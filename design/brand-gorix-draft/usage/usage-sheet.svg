<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180"><title>GoRix usage sheet</title><rect width="1600" height="1180" fill="#EFEBE5"/><text x="60" y="80" style="font-family:Onest,system-ui,sans-serif;font-size:40px;font-weight:700" fill="#15161A" text-anchor="start">GoRix — лист применения знака</text><text x="60" y="118" style="font-family:Onest,system-ui,sans-serif;font-size:22px;font-weight:400" fill="#575C68" text-anchor="start">Знак «Маршрут G». Охранное поле = диаметр точки (≈ 0,29 высоты знака) со всех сторон.</text><rect x="12" y="112" width="475" height="475" fill="none" stroke="#575C68" stroke-dasharray="8 8"/><rect x="100" y="200" width="300" height="300" fill="none" stroke="#575C68" stroke-opacity=".4"/><g transform="translate(100 200) scale(0.43860) translate(-170 -170)" ><path fill="#15161A" d="M600 170 H442 A272 272 0 0 0 170 442 V582 A272 272 0 0 0 442 854 H582 A272 272 0 0 0 854 582 V450 H618.5 A100 100 0 1 0 618.5 574 H730 V582 A148 148 0 0 1 582 730 H442 A148 148 0 0 1 294 582 V442 A148 148 0 0 1 442 294 H600 Z"/></g><circle cx="56" cy="350" r="44" fill="none" stroke="#575C68" stroke-dasharray="4 4"/><circle cx="446" cy="350" r="44" fill="none" stroke="#575C68" stroke-dasharray="4 4"/><text x="60" y="640" style="font-family:Onest,system-ui,sans-serif;font-size:18px;font-weight:400" fill="#575C68" text-anchor="start">Пунктир — охранное поле: диаметр точки со всех сторон</text><text x="620" y="190" style="font-family:Onest,system-ui,sans-serif;font-size:26px;font-weight:700" fill="#15161A" text-anchor="start">Минимальные размеры</text><g transform="translate(620 230) scale(0.07018) translate(-170 -170)" ><path fill="#15161A" d="M600 170 H442 A272 272 0 0 0 170 442 V582 A272 272 0 0 0 442 854 H582 A272 272 0 0 0 854 582 V450 H618.5 A100 100 0 1 0 618.5 574 H730 V582 A148 148 0 0 1 582 730 H442 A148 148 0 0 1 294 582 V442 A148 148 0 0 1 442 294 H600 Z"/></g><text x="700" y="262.0" style="font-family:Onest,system-ui,sans-serif;font-size:20px;font-weight:400" fill="#15161A" text-anchor="start">48 px — заставка, вход</text><g transform="translate(620 306) scale(0.03509) translate(-170 -170)" ><path fill="#15161A" d="M600 170 H442 A272 272 0 0 0 170 442 V582 A272 272 0 0 0 442 854 H582 A272 272 0 0 0 854 582 V450 H618.5 A100 100 0 1 0 618.5 574 H730 V582 A148 148 0 0 1 582 730 H442 A148 148 0 0 1 294 582 V442 A148 148 0 0 1 442 294 H600 Z"/></g><text x="700" y="326.0" style="font-family:Onest,system-ui,sans-serif;font-size:20px;font-weight:400" fill="#15161A" text-anchor="start">24 px — шапка приложения</text><g transform="translate(620 358) scale(0.02924) translate(-170 -170)" ><path fill="#15161A" d="M600 170 H442 A272 272 0 0 0 170 442 V582 A272 272 0 0 0 442 854 H582 A272 272 0 0 0 854 582 V450 H618.5 A100 100 0 1 0 618.5 574 H730 V582 A148 148 0 0 1 582 730 H442 A148 148 0 0 1 294 582 V442 A148 148 0 0 1 442 294 H600 Z"/></g><text x="700" y="376.0" style="font-family:Onest,system-ui,sans-serif;font-size:20px;font-weight:400" fill="#15161A" text-anchor="start">20 px — минимум знака в интерфейсе</text><g transform="translate(620 410) scale(0.02339) translate(-170 -170)" ><path fill="#15161A" d="M600 170 H442 A272 272 0 0 0 170 442 V582 A272 272 0 0 0 442 854 H582 A272 272 0 0 0 854 582 V450 H618.5 A100 100 0 1 0 618.5 574 H730 V582 A148 148 0 0 1 582 730 H442 A148 148 0 0 1 294 582 V442 A148 148 0 0 1 442 294 H600 Z"/></g><text x="700" y="426.0" style="font-family:Onest,system-ui,sans-serif;font-size:20px;font-weight:400" fill="#15161A" text-anchor="start">16 px — только фавикон-16 (упрощённый)</text><text x="620" y="492" style="font-family:Onest,system-ui,sans-serif;font-size:18px;font-weight:400" fill="#575C68" text-anchor="start">Логотип со словом: не уже 96 px (высота слова ≥ 10 px). PDF: «Made with GoRix» ≥ 7 pt, цвет mut.</text><text x="620" y="552" style="font-family:Onest,system-ui,sans-serif;font-size:26px;font-weight:700" fill="#15161A" text-anchor="start">Цвета</text><rect x="620" y="572" width="200" height="120" rx="18" fill="#0B0C0F" stroke="#575C68" stroke-opacity=".25"/><g transform="translate(690 602) scale(0.08772) translate(-170 -170)" ><path fill="#FBFF00" d="M600 170 H442 A272 272 0 0 0 170 442 V582 A272 272 0 0 0 442 854 H582 A272 272 0 0 0 854 582 V450 H618.5 A100 100 0 1 0 618.5 574 H730 V582 A148 148 0 0 1 582 730 H442 A148 148 0 0 1 294 582 V442 A148 148 0 0 1 442 294 H600 Z"/></g><text x="620" y="718" style="font-family:Onest,system-ui,sans-serif;font-size:15px;font-weight:400" fill="#575C68" text-anchor="start">иконка</text><rect x="850" y="572" width="200" height="120" rx="18" fill="#24272D" stroke="#575C68" stroke-opacity=".25"/><g transform="translate(920 602) scale(0.08772) translate(-170 -170)" ><path fill="#FBFF00" d="M600 170 H442 A272 272 0 0 0 170 442 V582 A272 272 0 0 0 442 854 H582 A272 272 0 0 0 854 582 V450 H618.5 A100 100 0 1 0 618.5 574 H730 V582 A148 148 0 0 1 582 730 H442 A148 148 0 0 1 294 582 V442 A148 148 0 0 1 442 294 H600 Z"/></g><text x="850" y="718" style="font-family:Onest,system-ui,sans-serif;font-size:15px;font-weight:400" fill="#575C68" text-anchor="start">заставка, сайт</text><rect x="1080" y="572" width="200" height="120" rx="18" fill="#24272D" stroke="#575C68" stroke-opacity=".25"/><g transform="translate(1150 602) scale(0.08772) translate(-170 -170)" ><path fill="#F2F3F5" d="M600 170 H442 A272 272 0 0 0 170 442 V582 A272 272 0 0 0 442 854 H582 A272 272 0 0 0 854 582 V450 H618.5 A100 100 0 1 0 618.5 574 H730 V582 A148 148 0 0 1 582 730 H442 A148 148 0 0 1 294 582 V442 A148 148 0 0 1 442 294 H600 Z"/></g><text x="1080" y="718" style="font-family:Onest,system-ui,sans-serif;font-size:15px;font-weight:400" fill="#575C68" text-anchor="start">тёмная тема</text><rect x="1310" y="572" width="200" height="120" rx="18" fill="#EFEBE5" stroke="#575C68" stroke-opacity=".25"/><g transform="translate(1380 602) scale(0.08772) translate(-170 -170)" ><path fill="#15161A" d="M600 170 H442 A272 272 