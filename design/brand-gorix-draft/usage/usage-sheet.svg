late(-170 -170)"><path fill="#15161A" d="M600 170 H442 A272 272 0 0 0 170 442 V582 A272 272 0 0 0 442 854 H582 A272 272 0 0 0 854 582 V450 H700 V574 H730 V582 A148 148 0 0 1 582 730 H442 A148 148 0 0 1 294 582 V442 A148 148 0 0 1 442 294 H600 Z"/><circle cx="470" cy="512" r="100" fill="#15161A"/></g></g><path d="M1490 835 l24 24 m0 -24 l-24 24" stroke="#B4232A" stroke-width="5"/><text x="1310" y="1045" style="font-family:Onest,system-ui,sans-serif;font-size:16px;font-weight:400" fill="#575C68" text-anchor="start">отрывать точку</text><text x="60" y="1120" style="font-family:Onest,system-ui,sans-serif;font-size:18px;font-weight:400" fill="#575C68" text-anchor="start">Заставка и иконка — жёлтый знак только на тёмном. В интерфейсе знак цвета ink своей темы; жёлтый остаётся главной кнопке.</text></svg>
