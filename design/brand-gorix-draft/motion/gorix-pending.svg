<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" class="gx gx-wait"><title>GoRix waiting to send · loop 1800 ms; always with the word and the count</title><style>.gx{--gx-ink:#F2F3F5;--gx-brand:#FBFF00;--gx-ok:#7CE08A;--gx-on:#0B0C0F}@media (prefers-color-scheme:light){.gx{--gx-ink:#15161A;--gx-brand:#15161A}}.gx-wait .r{fill:none;stroke:var(--gx-ink);stroke-width:124;stroke-linejoin:miter;stroke-dasharray:80 22;animation:gx-creep 1800ms linear infinite}.gx-wait .p{fill:none;stroke:var(--gx-ink);stroke-width:40;animation:gx-breathe 1800ms ease-in-out infinite}@keyframes gx-creep{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@keyframes gx-breathe{0%,100%{opacity:1}50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.gx *{animation:none!important}}</style><path class="r" pathLength="1000" d="M600 232 H442 A210 210 0 0 0 232 442 V582 A210 210 0 0 0 442 792 H582 A210 210 0 0 0 792 582 V512 H540"/><circle class="p" cx="540" cy="512" r="80"/></svg>
