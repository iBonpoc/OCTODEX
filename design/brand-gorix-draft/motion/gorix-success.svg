<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" class="gx gx-ok"><title>GoRix success · 510 ms; always with the word «Done»</title><style>.gx{--gx-ink:#F2F3F5;--gx-brand:#FBFF00;--gx-ok:#7CE08A;--gx-on:#0B0C0F}@media (prefers-color-scheme:light){.gx{--gx-ink:#15161A;--gx-brand:#15161A}}.gx-ok .r{fill:var(--gx-ink)}.gx-ok .p{fill:var(--gx-ok);transform-box:fill-box;transform-origin:center;animation:gx-dip 160ms cubic-bezier(.2,.8,.2,1) both,gx-grow 350ms cubic-bezier(.3,1.25,.5,1) 160ms both,gx-tint 160ms linear 160ms both}.gx-ok .c{fill:none;stroke:var(--gx-on);stroke-width:34;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:0;animation:gx-check 220ms cubic-bezier(.2,.8,.2,1) 220ms both}@keyframes gx-dip{from{transform:scale(1)}to{transform:scale(.8)}}@keyframes gx-tint{from{fill:var(--gx-ink)}to{fill:var(--gx-ok)}}@keyframes gx-grow{from{transform:scale(.8)}to{transform:scale(1)}}@keyframes gx-check{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.gx *{animation:none!important}}</style><path class="r" d="M600 170 H442 A272 272 0 0 0 170 442 V582 A272 272 0 0 0 442 854 H582 A272 272 0 0 0 854 582 V450 H540 V574 H730 V582 A148 148 0 0 1 582 730 H442 A148 148 0 0 1 294 582 V442 A148 148 0 0 1 442 294 H600 Z"/><circle class="p" cx="540" cy="512" r="118"/><path class="c" pathLength="100" d="M488 516 L524 552 L594 474"/></svg>
