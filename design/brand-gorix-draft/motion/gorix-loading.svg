<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" class="gx gx-load"><title>GoRix loading · loop 1250 ms, show only after spinnerDelayMs 300 (DESIGN-SYSTEM §13)</title><style>.gx{--gx-ink:#F2F3F5;--gx-brand:#FBFF00;--gx-ok:#7CE08A;--gx-on:#0B0C0F}@media (prefers-color-scheme:light){.gx{--gx-ink:#15161A;--gx-brand:#15161A}}.gx-load .t{fill:none;stroke:var(--gx-ink);stroke-opacity:.22;stroke-width:124;stroke-linejoin:miter}.gx-load .tp{fill:var(--gx-ink);fill-opacity:.22}.gx-load .run{fill:none;stroke:var(--gx-ink);stroke-width:124;stroke-linejoin:miter;stroke-dasharray:240 1000;stroke-dashoffset:240;animation:gx-run 1250ms cubic-bezier(.2,.8,.2,1) infinite}.gx-load .p{fill:var(--gx-ink);opacity:0;transform-box:fill-box;transform-origin:center;animation:gx-arrive 1250ms linear infinite}@keyframes gx-run{0%{stroke-dashoffset:240}72%,100%{stroke-dashoffset:-1000}}@keyframes gx-arrive{0%,60%{opacity:0;transform:scale(.6)}72%{opacity:1;transform:scale(1.08)}86%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}@media (prefers-reduced-motion:reduce){.gx-load .run{stroke-dasharray:none;stroke-dashoffset:0}.gx-load .p{opacity:1}}@media (prefers-reduced-motion:reduce){.gx *{animation:none!important}}</style><path class="t" d="M600 232 H442 A210 210 0 0 0 232 442 V582 A210 210 0 0 0 442 792 H582 A210 210 0 0 0 792 582 V512 H540"/><circle class="tp" cx="540" cy="512" r="100"/><path class="run" pathLength="1000" d="M600 232 H442 A210 210 0 0 0 232 442 V582 A210 210 0 0 0 442 792 H582 A210 210 0 0 0 792 582 V512 H540"/><circle class="p" cx="540" cy="512" r="100"/></svg>
