<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" class="gx gx-intro"><title>GoRix intro · ≤ 900 ms</title><style>.gx{--gx-ink:#F2F3F5;--gx-brand:#FBFF00;--gx-ok:#7CE08A;--gx-on:#0B0C0F}@media (prefers-color-scheme:light){.gx{--gx-ink:#15161A;--gx-brand:#15161A}}.gx-intro .r{fill:none;stroke:var(--gx-brand);stroke-width:124;stroke-linejoin:miter;stroke-dasharray:1000;stroke-dashoffset:0;animation:gx-draw 550ms cubic-bezier(.2,.8,.2,1) both}.gx-intro .p{fill:var(--gx-brand);transform-box:fill-box;transform-origin:center;animation:gx-pop 350ms cubic-bezier(.3,1.25,.5,1) 550ms both}@keyframes gx-draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}@keyframes gx-pop{from{transform:scale(0)}to{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.gx *{animation:none!important}}</style><path class="r" pathLength="1000" d="M600 232 H442 A210 210 0 0 0 232 442 V582 A210 210 0 0 0 442 792 H582 A210 210 0 0 0 792 582 V512 H540"/><circle class="p" cx="540" cy="512" r="100"/></svg>
