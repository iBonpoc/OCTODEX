<!-- @dsCard group="Components" viewport="700x200" name="Core" subtitle="Кнопки и статусы" -->
<link rel="stylesheet" href="../../styles.css">
<body data-theme="dark" data-style="glass" style="margin:0;padding:20px;background:var(--bg);color:var(--ink);font-family:'Onest',sans-serif;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button style="height:32px;padding:0 16px;border-radius:99px;border:0;background:var(--acc);color:var(--on-acc);font:600 12.5px Onest">Основная</button>
<button style="height:32px;padding:0 16px;border-radius:99px;border:1px solid var(--bd);background:var(--surf2);color:var(--ink);font:600 12.5px Onest">Вторичная</button>
<button style="height:32px;padding:0 16px;border-radius:99px;border:0;background:var(--st-bad);color:var(--st-on);font:600 12.5px Onest">Удалить</button></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;font:600 11.5px Onest;color:var(--st-on)">
<span style="padding:3px 10px;border-radius:99px;background:var(--st-ok)">✓ Выполнен</span><span style="padding:3px 10px;border-radius:99px;background:var(--st-info)">● В работе</span><span style="padding:3px 10px;border-radius:99px;background:var(--st-warn)">▲ Опаздывает</span><span style="padding:3px 10px;border-radius:99px;background:var(--st-bad)">✕ Проблема</span></div>
</body>
