<title>Gutter CRM Style Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@400;500;600&family=Onest:wght@400;500;600&display=swap">
<style>
/* Lab layout: sticky switcher of named prototypes; each prototype = same CRM content in its own visual world (tokens scoped per variant + light/dark mode). */
:root{
  --lab-bg:#f1eee9; --lab-fg:#1b1814; --lab-2:rgba(27,24,20,.62); --lab-line:rgba(27,24,20,.12); --lab-chip:#ffffff; --lab-on:#1b1814; --lab-on-fg:#fff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --lab-bg:#121110; --lab-fg:#f3efe9; --lab-2:rgba(243,239,233,.6); --lab-line:rgba(243,239,233,.12); --lab-chip:#1e1c1a; --lab-on:#f3efe9; --lab-on-fg:#121110; color-scheme:dark}}
:root[data-theme="dark"]{--lab-bg:#121110; --lab-fg:#f3efe9; --lab-2:rgba(243,239,233,.6); --lab-line:rgba(243,239,233,.12); --lab-chip:#1e1c1a; --lab-on:#f3efe9; --lab-on-fg:#121110; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--lab-bg);color:var(--lab-fg);font-family:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lab-bg)}
button{font:inherit}
button:focus-visible{outline:2px solid #f2622e;outline-offset:2px}

.labbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--lab-bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--lab-line)}
.labbar-in{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.labbar b{font-weight:600;margin-right:6px}
.switch{display:flex;gap:4px;flex-wrap:wrap;overflow-x:auto}
.switch a{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--lab-fg);font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--lab-chip);border:1px solid var(--lab-line);white-space:nowrap}
.switch a i{width:12px;height:12px;border-radius:50%;flex:none}
.switch a[aria-current="page"]{background:var(--lab-on);color:var(--lab-on-fg);border-color:var(--lab-on)}
.modes{margin-left:auto;display:flex;gap:4px}
.modes button{border:1px solid var(--lab-line);background:var(--lab-chip);color:var(--lab-fg);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.modes button[aria-pressed="true"]{background:var(--lab-on);color:var(--lab-on-fg)}

.page{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:22px}
.intro .num-tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--lab-2);font-weight:600}
.intro h1{margin:4px 0 0;font-size:clamp(34px,5.5vw,56px);line-height:1;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.intro p{margin:0;color:var(--lab-2);max-width:62ch}
.intro ul{margin:8px 0 0;padding-left:18px;color:var(--lab-2);display:flex;flex-direction:column;gap:4px}

/* ================= variant component system (all colors via tokens) ================= */
.vz[hidden]{display:none!important}
.vz{display:flex;flex-direction:column;gap:28px;color:var(--fg);font-family:var(--f-body)}
.vz .num{font-variant-numeric:tabular-nums}
.vz .disp{font-family:var(--f-display);font-weight:var(--d-w);text-transform:var(--d-case);letter-spacing:var(--d-track);line-height:1}
.scene{position:relative;border-radius:30px;overflow:hidden;isolation:isolate;padding:18px;background:var(--scene)}
.glass{background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(170%);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge),var(--shadow)}
.solid{background:var(--solid);border:1px solid var(--line)}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--solid);backdrop-filter:none;-webkit-backdrop-filter:none}}
.ico{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.shell{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.shell.top{grid-template-columns:minmax(0,1fr)}

/* side nav */
.side{width:252px;border-radius:calc(var(--r-lg) + 6px);padding:12px;display:flex;flex-direction:column;gap:4px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.side.mini{width:72px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 4px 10px;position:relative}
.logo{flex:none;width:40px;height:40px;border-radius:var(--r-logo);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 8px 20px -10px var(--btn-bg)}
.brand-t{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.brand-t b{font-weight:600;font-size:14px}
.brand-t span{font-size:12px;color:var(--fg3);white-space:nowrap}
.collapse{position:absolute;right:-4px;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--solid);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.side.mini .collapse{right:-18px}
.side.mini .collapse svg{transform:rotate(180deg)}
.search{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:var(--r-pill);background:var(--track);color:var(--fg3);font-size:13px}
.search kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line)}
.grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);padding:12px 12px 2px;font-weight:600}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;width:100%;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-pill);border:1px solid transparent;background:none;color:var(--fg);font-weight:500;font-size:13.5px;cursor:pointer;text-align:left}
.nav button:hover{background:var(--track)}
.nav button[aria-current="page"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-line);box-shadow:inset 0 1px 0 var(--edge)}
.badge{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:var(--r-pill);display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--track);color:var(--fg)}
.badge.hot{background:var(--hot);color:#fff}
.dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--hot)}
.ai{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:9px;padding:11px;border-radius:var(--r-pill);border:0;cursor:pointer;font-weight:600;background:var(--btn-bg);color:var(--btn-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 22px -12px var(--btn-bg)}
.me{display:flex;align-items:center;gap:10px;padding:10px 4px 2px;border-top:1px solid var(--line);margin-top:8px}
.ava{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--track)}
.side.mini .hm{display:none}
.side.mini .nav button,.side.mini .ai,.side.mini .search{justify-content:center;padding:10px 0}
.side.mini .badge,.side.mini .dot{position:absolute;top:5px;right:12px;min-width:0;width:8px;height:8px;padding:0;font-size:0;margin:0;background:var(--hot)}
.side.mini .brand,.side.mini .me{justify-content:center}
.side.mini .nav button:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;padding:6px 11px;border-radius:var(--r-pill);background:var(--solid);border:1px solid var(--line);color:var(--fg);font-size:12.5px;box-shadow:var(--shadow);z-index:5}

/* top nav */
.topnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.topnav .lg{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:var(--r-pill);font-weight:600}
.topnav .lg .logo{width:30px;height:30px;font-size:15px}
.pills{display:flex;gap:2px;padding:4px;border-radius:var(--r-pill);flex-wrap:wrap;margin-left:auto}
.pills button{border:0;background:none;color:var(--fg2);font-size:13px;font-weight:500;padding:7px 12px;border-radius:var(--r-pill);cursor:pointer}
.pills button[aria-current="page"]{background:var(--sel-bg);color:var(--sel-fg)}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:0;color:var(--fg);cursor:pointer}

/* main */
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:var(--h-size)}
.head p{margin:4px 0 0;font-size:12.5px;color:var(--fg3)}
.new{display:flex;align-items:center;gap:8px;border:0;cursor:pointer;font-weight:600;font-size:13px;padding:8px 16px 8px 8px;border-radius:var(--r-pill);background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 10px 22px -14px var(--btn-bg)}
.new i{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi small{font-size:12px;color:var(--fg3)}
.kpi b{font-size:var(--k-size)}
.kpi em{font-style:normal;font-size:12px}
.up{color:var(--ok)} .wa{color:var(--warn)} .bad{color:var(--hot)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{border-radius:var(--r-lg);padding:15px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:start;gap:8px}
.ch h4{margin:0;font-size:14px;font-weight:600}
.ch small{display:block;font-size:11.5px;color:var(--fg3)}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r-pill);white-space:nowrap}
.t-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.t-ac{background:var(--accent);color:var(--accent-ink)}
.t-info{color:var(--info);background:color-mix(in srgb,var(--info) 15%,transparent)}
.t-hot{color:var(--hot);background:color-mix(in srgb,var(--hot) 15%,transparent)}
.t-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.fun{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:8px;align-items:center}
.fr small{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11.5px;color:var(--fg2)}
.ft{height:12px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.ft i{display:block;height:100%;border-radius:var(--r-pill);background:var(--fg)}
.ft i.a{background:var(--accent)}
.fr > span{font-size:11.5px;font-weight:600;text-align:right}
.donut{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center}
.donut svg{width:104px;height:104px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12px}
.legend div{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:7px;align-items:center}
.legend i{width:9px;height:9px;border-radius:50%}
.legend span{color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{font-weight:600}
.legend em{grid-column:2/-1;font-style:normal;font-size:11px;color:var(--fg3);margin-top:-5px}
.dial{position:relative;width:124px;height:124px;margin:0 auto}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial b{font-size:30px}
.dial small{font-size:11px;color:var(--fg3)}
.inv{background:var(--inv-bg);color:var(--inv-fg);border:1px solid var(--inv-bg)}
.inv .ch small{color:var(--inv-2)}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:grid;grid-template-columns:minmax(0,1fr) 22px;gap:8px;align-items:center;padding:8px 10px;border-radius:calc(var(--r-md) - 2px);background:color-mix(in srgb,var(--inv-fg) 8%,transparent)}
.task b{font-weight:500;font-size:12.5px;display:block}
.task small{font-size:11px;color:var(--inv-2)}
.task.done b{text-decoration:line-through;color:var(--inv-2)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--inv-2);background:none;cursor:pointer;padding:0;display:grid;place-items:center;color:var(--accent-ink);font-size:12px}
.done .chk{background:var(--accent);border-color:var(--accent)}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{border-radius:var(--r-lg);padding:11px;display:flex;flex-direction:column;gap:9px;min-width:0;min-height:110px}
.colh{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;padding:2px 4px}
.colh span.sum{color:var(--fg3);font-weight:500}
.colh i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.deal{border-radius:var(--r-md);padding:11px;display:flex;flex-direction:column;gap:8px}
.who{display:flex;gap:9px;align-items:center}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--fg);color:var(--bg-ink)}
.deal b{font-weight:600;font-size:13px;display:block}
.deal small{font-size:11px;color:var(--fg3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prob{height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.prob i{display:block;height:100%;background:var(--accent)}
.df{display:flex;justify-content:space-between;align-items:center;gap:8px}
.amt{font-size:16px;font-weight:600}
.adv{border:0;cursor:pointer;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:var(--r-pill);background:var(--sel-bg);color:var(--sel-fg)}
.deal.won{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.deal.won small{color:var(--inv-2)}
.deal.won .av{background:var(--accent);color:var(--accent-ink)}
.deal.won .adv{background:var(--accent);color:var(--accent-ink)}

/* phones */
.phones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.pw{display:flex;flex-direction:column;gap:10px;align-items:center}
.pw > span{font-size:12.5px;color:var(--lab-2)}
.phone{width:100%;max-width:320px;aspect-ratio:9/19;border-radius:44px;padding:9px;background:#0b0908;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.screen{position:relative;height:100%;border-radius:36px;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;background:var(--scene);color:var(--fg)}
.status{display:flex;justify-content:space-between;padding:12px 22px 2px;font-size:12px;font-weight:600}
.sbar{margin:6px 12px 0;padding:9px 14px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:13.5px}
.scr{flex:1;overflow:hidden;padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.mc{border-radius:var(--r-lg);padding:13px;display:flex;flex-direction:column;gap:6px}
.tabbar{position:absolute;left:12px;right:12px;bottom:14px;border-radius:30px;padding:7px 9px;display:flex;align-items:center;justify-content:space-between}
.tab{border:0;background:none;color:var(--fg2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:5px 7px;cursor:pointer;border-radius:16px}
.tab[aria-current="page"]{color:var(--sel-fg);background:var(--sel-bg)}
.mic{width:52px;height:52px;margin-top:-24px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 0 0 6px color-mix(in srgb,var(--btn-bg) 22%,transparent),0 12px 24px -8px var(--btn-bg)}
.sat{position:relative;flex:1;margin:10px 12px 92px;border-radius:var(--r-lg);overflow:hidden;background:#3d4136}
.sat svg{width:100%;height:100%;display:block}
.tool{position:absolute;left:8px;right:8px;bottom:8px;border-radius:var(--r-lg);padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.tool .sum{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--fg2);flex-wrap:wrap}
.tool .sum b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.tools{display:flex;gap:5px;flex-wrap:wrap}
.tb{font-size:11px;font-weight:600;padding:5px 9px;border-radius:var(--r-pill);background:var(--track)}
.tb.on{background:var(--accent);color:var(--accent-ink)}
.opt{border-radius:var(--r-md);padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.opt.pick{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.opt .ot{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.opt h5{margin:0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.opt .pr{font-size:24px}
.opt p{margin:0;font-size:12px;color:var(--fg3)}
.opt .mo{font-size:11.5px;color:var(--fg2)}
.cta{margin-top:auto;border:0;border-radius:var(--r-pill);padding:12px;font-weight:600;cursor:pointer;background:var(--btn-bg);color:var(--btn-fg)}

@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.kan{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.phones{grid-template-columns:1fr}.intro{grid-template-columns:1fr}}
@media (max-width:760px){.shell{grid-template-columns:1fr}.side{width:100%}.side.mini{width:72px}.kpis{grid-template-columns:1fr}.pills{margin-left:0}.modes{margin-left:0}}
@media (max-width:540px){.grid4,.kan{grid-template-columns:1fr}.scene{padding:12px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ================= motion: springs, lift & drop ================= */
.vz{--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.2,.8,.2,1)}
@supports (transition-timing-function: linear(0, 1)){.vz{--ease-spring:linear(0, .009, .035 2.1%, .141 4.4%, .723 12.9%, .938 16.7%, 1.017 19.4%, 1.067, 1.099 24.3%, 1.106 26.4%, 1.098 28.8%, 1.068 32.4%, .998 41.5%, .981 46.7%, .981 52.6%, .999 69.4%, 1.002 80.6%, 1)}}
.vz:not([hidden]){animation:vz-in .55s var(--ease-out) both}
@keyframes vz-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.vz button{transition:transform .5s var(--ease-spring),background-color .25s,color .25s,box-shadow .25s}
.vz button:active{transform:scale(.92);transition-duration:.08s,.25s,.25s,.25s}
.vz .nav button:active,.vz .pills button:active,.vz .tab:active{transform:scale(.96)}
.vz .mic:active{transform:scale(.88)}
.vz .card,.vz .kpi,.vz .mc,.vz .opt{transition:transform .55s var(--ease-spring),box-shadow .3s}
.vz .card:hover,.vz .kpi:hover{transform:translateY(-3px)}
.vz .opt:active,.vz .mc:active{transform:scale(.98)}
.deal{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:transform .45s var(--ease-spring),box-shadow .3s,opacity .2s}
.deal:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.deal.ph{opacity:.5;background:transparent!important;border:2px dashed var(--accent)!important;box-shadow:none}
.deal.ph > *{visibility:hidden}
.deal.lifted{position:fixed;z-index:50;margin:0;pointer-events:none;cursor:grabbing;box-shadow:var(--shadow)}
.deal.lifted.up{box-shadow:0 34px 60px -18px rgba(0,0,0,.5),0 0 0 2px var(--accent)}
.col{transition:box-shadow .25s,transform .45s var(--ease-spring)}
.col.over{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow);transform:scale(1.015)}
.dragging .deal:not(.lifted):hover{transform:none}
.deal.landed{animation:land .8s var(--ease-out)}
@keyframes land{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 65%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.done .chk{animation:pop .5s var(--ease-spring)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.side .hm{transition:opacity .25s}
@media (prefers-reduced-motion: reduce){.vz,.vz *{animation:none!important;transition:none!important}}

/* ================= components page ================= */
.c-scene{display:flex;flex-direction:column;gap:14px}
.c-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 8px;border-radius:var(--r-pill)}
.c-lbl{font-size:12px;color:var(--fg3);font-weight:600;padding-left:8px}
.c-styles{display:flex;gap:4px;flex-wrap:wrap}
.c-styles button{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--fg2);font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:var(--r-pill);cursor:pointer}
.c-styles button i{width:10px;height:10px;border-radius:50%}
.c-styles button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg)}
.c-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.c-block{border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.c-block.wide{grid-column:1/-1}
.c-block>header h4{margin:0;font-size:14px;font-weight:600}
.c-block>header p{margin:2px 0 0;font-size:12px;color:var(--fg3)}
.c-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.c-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r-pill);padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap}
.c-btn.p{background:var(--btn-bg);color:var(--btn-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 22px -14px var(--btn-bg)}
.c-btn.s{background:var(--solid);color:var(--fg);border-color:var(--line)}
.c-btn.g{background:none;color:var(--fg2)}
.c-btn.g:hover{background:var(--track);color:var(--fg)}
.c-btn.d{background:color-mix(in srgb,var(--hot) 14%,transparent);color:var(--hot)}
.c-btn.sm{padding:6px 12px;font-size:12.5px;min-height:32px}
.c-btn:disabled{opacity:.4;cursor:not-allowed}
.c-load[data-state="done"]{background:var(--ok);color:#fff}
.c-spin{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.c-ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--solid);color:var(--fg);cursor:pointer}
.c-seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:var(--r-pill);background:var(--track);max-width:320px}
.c-seg button{position:relative;z-index:1;border:0;background:none;padding:7px 0;font-size:13px;font-weight:600;color:var(--fg2);cursor:pointer;border-radius:var(--r-pill)}
.c-seg button[aria-pressed="true"]{color:var(--sel-fg)}
.c-seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:var(--r-pill);background:var(--sel-bg);box-shadow:0 6px 16px -8px rgba(0,0,0,.4);transition:transform .55s var(--ease-spring)}
.c-tg{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px}
.c-tg small{display:block;font-size:11.5px;color:var(--fg3)}
.c-sw{flex:none;width:48px;height:28px;border-radius:999px;border:0;background:var(--track);position:relative;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px var(--line)}
.c-sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .5s var(--ease-spring)}
.c-sw[aria-checked="true"]{background:var(--ok)}
.c-sw[aria-checked="true"]::after{transform:translateX(20px)}
.c-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.c-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.c-field>label,.c-field>span{font-size:12px;font-weight:600;color:var(--fg2)}
.c-in{display:flex;align-items:center;gap:8px;border-radius:var(--r-md);background:var(--solid);border:1px solid var(--line);padding:0 12px;min-height:42px;color:var(--fg3);transition:box-shadow .2s,border-color .2s}
.c-in:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.c-in input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:14px;outline:none;padding:10px 0}
.c-in .pre{font-weight:600}
.c-step{display:flex;align-items:center;gap:6px;min-height:42px}
.c-step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--solid);color:var(--fg);cursor:pointer;font-size:18px;line-height:1}
.c-step output{min-width:86px;text-align:center;font-family:var(--f-mono);font-size:16px;font-weight:500}
.bump{animation:bump .45s var(--ease-spring)}
@keyframes bump{0%{transform:scale(1.2)}100%{transform:scale(1)}}
.c-chips{display:flex;gap:6px;flex-wrap:wrap}
.c-chip{border:1px solid var(--line);background:var(--solid);color:var(--fg);padding:6px 12px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500;cursor:pointer}
.c-chip[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-line)}
.c-pills{display:flex;gap:6px;flex-wrap:wrap}
.c-pills .tag{font-size:12px;padding:5px 10px}
.t-neu{background:var(--track);color:var(--fg)}
.t-okf{background:var(--ok);color:#fff}
.c-swl{display:flex;flex-direction:column;gap:8px}
.c-swipe{position:relative;border-radius:var(--r-md);overflow:hidden;background:var(--track)}
.c-acts{position:absolute;top:0;right:0;bottom:0;display:flex}
.c-acts button{width:56px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:#fff;cursor:pointer}
.c-front{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--solid);border:1px solid var(--line);border-radius:var(--r-md);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.c-front.snap{transition:transform .5s var(--ease-spring)}
.c-front .av{width:32px;height:32px}
.c-li{display:flex;flex-direction:column;gap:6px}
.c-item{display:grid;grid-template-columns:26px minmax(0,1fr) auto 84px 86px 32px;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-md);background:var(--solid);border:1px solid var(--line)}
.c-item.lift{position:relative;z-index:5;box-shadow:0 22px 40px -16px rgba(0,0,0,.45),0 0 0 2px var(--accent)}
.c-item.settle{transition:transform .5s var(--ease-spring),box-shadow .3s}
.c-item.flash{animation:land .9s var(--ease-out)}
.c-item.out{animation:out .28s var(--ease-out) forwards}
@keyframes out{to{opacity:0;transform:translateX(40px) scale(.96)}}
.c-grip{cursor:grab;color:var(--fg3);display:grid;place-items:center;touch-action:none;border:0;background:none;padding:0;height:32px;width:26px}
.c-grip:active{cursor:grabbing}
.c-item b{font-size:13px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-item small{font-size:11px;color:var(--fg3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-q{display:flex;align-items:center;gap:4px}
.c-q button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;font-size:14px;line-height:1;padding:0}
.c-q span{min-width:46px;text-align:center;font-family:var(--f-mono);font-size:12.5px}
.c-price{font-size:12px;color:var(--fg2);text-align:right;font-variant-numeric:tabular-nums}
.c-sum{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.c-del{width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--fg3);cursor:pointer;display:grid;place-items:center}
.c-del:hover{background:color-mix(in srgb,var(--hot) 14%,transparent);color:var(--hot)}
.c-total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 10px 0;border-top:1px solid var(--line)}
.c-total b{font-size:26px}
.c-cmd{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 14px;border-radius:var(--r-pill);background:var(--solid);border:1px solid var(--line);transition:box-shadow .2s,border-color .2s}
.c-cmd:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.c-cmd input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:14px;outline:none}
.c-mic{width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--track);color:var(--fg);cursor:pointer;flex:none}
.c-diff{border-radius:var(--r-md);border:1.5px solid var(--accent);background:var(--solid);padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:toast-in .5s var(--ease-spring)}
.c-diff .dh{font-size:12px;font-weight:600;color:var(--fg2);display:flex;align-items:center;gap:6px}
.dl{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;font-size:13px;align-items:start}
.dl i{font-style:normal;font-weight:700;text-align:center}
.dl.mod i{color:var(--info)} .dl.add i{color:var(--ok)} .dl.del i{color:var(--hot)}
.dl.del span{text-decoration:line-through;color:var(--fg3)}
.dl b{font-variant-numeric:tabular-nums}
.c-diff s{color:var(--fg3)}
.c-diff .df2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.c-toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(460px,calc(100% - 32px))}
.c-toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:var(--r-pill);width:100%;font-size:13px;color:var(--fg);animation:toast-in .5s var(--ease-spring)}
.c-toast button{margin-left:auto;border:0;border-radius:var(--r-pill);padding:7px 13px;font-weight:600;font-size:12.5px;background:var(--sel-bg);color:var(--sel-fg);cursor:pointer;flex:none}
.c-toast.bye{animation:toast-out .3s var(--ease-out) forwards}
@keyframes toast-in{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(12px) scale(.97)}}
.c-skel{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--solid)}
.c-skel i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--track) 0%,color-mix(in srgb,var(--fg) 14%,transparent) 50%,var(--track) 100%);background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.c-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px;border-radius:var(--r-md);border:1.5px dashed var(--line)}
.c-empty .ico{width:28px;height:28px;color:var(--fg3)}
.c-empty small{color:var(--fg3);font-size:12px;max-width:34ch}
@media (max-width:820px){.c-grid,.c-fields{grid-template-columns:1fr}}
@media (max-width:640px){.c-item{grid-template-columns:22px minmax(0,1fr) auto 30px}.c-price,.c-sum{display:none}}

  --fg:#22180f;--fg2:rgba(34,24,15,.72);--fg3:rgba(34,24,15,.5);--bg-ink:#fbf6f0;--panel:rgba(255,255,255,.45);--solid:rgba(255,252,248,.88);--edge:rgba(255,255,255,.9);--line:rgba(60,35,15,.10);

  '<div class="c-swl">'+rows.map(function(r){return '<div class="c-swipe"><div class="c-acts"><button type="button" style="background:var(--ok)">'+ic('phone',16)+'Звонок</button><button type="button" style="background:var(--info)">'+ic('msg',16)+'SMS</button><button type="button" style="background:#2b2b2b">'+ic('nav',16)+'Путь</button></div><div class="c-front"><span class="av">'+r[0]+'</span><div style="min-width:0"><b style="font-size:13.5px;display:block">'+r[1]+'</b><small style="display:block;color:var(--fg3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+r[2]+'</small></div><div style="text-align:right"><b class="num" style="font-size:14px;display:block">'+r[3]+'</b><span class="tag '+r[4]+'" style="display:inline-block;margin-top:3px">'+r[5]+'</span></div></div></div>'}).join('')+'</div></article>'+
 '<article class="c-block solid wide"><header><h4>Позиции сметы EST-0148</h4><p>Тащите за ⋮⋮, чтобы поменять порядок. Количество меняется кнопками, удаление можно отменить.</p></header><div class="c-li"></div><div class="c-total"><span style="color:var(--fg2)">Итого для клиента</span><b class="disp num c-tot">$0</b></div></article>'+
 '<article class="c-block solid wide"><header><h4>AI-помощник: предпросмотр перед действием</h4><p>Помощник ничего не меняет сам: показывает, что сделает, вы подтверждаете, а потом можно отменить. Попробуйте подсказки ниже или свою команду.</p></header>'+
  '<div class="c-cmd"><span style="color:var(--accent);display:grid">'+ic('spark',17)+'</span><input class="c-cmdin" value="Поменяй первую позицию на 6 дюймов и убери вывоз старых гаттеров" aria-label="Команда помощнику"><button class="c-mic" type="button" aria-label="Сказать голосом">'+ic('mic',16)+'</button><button class="c-btn p sm c-run" type="button">Выполнить</button></div>'+
  '<div class="c-chips"><button class="c-chip" type="button" data-cmd="Поменяй первую позицию на 6 дюймов и убери вывоз старых гаттеров">6″ вместо 5″, без вывоза</button><button class="c-chip" type="button" data-cmd="Добавь сетки guards на всю длину">Добавь guards</button><button class="c-chip" type="button" data-cmd="Сделай скидку 5%">Скидка 5%</button></div>'+
  '<div class="c-diffbox"></div></article>'+
 '<article class="c-block solid"><header><h4>Уведомления</h4><p>Короткое сообщение снизу. Опасные действия всегда можно отменить.</p></header><div class="c-row"><button class="c-btn s c-toastbtn" type="button">Показать уведомление</button></div></article>'+
 '<article class="c-block solid"><header><h4>Загрузка и пустой экран</h4><p>Скелетон вместо крутилки. Пустой экран подсказывает первое действие.</p></header>'+
  '<div class="c-skel" aria-hidden="true"><i style="width:55%"></i><i style="width:90%"></i><i style="width:38%"></i></div>'+
  '<div class="c-empty">'+ic('doc')+'<b>Смет пока нет</b><small>Нарисуйте гаттеры на спутнике, и смета посчитается сама.</small><button class="c-btn p sm" type="button">'+ic('plus',14)+'Первая смета</button></div></article>'+
 '</div></div><div class="c-toasts" aria-live="polite"></div>';

 /* ---- toast ---- */
 var tbox=sec.querySelector('.c-toasts');
 function toast(msg,undo){
  var t=document.createElement('div');t.className='c-toast glass';
  t.innerHTML='<span>'+msg+'</span>'+(undo?'<button type="button">Отменить</button>':'');
  tbox.appendChild(t);var gone=false;
  function close(){if(gone)return;gone=true;t.classList.add('bye');setTimeout(function(){t.remove()},300)}
  if(undo)t.querySelector('button').addEventListener('click',function(){undo();close()});
  setTimeout(close,4500);
 }
 /* ---- line items ---- */
 var items=[
  {id:'a',name:'Gutter 5″ K-style .027',d:'Seamless · Musket Brown · 1 этаж',q:148,u:'LF',p:10},
  {id:'b',name:'Downspout 3×4',d:'5 шт · по высоте этажа',q:48,u:'LF',p:11},
  {id:'c',name:'Outside miter',d:'Углы по чертежу',q:3,u:'ea',p:25},
  {id:'e',name:'Elbows A/B',d:'3 на каждый downspout',q:15,u:'ea',p:6},
  {id:'d',name:'Вывоз старых гаттеров',d:'Демонтаж и утилизация',q:1,u:'flat',p:75}
 ];
 var li=sec.querySelector('.c-li'),tot=sec.querySelector('.c-tot');
 function money(v){return (v<0?'−$':'$')+Math.abs(v).toLocaleString('en-US')}
 function delta(v){return (v>=0?'+$':'−$')+Math.abs(v).toLocaleString('en-US')}
 function total(list){return (list||items).reduce(function(s,it){return s+it.q*it.p},0)}
 function find(id,list){list=list||items;for(var k=0;k<list.length;k++)if(list[k].id===id)return list[k]}
 function renderLi(){
  li.innerHTML=items.map(function(it,idx){return '<div class="c-item" data-id="'+it.id+'"><button class="c-grip" type="button" aria-label="Перетащить позицию">'+ic('grip',16)+'</button><div style="min-width:0"><b>'+(idx+1)+'. '+it.name+'</b><small>'+it.d+'</small></div><div class="c-q">'+(it.u==='flat'?'<span>1</span>':'<button type="button" data-q="-1" aria-label="Меньше">−</button><span>'+it.q+' '+it.u+'</span><button type="button" data-q="1" aria-label="Больше">+</button>')+'</div><span class="c-price">'+money(it.p)+(it.u==='flat'?'':' / '+it.u)+'</span><span class="c-sum">'+money(it.q*it.p)+'</span><button class="c-del" type="button" aria-label="Удалить позицию">'+ic('trash',15)+'</button></div>'}).join('');
  tot.textContent=money(total());
 }
 function flipLi(mut,skip){
  var before={};[].forEach.call(li.children,function(c){before[c.dataset.id]=c.getBoundingClientRect().top});
  mut();if(reduce)return;
  [].forEach.call(li.children,function(c){if(c===skip)return;var b=before[c.dataset.id];if(b==null)return;var d=b-c.getBoundingClientRect().top;if(Math.abs(d)<1)return;
   c.style.transition='none';c.style.transform='translateY('+d+'px)';void c.offsetWidth;c.style.transition='transform .5s var(--ease-spring)';c.style.transform='';setTimeout(function(){c.style.transition=''},520)});
 }
 function flash(id){var el=li.querySelector('[data-id="'+id+'"]');if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
 renderLi();
 li.addEventListener('click',function(e){
  var qb=e.target.closest('[data-q]');
  if(qb){var it=find(qb.closest('.c-item').dataset.id);it.q=Math.max(1,it.q+(+qb.dataset.q));var id=it.id;renderLi();var s=li.querySelector('[data-id="'+id+'"] .c-q span');if(s)s.classList.add('bump');tot.classList.remove('bump');void tot.offsetWidth;tot.classList.add('bump');return;}
  var del=e.target.closest('.c-del');
  if(del){var row=del.closest('.c-item');var id2=row.dataset.id;var idx=items.indexOf(find(id2));var removed=items[idx];row.classList.add('out');
   setTimeout(function(){flipLi(function(){items.splice(idx,1);renderLi()});},reduce?0:260);
   toast('Позиция «'+removed.name+'» удалена',function(){flipLi(function(){items.splice(Math.min(idx,items.length),0,removed);renderLi()});flash(removed.id)});}
 });
 var dr=null;
 li.addEventListener('pointerdown',function(e){var g=e.target.closest('.c-grip');if(!g)return;e.preventDefault();var row=g.closest('.c-item');
  dr={row:row,startY:e.clientY};row.classList.remove('settle');row.classList.add('lift');try{g.setPointerCapture(e.pointerId)}catch(_){}});
 li.addEventListener('pointermove',function(e){if(!dr)return;var row=dr.row;
  var r=row.getBoundingClientRect(),mid=r.top+r.height/2,next=row.nextElementSibling,prev=row.previousElementSibling,b;
  if(next&&mid>next.getBoundingClientRect().top+next.offsetHeight/2){b=row.offsetTop;flipLi(function(){li.insertBefore(next,row)},row);dr.startY+=row.offsetTop-b;}
  else if(prev&&mid<prev.getBoundingClientRect().top+prev.offsetHeight/2){b=row.offsetTop;flipLi(function(){li.insertBefore(row,prev)},row);dr.startY+=row.offsetTop-b;}
  row.style.transform='translateY('+(e.clientY-dr.startY)+'px) scale(1.02)';});
 function endLi(){if(!dr)return;var row=dr.row;dr=null;row.classList.add('settle');row.style.transform='';
  var ids=[].map.call(li.children,function(c){return c.dataset.id});items.sort(function(a,b){return ids.indexOf(a.id)-ids.indexOf(b.id)});
  setTimeout(function(){renderLi();flash(row.dataset.id)},reduce?0:480);}
 li.addEventListener('pointerup',endLi);li.addEventListener('pointercancel',endLi);
 /* ---- AI preview ---- */
 var box=sec.querySelector('.c-diffbox'),cmdin=sec.querySelector('.c-cmdin');
 function plan(cmd){var c=cmd.toLowerCase(),ops=[],a=find('a');
  if(/6/.test(c)&&/перв|гаттер|позиц/.test(c)&&a&&a.name.indexOf('5″')>-1)ops.push({t:'mod',id:'a',to:'Gutter 6″ K-style .032',p1:13});
  if(/вывоз|мусор|демонтаж/.test(c)&&find('d'))ops.push({t:'del',id:'d'});
  if(/guard|сетк/.test(c)&&!find('g'))ops.push({t:'add',it:{id:'g',name:'Micro-mesh guards, негорючие',d:'Нержавейка · по всей длине гаттера',q:(a||{q:148}).q,u:'LF',p:14}});
  var m=c.match(/скидк\D*(\d+)/);if(m&&!find('x'))ops.push({t:'add',it:{id:'x',name:'Скидка '+m[1]+'%',d:'По команде владельца',q:1,u:'flat',p:-Math.round(total()*(+m[1])/100)}});
  return ops;}
 function applyTo(list,ops){ops.forEach(function(o){
  if(o.t==='mod'){var it=find(o.id,list);it.name=o.to;it.p=o.p1;}
  if(o.t==='del'){list.splice(list.indexOf(find(o.id,list)),1);}
  if(o.t==='add'){list.push(JSON.parse(JSON.stringify(o.it)));}});}
 function preview(){
  var ops=plan(cmdin.value);
  if(!ops.length){box.innerHTML='<div class="c-diff" style="border-color:var(--line)"><span class="dh">'+ic('spark',14)+'Нечего менять: команда уже выполнена или я её не понял. Попробуйте другую подсказку.</span></div>';return;}
  var after=JSON.parse(JSON.stringify(items));applyTo(after,ops);
  var lines=ops.map(function(o){
   if(o.t==='mod'){var it=find(o.id);return '<div class="dl mod"><i>~</i><span>Позиция '+(items.indexOf(it)+1)+': <s>'+it.name+'</s> → '+o.to+', '+money(it.p)+' → '+money(o.p1)+' / LF</span><b>'+delta((o.p1-it.p)*it.q)+'</b></div>'}
   if(o.t==='del'){var d=find(o.id);return '<div class="dl del"><i>−</i><span>Позиция '+(items.indexOf(d)+1)+': '+d.name+'</span><b>'+delta(-d.q*d.p)+'</b></div>'}
   return '<div class="dl add"><i>+</i><span>Новая позиция: '+o.it.name+(o.it.u==='flat'?'':' · '+o.it.q+' '+o.it.u)+'</span><b>'+delta(o.it.q*o.it.p)+'</b></div>'}).join('');
  box.innerHTML='<div class="c-diff"><span class="dh">'+ic('spark',14)+'Помощник предлагает изменения в EST-0148</span>'+lines+
   '<div class="df2"><span>Итого: <s>'+money(total())+'</s> → <b class="num">'+money(total(after))+'</b></span><div class="c-row"><button class="c-btn g sm c-cancel" type="button">Отмена</button><button class="c-btn p sm c-apply" type="button">'+ic('check',14)+'Применить</button></div></div></div>';
  box.querySelector('.c-cancel').onclick=function(){box.innerHTML=''};
  box.querySelector('.c-apply').onclick=function(){
   var snap=JSON.parse(JSON.stringify(items));
   flipLi(function(){applyTo(items,ops);renderLi()});
   ops.forEach(function(o){flash(o.t==='add'?o.it.id:o.id)});
   box.innerHTML='';
   toast('Помощник обновил смету',function(){flipLi(function(){items=snap;renderLi()})});
  };
 }
 sec.querySelector('.c-run').addEventListener('click',preview);
 cmdin.addEventListener('keydown',function(e){if(e.key==='Enter')preview()});
 /* ---- swipe rows ---- */
 var swp=null;
 sec.addEventListener('pointerdown',function(e){var f=e.target.closest('.c-front');if(!f)return;
  sec.querySelectorAll('.c-front').forEach(function(o){if(o!==f&&o.dataset.x&&+o.dataset.x!==0){o.classList.add('snap');o.dataset.x=0;o.style.transform=''}});
  swp={f:f,x:e.clientX,base:+(f.dataset.x||0),cx:+(f.dataset.x||0),moved:false};f.classList.remove('snap');});
 window.addEventListener('pointermove',function(e){if(!swp)return;var dx=e.clientX-swp.x;if(!swp.moved&&Math.abs(dx)<6)return;swp.moved=true;
  var x=swp.base+dx;if(x>0)x=x*.2;if(x<-168)x=-168+(x+168)*.25;swp.cx=x;swp.f.style.transform='translateX('+x+'px)';});
 function swEnd(){if(!swp)return;var f=swp.f,open=(swp.moved?swp.cx:swp.base)<-70;f.classList.add('snap');f.dataset.x=open?-168:0;f.style.transform=open?'translateX(-168px)':'';swp=null;}
 window.addEventListener('pointerup',swEnd);window.addEventListener('pointercancel',swEnd);
 /* ---- misc controls ---- */
 var len=148;
 sec.addEventListener('click',function(e){
  var t=e.target,b;
  if((b=t.closest('.c-styles button'))){sec.className='vz v-'+b.dataset.style;sec.querySelectorAll('.c-styles button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});return;}
  if((b=t.closest('.c-seg button'))){var bs=[].slice.call(b.parentNode.querySelectorAll('button'));var i=bs.indexOf(b);bs.forEach(function(x){x.setAttribute('aria-pressed',x===b)});b.parentNode.querySelector('.ind').style.transform='translateX('+(i*100)+'%)';return;}
  if((b=t.closest('.c-sw'))){b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true');return;}
  if((b=t.closest('.c-step button'))){len=Math.max(1,len+(+b.dataset.d));var o=sec.querySelector('#cf-len');o.textContent=len+'′ 0″';o.classList.remove('bump');void o.offsetWidth;o.classList.add('bump');return;}
  if((b=t.closest('[data-cmd]'))){cmdin.value=b.dataset.cmd;preview();return;}
  if((b=t.closest('.c-single .c-chip'))){b.parentNode.querySelectorAll('.c-chip').forEach(function(x){x.setAttribute('aria-pressed',x===b)});return;}
  if((b=t.closest('.c-load'))){if(b.dataset.state!=='idle')return;var lbl=b.querySelector('span'),ico=b.querySelector('svg');b.dataset.state='loading';ico.outerHTML='<span class="c-spin"></span>';lbl.textContent='Отправляю…';
   setTimeout(function(){b.dataset.state='done';b.querySelector('.c-spin').outerHTML=ic('check',16);lbl.textContent='Отправлено';
    setTimeout(function(){b.dataset.state='idle';b.querySelector('svg').outerHTML=ic('send',16);lbl.textContent='Отправить клиенту'},1600)},1100);return;}
  if(t.closest('.c-toastbtn')){toast('Смета EST-0148 отправлена Yuri Petrov',function(){toast('Отправка отменена')});return;}
  if((b=t.closest('.c-acts button'))){toast(b.textContent.trim()+': Yuri Petrov');return;}
 });
 return sec;
}
var stage=document.getElementById('stage'),sw=document.getElementById('switch'),intro=document.getElementById('intro');
var views={};
V.forEach(function(v){views[v.key]=build(v);stage.appendChild(views[v.key]);
 var a=document.createElement('a');a.href='#'+v.key;a.dataset.k=v.key;a.innerHTML='<i style="background:'+v.sw+'"></i>'+v.n+' · '+v.name;sw.appendChild(a);});
views.components=componentsView();stage.appendChild(views.components);
(function(){var ac=document.createElement('a');ac.href='#components';ac.dataset.k='components';ac.innerHTML='<i style="background:conic-gradient(#f2622e,#f4c430,#2f6fdb,#ff7a59,#0a6cff,#f2622e)"></i>Компоненты';sw.appendChild(ac);})();
var cur=null;
function show(){
 var k=(location.hash||'').slice(1);if(!views[k])k=V[0].key;cur=k;
 Object.keys(views).forEach(function(key){views[key].hidden=key!==k});
 sw.querySelectorAll('a').forEach(function(a){if(a.dataset.k===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 if(k==='components'){intro.innerHTML='<div><span class="num-tag">Библиотека компонентов</span><h1>Компоненты</h1></div><div><p>Живые компоненты продукта: кнопки, переключатели, поля, статусы, свайп строк, позиции сметы с перетаскиванием, AI-предпросмотр, уведомления с отменой. Стиль меняется кнопками сверху, тема и плотность справа.</p></div>';syncModes();return;}
 var v=V.filter(function(x){return x.key===k})[0];
 intro.innerHTML='<div><span class="num-tag">Прототип '+v.n+' из '+V.length+'</span><h1>'+v.name+'</h1></div><div><p>'+v.d+'</p><ul>'+v.pts.map(function(p){return '<li>'+p+'</li>'}).join('')+'</ul></div>';
 syncModes();
}
function syncModes(){var m=views[cur].dataset.mode;document.getElementById('m-light').setAttribute('aria-pressed',m==='light');document.getElementById('m-dark').setAttribute('aria-pressed',m==='dark');}
document.getElementById('m-light').addEventListener('click',function(){views[cur].dataset.mode='light';syncModes()});
document.getElementById('m-dark').addEventListener('click',function(){views[cur].dataset.mode='dark';syncModes()});
var density='normal';
function setDensity(d){density=d;Object.keys(views).forEach(function(key){views[key].dataset.density=d});
 document.getElementById('d-normal').setAttribute('aria-pressed',d==='normal');document.getElementById('d-compact').setAttribute('aria-pressed',d==='compact');}
document.getElementById('d-normal').addEventListener('click',function(){setDensity('normal')});
document.getElementById('d-compact').addEventListener('click',function(){setDensity('compact')});
setDensity('normal');
window.addEventListener('hashchange',show);
show();
})();
</script>
