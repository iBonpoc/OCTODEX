<title>Gutter CRM Style Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@400;500;600&family=Onest:wght@400;500;600&display=swap">
<style>
/* Lab layout: sticky switcher of named prototypes; each prototype = same CRM content in its own visual world (tokens scoped per variant + light/dark mode). */
:root{
  --lab-bg:#f1eee9; --lab-fg:#1b1814; --lab-2:rgba(27,24,20,.62); --lab-line:rgba(27,24,20,.12); --lab-chip:#ffffff; --lab-on:#1b1814; --lab-on-fg:#fff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --lab-bg:#121110; --lab-fg:#f3efe9; --lab-2:rgba(243,239,233,.6); --lab-line:rgba(243,239,233,.12); --lab-chip:#1e1c1a; --lab-on:#f3efe9; --lab-on-fg:#121110; color-scheme:dark}}
:root[data-theme="dark"]{--lab-bg:#121110; --lab-fg:#f3efe9; --lab-2:rgba(243,239,233,.6); --lab-line:rgba(243,239,233,.12); --lab-chip:#1e1c1a; --lab-on:#f3efe9; --lab-on-fg:#121110; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--lab-bg);color:var(--lab-fg);font-family:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lab-bg)}
button{font:inherit}
button:focus-visible{outline:2px solid #f2622e;outline-offset:2px}

.labbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--lab-bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--lab-line)}
.labbar-in{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.labbar b{font-weight:600;margin-right:6px}
.switch{display:flex;gap:4px;flex-wrap:wrap;overflow-x:auto}
.switch a{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--lab-fg);font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--lab-chip);border:1px solid var(--lab-line);white-space:nowrap}
.switch a i{width:12px;height:12px;border-radius:50%;flex:none}
.switch a[aria-current="page"]{background:var(--lab-on);color:var(--lab-on-fg);border-color:var(--lab-on)}
.modes{margin-left:auto;display:flex;gap:4px}
.modes button{border:1px solid var(--lab-line);background:var(--lab-chip);color:var(--lab-fg);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.modes button[aria-pressed="true"]{background:var(--lab-on);color:var(--lab-on-fg)}

.page{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:22px}
.intro .num-tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--lab-2);font-weight:600}
.intro h1{margin:4px 0 0;font-size:clamp(34px,5.5vw,56px);line-height:1;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.intro p{margin:0;color:var(--lab-2);max-width:62ch}
.intro ul{margin:8px 0 0;padding-left:18px;color:var(--lab-2);display:flex;flex-direction:column;gap:4px}

/* ================= variant component system (all colors via tokens) ================= */
.vz{display:flex;flex-direction:column;gap:28px;color:var(--fg);font-family:var(--f-body)}
.vz .num{font-variant-numeric:tabular-nums}
.vz .disp{font-family:var(--f-display);font-weight:var(--d-w);text-transform:var(--d-case);letter-spacing:var(--d-track);line-height:1}
.scene{position:relative;border-radius:30px;overflow:hidden;isolation:isolate;padding:18px;background:var(--scene)}
.glass{background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(170%);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge),var(--shadow)}
.solid{background:var(--solid);border:1px solid var(--line)}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--solid);backdrop-filter:none;-webkit-backdrop-filter:none}}
.ico{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.shell{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.shell.top{grid-template-columns:minmax(0,1fr)}

/* side nav */
.side{width:252px;border-radius:calc(var(--r-lg) + 6px);padding:12px;display:flex;flex-direction:column;gap:4px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.side.mini{width:72px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 4px 10px;position:relative}
.logo{flex:none;width:40px;height:40px;border-radius:var(--r-logo);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 8px 20px -10px var(--btn-bg)}
.brand-t{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.brand-t b{font-weight:600;font-size:14px}
.brand-t span{font-size:12px;color:var(--fg3);white-space:nowrap}
.collapse{position:absolute;right:-4px;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--solid);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.side.mini .collapse{right:-18px}
.side.mini .collapse svg{transform:rotate(180deg)}
.search{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:var(--r-pill);background:var(--track);color:var(--fg3);font-size:13px}
.search kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line)}
.grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);padding:12px 12px 2px;font-weight:600}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;width:100%;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-pill);border:1px solid transparent;background:none;color:var(--fg);font-weight:500;font-size:13.5px;cursor:pointer;text-align:left}
.nav button:hover{background:var(--track)}
.nav button[aria-current="page"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-line);box-shadow:inset 0 1px 0 var(--edge)}
.badge{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:var(--r-pill);display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--track);color:var(--fg)}
.badge.hot{background:var(--hot);color:#fff}
.dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--hot)}
.ai{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:9px;padding:11px;border-radius:var(--r-pill);border:0;cursor:pointer;font-weight:600;background:var(--btn-bg);color:var(--btn-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 22px -12px var(--btn-bg)}
.me{display:flex;align-items:center;gap:10px;padding:10px 4px 2px;border-top:1px solid var(--line);margin-top:8px}
.ava{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--track)}
.side.mini .hm{display:none}
.side.mini .nav button,.side.mini .ai,.side.mini .search{justify-content:center;padding:10px 0}
.side.mini .badge,.side.mini .dot{position:absolute;top:5px;right:12px;min-width:0;width:8px;height:8px;padding:0;font-size:0;margin:0;background:var(--hot)}
.side.mini .brand,.side.mini .me{justify-content:center}
.side.mini .nav button:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;padding:6px 11px;border-radius:var(--r-pill);background:var(--solid);border:1px solid var(--line);color:var(--fg);font-size:12.5px;box-shadow:var(--shadow);z-index:5}

/* top nav */
.topnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.topnav .lg{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:var(--r-pill);font-weight:600}
.topnav .lg .logo{width:30px;height:30px;font-size:15px}
.pills{display:flex;gap:2px;padding:4px;border-radius:var(--r-pill);flex-wrap:wrap;margin-left:auto}
.pills button{border:0;background:none;color:var(--fg2);font-size:13px;font-weight:500;padding:7px 12px;border-radius:var(--r-pill);cursor:pointer}
.pills button[aria-current="page"]{background:var(--sel-bg);color:var(--sel-fg)}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:0;color:var(--fg);cursor:pointer}

/* main */
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:var(--h-size)}
.head p{margin:4px 0 0;font-size:12.5px;color:var(--fg3)}
.new{display:flex;align-items:center;gap:8px;border:0;cursor:pointer;font-weight:600;font-size:13px;padding:8px 16px 8px 8px;border-radius:var(--r-pill);background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 10px 22px -14px var(--btn-bg)}
.new i{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi small{font-size:12px;color:var(--fg3)}
.kpi b{font-size:var(--k-size)}
.kpi em{font-style:normal;font-size:12px}
.up{color:var(--ok)} .wa{color:var(--warn)} .bad{color:var(--hot)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{border-radius:var(--r-lg);padding:15px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:start;gap:8px}
.ch h4{margin:0;font-size:14px;font-weight:600}
.ch small{display:block;font-size:11.5px;color:var(--fg3)}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r-pill);white-space:nowrap}
.t-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.t-ac{background:var(--accent);color:var(--accent-ink)}
.t-info{color:var(--info);background:color-mix(in srgb,var(--info) 15%,transparent)}
.t-hot{color:var(--hot);background:color-mix(in srgb,var(--hot) 15%,transparent)}
.t-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.fun{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:8px;align-items:center}
.fr small{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11.5px;color:var(--fg2)}
.ft{height:12px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.ft i{display:block;height:100%;border-radius:var(--r-pill);background:var(--fg)}
.ft i.a{background:var(--accent)}
.fr > span{font-size:11.5px;font-weight:600;text-align:right}
.donut{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center}
.donut svg{width:104px;height:104px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12px}
.legend div{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:7px;align-items:center}
.legend i{width:9px;height:9px;border-radius:50%}
.legend span{color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{font-weight:600}
.legend em{grid-column:2/-1;font-style:normal;font-size:11px;color:var(--fg3);margin-top:-5px}
.dial{position:relative;width:124px;height:124px;margin:0 auto}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial b{font-size:30px}
.dial small{font-size:11px;color:var(--fg3)}
.inv{background:var(--inv-bg);color:var(--inv-fg);border:1px solid var(--inv-bg)}
.inv .ch small{color:var(--inv-2)}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:grid;grid-template-columns:minmax(0,1fr) 22px;gap:8px;align-items:center;padding:8px 10px;border-radius:calc(var(--r-md) - 2px);background:color-mix(in srgb,var(--inv-fg) 8%,transparent)}
.task b{font-weight:500;font-size:12.5px;display:block}
.task small{font-size:11px;color:var(--inv-2)}
.task.done b{text-decoration:line-through;color:var(--inv-2)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--inv-2);background:none;cursor:pointer;padding:0;display:grid;place-items:center;color:var(--accent-ink);font-size:12px}
.done .chk{background:var(--accent);border-color:var(--accent)}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{border-radius:var(--r-lg);padding:11px;display:flex;flex-direction:column;gap:9px;min-width:0;min-height:110px}
.colh{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;padding:2px 4px}
.colh span.sum{color:var(--fg3);font-weight:500}
.colh i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.deal{border-radius:var(--r-md);padding:11px;display:flex;flex-direction:column;gap:8px}
.who{display:flex;gap:9px;align-items:center}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--fg);color:var(--bg-ink)}
.deal b{font-weight:600;font-size:13px;display:block}
.deal small{font-size:11px;color:var(--fg3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prob{height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.prob i{display:block;height:100%;background:var(--accent)}
.df{display:flex;justify-content:space-between;align-items:center;gap:8px}
.amt{font-size:16px;font-weight:600}
.adv{border:0;cursor:pointer;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:var(--r-pill);background:var(--sel-bg);color:var(--sel-fg)}
.deal.won{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.deal.won small{color:var(--inv-2)}
.deal.won .av{background:var(--accent);color:var(--accent-ink)}
.deal.won .adv{background:var(--accent);color:var(--accent-ink)}

/* phones */
.phones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.pw{display:flex;flex-direction:column;gap:10px;align-items:center}
.pw > span{font-size:12.5px;color:var(--lab-2)}
.phone{width:100%;max-width:320px;aspect-ratio:9/19;border-radius:44px;padding:9px;background:#0b0908;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.screen{position:relative;height:100%;border-radius:36px;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;background:var(--scene);color:var(--fg)}
.status{display:flex;justify-content:space-between;padding:12px 22px 2px;font-size:12px;font-weight:600}
.sbar{margin:6px 12px 0;padding:9px 14px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:13.5px}
.scr{flex:1;overflow:hidden;padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.mc{border-radius:var(--r-lg);padding:13px;display:flex;flex-direction:column;gap:6px}
.tabbar{position:absolute;left:12px;right:12px;bottom:14px;border-radius:30px;padding:7px 9px;display:flex;align-items:center;justify-content:space-between}
.tab{border:0;background:none;color:var(--fg2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:5px 7px;cursor:pointer;border-radius:16px}
.tab[aria-current="page"]{color:var(--sel-fg);background:var(--sel-bg)}
.mic{width:52px;height:52px;margin-top:-24px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 0 0 6px color-mix(in srgb,var(--btn-bg) 22%,transparent),0 12px 24px -8px var(--btn-bg)}
.sat{position:relative;flex:1;margin:10px 12px 92px;border-radius:var(--r-lg);overflow:hidden;background:#3d4136}
.sat svg{width:100%;height:100%;display:block}
.tool{position:absolute;left:8px;right:8px;bottom:8px;border-radius:var(--r-lg);padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.tool .sum{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--fg2);flex-wrap:wrap}
.tool .sum b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.tools{display:flex;gap:5px;flex-wrap:wrap}
.tb{font-size:11px;font-weight:600;padding:5px 9px;border-radius:var(--r-pill);background:var(--track)}
.tb.on{background:var(--accent);color:var(--accent-ink)}
.opt{border-radius:var(--r-md);padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.opt.pick{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.opt .ot{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.opt h5{margin:0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.opt .pr{font-size:24px}
.opt p{margin:0;font-size:12px;color:var(--fg3)}
.opt .mo{font-size:11.5px;color:var(--fg2)}
.cta{margin-top:auto;border:0;border-radius:var(--r-pill);padding:12px;font-weight:600;cursor:pointer;background:var(--btn-bg);color:var(--btn-fg)}

@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.kan{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.phones{grid-template-columns:1fr}.intro{grid-template-columns:1fr}}
@media (max-width:760px){.shell{grid-template-columns:1fr}.side{width:100%}.side.mini{width:72px}.kpis{grid-template-columns:1fr}.pills{margin-left:0}.modes{margin-left:0}}
@media (max-width:540px){.grid4,.kan{grid-template-columns:1fr}.scene{padding:12px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ================= motion: springs, lift & drop ================= */
.vz{--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.2,.8,.2,1)}
@supports (transition-timing-function: linear(0, 1)){.vz{--ease-spring:linear(0, .009, .035 2.1%, .141 4.4%, .723 12.9%, .938 16.7%, 1.017 19.4%, 1.067, 1.099 24.3%, 1.106 26.4%, 1.098 28.8%, 1.068 32.4%, .998 41.5%, .981 46.7%, .981 52.6%, .999 69.4%, 1.002 80.6%, 1)}}
.vz:not([hidden]){animation:vz-in .55s var(--ease-out) both}
@keyframes vz-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.vz button{transition:transform .5s var(--ease-spring),background-color .25s,color .25s,box-shadow .25s}
.vz button:active{transform:scale(.92);transition-duration:.08s,.25s,.25s,.25s}
.vz .nav button:active,.vz .pills button:active,.vz .tab:active{transform:scale(.96)}
.vz .mic:active{transform:scale(.88)}
.vz .card,.vz .kpi,.vz .mc,.vz .opt{transition:transform .55s var(--ease-spring),box-shadow .3s}
.vz .card:hover,.vz .kpi:hover{transform:translateY(-3px)}
.vz .opt:active,.vz .mc:active{transform:scale(.98)}
.deal{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:transform .45s var(--ease-spring),box-shadow .3s,opacity .2s}
.deal:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.deal.ph{opacity:.5;background:transparent!important;border:2px dashed var(--accent)!important;box-shadow:none}
.deal.ph > *{visibility:hidden}
.deal.lifted{position:fixed;z-index:50;margin:0;pointer-events:none;cursor:grabbing;box-shadow:var(--shadow)}
.deal.lifted.up{box-shadow:0 34px 60px -18px rgba(0,0,0,.5),0 0 0 2px var(--accent)}
.col{transition:box-shadow .25s,transform .45s var(--ease-spring)}

 function endDrag(){
  var d=drag;drag=null;sec.classList.remove('dragging');if(d.over)d.over.classList.remove('over');
  var t=d.el.getBoundingClientRect();
  d.g.classList.remove('up');
  d.g.style.transition='transform .48s var(--ease-spring),box-shadow .48s';
  d.g.style.transform='translate('+(t.left-d.x0)+'px,'+(t.top-d.y0)+'px)';
  setTimeout(function(){
   d.g.remove();d.el.classList.remove('ph');
   var order=[];cols.forEach(function(c,ci){c.querySelectorAll('.deal[data-id]').forEach(function(el){var dd=byId(el.dataset.id);if(dd.st!==ci){dd.st=ci;if(ci===3)dd.p=100}order.push(dd)})});
   deals=order;render();land(d.el.dataset.id);
   try{navigator.vibrate&&navigator.vibrate(14)}catch(_){}
  },reduce?0:440);
 }
 sec.addEventListener('pointerdown',function(e){
  var el=e.target.closest('.deal[data-id]');if(!el||e.target.closest('button')||e.button>0||drag)return;
  press={el:el,x:e.clientX,y:e.clientY,touch:e.pointerType!=='mouse',t:null};
  if(press.touch){var p=press;p.t=setTimeout(function(){if(press===p){press=null;startDrag(p.el,p.x,p.y)}},230);}
 });
 window.addEventListener('pointermove',function(e){
  if(drag){e.preventDefault();moveDrag(e.clientX,e.clientY);return}
  if(!press)return;
  var m=Math.abs(e.clientX-press.x)+Math.abs(e.clientY-press.y);
  if(press.touch){if(m>10){clearTimeout(press.t);press=null}return}
  if(m>5){var p=press;press=null;startDrag(p.el,p.x,p.y);moveDrag(e.clientX,e.clientY)}
 },{passive:false});
 window.addEventListener('touchmove',function(e){if(drag)e.preventDefault()},{passive:false});
 function up(){if(press){clearTimeout(press.t);press=null}if(drag)endDrag()}
 window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
 sec.addEventListener('contextmenu',function(e){if(e.target.closest('.deal'))e.preventDefault()});
 sec.addEventListener('click',function(e){
  var t=e.target;
  var adv=t.closest('.adv');if(adv){var d=byId(adv.dataset.id);if(d&&d.st<3){flip(function(){d.st++;d.p=Math.min(100,d.p+20);deals.splice(deals.indexOf(d),1);deals.push(d);render()});land(d.i);}return;}
  var chk=t.closest('.chk');if(chk){var tk=chk.closest('.task');var on=tk.classList.toggle('done');chk.textContent=on?'✓':'';
   var box=tk.parentNode;sec.querySelector('.tc').textContent=box.querySelectorAll('.done').length+'/'+box.children.length;return;}
  var col=t.closest('.collapse');if(col){var s=sec.querySelector('.side');var m=s.classList.toggle('mini');col.setAttribute('aria-label',m?'Развернуть меню':'Свернуть меню');return;}
  var nb=t.closest('.nav button');if(nb){sec.querySelectorAll('.nav button').forEach(function(x){x.removeAttribute('aria-current')});nb.setAttribute('aria-current','page');return;}
  var pb=t.closest('.pills button');if(pb){sec.querySelectorAll('.pills button').forEach(function(x){x.removeAttribute('aria-current')});pb.setAttribute('aria-current','page');return;}
  var tb=t.closest('.tab');if(tb&&tb.parentNode){tb.parentNode.querySelectorAll('.tab').forEach(function(x){x.removeAttribute('aria-current')});tb.setAttribute('aria-current','page');}
 });
 return sec;
}
var stage=document.getElementById('stage'),sw=document.getElementById('switch'),intro=document.getElementById('intro');
var views={};
V.forEach(function(v){views[v.key]=build(v);stage.appendChild(views[v.key]);
 var a=document.createElement('a');a.href='#'+v.key;a.dataset.k=v.key;a.innerHTML='<i style="background:'+v.sw+'"></i>'+v.n+' · '+v.name;sw.appendChild(a);});
var cur=null;
function show(){
 var k=(location.hash||'').slice(1);if(!views[k])k=V[0].key;cur=k;
 V.forEach(function(v){views[v.key].hidden=v.key!==k});
 sw.querySelectorAll('a').forEach(function(a){if(a.dataset.k===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 var v=V.filter(function(x){return x.key===k})[0];
 intro.innerHTML='<div><span class="num-tag">Прототип '+v.n+' из '+V.length+'</span><h1>'+v.name+'</h1></div><div><p>'+v.d+'</p><ul>'+v.pts.map(function(p){return '<li>'+p+'</li>'}).join('')+'</ul></div>';
 syncModes();
}
function syncModes(){var m=views[cur].dataset.mode;document.getElementById('m-light').setAttribute('aria-pressed',m==='light');document.getElementById('m-dark').setAttribute('aria-pressed',m==='dark');}
document.getElementById('m-light').addEventListener('click',function(){views[cur].dataset.mode='light';syncModes()});
document.getElementById('m-dark').addEventListener('click',function(){views[cur].dataset.mode='dark';syncModes()});
var density='normal';
function setDensity(d){density=d;V.forEach(function(v){views[v.key].dataset.density=d});
 document.getElementById('d-normal').setAttribute('aria-pressed',d==='normal');document.getElementById('d-compact').setAttribute('aria-pressed',d==='compact');}
document.getElementById('d-normal').addEventListener('click',function(){setDensity('normal')});
document.getElementById('d-compact').addEventListener('click',function(){setDensity('compact')});
setDensity('normal');
window.addEventListener('hashchange',show);
show();
})();
</script>
