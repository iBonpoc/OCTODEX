# Every PR and push to main: types, unit tests (engine money scenarios, design-system guard, tokens contrast),
# database tests (RLS, money safety, client page), then the end-to-end browser runs. A red check blocks the merge.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types + unit tests
        run: npm run typecheck && npm test
      - name: Database tests (PostgreSQL 16)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16 >/dev/null
          sudo bash supabase/tests/run.sh
      - name: End-to-end (browser)
        working-directory: apps/mobile
        run: |
          npx playwright install --with-deps chromium >/dev/null
          node e2e/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: apps/mobile/e2e/out/
