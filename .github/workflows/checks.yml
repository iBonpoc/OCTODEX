# Every PR and push to main: types, unit tests (engine money scenarios, design-system guard, tokens contrast, story map),
# database tests (RLS, money safety, client page), then the end-to-end browser runs, each view in 2 parallel parts:
# a PR runs every spec at 390 dark, 820 light and 1280 dark (each width and both themes; 08-layouts checks every screen
# at all 6 views); a push to main runs only 390 dark (#906 п.6, audit variant C, 11.11) — the 3 views already ran on the PR.
# Nightly on main (and by hand): every spec at all 3 widths × 2 themes (CLAUDE.md rule 4, docs/ai/CHECKS.md §1).
# The job "checks" is green only when all of them are — that is the one branch protection requires, and the release
# (release.yml) starts only after it is green on main.
# Docs-only changes (every changed file is under docs/ or ends in .md) skip the browser runs: they cannot change the app
# (founder 05.11.2026, saves GitHub minutes and the queue). Types, unit and database tests still run — the story-map test
# reads docs/15-story-map.md.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  # Nightly on main: every spec at all 3 widths × 2 themes (docs/ai/CHECKS.md §1). 10:17 UTC = 2:17 AM in Los Angeles,
  # away from the company-midnight window (CHECKS §5). A red nightly opens an issue for the director.
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

# A new push to a PR stops the run of its older version (saves GitHub minutes). Pushes to main are never cancelled:
# each gets its own group (run_id).
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pipeline pause (#1087, rule 26): while a task labelled «остановка» is open, a pull request without the label «починка» stops
  # here in seconds (red, plain text) and its other jobs are skipped, so they take no runners. scripts/pipelinePause.cjs decides;
  # pipeline-resume.yml re-runs the stopped PRs when the stop is closed. push to main, the nightly and manual runs are never paused.
  pause:
    name: Pipeline pause
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: No open stop (or the PR is a fix)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/pipelinePause.cjs

  changes:
    name: What changed
    needs: pause
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.diff.outputs.app }}
      deps: ${{ steps.deps.outputs.deps }}
      views: ${{ steps.views.outputs.views }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: App files changed?
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|\.md$'; then echo "app=false" >> "$GITHUB_OUTPUT"; else echo "app=true" >> "$GITHUB_OUTPUT"; fi
      # #1074: did THIS PR change dependency files (measured from the merge-base of its head)? Decides how the Expo version check ends.
      - id: deps
        name: Dependencies changed?
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/depsChanged.cjs
      # PR: every spec at 3 views that cover each width and both themes (08-layouts checks every screen at all 6 views by
      # itself, in 390-dark only). Push to main: 390-dark only. Nightly and by hand: all 6 views. 2 parallel parts (--shard).
      - id: views
        name: Which views
        run: |
          # push to main: ONE view (390-dark; it also carries 08-layouts, which checks all 6 views by itself) — the full 3-view
          # run already ran on the PR, and all 6 views run every night (#906 п.6, audit "yes" 11.11 to variant C, conditions 2–5)
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v='["390-dark","390-light","820-dark","820-light","1280-dark","1280-light"]'
          elif [ "${{ github.event_name }}" = "push" ]; then
            v='["390-dark"]'
          else
            v='["390-dark","820-light","1280-dark"]'
          fi
          echo "views=$v" >> "$GITHUB_OUTPUT"

  fast:
    name: Types, unit and database tests
    needs: pause
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # #621: the base the old-labels guard (apps/mobile/test/i18nStale.test.ts) compares src/i18n with — the PR's base,
      # the commit before a push to main; the night and a run by hand compare the commit with itself (nothing changed)
      - name: The base for the old-labels guard
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git fetch -q --no-tags --depth=1 origin "$BASE"; then
            echo "I18N_BASE=$BASE" >> "$GITHUB_ENV"
          else
            echo "I18N_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Types + unit tests
        run: npm run typecheck && npm test
      # the built libfaketime (when Ubuntu's mirrors do not resolve) is kept between runs; scripts/dbTools.sh decides what is needed
      - uses: actions/cache@v4
        with:
          path: ~/libfaketime
          key: libfaketime-v0.9.10-${{ runner.os }}-${{ runner.arch }}-d475b925943ad404c6c728ac868dc73949e7281c
      - name: Database tests (PostgreSQL 16)
        run: |
          bash scripts/aptRetries.sh
          bash scripts/dbTools.sh postgres faketime
          sudo CATALOG_OUT="$RUNNER_TEMP/catalog.json" bash supabase/tests/run.sh
      # #620: the same tests with the database's clock at 23:40 in Los Angeles — the UTC date is tomorrow already, so a
      # test taking «today» from current_date goes red here, not on main for 8 hours in the company's evening (T147, #476)
      - name: Database tests at 23:40 Los Angeles (UTC is a day ahead)
        run: sudo DB_NOW=la-2340 FAKETIME_LIB="${FAKETIME_LIB:-}" bash supabase/tests/run.sh
      # docs/specs/21 §5: the app's calls against the LIVE catalog the run above wrote (pg_proc, EXECUTE rights).
      # CATALOG_REQUIRED=1: without the file the test fails instead of skipping.
      - name: The app's server calls against the live catalog
        working-directory: apps/mobile
        env:
          CATALOG_JSON: ${{ runner.temp }}/catalog.json
          CATALOG_REQUIRED: '1'
        run: npx vitest run test/serverCatalog.test.ts

  bundle:
    # CHECKS §3а п.2: the iOS and Android bundles build (Metro, Hermes) and the dependencies match the Expo SDK.
    # Not EAS: no account, no network beyond npm. Skipped for docs-only, like e2e.
    name: iOS + Android bundle, Expo checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # #1074: Expo patch releases must not turn every PR red. Red only when this PR changed package.json / the lock (then the
      # difference is ours); otherwise a warning — the daily run (expo-patches.yml) keeps one task open until it is fixed.
      - name: Dependencies match the Expo SDK
        working-directory: apps/mobile
        env:
          DEPS_CHANGED: ${{ needs.changes.outputs.deps }}
        run: |
          if npx expo install --check; then exit 0; fi
          if [ "$DEPS_CHANGED" = "true" ]; then echo "::error::Expo versions differ and this PR changed the dependencies: run npx expo install --fix"; exit 1; fi
          echo "::warning::Expo versions differ from the SDK's expected patches, but this PR changed no dependencies: not red (task «Обновить патчи Expo» is kept by expo-patches.yml)"
      - name: expo-doctor (pinned, rule 17 checked in #225)
        working-directory: apps/mobile
        env:
          DEPS_CHANGED: ${{ needs.changes.outputs.deps }}
        # #1074 again: expo-doctor repeats the same «versions match the SDK» check, so a fresh Expo patch turned every PR red
        # (12.11.2026). The step above already decides that check; doctor skips it unless this PR changed the dependencies.
        run: |
          if [ "$DEPS_CHANGED" != "true" ]; then export EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK=1; fi
          npx -y expo-doctor@1.21.5
      - name: Export the iOS and Android bundles
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/bundle"

  # One web build per run (#906 п.3, D-13): before, every one of the 6 e2e jobs ran its own `expo export` (7 builds a run).
  # The build is the same for every view and part; the jobs download it and run with --no-build.
  build-web:
    name: Web build (once for all e2e jobs)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the web app
        working-directory: apps/mobile
        run: npx expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/mobile/dist/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: End-to-end ${{ matrix.view }} part ${{ matrix.part }}
    needs: [changes, build-web]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # a part takes ~10 min; the limit only catches a hung run
    strategy:
      fail-fast: false
      matrix:
        view: ${{ fromJSON(needs.changes.outputs.views) }}
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/mobile/dist
      # The browser download is cached per Playwright version; scripts/playwrightInstall.sh adds the system libraries (one quick apt try, then Chromium without them) and starts the browser once.
      - id: pw
        name: Playwright version
        working-directory: apps/mobile
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: End-to-end (browser)
        working-directory: apps/mobile
        run: |
          bash ../../scripts/aptRetries.sh
          bash ../../scripts/playwrightInstall.sh
          view="${{ matrix.view }}"
          # 08-layouts checks all 6 views by itself: run it in one view only
          [ "$view" = "390-dark" ] || export E2E_OWN_LAYOUTS=0
          node e2e/run.cjs --no-build --width="${view%-*}" --theme="${view#*-}" --shard=${{ matrix.part }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        # screenshots are for reading a failure, not a test: a GitHub storage outage must not turn green tests red (05.11.2026)
        continue-on-error: true
        with:
          name: e2e-screenshots-${{ matrix.view }}-${{ matrix.part }}
          path: apps/mobile/e2e/out/

  # Rule 22 (CLAUDE.md, #902): the PR refers to a «до-1.0» task inside a release epic. Skipped: documents-only PRs and the
  # label «починка-main» (scripts/rule22.cjs). Reads the PR live (not from the event), so a re-run after editing the body is enough.
  rule22:
    name: Rule 22 (PR names a до-1.0 task)
    needs: pause
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: PR refers to a до-1.0 task in an epic
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/rule22.cjs

  checks:
    name: checks
    needs: [pause, changes, fast, bundle, build-web, e2e, rule22]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All checks green
        run: |
          # the pipeline pause (#1087): a stopped PR is RED — «skipped» jobs behind a failed pause must never read as green
          [ "${{ needs.pause.result }}" = "success" ] || { echo "::error::пауза конвейера (pause=${{ needs.pause.result }}): влить нельзя, пока открыта остановка"; exit 1; }
          # e2e may be skipped only when the change is docs-only
          e2e="${{ needs.e2e.result }}"
          bundle="${{ needs.bundle.result }}"
          docs=false
          if [ "${{ needs.changes.result }}" = "success" ] && [ "${{ needs.changes.outputs.app }}" = "false" ]; then docs=true; fi
          if [ "$docs" = true ] && [ "$e2e" = "skipped" ]; then e2e=success; fi
          if [ "$docs" = true ] && [ "$bundle" = "skipped" ]; then bundle=success; fi
          # rule22 runs on pull requests only: "skipped" on push/schedule is fine, failure is not
          [ "${{ needs.rule22.result }}" != "failure" ] && [ "${{ needs.rule22.result }}" != "cancelled" ] || { echo "::error::rule22=${{ needs.rule22.result }}"; exit 1; }
          [ "${{ needs.fast.result }}" = "success" ] && [ "$e2e" = "success" ] && [ "$bundle" = "success" ] || { echo "::error::changes=${{ needs.changes.result }} fast=${{ needs.fast.result }} bundle=${{ needs.bundle.result }} build-web=${{ needs.build-web.result }} e2e=${{ needs.e2e.result }}"; exit 1; }

  # A red nightly run opens (or adds to) one issue, so the director sees it in the morning (docs/ai/CHECKS.md §1).
  nightly-alert:
    name: Nightly alert
    needs: checks
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open or update the issue
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list -R "${{ github.repository }}" --state open --label nightly-red --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "${{ github.repository }}" --body "Red again: $url"
          else gh label create nightly-red -R "${{ github.repository }}" --color B60205 2>/dev/null || true
               gh issue create -R "${{ github.repository }}" --label nightly-red --title "Nightly checks red on main" --body "Full run (6 views) failed: $url"; fi
