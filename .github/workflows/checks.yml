# Every PR and push to main: types, unit tests (engine money scenarios, design-system guard, tokens contrast, story map),
# database tests (RLS, money safety, client page), then the end-to-end browser runs at 3 widths × 2 themes in parallel
# (CLAUDE.md rule 4). The job "checks" is green only when all of them are — that is the one branch protection requires.
# Docs-only changes (every changed file is under docs/ or ends in .md) skip the browser runs: they cannot change the app
# (founder 05.11.2026, saves GitHub minutes and the queue). Types, unit and database tests still run — the story-map test
# reads docs/15-story-map.md.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR stops the run of its older version (saves GitHub minutes). Pushes to main are never cancelled:
# each gets its own group (run_id).
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: App files changed?
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|\.md$'; then echo "app=false" >> "$GITHUB_OUTPUT"; else echo "app=true" >> "$GITHUB_OUTPUT"; fi

  fast:
    name: Types, unit and database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types + unit tests
        run: npm run typecheck && npm test
      - name: Database tests (PostgreSQL 16)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16 >/dev/null
          sudo bash supabase/tests/run.sh

  e2e:
    name: End-to-end ${{ matrix.width }} ${{ matrix.theme }}
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        width: [390, 820, 1280]
        theme: [dark, light]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: End-to-end (browser)
        working-directory: apps/mobile
        run: |
          npx playwright install --with-deps chromium >/dev/null
          node e2e/run.cjs --width=${{ matrix.width }} --theme=${{ matrix.theme }}
      - uses: actions/upload-artifact@v4
        if: always()
        # screenshots are for reading a failure, not a test: a GitHub storage outage must not turn green tests red (05.11.2026)
        continue-on-error: true
        with:
          name: e2e-screenshots-${{ matrix.width }}-${{ matrix.theme }}
          path: apps/mobile/e2e/out/

  checks:
    name: checks
    needs: [changes, fast, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All checks green
        run: |
          # e2e may be skipped only when the change is docs-only
          e2e="${{ needs.e2e.result }}"
          if [ "${{ needs.changes.result }}" = "success" ] && [ "${{ needs.changes.outputs.app }}" = "false" ] && [ "$e2e" = "skipped" ]; then e2e=success; fi
          [ "${{ needs.fast.result }}" = "success" ] && [ "$e2e" = "success" ] || { echo "::error::changes=${{ needs.changes.result }} fast=${{ needs.fast.result }} e2e=${{ needs.e2e.result }}"; exit 1; }
