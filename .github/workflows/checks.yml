# Every PR and push to main: types, unit tests (engine money scenarios, design-system guard, tokens contrast, story map),
# database tests (RLS, money safety, client page), then the end-to-end browser runs: every spec at 390 dark, 820 light
# and 1280 dark (each width and both themes; 08-layouts checks every screen at all 6 views), each view in 2 parallel parts.
# Nightly on main (and by hand): every spec at all 3 widths × 2 themes (CLAUDE.md rule 4, docs/ai/CHECKS.md §1).
# The job "checks" is green only when all of them are — that is the one branch protection requires, and the release
# (release.yml) starts only after it is green on main.
# Docs-only changes (every changed file is under docs/ or ends in .md) skip the browser runs: they cannot change the app
# (founder 05.11.2026, saves GitHub minutes and the queue). Types, unit and database tests still run — the story-map test
# reads docs/15-story-map.md.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  # Nightly on main: every spec at all 3 widths × 2 themes (docs/ai/CHECKS.md §1). 10:17 UTC = 2:17 AM in Los Angeles,
  # away from the company-midnight window (CHECKS §5). A red nightly opens an issue for the director.
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

# A new push to a PR stops the run of its older version (saves GitHub minutes). Pushes to main are never cancelled:
# each gets its own group (run_id).
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.diff.outputs.app }}
      views: ${{ steps.views.outputs.views }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: App files changed?
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|\.md$'; then echo "app=false" >> "$GITHUB_OUTPUT"; else echo "app=true" >> "$GITHUB_OUTPUT"; fi
      # PR and push to main: every spec at 3 views that cover each width and both themes (08-layouts checks every screen
      # at all 6 views by itself). Nightly and by hand: all 6 views. Each view runs in 2 parallel parts (--shard).
      - id: views
        name: Which views
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v='["390-dark","390-light","820-dark","820-light","1280-dark","1280-light"]'
          else
            v='["390-dark","820-light","1280-dark"]'
          fi
          echo "views=$v" >> "$GITHUB_OUTPUT"

  fast:
    name: Types, unit and database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types + unit tests
        run: npm run typecheck && npm test
      - name: Database tests (PostgreSQL 16)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16 faketime >/dev/null
          sudo CATALOG_OUT="$RUNNER_TEMP/catalog.json" bash supabase/tests/run.sh
      # #620: the same tests with the database's clock at 23:40 in Los Angeles — the UTC date is tomorrow already, so a
      # test taking «today» from current_date goes red here, not on main for 8 hours in the company's evening (T147, #476)
      - name: Database tests at 23:40 Los Angeles (UTC is a day ahead)
        run: sudo DB_NOW=la-2340 bash supabase/tests/run.sh
      # docs/specs/21 §5: the app's calls against the LIVE catalog the run above wrote (pg_proc, EXECUTE rights).
      # CATALOG_REQUIRED=1: without the file the test fails instead of skipping.
      - name: The app's server calls against the live catalog
        working-directory: apps/mobile
        env:
          CATALOG_JSON: ${{ runner.temp }}/catalog.json
          CATALOG_REQUIRED: '1'
        run: npx vitest run test/serverCatalog.test.ts

  bundle:
    # CHECKS §3а п.2: the iOS and Android bundles build (Metro, Hermes) and the dependencies match the Expo SDK.
    # Not EAS: no account, no network beyond npm. Skipped for docs-only, like e2e.
    name: iOS + Android bundle, Expo checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencies match the Expo SDK
        working-directory: apps/mobile
        run: npx expo install --check
      - name: expo-doctor (pinned, rule 17 checked in #225)
        working-directory: apps/mobile
        run: npx -y expo-doctor@1.21.5
      - name: Export the iOS and Android bundles
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/bundle"

  e2e:
    name: End-to-end ${{ matrix.view }} part ${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # a part takes ~10 min; the limit only catches a hung run
    strategy:
      fail-fast: false
      matrix:
        view: ${{ fromJSON(needs.changes.outputs.views) }}
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: End-to-end (browser)
        working-directory: apps/mobile
        run: |
          npx playwright install --with-deps chromium >/dev/null
          view="${{ matrix.view }}"
          # 08-layouts checks all 6 views by itself: run it in one view only
          [ "$view" = "390-dark" ] || export E2E_OWN_LAYOUTS=0
          node e2e/run.cjs --width="${view%-*}" --theme="${view#*-}" --shard=${{ matrix.part }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        # screenshots are for reading a failure, not a test: a GitHub storage outage must not turn green tests red (05.11.2026)
        continue-on-error: true
        with:
          name: e2e-screenshots-${{ matrix.view }}-${{ matrix.part }}
          path: apps/mobile/e2e/out/

  checks:
    name: checks
    needs: [changes, fast, bundle, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All checks green
        run: |
          # e2e may be skipped only when the change is docs-only
          e2e="${{ needs.e2e.result }}"
          bundle="${{ needs.bundle.result }}"
          docs=false
          if [ "${{ needs.changes.result }}" = "success" ] && [ "${{ needs.changes.outputs.app }}" = "false" ]; then docs=true; fi
          if [ "$docs" = true ] && [ "$e2e" = "skipped" ]; then e2e=success; fi
          if [ "$docs" = true ] && [ "$bundle" = "skipped" ]; then bundle=success; fi
          [ "${{ needs.fast.result }}" = "success" ] && [ "$e2e" = "success" ] && [ "$bundle" = "success" ] || { echo "::error::changes=${{ needs.changes.result }} fast=${{ needs.fast.result }} bundle=${{ needs.bundle.result }} e2e=${{ needs.e2e.result }}"; exit 1; }

  # A red nightly run opens (or adds to) one issue, so the director sees it in the morning (docs/ai/CHECKS.md §1).
  nightly-alert:
    name: Nightly alert
    needs: checks
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open or update the issue
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list -R "${{ github.repository }}" --state open --label nightly-red --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "${{ github.repository }}" --body "Red again: $url"
          else gh label create nightly-red -R "${{ github.repository }}" --color B60205 2>/dev/null || true
               gh issue create -R "${{ github.repository }}" --label nightly-red --title "Nightly checks red on main" --body "Full run (6 views) failed: $url"; fi
