# The stand (#3117 Б, #3120): one web copy at a fixed link (alias «stand») = fresh main + every open PR labelled «стенд».
# The branch stand/auto is rebuilt from origin/main every time, only by the job «merge» below — nobody writes it by hand.
# scripts/stand.cjs decides the order (dependencies, then number) and what is left out (a conflict — git merge-tree, a PR
# that depends on one left out, a PR changing .github/workflows, a PR that breaks the build — found by halving the list).
# What went in and what did not, with the reason — the body of the pinned task #3123 «Стенд — ссылка и состав».
#
# Runs from main only (workflow_run, push, workflow_dispatch): a PR cannot change this file. Jobs:
#   merge  — contents: write, no npm: git merge-tree / commit-tree, push stand/auto; no code of a PR is run
#   build  — contents: read, no key, no cache: npm ci, typecheck, expo export (the code of the PRs runs only here)
#   merge-again — only when build dropped a PR: the same merges without it, the SHA must be the one build built
#   deploy — environment preview-web (the key), static files only, checked like preview-deploy.yml; eas deploy --alias stand
# eas-cli pinned as in preview-deploy.yml (27.4.1).
name: Stand

on:
  # a push to a PR (Preview builds it) and the label put on / taken off / a PR closed (stand-trigger.yml)
  workflow_run:
    workflows: [Preview, Stand trigger]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one stand: a newer event stops the older build (its result would be stale anyway)
concurrency:
  group: stand
  cancel-in-progress: true

jobs:
  # Is this event about the stand? A push to main, a run by hand, the stand trigger — yes; a Preview of a PR — only when the PR
  # has the label «стенд» now.
  should:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.go.outputs.go }}
    steps:
      - id: go
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WF: ${{ github.event.workflow_run.name }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_EVENT: ${{ github.event.workflow_run.event }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          REF: ${{ github.ref }}
        run: |
          go=false
          case "$EVENT" in
            push|workflow_dispatch) [ "$REF" = "refs/heads/main" ] && go=true ;;
            workflow_run)
              if [ "$WF_EVENT" = "pull_request" ] && [ "$WF_CONCLUSION" != "skipped" ] && [ "$WF_CONCLUSION" != "cancelled" ]; then
                if [ "$WF" = "Stand trigger" ]; then go=true
                elif [[ "$PR" =~ ^[0-9]+$ ]] && gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name' | grep -qx 'стенд'; then go=true; fi
              fi ;;
          esac
          echo "go=$go" | tee -a "$GITHUB_OUTPUT"

  merge:
    needs: should
    if: needs.should.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    outputs:
      stand: ${{ steps.merge.outputs.stand }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: merge
        name: main + the PRs labelled «стенд» → stand/auto (no checkout of a PR, no npm)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stand.cjs merge --out manifest.json --push
      - uses: actions/upload-artifact@v4
        with:
          name: stand-manifest
          path: manifest.json
          retention-days: 7
          if-no-files-found: error

  build:
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      stand: ${{ steps.build.outputs.stand }}
      changed: ${{ steps.build.outputs.changed }}
    steps:
      # the script from main; the code of the PRs only in the worktree it builds
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: stand-manifest
      - id: build
        name: Typecheck + web build (a broken combination → the PR found by halving the list is dropped)
        run: node scripts/stand.cjs build --manifest manifest.json --out manifest-build.json --dist "$RUNNER_TEMP/stand-dist" --worktree "$RUNNER_TEMP/stand-wt"
      - uses: actions/upload-artifact@v4
        with:
          name: stand-dist
          path: ${{ runner.temp }}/stand-dist
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stand-build
          path: manifest-build.json
          retention-days: 7
          if-no-files-found: error

  merge-again:
    needs: [merge, build]
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: stand-manifest
      - uses: actions/download-artifact@v4
        with:
          name: stand-build
      - name: The same merges without the PRs that break the build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ needs.build.outputs.stand }}
        run: |
          [[ "$BUILT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad commit from the build"; exit 1; }
          node scripts/stand.cjs merge --from manifest.json --exclude manifest-build.json --expect "$BUILT" --out manifest-final.json --push
      - uses: actions/upload-artifact@v4
        with:
          name: stand-manifest-final
          path: manifest-final.json
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [merge, build, merge-again]
    if: always() && needs.build.result == 'success' && (needs.merge-again.result == 'success' || needs.merge-again.result == 'skipped')
    environment: preview-web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      CHANGED: ${{ needs.build.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Take the built files (static files only)
        uses: actions/download-artifact@v4
        with:
          name: stand-dist
          path: apps/mobile/dist
      # the manifest of the write job (not the build job's: that one ran code of the PRs)
      - uses: actions/download-artifact@v4
        if: env.CHANGED != 'true'
        with:
          name: stand-manifest
      - uses: actions/download-artifact@v4
        if: env.CHANGED == 'true'
        with:
          name: stand-manifest-final
      - name: The built files are a plain static site
        working-directory: apps/mobile
        run: |
          # as preview-deploy.yml: only static files go online (no server code, no links, an index page, a sane size)
          [ -f dist/index.html ] || { echo "::error::dist has no index.html"; exit 1; }
          [ ! -e dist/server ] || { echo "::error::dist has server files"; exit 1; }
          [ -z "$(find dist -type l)" ] || { echo "::error::dist has symbolic links"; exit 1; }
          size_mb="$(du -sm dist | cut -f1)"
          [ "$size_mb" -le 300 ] || { echo "::error::dist is $size_mb MB"; exit 1; }
      - name: Deploy the stand (the fixed alias «stand»)
        id: web
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          npx eas-cli@27.4.1 deploy --non-interactive --alias stand | tee deploy.log
          # the alias URL: https://<project>--stand.expo.app
          url="$(grep -oE 'https://[a-z0-9-]+--stand\.expo\.app' deploy.log | head -1)"
          [ -n "$url" ] || { echo "::error::eas deploy printed no stand URL"; exit 1; }
          for i in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"; [ "$code" = "200" ] && break; sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::$url answers $code"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: The link and what is on the stand → the pinned task (an edit, no e-mail)
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.web.outputs.url }}
        run: |
          f=manifest.json; [ "$CHANGED" = "true" ] && f=manifest-final.json
          node scripts/stand.cjs issue --manifest "$f" --url "$URL"
