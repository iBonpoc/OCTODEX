# Release on every push to main (and by hand): 1) database migrations → 2) Expo Go update (EAS Update, channel "preview")
# → 3) web app (Expo Hosting) → 4) check that Expo really serves the new update. A failed step stops the next ones,
# so the app never goes out ahead of its database. Logs are visible in GitHub Actions.
# Secrets (repo → Settings → Secrets and variables → Actions): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, EXPO_TOKEN.
name: Release

on:
  push:
    branches: [main]
    # docs-only pushes do not change the app or the database: no release (founder 05.11.2026)
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  migrate:
    name: Database migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: kgiaxygsjkyiquhjbxdg
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # exact version: "latest" asks the GitHub API and fails on its rate limit
          version: 3.0.0
      - name: Secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in Settings → Secrets and variables → Actions"; exit 1
          fi
      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Show pending
        run: supabase migration list --remote
      - name: Apply new migrations
        run: supabase db push --remote --yes

  publish:
    name: Publish (Expo Go + web)
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Expo token is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Add EXPO_TOKEN in Settings → Secrets and variables → Actions"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Who publishes
        working-directory: apps/mobile
        run: npx eas-cli@latest whoami
      - name: Publish the Expo Go update (channel preview)
        working-directory: apps/mobile
        run: npx eas-cli@latest update --channel preview --platform all --non-interactive --message "main @ ${GITHUB_SHA::7}"
      - name: Check that Expo serves the new update
        run: |
          created=$(curl -sS https://u.expo.dev/49d009d4-a05b-4911-b7da-1e47c4e10fba -H 'expo-platform: ios' -H 'expo-runtime-version: exposdk:58.0.0' \
            -H 'expo-channel-name: preview' -H 'accept: multipart/mixed' | grep -o '"createdAt":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Latest update on Expo: $created"
          [ -n "$created" ] && [ $(( $(date -u +%s) - $(date -u -d "$created" +%s) )) -lt 1800 ] || { echo "::error::Expo still serves an old update"; exit 1; }
      - name: Build the web app
        working-directory: apps/mobile
        run: npx expo export --platform web
      - name: Deploy the web app (octodex.expo.app)
        working-directory: apps/mobile
        run: npx eas-cli@latest deploy --prod --non-interactive
