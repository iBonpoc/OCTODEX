# Release after the checks are green on a push to main (and by hand): 1) database migrations → 2) Expo Go update (EAS Update, channel "preview")
# → 3) web app (Expo Hosting) → 4) check that Expo really serves the new update. A failed step stops the next ones,
# so the app never goes out ahead of its database. Logs are visible in GitHub Actions.
# Secrets (repo → Settings → Secrets and variables → Actions): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, EXPO_TOKEN.
name: Release

on:
  # Only after the checks are green on that very commit of main (06.11.2026): two PRs green apart can break together,
  # and the release must never ship ahead of its tests.
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One release at a time; the gate is outside the group so a skipped run never takes a queued release's place
# (a newer queued release includes the older one's changes).

# eas-cli pinned to 27.4.1 (05.11.2026): 27.5.0 was published broken (ETARGET @expo/turtle-spawn@27.5.0).
# Raise the pin deliberately after checking a new version, never back to @latest.
jobs:
  # Which commit, and whether to release it at all (review #221). Release the commit whose checks are green when
  # 1) it is a push to main or the nightly run (the nightly one catches a release that was missed),
  # 2) nothing newer than it on main changes the app (a newer app commit releases itself, newer docs do not count),
  # 3) since the last released commit (tag `released`) something besides docs changed
  #    (founder 05.11.2026: docs-only pushes do not release).
  # So a docs PR merged right after an app PR never swallows the app's release.
  gate:
    name: Release this commit?
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.g.outputs.go }}
      sha: ${{ steps.g.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: g
        run: |
          no() { echo "$1 — no release"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          docs_only() { [ -z "$1" ] || ! echo "$1" | grep -qvE '^docs/|\.md$'; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ github.ref }}" = "refs/heads/main" ] || no "by hand only from main"
            sha="$(git rev-parse origin/main)"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha="${{ github.event.workflow_run.head_sha }}"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
          ev="${{ github.event.workflow_run.event }}"; res="${{ github.event.workflow_run.conclusion }}"
          [ "$res" = "success" ] || no "checks $res"
          [ "$ev" = "push" ] || [ "$ev" = "schedule" ] || no "checks event $ev"
          docs_only "$(git diff --name-only "$sha" origin/main)" || no "a newer app commit on main releases itself"
          if git rev-parse -q --verify refs/tags/released >/dev/null; then
            git merge-base --is-ancestor "$sha" released && no "already released"
            docs_only "$(git diff --name-only released "$sha")" && no "only docs since the last release"
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  migrate:
    name: Database migrations
    needs: gate
    if: needs.gate.outputs.go == 'true'
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: kgiaxygsjkyiquhjbxdg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: supabase/setup-cli@v1
        with:
          # exact version: "latest" asks the GitHub API and fails on its rate limit
          version: 3.0.0
      - name: Secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in Settings → Secrets and variables → Actions"; exit 1
          fi
      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Show pending
        run: supabase migration list --remote
      # A migration merged after a later-dated one already reached the base is refused by db push (releases 205–212 stopped
      # here, 08.11: 20261108130000_tech_no_costs after 20261108140000_checklists). Such a file is applied with --include-all
      # only when the director listed it below after checking it changes nothing a later applied migration defines
      # (CHECKS §9); any other out-of-order file still stops the release.
      - name: Apply new migrations
        env:
          OUT_OF_ORDER_OK: |
            supabase/migrations/20261108130000_tech_no_costs.sql
        run: |
          set +e
          out=$(supabase db push --remote --yes 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          echo "$out" | grep -q "Rerun the command with --include-all" || exit $code
          files=$(echo "$out" | grep -oE 'supabase/migrations/[^ ]+\.sql')
          [ -n "$files" ] || exit $code
          for f in $files; do
            echo "$OUT_OF_ORDER_OK" | grep -qxF "$f" || { echo "::error::$f is dated before a migration already on the base; give it a new time (CLAUDE.md: new file)"; exit 1; }
          done
          supabase db push --remote --yes --include-all
      # 7а-2a (S22): «Удалить аккаунт» closes the sign-in through Supabase Auth (docs/specs/19 §6.7). After the migrations
      # (the function calls public.delete_account); a failed deploy stops the release — the app never ships ahead of it.
      # --yes: the CLI asks for confirmation and fails without a terminal (releases after #214 stopped here, 06.11).
      # verify_jwt = true comes from supabase/config.toml; SUPABASE_SERVICE_ROLE_KEY is provided to the function by Supabase.
      # Пуши П3: send-push (verify_jwt = false, its own key x-push-key; docs/specs/27 §4.5)
      - name: Deploy edge functions
        run: |
          supabase functions deploy delete-account --project-ref "$PROJECT_REF" --yes
          supabase functions deploy send-push --project-ref "$PROJECT_REF" --yes
          supabase functions deploy lead-intake --project-ref "$PROJECT_REF" --yes
          supabase functions deploy stripe-connect --project-ref "$PROJECT_REF" --yes
          supabase functions deploy stripe-pay --project-ref "$PROJECT_REF" --yes
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --yes
          supabase functions deploy stripe-refund --project-ref "$PROJECT_REF" --yes

  publish:
    name: Publish (Expo Go + web)
    needs: [gate, migrate]
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write   # moves the tag `released`
      pull-requests: read   # which PR this commit of main came from (the build number, #733)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Expo token is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Add EXPO_TOKEN in Settings → Secrets and variables → Actions"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Who publishes
        working-directory: apps/mobile
        run: npx eas-cli@27.4.1 whoami
      # #733: the build number in every screen's header is the merged PR's number, written here — PRs never change
      # version.ts (that made every open PR conflict after each merge). No number found → the release stops, nothing goes out.
      - name: Build number (the merged PR)
        working-directory: apps/mobile
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq "[.[] | select(.merge_commit_sha == \"$SHA\")][0].number // empty" 2>/dev/null || true)"
          node scripts/setBuild.cjs "$pr" --message "$(git log -1 --format=%s "$SHA")"
      - name: Publish the Expo Go update (channel preview)
        working-directory: apps/mobile
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: npx eas-cli@27.4.1 update --channel preview --platform all --non-interactive --message "main @ ${SHA::7}"
      - name: Check that Expo serves the new update
        run: |
          created=$(curl -sS https://u.expo.dev/49d009d4-a05b-4911-b7da-1e47c4e10fba -H 'expo-platform: ios' -H 'expo-runtime-version: exposdk:58.0.0' \
            -H 'expo-channel-name: preview' -H 'accept: multipart/mixed' | grep -o '"createdAt":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Latest update on Expo: $created"
          [ -n "$created" ] && [ $(( $(date -u +%s) - $(date -u -d "$created" +%s) )) -lt 1800 ] || { echo "::error::Expo still serves an old update"; exit 1; }
      - name: Build the web app
        working-directory: apps/mobile
        run: npx expo export --platform web
      - name: Deploy the web app (octodex.expo.app)
        working-directory: apps/mobile
        run: npx eas-cli@27.4.1 deploy --prod --non-interactive
      - name: Mark this commit released (tag `released`)
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: git tag -f released "$SHA" && git push -f origin refs/tags/released
