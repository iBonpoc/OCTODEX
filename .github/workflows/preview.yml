# Preview of every PR before it is merged: an Expo Go update on its own channel "pr-<N>" and a web copy at
# https://octodex--pr-<N>.expo.app. A comment on the PR gives both links. main and the release are not touched.
# The preview uses the same database as the app, but database migrations from the PR are NOT applied
# (they go out only on merge, release.yml) — the comment says so when the PR has migrations.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # PRs from forks get no secrets — skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish the Expo Go update (channel pr-N)
        working-directory: apps/mobile
        run: |
          npx eas-cli@latest update --channel "pr-$PR" --platform all --non-interactive --message "PR $PR @ ${GITHUB_SHA::7}"
      - name: Build the web app
        working-directory: apps/mobile
        run: npx expo export --platform web
      - name: Deploy the web copy (octodex--pr-N.expo.app)
        working-directory: apps/mobile
        run: npx eas-cli@latest deploy --alias "pr-$PR" --non-interactive
      - name: Does the PR change the database?
        id: mig
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^supabase/migrations/'; then echo "has=1" >> "$GITHUB_OUTPUT"; else echo "has=0" >> "$GITHUB_OUTPUT"; fi
      - name: Comment with the links
        uses: actions/github-script@v7
        env:
          HAS_MIG: ${{ steps.mig.outputs.has }}
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const expoGo = `exp://u.expo.dev/49d009d4-a05b-4911-b7da-1e47c4e10fba?runtime-version=exposdk%3A58.0.0&channel-name=pr-${pr}`;
            const web = `https://octodex--pr-${pr}.expo.app`;
            const mig = process.env.HAS_MIG === "1"
              ? "\n\n⚠ В этом PR есть изменения базы. В предпросмотре они ещё не применены: проверяйте экраны в демо-режиме, облачные данные заработают после слияния."
              : "";
            const body = `<!-- octodex-preview -->\n### Предпросмотр PR #${pr} (\`${sha}\`)\n\n` +
              `- **Телефон (Expo Go):** откройте ссылку в Safari на iPhone: \`${expoGo}\`\n` +
              `- **Сайт:** ${web}\n\n` +
              `Номер сборки в шапке экрана — номер этого PR. После новых правок ссылки те же, закройте и откройте приложение заново.${mig}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr, per_page: 100 });
            const old = comments.find((c) => c.body && c.body.includes("<!-- octodex-preview -->"));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
