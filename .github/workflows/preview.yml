# Preview of every PR before it is merged: a web copy at its own deployment URL (link in a PR comment).
# No pr-<N> alias: the Expo free plan allows 5 aliases, so they ran out and every new preview 404'd (05.11.2026).
# NOT published to Expo Go: Expo Go lists every update of the project, and the founder must see only what is merged
# (main → release.yml). Founder decision 05.11.2026.
# The preview uses the same database as the app, but database migrations from the PR are NOT applied
# (they go out only on merge, release.yml) — the comment says so when the PR has migrations.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # PRs from forks get no secrets — skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app
        working-directory: apps/mobile
        run: npx expo export --platform web
      - name: Deploy the web copy (its own deployment URL)
        id: web
        working-directory: apps/mobile
        run: |
          set -o pipefail
          npx eas-cli@latest deploy --non-interactive | tee deploy.log
          # the unique deployment URL looks like https://<project>--<id>.expo.app (never the production octodex.expo.app)
          url="$(grep -oE 'https://[a-z0-9-]+--[a-z0-9-]+\.expo\.app' deploy.log | head -1)"
          # a preview without a working link is a failed preview — never a green step with a dead link
          [ -n "$url" ] || { echo "::error::eas deploy printed no deployment URL"; exit 1; }
          for i in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"; [ "$code" = "200" ] && break; sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::$url answers $code"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Does the PR change the database?
        id: mig
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^supabase/migrations/'; then echo "has=1" >> "$GITHUB_OUTPUT"; else echo "has=0" >> "$GITHUB_OUTPUT"; fi
      - name: Comment with the links
        uses: actions/github-script@v7
        env:
          HAS_MIG: ${{ steps.mig.outputs.has }}
          WEB_URL: ${{ steps.web.outputs.url }}
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const web = process.env.WEB_URL;
            const mig = process.env.HAS_MIG === "1"
              ? "\n\n⚠ В этом PR есть изменения базы. В предпросмотре они ещё не применены: проверяйте экраны в демо-режиме, облачные данные заработают после слияния."
              : "";
            const body = `<!-- octodex-preview -->\n### Предпросмотр PR #${pr} (\`${sha}\`) — ещё не влит\n\n` +
              `- **Сайт:** ${web}\n\n` +
              `Только сайт: в Expo Go появляется лишь то, что влито в main.${mig}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr, per_page: 100 });
            const old = comments.find((c) => c.body && c.body.includes("<!-- octodex-preview -->"));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
