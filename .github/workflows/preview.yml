# Preview of every PR before it is merged: a web copy at its own deployment URL (link in the PR description, not a comment).
# This workflow only BUILDS the web copy and keeps no secret; preview-deploy.yml (from main) puts it online.
# No pr-<N> alias: the Expo free plan allows 5 aliases, so they ran out and every new preview 404'd (05.11.2026).
# NOT published to Expo Go: Expo Go lists every update of the project, and the founder must see only what is merged
# (main → release.yml). Founder decision 05.11.2026.
# The preview uses the same database as the app, but database migrations from the PR are NOT applied
# (they go out only on merge, release.yml) — the description says so when the PR has migrations.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # PRs from forks get nothing here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build number (this PR, #733)
        working-directory: apps/mobile
        run: node scripts/setBuild.cjs "$PR"
      - name: Build the web app
        working-directory: apps/mobile
        run: npx expo export --platform web
      - name: Keep the built files for the deploy workflow
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: apps/mobile/dist
          retention-days: 1
          if-no-files-found: error
