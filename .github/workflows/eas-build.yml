# A phone build of the app by hand (docs/specs/27-push.md §2, docs/specs/30-ios-testflight.md): pushes do not work in Expo Go
# (SDK 53+), they need our own build. Actions → «EAS build» → Run workflow:
#   * android — profile `preview`: an APK; the install link appears on expo.dev → octodex → Builds;
#   * ios — profile `testflight`: a store build. Only after the one-time `npm run ios:first` on the founder's Mac (spec 30 §4):
#     eas-cli never creates the distribution certificate with --non-interactive, and no Apple API key can create the push key.
#     That run, signed in with the Apple ID, leaves on EAS the certificate, the profile, the push key and an App Store Connect
#     API key; this job then needs nothing from Apple. «ios_submit» sends the build to TestFlight (needs ascAppId in eas.json).
# Both builds take Expo updates from the channel `preview`, like Expo Go now (release.yml publishes there).
# The only secret: EXPO_TOKEN (repo → Settings → Secrets and variables → Actions). No Apple key lives in GitHub.
# Android's FCM key and google-services.json live in expo.dev (Credentials; Environment variables → GOOGLE_SERVICES_JSON), not here.
# Our BUILD (src/config/version.ts, the header's number) is written before the build (#733); the store build number is EAS's own (autoIncrement).
# --no-wait: the build runs on EAS (its page is on expo.dev); with ios_submit the TestFlight submission is queued on EAS at start.
# eas-cli pinned as in release.yml (27.4.1).
name: EAS build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which phone"
        type: choice
        options: [android, ios]
        default: android
      ios_submit:
        description: "ios only: send to TestFlight (only after the app exists in App Store Connect and its id is in eas.json)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read   # which PR main's last commit came from (our BUILD, #733)
  actions: read         # the store-build gate reads the Checks runs of this commit (#1004)

concurrency:
  group: eas-build-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # #1004: a store build (iOS: TestFlight) only from a commit with a green FULL Checks run (nightly or a manual run, all 6
      # views). A push to main runs only 390-dark and a PR three views (audit condition for #906 п.6); every platform except Android «preview»
      # (an APK for our own phones, not a store build) is gated — a new store platform is gated by default. scripts/fullRunGate.cjs, test/fullRunGate.test.ts.
      - name: Full Checks run is green on this commit (store builds)
        id: gate
        if: inputs.platform != 'android'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: node scripts/fullRunGate.cjs
      - name: Secrets are set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Add EXPO_TOKEN in Settings → Secrets and variables → Actions"; exit 1; fi
      - name: TestFlight needs the app id
        if: inputs.platform == 'ios' && inputs.ios_submit
        working-directory: apps/mobile
        run: |
          if ! node -e 'const id=require("./eas.json").submit.testflight.ios.ascAppId; process.exit(/^\d+$/.test(id||"")?0:1)'; then
            echo "::error::ascAppId is not in eas.json yet (App Store Connect → the app → App Information → Apple ID). Run without ios_submit or add it first."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # #733: our BUILD (the header's number) = the PR of the commit being built; the store's own build number stays EAS's
      - name: Build number (the PR of this commit)
        working-directory: apps/mobile
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq "[.[] | select(.merge_commit_sha == \"$SHA\")][0].number // empty" 2>/dev/null || true)"
          node scripts/setBuild.cjs "$pr" --message "$(git log -1 --format=%s "$SHA")"
      - name: Expo account
        working-directory: apps/mobile
        run: npx eas-cli@27.4.1 whoami

      - name: Android build (APK, preview)
        if: inputs.platform == 'android'
        working-directory: apps/mobile
        # --no-wait: the build runs on EAS; its page (and the install link) is on expo.dev
        run: npx eas-cli@27.4.1 build --platform android --profile preview --non-interactive --no-wait

      - name: iOS build (and TestFlight)
        if: inputs.platform == 'ios'
        working-directory: apps/mobile
        run: |
          if [ "${{ inputs.ios_submit }}" = "true" ]; then
            npx eas-cli@27.4.1 build --platform ios --profile testflight --non-interactive --no-wait --auto-submit-with-profile=testflight
          else
            npx eas-cli@27.4.1 build --platform ios --profile testflight --non-interactive --no-wait
          fi
      - name: If the iOS build could not start
        if: failure() && inputs.platform == 'ios' && steps.gate.outcome != 'failure'
        run: echo "::error::Credentials missing? The first iPhone build is made once on the Mac with npm run ios:first (docs/11-setup-guide.md §5)."
