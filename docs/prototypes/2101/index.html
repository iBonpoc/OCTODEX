<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница клиента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Прототип #2101 v2 (после двух design-reviewer) — страница клиента /p/ как «продающая». Значения — токены packages/design-tokens.
   Параметры: ?w=390|820|1280 &theme=light|dark &state=sent|sign|signed|done|expired &adds=guards,fascia &full=1
   Бренд компании, а не GoRix; язык клиента (EN; переключатель EN/ES/RU). Данные вымышленные, цены примерные. */
:root{
  --font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --r-card:24px;--r-inner:18px;--r-field:12px;--r-pill:999px;
  --fs-display:28px;--fs-title:22px;--fs-heading:17px;--fs-body:15px;--fs-caption:13px;--fs-micro:11px;
  --btn:36px;--hit:44px;--bar:44px;--chip:24px;--icon:20px;--icon-sm:16px;--panel:360px;--form:560px;--seg:32px;
  --st-ok:#7CE08A;--st-info:#8FA2FF;--st-warn:#FF8A3D;--st-bad:#FF6B6B;--st-on:#0B0C0F;--acc:#FBFF00;--on-acc:#0B0C0F;
  --brand:#1F6FB2; /* Company.brand.color — только полоса и знак компании, DS §19.1 п.7 */
  --bg:#EFEBE5;--ink:#15161A;--mut:#575C68;--surf:rgba(255,255,255,.62);--surf2:rgba(255,255,255,.85);--solid:#F9F7F5;
  --bd:rgba(20,22,30,.1);--bdf:rgba(20,22,30,.5);--ov:rgba(250,248,244,.78);--track:rgba(20,22,30,.09);
  --t-ok:#176428;--t-info:#3647C4;--t-warn:#944600;--t-bad:#B4232A;--n-fill:rgba(20,22,30,.09);
  --shadow:0 10px 28px rgba(60,50,40,.12);--shadow-sm:0 2px 8px rgba(60,50,40,.25);
}
[data-theme=dark]{
  --bg:#24272D;--ink:#F2F3F5;--mut:#CDD1DA;--surf:rgba(255,255,255,.07);--surf2:rgba(255,255,255,.11);--solid:#33363C;
  --bd:rgba(255,255,255,.14);--bdf:rgba(255,255,255,.38);--ov:rgba(38,41,48,.72);--track:rgba(255,255,255,.12);
  --t-ok:#9CF0A8;--t-info:#C2CCFF;--t-warn:#FFB47E;--t-bad:#FFAAAA;--n-fill:rgba(255,255,255,.11);
  --shadow:0 10px 30px rgba(0,0,0,.3);--shadow-sm:0 2px 8px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0}
html,body{background:#8a8780;font-family:var(--font);-webkit-font-smoothing:antialiased}
.ctl{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#1d1f23;color:#eee;font-size:13px;align-items:center}
.ctl b{margin-right:4px}.ctl button{font:inherit;padding:4px 10px;border-radius:8px;border:1px solid #555;background:#2b2e33;color:#eee;cursor:pointer}
.ctl button[aria-pressed=true]{background:#eee;color:#111}
.stage{display:flex;justify-content:center;padding:24px 16px}
.dev{position:relative;background:var(--bg);color:var(--ink);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.w390{width:390px;height:844px;border-radius:36px}.w820{width:820px;height:1100px;border-radius:24px}.w1280{width:1280px;height:900px;border-radius:16px}
.scroll{position:absolute;inset:0;overflow:auto;padding-bottom:130px}
.w820 .scroll,.w1280 .scroll{padding-bottom:var(--s8)}
.w390 .scroll{padding-top:47px}
.full .dev{height:auto!important}.full .scroll{position:relative;inset:auto}
.wrap{position:relative;margin:0 auto;padding:0 var(--s4);display:grid;gap:var(--s4)}
.w820 .wrap{max-width:var(--form);padding:0}
.w1280 .wrap{max-width:1048px;grid-template-columns:minmax(0,1fr) var(--panel);align-items:start;column-gap:var(--s6);padding:0}
.w1280 .main{display:grid;gap:var(--s4)}
.w390 .main,.w820 .main{display:contents}
.w1280 .side{display:grid;gap:var(--s4);position:sticky;top:var(--s6)}
.w390 .side,.w820 .side{display:contents}
.brandbar{height:6px;background:var(--brand)}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-card);padding:var(--s4);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;gap:var(--s3)}
.co{grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s3)}
.logo{width:36px;height:36px;border-radius:var(--r-field);background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:var(--fs-caption)}
.co .nm{font-size:var(--fs-body);font-weight:700;line-height:1.3}
.meta{font-size:var(--fs-caption);color:var(--mut);line-height:1.4}
.nw{white-space:nowrap}
.lang{height:var(--btn);padding:0 var(--s3);border-radius:var(--r-pill);border:1px solid var(--bdf);background:var(--surf2);font:600 var(--fs-caption) var(--font);color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.contact{display:flex;gap:var(--s2);grid-column:1/-1}
.btn{min-height:var(--btn);padding:0 var(--s4);border-radius:var(--r-pill);font:600 var(--fs-caption)/1 var(--font);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;cursor:pointer;color:var(--ink);background:none;white-space:nowrap;text-decoration:none}
.btn.sec{background:var(--surf2);border-color:var(--bdf)}
.btn.pri{background:var(--acc);color:var(--on-acc)}
.btn.full{width:100%}.btn.bar{min-height:var(--bar);font-size:var(--fs-body)}
.btn svg{width:var(--icon-sm);height:var(--icon-sm)}
.contact .btn{flex:1}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1{font-size:var(--fs-title);font-weight:700;letter-spacing:-.01em;line-height:1.25}
h2{font-size:var(--fs-heading);font-weight:700}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
.chip{white-space:nowrap;height:var(--chip);padding:0 10px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-caption);font-weight:600;justify-self:start}
.chip svg{width:12px;height:12px}
.chip.warn{background:color-mix(in srgb,var(--st-warn) 22%,transparent);color:var(--t-warn)}
.chip.ok{background:color-mix(in srgb,var(--st-ok) 22%,transparent);color:var(--t-ok)}
.chip.neutral{background:var(--n-fill);color:var(--mut)}
.tag{font-size:var(--fs-caption);font-weight:600;color:var(--ink);display:inline-flex;gap:4px;align-items:center}
.tag svg{width:12px;height:12px}
.big{font-size:var(--fs-display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
/* варианты: телефон — сегменты (как экран сметы, DS §8.10) + итог каждого под ними; от 820 — плитки «Заливка» + CheckMark */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--track);border-radius:var(--r-pill);padding:4px}
.seg button{border:0;background:none;border-radius:var(--r-pill);font:500 var(--fs-caption) var(--font);color:var(--mut);cursor:pointer;min-height:var(--seg)}
.seg button[aria-selected=true]{background:var(--surf2);box-shadow:var(--shadow-sm);color:var(--ink);font-weight:600}
.segt{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.segt .p{font-weight:600;font-size:var(--fs-caption)}
.tiles{display:none}
.w820 .seg,.w820 .segt,.w1280 .seg,.w1280 .segt{display:none}
.w820 .tiles,.w1280 .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);grid-template-rows:auto auto auto 1fr}
.tile{display:grid;grid-row:span 4;grid-template-rows:subgrid;gap:4px;border-radius:var(--r-inner);padding:var(--s3);border:1px solid var(--bd);background:var(--solid);cursor:pointer;position:relative;text-align:left;font:inherit;color:inherit}
.tile[aria-checked=true]{background:var(--surf2);box-shadow:var(--shadow-sm)}
.tile .ck{position:absolute;top:var(--s2);right:var(--s2);width:var(--icon);height:var(--icon);display:none}
.tile[aria-checked=true] .ck{display:block}
.tile .tn{font-weight:600}.tile .pr{font-size:var(--fs-heading);font-weight:700}
.tile ul{padding-left:18px;font-size:var(--fs-caption);color:var(--mut);line-height:1.5}
.rec{min-height:18px}
.sect{display:grid;border-top:1px solid var(--bd);padding-top:var(--s3)}
.sect h3{font-size:var(--fs-body);font-weight:600;margin-bottom:var(--s2)}
.ln{display:grid;grid-template-columns:1fr auto;gap:var(--s3);padding:6px 0;font-size:var(--fs-body)}
.ln .d{font-size:var(--fs-caption);color:var(--mut)}
.ln.opt{grid-template-columns:auto 1fr auto;align-items:center;min-height:var(--hit);cursor:pointer;border-radius:var(--r-field)}
.thumb{width:44px;height:44px;border-radius:var(--r-field);background:linear-gradient(135deg,#a9b9a0,#6e8467)}
.ln .why{font-size:var(--fs-caption);color:var(--mut)}
.ln .r{display:flex;align-items:center;gap:var(--s3)}
.tog{width:42px;height:24px;border-radius:var(--r-pill);background:var(--track);border:1px solid var(--bdf);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:left .16s}
.tog.on{background:var(--acc);border-color:transparent}.tog.on::after{left:20px;background:var(--on-acc)}
.sub{display:flex;justify-content:space-between;font-size:var(--fs-caption);color:var(--mut);padding:6px 0 var(--s2)}
.tot{display:grid;gap:6px;border-top:1px solid var(--bd);padding-top:var(--s3)}
.row{display:flex;justify-content:space-between;gap:var(--s3);font-size:var(--fs-body)}
.row.m{color:var(--mut);font-size:var(--fs-caption)}
.trust{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:var(--fs-caption);color:var(--mut)}
.trust span{display:inline-flex;gap:6px;align-items:center}
.trust svg{width:var(--icon-sm);height:var(--icon-sm);color:var(--ink)}
.doc{display:grid;grid-template-columns:auto 1fr auto auto;gap:var(--s3);align-items:center;padding:var(--s3);border-radius:var(--r-inner);background:var(--solid);border:1px solid var(--bd);min-height:var(--hit);cursor:pointer;color:inherit;text-decoration:none}
.doc .ic{width:36px;height:36px;border-radius:var(--r-field);background:var(--surf2);display:grid;place-items:center}
.doc .ic svg,.chev{width:var(--icon);height:var(--icon)}
.chev{color:var(--mut)}
.doc .n{font-weight:600;font-size:var(--fs-body)}
.doc .r{display:grid;justify-items:end;gap:4px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.ph{height:110px;border-radius:var(--r-field);position:relative;background:linear-gradient(160deg,#8a9aa6,#566874)}
.ph.after{background:linear-gradient(160deg,#9ec2d6,#4f7f99)}
.ph span{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:var(--fs-micro);padding:2px 8px;border-radius:var(--r-pill)}
.rev{padding:var(--s3);border-radius:var(--r-inner);background:var(--solid);border:1px solid var(--bd);font-size:var(--fs-caption);line-height:1.5;display:grid;gap:6px}
.stars{display:flex;gap:2px}.stars svg{width:var(--icon-sm);height:var(--icon-sm)}
.svc{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:center;padding:var(--s3);border-radius:var(--r-inner);background:var(--solid);border:1px solid var(--bd);min-height:var(--hit);cursor:pointer;color:inherit;text-decoration:none}
.svc .im{width:56px;height:56px;border-radius:var(--r-field);background:linear-gradient(135deg,#b7a98f,#7d6d55)}
.svc:nth-of-type(2) .im{background:linear-gradient(135deg,#9fb6c9,#5d7a91)}.svc:nth-of-type(3) .im{background:linear-gradient(135deg,#a9c0a0,#647f5c)}
.svc .n{font-weight:600;font-size:var(--fs-body)}
.foot{font-size:var(--fs-micro);color:var(--mut);text-align:center;padding:var(--s4) 0;line-height:1.6}
.field{display:grid;gap:6px}
.field label{font-size:var(--fs-caption);color:var(--mut)}
.inp{height:var(--hit);border-radius:var(--r-field);border:1px solid var(--bdf);background:var(--surf2);padding:0 var(--s3);font:var(--fs-body) var(--font);color:var(--ink)}
.pad{height:150px;border-radius:var(--r-field);border:1px dashed var(--bdf);background:var(--solid);display:grid;place-items:center;color:var(--mut);font-size:var(--fs-caption)}
.notice{font-size:var(--fs-heading);font-weight:700;line-height:1.35}
.trow{display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;min-height:var(--hit);cursor:pointer;font-size:var(--fs-caption)}
.pbar{position:absolute;left:0;right:0;bottom:0;padding:var(--s3) var(--s4) 34px;background:var(--ov);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--bd);border-radius:var(--r-card) var(--r-card) 0 0;display:grid;grid-template-columns:auto 1fr;gap:var(--s3);align-items:center}
.pbar .sm{display:grid}.pbar .sm b{font-size:var(--fs-heading)}
.w820 .pbar,.w1280 .pbar{display:none!important}
.onlywide{display:none}.w820 .onlywide,.w1280 .onlywide{display:grid}
.onlyphone{display:inline-flex}.w820 .onlyphone,.w1280 .onlyphone{display:none}
.note{max-width:900px;margin:0 auto 32px;padding:0 16px;font-size:13px;line-height:1.5;color:#1b1b1b}
@media (prefers-reduced-motion:reduce){.tog::after{transition:none}}
</style>
</head>
<body>
<div class="ctl" role="toolbar" aria-label="Вид">
 <b>Ширина</b><button data-k="w" data-v="390">390</button><button data-k="w" data-v="820">820</button><button data-k="w" data-v="1280">1280</button>
 <b>Тема</b><button data-k="theme" data-v="light">светлая</button><button data-k="theme" data-v="dark">тёмная</button>
 <b>Шаг</b><button data-k="state" data-v="sent">1 решение</button><button data-k="state" data-v="sign">2 подпись</button><button data-k="state" data-v="signed">3 задаток</button><button data-k="state" data-v="done">4 работа сделана</button><button data-k="state" data-v="expired">ссылка устарела</button>
</div>
<div class="stage"><div class="dev" id="dev"><div class="scroll" id="scroll"></div><div class="pbar" id="pbar"></div></div></div>
<div class="note">Прототип #2101 v2. Нажимается: варианты, строки допуслуг (итог пересчитывается), «Choose &amp; sign» (шаг подписи), шаги вверху. Цены примерные; имена вымышленные. README — состав, сценарии, ревью.</div>
<script>
const I={
 phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/></svg>',
 sms:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
 mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
 invoice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
 note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>',
 wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12h2"/></svg>',
 shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg>',
 star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
 down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px"><path d="M6 9l6 6 6-6"/></svg>',
 alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>',
};
const P=new URLSearchParams(location.search);
if(P.get('full'))document.documentElement.classList.add('full');
const st={w:P.get('w')||'390',theme:P.get('theme')||'light',state:P.get('state')||'sent',opt:'better',adds:new Set()};
if(P.get('adds'))P.get('adds').split(',').forEach(x=>st.adds.add(x));
// у каждого варианта свой полный список (DS §8.10); строки по разделам; допуслуги — в своих разделах, выключены по умолчанию (DS §19.1)
const OPTS={
 good:{nm:'Good',sub:'5″ K-style',li:['124 ft seamless gutters','4 downspouts','Haul-away'],sec:[['Gutters',[['124 ft seamless gutter, 5″ K-style, 0.027″',2480,1]]],['Downspouts',[['4 downspouts, 2×3',640,1]]],['Labor',[['Install and haul-away',360,0]]]]},
 better:{nm:'Better',sub:'6″ K-style',rec:true,li:['124 ft seamless gutters, 6″','5 oversized downspouts','10-year workmanship warranty'],sec:[['Gutters',[['124 ft seamless gutter, 6″ K-style, 0.032″',2900,1],['Hidden hangers every 24″',260,1]]],['Downspouts',[['5 oversized downspouts, 3×4',700,1]]],['Labor',[['Install and haul-away',400,0]]]]},
 best:{nm:'Best',sub:'6″ half-round',li:['Everything in Better','Half-round profile','Lifetime workmanship warranty'],sec:[['Gutters',[['124 ft half-round gutter, 6″',4180,1],['Decorative hangers',420,1]]],['Downspouts',[['5 round downspouts, 4″',880,1]]],['Labor',[['Install and haul-away',500,0]]]]},
};
const ADDS={Gutters:[{id:'guards',nm:'Leaf guards, 124 ft',why:'No more cleaning — fits the new gutters',pr:860,tax:1}],Repairs:[{id:'fascia',nm:'Fascia board repair, 16 ft',why:'Rot found during the visit — photo 3',pr:420,tax:1}]};
const TAX=0.095;
const money=c=>'$'+c.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const addsWord=()=>st.adds.size?' + '+st.adds.size+(st.adds.size>1?' add-ons':' add-on'):'';
function totals(id,bare){
  const o=OPTS[id||st.opt];let sub=0,taxable=0;
  o.sec.forEach(([,ls])=>ls.forEach(([,p,t])=>{sub+=p;if(t)taxable+=p;}));
  Object.values(ADDS).flat().forEach(a=>{if(!bare&&st.adds.has(a.id)){sub+=a.pr;if(a.tax)taxable+=a.pr;}});
  const tax=Math.round(taxable*TAX*100)/100;const t=Math.round((sub+tax)*100)/100;
  const dep=Math.min(Math.round(t*0.10*100)/100,1000); // CA B&P §7159.5: 10 % или $1,000 — что меньше
  return {o,sub,tax,t,dep};
}
function head(){return `<section class="card co" aria-label="Company">
  <div class="logo" aria-hidden="true">BG</div>
  <div><div class="nm">Brightline Gutters &amp; Exteriors</div><div class="meta"><span class="nw">★ 4.9 · 128 Google reviews</span> · <span class="nw">CSLB Lic. #1048XXX</span> · Insured</div></div>
  <button class="lang" aria-label="Language: English">EN${I.down}</button>
  <div class="contact"><a class="btn sec" href="#">${I.phone}Call</a><a class="btn sec" href="#">${I.sms}Text</a><a class="btn sec" href="#">${I.mail}Email</a></div></section>`;}
function next(){
  const t=totals();
  if(st.state==='sent')return `<section class="card" aria-label="Your estimate"><span class="chip neutral">${I.clock}Waiting for your choice · valid until 12/01/2026</span><h1>Hi Sam — your gutter estimate</h1><p class="meta">1420 Oak St, Pasadena · EST-0042 · sent 11/18/2026</p></section>`;
  if(st.state==='signed')return `<section class="card" aria-label="Next step"><span class="chip ok">${I.check}Signed 11/18/2026</span><h1>Next: pay the deposit to book your install</h1>
   <div class="row" style="align-items:baseline"><span>Deposit</span><b class="big">${money(t.dep)}</b></div>
   <p class="meta">Deposit is 10% or $1,000, whichever is less (California law). The rest is due when the job is done.</p>
   <p class="meta">First open day: Tue 11/25 · 8–10 AM. We call you to confirm.</p>
   <button class="btn pri bar full">${I.wallet}Pay ${money(t.dep)}</button><p class="meta">Card, Apple Pay or bank (ACH). The receipt comes to your email.</p></section>`;
  if(st.state==='done')return `<section class="card" aria-label="Next step"><span class="chip ok">${I.check}Job done 11/26/2026 · paid</span><h1>Thank you, Sam!</h1><p class="meta">Your 10-year workmanship warranty is active until 11/2036.</p>
   <button class="btn pri bar full">${I.star}Review us on Google</button><p class="meta">We ask every customer. Any honest review helps.</p></section>`;
  return '';
}
function chooser(){
  return `<div class="hd"><h2>Pick one option</h2><span class="meta">Prices without add-ons</span></div>
  <div class="seg" role="tablist" aria-label="Options">${Object.entries(OPTS).map(([id,o])=>`<button role="tab" data-opt="${id}" aria-selected="${id===st.opt}">${o.nm}${o.rec?' ★':''}</button>`).join('')}</div>
  <div class="segt">${Object.keys(OPTS).map(id=>`<div><div class="p num">${money(totals(id,1).t)}</div><div class="meta">${OPTS[id].sub}</div></div>`).join('')}</div>
  <div class="tiles" role="radiogroup" aria-label="Options">${Object.entries(OPTS).map(([id,o])=>`<button class="tile" role="radio" aria-checked="${id===st.opt}" data-opt="${id}"><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
   <span class="rec">${o.rec?`<span class="tag">${I.star}Recommended</span>`:''}</span><span><span class="tn">${o.nm}</span> <span class="meta">${o.sub}</span></span><span class="pr num">${money(totals(id,1).t)}</span><ul>${o.li.map(x=>`<li>${x}</li>`).join('')}</ul></button>`).join('')}</div>`;
}
function sections(){
  const t=totals();
  const names=t.o.sec.map(s=>s[0]);names.splice(names.length-1,0,'Repairs');
  return names.map(n=>{
    const ls=(t.o.sec.find(s=>s[0]===n)||[n,[]])[1];const ad=ADDS[n]||[];
    const subtotal=ls.reduce((s,l)=>s+l[1],0)+ad.filter(a=>st.adds.has(a.id)).reduce((s,a)=>s+a.pr,0);
    const adHtml=ad.map(a=>`<div class="ln opt" role="switch" aria-checked="${st.adds.has(a.id)}" tabindex="0" data-add="${a.id}"><div class="thumb" aria-hidden="true"></div><div><div>${a.nm}</div><div class="why">${a.why} · optional</div></div><div class="r"><b class="num">+${money(a.pr)}</b><span class="tog ${st.adds.has(a.id)?'on':''}" aria-hidden="true"></span></div></div>`).join('');
    return `<div class="sect"><h3>${n}</h3>${ls.map(([d,p])=>`<div class="ln"><span>${d}</span><b class="num">${money(p)}</b></div>`).join('')}${adHtml}<div class="sub"><span>${n} subtotal</span><b class="num">${money(subtotal)}</b></div></div>`;
  }).join('');
}
function totalsBlock(){const t=totals();return `<div class="tot">
  <div class="row m"><span>Subtotal</span><b class="num">${money(t.sub)}</b></div>
  <div class="row m"><span>Sales tax 9.5% (materials)</span><b class="num">${money(t.tax)}</b></div>
  <div class="row" style="align-items:baseline"><span style="font-weight:600">Total</span><b class="big">${money(t.t)}</b></div>
  <div class="row m"><span>Deposit to book (10% or $1,000, whichever is less)</span><b class="num">${money(t.dep)}</b></div></div>`;}
function estimate(){
  if(st.state!=='sent'){const t=totals();return `<section class="card" aria-label="Your estimate"><div class="hd"><h2>Your estimate</h2><span class="meta">EST-0042</span></div>
    <div class="row"><span>${t.o.nm} option${addsWord()}</span><b class="num">${money(t.t)}</b></div>
    <a class="doc" href="#"><span class="ic">${I.note}</span><span><span class="n">Signed estimate (PDF)</span><br><span class="meta">Signed by Sam Brooks · 11/18/2026</span></span><span></span>${I.chev}</a></section>`;}
  const wide=st.w==='1280';
  return `<section class="card" aria-label="Your estimate">${chooser()}${sections()}${totalsBlock()}
   <div class="trust"><span>${I.shield}10-year warranty</span><span>${I.check}Licensed &amp; insured</span><span>${I.clock}Install in 1 day</span></div>
   ${st.w==='820'?`<button class="btn pri bar full" data-go="sign">Choose ${totals().o.nm} &amp; sign</button>`:''}
   <a class="btn sec full" href="#">${I.sms}Questions? Text us</a>
   <a class="doc" href="#"><span class="ic">${I.note}</span><span><span class="n">Full estimate and terms (PDF)</span></span><span></span>${I.chev}</a></section>`;
}
function sign(){const t=totals();return `<section class="card" aria-label="Sign"><span class="chip neutral">${t.o.nm}${addsWord()} · ${money(t.t)}</span><h1>Sign your estimate</h1>
  <div class="field"><label for="nm">Full name</label><input id="nm" class="inp" value="Sam Brooks"></div>
  <label class="trow"><span>I agree to sign electronically and to get records electronically (E-SIGN).</span><span class="tog" aria-hidden="true"></span></label>
  <p class="notice">You, the buyer, may cancel this transaction at any time prior to midnight of the third business day after the date of this transaction.</p>
  <p class="meta">The full notice of cancellation is in the estimate PDF.</p>
  <div class="field"><label>Signature</label><div class="pad">Sign here with your finger</div></div>
  ${st.w==='390'?'':'<button class="btn pri bar full">Approve and sign</button>'}<button class="btn sec full" data-go="sent">Back to the estimate</button></section>`;}
function docs(){
  const t=totals();const rows=[];
  if(st.state==='sent')rows.push(['note','Estimate EST-0042','Sent 11/18 · valid until 12/01','<span class="chip neutral">'+I.clock+'To choose</span>',money(t.t)]);
  else rows.push(['note','Estimate EST-0042','Signed 11/18','<span class="chip ok">'+I.check+'Signed</span>',money(t.t)]);
  if(st.state==='signed')rows.push(['invoice','Invoice INV-0017 · Deposit','Due on booking','<span class="chip warn">'+I.clock+'To pay</span>',money(t.dep)]);
  if(st.state==='done'){rows.push(['invoice','Invoice INV-0017 · Deposit','Paid 11/19 · receipt','<span class="chip ok">'+I.check+'Paid</span>',money(t.dep)]);rows.push(['invoice','Invoice INV-0021 · Final','Paid 11/26 · receipt','<span class="chip ok">'+I.check+'Paid</span>',money(Math.round((t.t-t.dep)*100)/100)]);rows.push(['shield','Warranty certificate','10 years · until 11/2036','','']);}
  rows.push(['note','Inspection report','Visit 11/14 · 12 photos','','']);
  return `<section class="card" aria-label="Your documents"><div class="hd"><h2>Your documents</h2><span class="meta">${rows.length}</span></div>
   ${rows.map(([ic,n,s,c,a])=>`<a class="doc" href="#"><span class="ic">${I[ic]}</span><span><span class="n">${n}</span><br><span class="meta">${s}</span></span><span class="r">${c}${a?`<b class="num">${a}</b>`:''}</span>${I.chev}</a>`).join('')}</section>`;
}
function photos(){return `<section class="card" aria-label="Photos"><div class="hd"><h2>${st.state==='done'?'Your home — before &amp; after':'Our work nearby'}</h2><span class="meta">${st.state==='done'?'8 photos':'Pasadena, 10/2026'}</span></div><div class="ba"><div class="ph"><span>Before</span></div><div class="ph after"><span>After</span></div></div></section>`;}
function reviews(){
  const R=[['“On time, clean, and the gutters look great. They found a rotten fascia board and fixed it the same day.”','Maria G. · 10/2026'],['“Clear estimate with options, no pressure. Paid online in a minute.”','David K. · 09/2026']];
  return `<section class="card" aria-label="Recent Google reviews"><div class="hd"><h2>Recent Google reviews</h2><span class="meta">★ 4.9 · 128 · updated 11/17</span></div>
   ${R.map(([q,w])=>`<div class="rev"><div class="stars" role="img" aria-label="5 out of 5">${I.star.repeat(5)}</div><div>${q}</div><div class="meta">${w}</div></div>`).join('')}
   <a class="doc" href="#"><span></span><span class="n">See all 128 reviews on Google</span><span></span>${I.chev}</a></section>`;}
function services(){
  const S=[['Yearly gutter check','Clean, check, fix small leaks — from $149'],['Roof tune-up','from $350'],['Window cleaning','from $180']];
  return `<section class="card" aria-label="We also do"><div class="hd"><h2>We also do</h2><span class="meta">Ask for a quote</span></div>
   ${S.map(([n,f])=>`<a class="svc" href="#"><span class="im" aria-hidden="true"></span><span><span class="n">${n}</span><br><span class="meta">${f}</span></span>${I.chev}</a>`).join('')}</section>`;}
function expired(){return `<section class="card"><span class="chip warn">${I.alert}This link is no longer valid</span><h1>Ask for a new link</h1><p class="meta">We send it to the phone or email we have for you.</p><button class="btn pri bar full">Send me a new link</button></section>`;}
function foot(){return `<div class="foot">Brightline Gutters &amp; Exteriors · 2200 E Colorado Blvd, Pasadena, CA · (626) 555-0142</div>`;}
function bar(){
  const b=document.getElementById('pbar');const t=totals();
  if(st.w!=='390'){b.style.display='none';return;}
  if(st.state==='sent'){b.style.display='';b.innerHTML=`<div class="sm"><span class="meta">${t.o.nm}${addsWord()}</span><b class="num">${money(t.t)}</b></div><button class="btn pri bar full" data-go="sign">Choose &amp; sign</button>`;}
  else if(st.state==='sign'){b.style.display='';b.innerHTML=`<div class="sm"><span class="meta">Total</span><b class="num">${money(t.t)}</b></div><button class="btn pri bar full">Approve and sign</button>`;}
  else b.style.display='none';
}
function render(){
  const d=document.getElementById('dev');d.className='dev w'+st.w;d.dataset.theme=st.theme;
  document.querySelectorAll('[data-k]').forEach(x=>x.setAttribute('aria-pressed',st[x.dataset.k]===x.dataset.v));
  let main;
  if(st.state==='expired')main=[expired()];
  else if(st.state==='sign')main=[sign()];
  else if(st.state==='sent')main=[next(),estimate(),docs(),photos(),reviews(),services()];
  else if(st.state==='signed')main=[next(),estimate(),docs(),reviews(),services()];
  else main=[next(),photos(),docs(),estimate(),services()];
  const wide=st.w==='1280';
  // 1280: правая колонка закреплена — компания, связь и (на шаге решения) итог с главной кнопкой; в колонке документа жёлтой нет
  const side=head()+(st.state==='sent'?`<section class="card" aria-label="Summary"><h2>${totals().o.nm} option${addsWord()}</h2>${totalsBlock()}<button class="btn pri bar full" data-go="sign">Choose ${totals().o.nm} &amp; sign</button></section>`:'');
  document.getElementById('scroll').innerHTML=`<div class="brandbar"></div><div style="height:16px"></div><div class="wrap">${wide?`<div class="main">${main.join('')}</div><aside class="side">${side}</aside>`:head()+main.join('')}${foot()}</div>`;
  if(wide&&st.state==='sent')document.querySelectorAll('.main .tot').forEach(x=>x.remove());
  document.querySelectorAll('[data-opt]').forEach(e=>e.onclick=()=>{if(st.state!=='sent')return;st.opt=e.dataset.opt;render();});
  document.querySelectorAll('[data-add]').forEach(e=>{const f=()=>{if(st.state!=='sent')return;const id=e.dataset.add;st.adds.has(id)?st.adds.delete(id):st.adds.add(id);render();};e.onclick=f;e.onkeydown=k=>{if(k.key===' '||k.key==='Enter'){k.preventDefault();f();}};});
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{st.state=e.dataset.go;render();});
  bar();
}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st[b.dataset.k]=b.dataset.v;render();});
render();
</script>
</body>
</html>
