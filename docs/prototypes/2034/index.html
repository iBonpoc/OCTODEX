<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Волна Н4: формы и пусто</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Прототип этапа 0 волны Н1 (#2031). «Было» — снимки приложения (before/), «Стало» — макет на токенах «Наряда»
   (packages/design-tokens, DS §2.2: шрифт 28/22/17/15/15/13/11, отступы 4…32, радиусы 24/18/12, кнопки 28/32/36, зона 44).
   Правило — design/naryad-ds/DESIGN-SYSTEM.md §8.9а–§8.9в. Светлая тёплая — :root, тёмная графитовая — [data-theme=dark]. */
:root{
  --acc:#FBFF00;--on-acc:#0B0C0F;--font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:24px;--ri:18px;--rf:12px;
  --fs-display:28px;--fs-title:22px;--fs-heading:17px;--fs-body:15px;--fs-btn:15px;--fs-caption:13px;--fs-micro:11px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --c-sm:28px;--c-md:32px;--c-lg:36px;--hit:44px;--field-phone:44px;--field:34px;--chip-h:24px;
  --tabbar-h:56px;--rail:72px;--panel-w:360px;--form-max:560px;--content-max:1200px;--thumb:72px;--step-bar:4px;
  --st-ok:#7CE08A;--st-info:#8FA2FF;--st-warn:#FF8A3D;--st-bad:#FF6B6B;--st-on:#0B0C0F;
  --page:#DDD9D2;--bg:#EFEBE5;--ink:#15161A;--mut:#575C68;--surf:rgba(255,255,255,.62);--surf2:rgba(255,255,255,.85);--in:rgba(255,255,255,.55);
  --bd:rgba(20,22,30,.1);--bd-field:rgba(20,22,30,.5);--track:rgba(20,22,30,.09);--sh:0 10px 28px rgba(60,50,40,.12);--ov:rgba(250,248,244,.78);--ring:#15161A;
  --st-ok-t:#176428;--st-info-t:#3647C4;--st-warn-t:#944600;--st-bad-t:#B4232A;
}
[data-theme="dark"]{
  --page:#181A1E;--bg:#24272D;--ink:#F2F3F5;--mut:#CDD1DA;--surf:rgba(255,255,255,.07);--surf2:rgba(255,255,255,.11);--in:rgba(255,255,255,.05);
  --bd:rgba(255,255,255,.14);--bd-field:rgba(255,255,255,.38);--track:rgba(255,255,255,.12);--sh:0 10px 30px rgba(0,0,0,.3);--ov:rgba(38,41,48,.72);--ring:#FBFF00;
  --st-ok-t:#9CF0A8;--st-info-t:#C2CCFF;--st-warn-t:#FFB47E;--st-bad-t:#FFAAAA;color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#181A1E;--bg:#24272D;--ink:#F2F3F5;--mut:#CDD1DA;--surf:rgba(255,255,255,.07);--surf2:rgba(255,255,255,.11);--in:rgba(255,255,255,.05);
  --bd:rgba(255,255,255,.14);--bd-field:rgba(255,255,255,.38);--track:rgba(255,255,255,.12);--sh:0 10px 30px rgba(0,0,0,.3);--ov:rgba(38,41,48,.72);--ring:#FBFF00;
  --st-ok-t:#9CF0A8;--st-info-t:#C2CCFF;--st-warn-t:#FFB47E;--st-bad-t:#FFAAAA;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:var(--fs-body);line-height:1.45}
body{padding:var(--s4) max(16px,env(safe-area-inset-right,0px)) var(--s8) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
h1{font-size:var(--fs-title);margin:0 0 var(--s1)}
.lead{color:var(--mut);margin:0 0 var(--s4);max-width:760px}
.bar{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;margin-bottom:var(--s4)}
.seg{display:inline-flex;background:var(--track);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{min-height:var(--c-md);padding:0 var(--s3);border-radius:999px;font-size:var(--fs-caption);font-weight:600;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--surf2);color:var(--ink);box-shadow:var(--sh)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.pane h2{font-size:var(--fs-heading);margin:0 0 var(--s2)}
.stage{background:var(--track);border-radius:var(--r);padding:var(--s3);overflow:hidden}
.scaler{transform-origin:0 0}
.before img{display:block;width:100%;height:auto;border-radius:var(--ri)}
.notes{margin-top:var(--s4);background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s4)}
.notes h3{font-size:var(--fs-heading);margin:0 0 var(--s2)}
.notes li{margin-bottom:var(--s1)}

/* ===== устройство ===== */
.dev{position:relative;background:var(--bg);color:var(--ink);overflow:hidden;border-radius:var(--ri);display:flex}
.dev[data-w="390"]{width:390px;height:844px}
.dev[data-w="820"]{width:820px;height:900px}
.dev[data-w="1280"]{width:1280px;height:900px}
.rail{width:var(--rail);flex:none;border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding-top:var(--s4)}
.rail .ri{width:56px;min-height:48px;border-radius:var(--rf);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs-micro);color:var(--mut);gap:2px}
.rail .ri.on{background:var(--surf2);color:var(--ink);font-weight:600}
.main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow:hidden;padding:var(--s4)}
.dev[data-w="820"] .scroll,.dev[data-w="1280"] .scroll{padding:var(--s4) var(--s6)}
.wrap{max-width:var(--content-max);margin:0 auto}
.ver{font-size:var(--fs-micro);color:var(--mut);margin-bottom:var(--s2)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:var(--hit);color:var(--mut);font-size:var(--fs-body);font-weight:500}
.hdr{display:flex;align-items:flex-start;gap:var(--s2)}
.hdr h2{font-size:var(--fs-display);line-height:1.15;margin:0;font-weight:700}
.q{width:18px;height:18px;border-radius:999px;border:1.5px solid var(--mut);color:var(--mut);font-size:11px;display:inline-flex;align-items:center;justify-content:center;margin-top:8px;flex:none}
.sp{flex:1}
.ib{width:var(--c-lg);height:var(--c-lg);border-radius:999px;background:var(--surf2);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;flex:none}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin:var(--s2) 0 var(--s6);color:var(--mut)}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:var(--chip-h);padding:0 10px;border-radius:999px;font-size:var(--fs-caption);font-weight:600;border:1px solid var(--bd);background:var(--surf2);color:var(--ink)}
.chip.warn{color:var(--st-warn-t);border-color:var(--st-warn)}
.chip.info{color:var(--st-info-t);border-color:var(--st-info)}
.chip.ok{color:var(--st-ok-t);border-color:var(--st-ok)}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);box-shadow:var(--sh)}
.now{font-size:var(--fs-body);margin:0 0 var(--s3)}
.stitle{font-size:var(--fs-heading);font-weight:600;margin:var(--s3) 0 var(--s2);display:flex;align-items:center;gap:var(--s2)}
.row{display:flex;align-items:center;gap:var(--s3);min-height:var(--hit);border-bottom:1px solid var(--bd);padding:var(--s1) 0}
.row:last-child{border-bottom:0}
.row .k{color:var(--mut);width:96px;flex:none;font-size:var(--fs-caption)}
.row .v{flex:1;min-width:0}
.row .chev{color:var(--mut)}
.money{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3)}
.money .lbl{color:var(--mut);font-size:var(--fs-caption)}
.money .sum{font-size:var(--fs-title);font-weight:600;font-variant-numeric:tabular-nums}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s1);margin:var(--s2) 0 var(--s3)}
.steps .st{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-caption);color:var(--mut)}
.steps .st i{display:block;height:var(--step-bar);border-radius:999px;background:var(--track)}
.steps .st.done{color:var(--ink)}
.steps .st.done i{background:var(--ink)}
.steps .st.cur{color:var(--ink);font-weight:600}
.steps .st.cur i{background:var(--acc);outline:1px solid var(--bd)}
.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.contact button{min-height:var(--hit);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-caption);font-weight:500;border-radius:var(--rf);background:var(--in);border:1px solid var(--bd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--hit);padding:0 var(--s4);border-radius:999px;font-weight:600;font-size:var(--fs-btn)}
.btn.pri{background:var(--acc);color:var(--on-acc)}
.btn.sec{background:var(--surf2);border:1px solid var(--bd)}
.btn.sm{min-height:var(--c-md);font-size:var(--fs-caption);padding:0 var(--s3)}
.tabs{display:flex;gap:var(--s1);overflow:hidden;margin:var(--s2) 0 var(--s3)}
.tabs span{min-height:30px;padding:0 var(--s3);display:inline-flex;align-items:center;border-radius:999px;font-size:var(--fs-caption);font-weight:600;color:var(--mut);white-space:nowrap}
.tabs span.on{background:var(--surf2);color:var(--ink);box-shadow:var(--sh)}
.thumbs{display:flex;gap:var(--s2);flex-wrap:wrap}
.thumbs b{width:var(--thumb);height:var(--thumb);border-radius:var(--rf);background:var(--track);border:1px solid var(--bd);display:flex;align-items:flex-end;padding:4px;font-size:var(--fs-micro);font-weight:500;color:var(--mut)}
ul.todo{margin:0;padding-left:var(--s5)}
ul.todo li{margin-bottom:var(--s1)}
.field{margin-bottom:var(--s3)}
.field label{display:block;font-size:var(--fs-caption);font-weight:500;color:var(--mut);margin-bottom:var(--s1)}
.field .inp{height:var(--field-phone);border-radius:var(--rf);background:var(--in);border:1px solid var(--bd);display:flex;align-items:center;padding:0 var(--s3);font-size:17px}
.dev:not([data-w="390"]) .field .inp{height:var(--field)}
.field .inp.ph{color:var(--mut)}
.form{max-width:var(--form-max)}

/* панели действия */
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 var(--s3) var(--s3);display:flex;flex-direction:column;gap:var(--s2);z-index:2}
.actionbar{background:var(--ov);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s2);box-shadow:var(--sh)}
.actionbar .r{display:flex;gap:var(--s2)}
.actionbar .r .btn{flex:1}
.actionbar .r .btn.g2{flex:2}.actionbar .r .btn.g3{flex:3}
.tabpill{height:var(--tabbar-h);background:var(--ov);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd);border-radius:999px;display:flex;align-items:center;justify-content:space-around;box-shadow:var(--sh)}
.tabpill span{display:flex;flex-direction:column;align-items:center;font-size:var(--fs-micro);color:var(--mut);gap:2px;min-width:60px}
.tabpill span.on{color:var(--ink);font-weight:600}
.dev[data-w="390"] .room{height:150px}
.dev[data-w="390"] .room.tall{height:200px}
/* полоса 820 — шириной колонки */
.strip{position:absolute;bottom:0;left:var(--s6);right:var(--s6);padding-bottom:var(--s3);z-index:2}
.strip .actionbar{flex-direction:row;justify-content:flex-end;align-items:center;max-width:var(--content-max);margin:0 auto}
.strip.formw{right:auto;width:var(--form-max)}
.strip .actionbar .btn{min-width:160px;max-width:280px}
.strip .info{margin-right:auto;font-size:var(--fs-caption);color:var(--mut)}
/* 1280 — две колонки */
.two{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);gap:var(--s6);align-items:start}
.side .btn{width:100%}
.side .card{margin-bottom:var(--s3)}
.menu{position:absolute;z-index:5;background:var(--ov);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd);border-radius:var(--rf);box-shadow:var(--sh);width:240px;padding:var(--s1) 0}
.menu div{min-height:var(--hit);display:flex;align-items:center;padding:0 var(--s4);gap:var(--s2)}
.menu .bad{color:var(--st-bad-t)}
.menu hr{border:0;border-top:1px solid var(--bd);margin:var(--s1) 0}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.m{width:20px;height:20px}

/* правки после ревью 18.11 */
.dev.full{height:auto!important}
.dev.full .scroll{overflow:visible}
.scroll{overflow:auto}
.rail{gap:2px;padding-top:var(--s3);overflow:hidden}
.rail .logo{font-weight:700;font-size:var(--fs-heading);margin-bottom:var(--s2)}
.rail .ri{min-height:44px}
.rail .av{width:var(--c-md);height:var(--c-md);border-radius:999px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:var(--fs-micro);margin-top:auto;margin-bottom:var(--s3)}
.field .inp{border-color:var(--bd-field)}
.field .inp.multi{height:88px;align-items:flex-start;padding-top:var(--s2)}
.field .inp .act{margin-left:auto;color:var(--mut);display:inline-flex}
.field2{display:grid;grid-template-columns:1fr 96px 120px;gap:var(--s2)}
.btn.sec{border-color:var(--bd-field)}
.contact{display:flex;gap:var(--s2);flex-wrap:wrap}
.contact button{flex:1;min-width:0;min-height:var(--c-lg);flex-direction:row;border-radius:999px;border:1px solid var(--bd-field);background:var(--surf2);font-size:var(--fs-caption);font-weight:600;gap:6px;position:relative}
.contact button::after{content:"";position:absolute;inset:-4px 0}
.steps .st.done{color:var(--ink)}
.steps .st.done i{background:var(--ink)}
.steps .st.next{color:var(--ink);font-weight:600}
.steps .st.next i{background:var(--track);outline:1px solid var(--bd-field)}
.steps .st span{display:inline-flex;align-items:center;gap:2px}
.lc{display:flex;align-items:center;gap:var(--s3);min-height:var(--hit);background:var(--surf);border:1px solid var(--bd);border-radius:var(--ri);padding:var(--s2) var(--s3);margin-bottom:var(--s2)}
.lc .t{flex:1;min-width:0}
.lc .t b{display:block;font-weight:600}
.lc .t small{color:var(--mut);font-size:var(--fs-caption)}
.detail{max-width:var(--form-max)}
.detail .row .k{width:72px}
.side .btn{min-height:var(--c-md);font-size:var(--fs-caption)}
.side .contact button{min-height:var(--c-md)}
.dock{padding-bottom:max(var(--s3),34px)}
.dock.acc .actionbar{background:none;border:0;box-shadow:none;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.dock.acc .btn{box-shadow:var(--sh)}
.strip.formw{position:sticky;left:auto;right:auto;margin-top:var(--s4);padding:0}
.chk{display:flex;align-items:center;gap:var(--s2);min-height:var(--hit);border-bottom:1px solid var(--bd)}
.chk:last-child{border-bottom:0}
.dc{width:22px;height:22px;border-radius:999px;border:1.5px solid var(--bd-field);display:inline-flex;align-items:center;justify-content:center;flex:none}
.dc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.addph{width:var(--thumb);height:var(--thumb);border-radius:var(--rf);border:1.5px dashed var(--bd-field);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs-micro);color:var(--mut);gap:2px}
.tabs{position:relative;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.stitle .add{margin-left:auto}
.st-n{color:var(--st-warn-t)}
.field .inp.multi{height:88px!important}
.strip.formw .actionbar{background:none;border:0;box-shadow:none;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
</style>
<style>

.note{display:flex;align-items:center;gap:6px;font-size:var(--fs-caption);font-weight:600}
.note.warn{color:var(--st-warn-t)}.note.bad{color:var(--st-bad-t)}
.lcard{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3)}

.tip{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s4);display:flex;gap:var(--s3);margin:var(--s3) 0}

.bigsum{font-size:var(--fs-display);font-weight:700;font-variant-numeric:tabular-nums}

.lhead{font-size:var(--fs-caption);color:var(--mut);margin-bottom:var(--s1)}
.lrow{min-height:56px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--rf);margin-bottom:var(--s2)}

.demo{display:inline-flex;align-items:center;gap:6px;min-height:var(--chip-h);padding:0 10px;border-radius:999px;font-size:var(--fs-caption);font-weight:600;background:var(--st-warn);color:var(--st-on)}
.backrow{height:44px;display:flex;align-items:center}
.field .inp{border-color:var(--bd-field)}

.field .err{display:flex;gap:6px;align-items:center;color:var(--st-bad-t);font-size:var(--fs-caption);font-weight:600;margin-top:6px}

.empty .ico{width:48px;height:48px;border-radius:999px;background:var(--surf2);display:inline-flex;align-items:center;justify-content:center;margin-bottom:var(--s2)}
.empty b{display:block;font-size:var(--fs-heading);margin-bottom:6px}
.dot{display:flex;gap:var(--s2);align-items:flex-start;min-height:32px;padding:4px 0}
.dot::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--mut);margin-top:9px;flex:none}
.canvas{height:200px;border:1.5px dashed var(--bd-field);border-radius:var(--ri);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.canvas.bad{border-color:var(--st-bad)}
.offline{display:flex;gap:var(--s2);align-items:center;background:var(--surf);border:1px solid var(--bd);border-radius:var(--ri);padding:var(--s3) var(--s4);max-width:var(--form-max)}
.dev.full{height:auto!important}
.field .err{color:var(--st-bad-t)}
.field .inp.bad,.canvas.bad{border-color:var(--st-bad-t)}
.empty{margin:var(--s4) 0;text-align:left}
.dev[data-w="390"] .empty{max-width:none}
.btn{min-height:var(--c-lg)}
.dev:not([data-w="390"]) .btn{min-height:var(--c-md);font-size:var(--fs-caption)}
.dock .btn,.strip .btn{min-height:var(--hit)!important;font-size:var(--fs-btn)!important}
.btn.badtxt{background:var(--surf2);border:1px solid var(--bd-field);color:var(--st-bad-t)}
.co{display:flex;gap:var(--s3);align-items:center;background:var(--surf);border:1px solid var(--bd);border-radius:var(--ri);padding:var(--s3)}
</style>

<script>
const BEFORE = { item: "catalog_cat-haul", del: "settings_delete-account", imports: "client_imports", pay: "company_payments", sign: "estimate_signature" };
const ST = { item: ["обычное","после нажатия «Сохранить позицию» с пустой ценой","= 2"], del: ["демо","настоящий аккаунт, первый экран","настоящий аккаунт, шаг кода — нажато «Проверить код» с пустым полем"], imports: ["пусто","облачный аккаунт: нет сети и нет данных в телефоне","= 2"], pay: ["демо","= 1","= 1"], sign: ["обычное","после нажатия «Сохранить подпись» с пустым холстом","= 2"] };
const S = { scr: "item", st: "0", wid: "390", thm: "dark" };
const ic = (n, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const RAIL = [["home","Главная"],["msg","Сообщения"],["cal","План"],["inbox","Лиды"],["wrench","Работы"],["users","Клиенты"],["phone","Звонки"],["check","Задачи"],["note","Сметы"],["wallet","Счета"],["burger","Ещё"]];
const rail = (on) => `<nav class="railx">${RAIL.map(([i,t]) => `<div class="ri ${t===on?"on":""}">${ic(i,"m")}${t}</div>`).join("")}</nav>`;
const tabs = (on) => `<div class="dock"><div class="tabpill">${[["home","Главная"],["cal","План"],["msg","Сообщения"],["users","Клиенты"],["burger","Ещё"]].map(([i,t]) => `<span class="${t===on?"on":""}">${ic(i,"m")}${t}</span>`).join("")}</div></div>`;
function head(back, title, opts = {}) {
  const w = +S.wid;
  const svc = `<span class="ver" style="margin:0">GoRix v1.0.0 · 18 · 18 нояб.</span>${opts.demo===false?"":`<span class="demo">${ic("alert")}Демо · данные только на этом телефоне</span>`}`;
  const b = opts.cancel ? `<button class="back" style="padding-left:0">Отмена</button>` : back ? `<button class="back">${ic("back")}${back}</button>` : "";
  const top = w === 390 ? `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-bottom:10px">${svc}</div><div class="backrow">${b}</div>` : `<div class="backrow">${b}<span style="flex:1"></span><span style="display:flex;gap:8px;align-items:center">${svc}</span></div>`;
  return top + `<div class="hdr"><h2>${title}</h2><span class="q">?</span><span class="sp"></span>${opts.more===false?"":`<button class="ib" aria-label="Ещё действия">${ic("more")}</button>`}</div>${opts.sub ? `<p class="small" style="margin:8px 0 0;max-width:680px">${opts.sub}</p>` : ""}`;
}
const fld = (l, v, o = {}) => o.sel ? `<div class="field"><div class="inp"><span>${l}</span><span class="val">${v} ${ic("chevd")}</span></div></div>` : `<div class="field"><label>${l}</label><div class="inp ${o.ph?"ph":""} ${o.bad?"bad":""}">${o.lead?`<span style="color:var(--mut);display:inline-flex;margin-right:8px">${ic(o.lead)}</span>`:""}${o.sel?`<span class="val">${v} ${ic("chevd")}</span>`:v}${o.act?`<span class="act" aria-label="${o.actLabel||""}">${ic(o.act)}</span>`:""}</div>${o.err?`<div class="err">${ic("alertc")}${o.err}</div>`:""}</div>`;
function render() {
  const w = +S.wid, sp = S.st !== "0"; let c = "", dock = "", full = false, railOn = "Ещё", noRail = false, tabOn = "";
  document.getElementById("stHint").textContent = "Состояния: 1 — " + ST[S.scr][0] + "; 2 — " + ST[S.scr][1] + "; 3 — " + ST[S.scr][2];
  const st = +S.st;
  if (S.scr === "item") {
    const save = `<button class="btn pri">Сохранить позицию</button>`;
    c = head("", "Debris haul-away", { cancel: true }) + `<div style="height:16px"></div><div class="form">
      ${fld("Тип", "Услуга", { sel: 1 })}${fld("Название (видит клиент)", "Debris haul-away (pickup load)")}
      ${fld("Единица", "Своя", { sel: 1 })}${fld("Своя единица", "flat")}
      ${fld("Цена клиенту, $ за flat", sp ? "" : "150", sp ? { bad: 1, err: "Впишите цену — клиент увидит её в смете" } : {})}
      ${w>390?`<div style="margin-top:28px">${save}</div>`:""}</div><p class="small" style="margin-top:16px">«Удалить из каталога» — в «⋯» (красным, тост «Отменить» 5 с).</p>`;
    if (w === 390) dock = `<div class="dock"><div class="actionbar"><div class="r">${save}</div></div></div>`;
  } else if (S.scr === "del") {
    const gone = ["Ваше имя, email и телефон","Вход в приложение","Личные настройки","Местоположение","Личные заметки"];
    const stays = ["Работы, сметы, счета, оплаты, выезды, общие заметки, сообщения и файлы, которые вы добавили, — с подписью «Удалённый пользователь»","История изменений (в ней прежние должность, номер HIS — лицензии на ремонт жилья — и цвет)","Имя и подпись на уже подписанных документах","Запись о согласии с Условиями — без IP-адреса","Контакт компании с вашими данными, если он был","Отпуска и выходные в календаре"];
    const list = (a) => `<div class="card" style="max-width:560px">${a.map(t => `<div class="dot">${t}</div>`).join("")}</div>`;
    const lists = `<div class="stitle">Что удалится</div>${list(gone)}<div class="stitle">Что останется у компании</div>${list(stays)}<p class="small" style="max-width:560px">Служебный журнал входов хранится у поставщика сервера по его правилам.</p>`;
    if (st === 0) {
      c = head("Профиль и аккаунт", "Удалить учётную запись", { more: false }) + `<div style="height:16px"></div><div class="form"><div class="empty" style="margin-top:0">${ic("info","m")}<b style="margin-top:8px">В демо учётной записи нет — удалять нечего</b><div class="small" style="margin-bottom:16px">Так этот экран выглядит у настоящей учётной записи.</div><button class="btn pri">Войти или создать компанию</button></div>${lists}</div>`;
    } else if (st === 1) {
      c = head("Профиль и аккаунт", "Удалить учётную запись", { more: false, demo: false }) + `<div style="height:16px"></div><div class="form">${lists}
        <div class="stitle">Ваши компании</div><div class="co">${ic("home","m")}<div style="flex:1"><b>GoRix Demo Home Services</b><div class="small">Владелец · вы последний владелец</div></div><span class="chip f warn">${ic("alert")}Нужно решение</span></div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sec sm">Передать компанию</button><button class="btn sec sm">Закрыть компанию</button></div>
        <div style="margin-top:28px"><button class="btn badtxt">${ic("trash")}Удалить учётную запись</button></div></div>`;
    } else {
      c = head("Профиль и аккаунт", "Код из письма", { more: false, demo: false }) + `<div style="height:16px"></div><div class="form"><p>Мы отправили код на <b>alex.petrov@gorixdemo-homeservices.com</b>. Письмо придёт от <b>no-reply@gorix.app</b>. Так мы знаем, что удаляете именно вы.</p>
        ${fld("Код из письма — N цифр (длина по спеке 50)", "", { ph: 1, bad: 1, err: "Впишите код из письма", act: "paste", actLabel: "Вставить" })}
        <div class="stitle" style="font-size:15px">Не пришло письмо?</div><div class="dot">Проверьте папку «Спам» и «Промоакции»</div><div class="dot">Подождите минуту — письмо может задержаться</div>
        <div style="margin-top:12px;display:flex;gap:12px;align-items:center"><button class="btn sec sm">Запросить снова</button><span class="small">доступно через 0:42</span></div>
        ${w>390?`<div style="margin-top:28px"><button class="btn pri">Проверить код</button></div>`:""}<p class="small" style="margin-top:16px">Дальше — слово подтверждения и «Удалить навсегда» (спека 50).</p></div>`;
      if (w === 390) dock = `<div class="dock"><div class="actionbar"><div class="r"><button class="btn pri">Проверить код</button></div></div></div>`;
    }
  } else if (S.scr === "imports") {
    railOn = "Клиенты"; tabOn = "Клиенты";
    c = head("Клиенты", "Импорты", { demo: !sp, sub: "Импорты клиентов из CSV. Подробнее — «?»: незаконченный — «Продолжить» и тот же файл; готовый можно отменить 30 дней." }) + (sp ? `<div class="small" style="margin-top:8px;display:flex;gap:6px;align-items:center">${ic("wifiOff")}Нет сети — изменения отправятся позже</div>` : "");
    c += sp ? `<div class="empty"><span class="ico">${ic("wifiOff","m")}</span><b>Нет сети</b><div class="small" style="margin-bottom:16px">Список импортов появится, когда телефон подключится.</div><button class="btn sec sm">Повторить</button></div>`
      : `<div class="empty"><span class="ico">${ic("upload","m")}</span><b>Импортов ещё не было</b><div class="small" style="margin-bottom:16px">Загрузите CSV из таблицы или старой CRM — клиенты появятся в списке.</div><button class="btn pri">${ic("plus")}Импортировать клиентов</button></div>`;
  } else if (S.scr === "pay") {
    tabOn = "Ещё";
    c = head("Настройки компании", "Онлайн-оплата", { more: false, sub: "Приём карт на странице клиента: клиент платит по ссылке из счёта." }) + `<div class="empty">${ic("info","m")}<b style="margin-top:8px">Онлайн-оплата работает в облачном аккаунте компании</b><div class="small" style="margin-bottom:16px">Карты принимаются через Stripe — он работает только в облачном аккаунте. Войдите или создайте компанию.</div><button class="btn pri">Войти или создать компанию</button></div>`;
  } else {
    const save = `<button class="btn pri">Сохранить подпись</button>`;
    c = head("Профиль и аккаунт", "Моя подпись", { more: false, sub: "Подписи ещё нет. Нарисуйте её — она будет на договорах от имени компании." }) + `<div style="height:16px"></div><div class="form">${fld("Имя на документах", "Alex Petrov", { lead: "user" })}${fld("Должность", "Например: Owner", { ph: 1 })}
      <label class="small" style="display:block;margin-bottom:4px">Подпись</label><div class="canvas ${sp?"bad":""}">Распишитесь здесь пальцем${w>390?" или мышью":""}</div>${sp?`<div class="field"><div class="err">${ic("alertc")}Распишитесь в рамке</div></div>`:""}
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn sec sm">${ic("expand")}Во весь экран</button></div>${w>390?`<div style="margin-top:28px">${save}</div>`:""}
      <p class="small" style="margin-top:12px">«Очистить» появится после первого штриха. «Во весь экран» — полноэкранный режим Б11 («Отмена / Готово», без меню и прокрутки, смахивание «назад» выключено).</p></div>`;
    if (w === 390) dock = `<div class="dock"><div class="actionbar"><div class="r">${save}</div></div></div>`;
  }
  if (w === 390 && tabOn && !dock) dock = tabs(tabOn);
  const left = w === 390 || noRail ? "" : rail(railOn);
  const dev = `<div class="dev" data-w="${w}" data-theme="${S.thm}">${left}<div class="main"><div class="scroll"><div class="wrap">${c}${w===390?'<div style="height:110px"></div>':""}</div></div>${dock}</div></div>`;
  const sc = document.getElementById("scaler"); sc.innerHTML = dev;
  const stage = document.getElementById("afterStage"), hgt = sc.firstElementChild.offsetHeight, k = Math.min(1, (stage.clientWidth - 24) / w);
  sc.style.transform = `scale(${k})`; sc.style.width = w + "px"; sc.style.height = hgt * k + "px"; stage.style.height = hgt * k + 24 + "px";
  const img = document.getElementById("beforeImg"); img.src = `before/${BEFORE[S.scr]}-${w}-${S.thm}.jpg`; img.alt = `Сейчас: ${BEFORE[S.scr]}`;
  document.getElementById("notes").innerHTML = NOTES[S.scr];
}
const NOTES = {
  item: `<h3>Позиция каталога</h3><ul><li>У каждого поля подпись (СМ-27, О-15): «flat» было полем без подписи — стало «Своя единица»; «Единица · Своя ⌄» не обрезана; единица — в подписи цены.</li><li>«Сохранить» всегда активна: пустая цена → ошибка вплотную под полем (§11 п.3). На 390 — панель (Н1), на широком — под формой; колонка 560 (Н2).</li></ul>`,
  del: `<h3>Удалить учётную запись</h3><ul><li>1 — демо: справка облачной функции (как «Онлайн-оплата»), главная «Войти или создать компанию»; кнопки удаления и шага кода нет ни на одной ширине (ВХ-15, ВХ-04).</li><li>2 — настоящая учётная запись: перечни раскрытия полностью, как сейчас, списком с маркерами (ВХ-19); «Ваши компании» с «Передать / Закрыть»; «Удалить учётную запись» — вторичная с красным текстом (danger — только на шаге слова).</li><li>3 — шаг кода: адрес целиком, отправитель словом (ВХ-09), «6 цифр», «Вставить», советы списком, «Запросить снова» — кнопка. Дальше по спеке 50 — слово и «Удалить навсегда».</li></ul>`,
  imports: `<h3>Импорты</h3><ul><li>«Пусто» с действием здесь же: «Импортировать клиентов» (О-18); карточка не шире 560 по центру.</li><li>Нет сети и данных — одна строка «Нет сети» и «Повторить» вместо «Импортов нет» (КЛ-26).</li></ul>`,
  pay: `<h3>Онлайн-оплата</h3><ul><li>Облачная функция в демо — не тупик: кнопка «Войти или создать компанию» (НК-11). Заголовок — «Онлайн-оплата», «‹ Настройки компании» (Н2).</li></ul>`,
  sign: `<h3>Моя подпись</h3><ul><li>Подписи у полей «Имя на документах», «Должность», «Подпись» (СМ-11). «Во весь экран» — словом, не значком. На широком — без меню слева (Б11).</li><li>«Сохранить подпись» активна всегда: пустой холст → «Распишитесь в рамке» под ним (О-16).</li></ul>`,
};
for (const id of ["scr","st","wid","thm"]) document.getElementById(id).addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; S[id] = b.dataset.v; for (const x of e.currentTarget.querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b)); render(); });
addEventListener("resize", render); render();
</script>
