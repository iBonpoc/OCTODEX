<title>Карточки списков OCTODEX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Макет: панель управления сверху · слева список всех списков · в центре устройство (390 / 820 / 1280) в масштабе.
   Все значения — токены дизайн-системы OCTODEX (сейчас лежат в design/naryad-ds/tokens/*.css). Светлая тёплая — на :root, тёмная графитовая — ниже. */
:root{
  --acc:#FBFF00;--on-acc:#0B0C0F;--font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:24px;--ri:18px;--rf:12px;--blur:20px;--blurov:24px;
  --fs-display:28px;--fs-title:20px;--fs-heading:15px;--fs-body:13px;--fs-btn:12.5px;--fs-caption:11.5px;--fs-micro:10.5px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --c-sm:28px;--c-md:32px;--c-lg:36px;--hit:44px;--field:34px;--field-phone:44px;--chip-h:24px;--chip-px:10px;
  --icon-sm:16px;--tabbar-h:56px;--edge:3px;--avatar:36px;--avatar-sm:28px;--row-min:44px;--row-max:52px;--panel-w:360px;
  --dur-fast:160ms;--dur-base:220ms;--settle:420ms;--ease-spring:cubic-bezier(.3,1.25,.5,1);--ease-liquid:cubic-bezier(.3,1.35,.5,1);
  --st-ok:#7CE08A;--st-info:#8FA2FF;--st-warn:#FF8A3D;--st-bad:#FF6B6B;--st-on:#0B0C0F;--scrim:rgba(0,0,0,.42);--shadow-pop:0 20px 60px rgba(0,0,0,.45);
  --page:#DDD9D2;--bg:#EFEBE5;--ink:#15161A;--mut:#575C68;--surf:rgba(255,255,255,.62);--surf2:rgba(255,255,255,.85);--in:rgba(255,255,255,.55);
  --bd:rgba(20,22,30,.1);--track:rgba(20,22,30,.09);--sh:0 10px 28px rgba(60,50,40,.12);--ov:rgba(250,248,244,.78);--ring:#15161A;
  --st-ok-t:#176428;--st-info-t:#3647C4;--st-warn-t:#944600;--st-bad-t:#B4232A;
  --glow:radial-gradient(600px 420px at 6% 0%,rgba(124,224,138,.3),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,160,60,.24),transparent 60%),radial-gradient(520px 420px at 60% 35%,rgba(143,162,255,.2),transparent 60%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#181A1E;--bg:#24272D;--ink:#F2F3F5;--mut:#CDD1DA;--surf:rgba(255,255,255,.07);--surf2:rgba(255,255,255,.11);--in:rgba(255,255,255,.05);
  --bd:rgba(255,255,255,.14);--track:rgba(255,255,255,.12);--sh:0 10px 30px rgba(0,0,0,.3);--ov:rgba(38,41,48,.72);--ring:#FBFF00;
  --st-ok-t:#9CF0A8;--st-info-t:#C2CCFF;--st-warn-t:#FFB47E;--st-bad-t:#FFAAAA;
  --glow:radial-gradient(600px 420px at 6% 0%,rgba(124,224,138,.08),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,160,60,.07),transparent 60%),radial-gradient(520px 420px at 60% 35%,rgba(143,162,255,.06),transparent 60%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#181A1E;--bg:#24272D;--ink:#F2F3F5;--mut:#CDD1DA;--surf:rgba(255,255,255,.07);--surf2:rgba(255,255,255,.11);--in:rgba(255,255,255,.05);
  --bd:rgba(255,255,255,.14);--track:rgba(255,255,255,.12);--sh:0 10px 30px rgba(0,0,0,.3);--ov:rgba(38,41,48,.72);--ring:#FBFF00;
  --st-ok-t:#9CF0A8;--st-info-t:#C2CCFF;--st-warn-t:#FFB47E;--st-bad-t:#FFAAAA;
  --glow:radial-gradient(600px 420px at 6% 0%,rgba(124,224,138,.08),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,160,60,.07),transparent 60%),radial-gradient(520px 420px at 60% 35%,rgba(143,162,255,.06),transparent 60%);
  color-scheme:dark}
@media (prefers-reduced-motion:reduce){:root{--dur-fast:0ms;--dur-base:0ms;--settle:0ms}}

*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:var(--fs-body);line-height:1.45}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s4) var(--s8)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
svg{flex:none}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}

/* ---------- оболочка прототипа ---------- */
.top{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s4);align-items:center;justify-content:space-between;max-width:1680px;margin:0 auto var(--s4)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-size:var(--fs-title);margin:0;line-height:1.15;text-wrap:balance}
.brand p{margin:0;color:var(--mut);font-size:var(--fs-caption)}
.controls{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:center}
.ctl{display:flex;flex-direction:column;gap:2px}
.ctl>span{font-size:var(--fs-micro);color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--surf);border:1px solid var(--bd);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n,2));border-radius:999px;background:var(--acc);transform:translateX(calc(var(--i,0) * 100%));transition:transform var(--settle) var(--ease-liquid)}
.seg button{position:relative;z-index:1;height:24px;padding:0 var(--s3);border-radius:999px;font-size:var(--fs-btn);font-weight:600;white-space:nowrap;transition:color var(--dur-fast)}
.seg button[aria-pressed="true"]{color:var(--on-acc)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:var(--s4);max-width:1680px;margin:0 auto;align-items:start}
.nav{position:sticky;top:var(--s4);display:flex;flex-direction:column;gap:var(--s3);max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
.nav h3{margin:0 0 2px;font-size:var(--fs-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.nav .grp{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:var(--s2);min-height:32px;padding:0 var(--s2);border-radius:var(--rf);text-align:left;font-weight:500}
.nav button:hover{background:var(--surf)}
.nav button[aria-current="true"]{background:var(--surf2);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
.nav .ar{margin-left:auto;font-size:var(--fs-micro);color:var(--mut);font-weight:600}
.navsel{display:none;height:var(--field-phone);border-radius:var(--rf);border:1px solid var(--bd);background:var(--surf2);color:var(--ink);font:inherit;font-size:15px;padding:0 var(--s3);width:100%}
.stage{min-width:0}
.stagebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.stagebar .what{display:flex;flex-direction:column;gap:2px;min-width:0}
.stagebar b{font-size:var(--fs-heading)}
.stagebar small{color:var(--mut);font-size:var(--fs-caption)}
.fit{position:relative;width:100%;overflow:hidden}
.devwrap{transform-origin:top left;position:absolute;left:0;top:0}
.note-test{display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-caption);color:var(--mut)}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.nav{display:none}.navsel{display:block}}

/* ---------- устройство ---------- */
.dev{position:relative;overflow:hidden;background:var(--bg);color:var(--ink);box-shadow:var(--shadow-pop);border:1px solid var(--bd)}
.dev::before{content:"";position:absolute;inset:0;background:var(--glow);pointer-events:none}
.dev.phone{width:390px;height:844px;border-radius:48px}
.dev.tablet{width:820px;height:1100px;border-radius:32px}
.dev.desktop{width:1280px;height:820px;border-radius:16px}
.dev>*{position:relative}
.sbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-weight:600;font-size:15px}
.sbar i{display:inline-block;width:60px;height:4px}
.scroll{position:absolute;inset:44px 0 0 0;overflow-y:auto;overflow-x:hidden;padding:0 var(--s4) 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.ver{font-size:var(--fs-micro);color:var(--mut);font-weight:600;letter-spacing:.02em}
.hdr{display:flex;flex-direction:column;gap:var(--s2);margin:var(--s1) 0 var(--s3)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:44px}
.disp{font-size:var(--fs-display);font-weight:700;line-height:1.15;margin:0}
.ttl{font-size:var(--fs-title);font-weight:700;line-height:1.15;margin:0}
.back{display:inline-flex;align-items:center;gap:4px;height:36px;font-weight:500}
.help{width:18px;height:18px;border-radius:50%;border:1px solid var(--bd);display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--mut);position:relative}
.help::after{content:"";position:absolute;inset:-13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--c-lg);padding:0 var(--s3);border-radius:999px;font-size:var(--fs-btn);font-weight:600;background:var(--surf2);border:1px solid var(--bd);white-space:nowrap;position:relative;transition:transform var(--dur-fast) var(--ease-spring)}
.btn:active{transform:scale(.95)}
.btn::after{content:"";position:absolute;inset:-4px}
.btn.acc{background:var(--acc);color:var(--on-acc);border-color:transparent}
.btn.ic{width:var(--c-lg);padding:0}
.dev:not(.phone) .btn{height:var(--c-md)}
.dev:not(.phone) .btn.ic{width:var(--c-md)}
.btn.sm{height:var(--c-sm)!important}
.field{display:flex;align-items:center;gap:var(--s2);height:var(--field-phone);padding:0 var(--s3);border-radius:var(--rf);background:var(--in);border:1px solid var(--bd)}
.dev:not(.phone) .field{height:var(--field)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:15px;color:var(--ink)}
.dev:not(.phone) .field input{font-size:var(--fs-body)}
.field input::placeholder{color:var(--mut)}
.chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--s4) * -1);padding:2px var(--s4)}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;height:var(--c-md);padding:0 var(--s3);border-radius:999px;border:1px solid var(--bd);background:var(--surf);font-size:var(--fs-btn);font-weight:600;white-space:nowrap}
.fchip b{font-weight:600;color:var(--mut)}
.fchip[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);border-color:transparent}
.fchip[aria-pressed="true"] b{color:var(--on-acc)}
.dev:not(.phone) .fchip{height:var(--c-sm)}
.inseg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--track)}
.inseg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n,2));border-radius:999px;background:var(--surf2);box-shadow:var(--sh);transform:translateX(calc(var(--i,0) * 100%));transition:transform var(--settle) var(--ease-liquid)}
.inseg button{position:relative;z-index:1;height:28px;font-size:var(--fs-btn);font-weight:600;white-space:nowrap;padding:0 var(--s2)}
.offline{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;height:var(--chip-h);padding:0 var(--chip-px);border-radius:999px;background:var(--st-warn);color:var(--st-on);font-size:var(--fs-caption);font-weight:600}

.totals{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:4px var(--s3);align-items:center;justify-content:space-between;margin:var(--s2) 0;padding:var(--s2) var(--s3);border-radius:var(--rf);background:var(--ov);border:1px solid var(--bd);backdrop-filter:blur(var(--blurov));-webkit-backdrop-filter:blur(var(--blurov));font-size:var(--fs-caption)}
.totals b{font-size:var(--fs-body)}
.totals .bad{color:var(--st-bad-t);font-weight:600;display:inline-flex;gap:4px;align-items:center}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:var(--s4) 4px var(--s2);font-size:var(--fs-caption);color:var(--mut);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.sec span:last-child{letter-spacing:0;text-transform:none}
.list{display:flex;flex-direction:column;gap:var(--s2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);align-items:start}
.grid2 .sec{grid-column:1/-1;margin-bottom:0}

/* ---------- КАРТОЧКА v2: всё видно, без троеточий ----------
   Шапка (ведущий · имя + номер · значение) → чипы → строки фактов (значок + текст, перенос по словам)
   → цифры (плитки) → кнопки связи и главное действие. Текст никогда не обрезается многоточием. */
.sw{position:relative;border-radius:var(--ri);touch-action:pan-y}
.sw .acts{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 var(--s4);border-radius:var(--ri);background:var(--surf2);font-size:var(--fs-caption);font-weight:600;opacity:0;transition:opacity var(--dur-fast)}
.sw.dragging .acts{opacity:1}
.sw .acts span{display:inline-flex;align-items:center;gap:4px}
.card{position:relative;display:flex;flex-direction:column;gap:var(--s3);width:100%;text-align:left;padding:var(--s3) var(--s3) var(--s3) var(--s4);border-radius:var(--ri);background:var(--surf);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));overflow:hidden;transition:transform var(--dur-base) var(--ease-spring),border-color var(--dur-fast);overflow-wrap:anywhere}
.card:active{transform:scale(.98)}
.card[aria-selected="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),var(--sh)}
.edge{position:absolute;left:0;top:0;bottom:0;width:var(--edge)}
.e-ok{background:var(--st-ok)}.e-info{background:var(--st-info)}.e-warn{background:var(--st-warn)}.e-bad{background:var(--st-bad)}
.card.compact{gap:var(--s2);padding-block:var(--s2);border-radius:var(--rf);box-shadow:none}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:start}
.main{min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-size:var(--fs-heading);font-weight:600;line-height:1.25}
.compact .t{font-size:var(--fs-body)}
.num{font-variant-numeric:tabular-nums}
.n{font-size:var(--fs-caption);color:var(--mut);font-weight:500;line-height:1.35}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.v{font-size:var(--fs-heading);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.compact .v{font-size:var(--fs-body)}
.v small{font-size:var(--fs-caption);color:var(--mut);font-weight:500}
.v.plus{color:var(--st-ok-t)}
.vl{font-size:var(--fs-micro);color:var(--mut);font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.unread .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--st-info);margin-right:6px;vertical-align:middle}
.done .t{text-decoration:line-through;color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;height:var(--chip-h);padding:0 8px;border-radius:999px;border:1px solid var(--bd);font-size:var(--fs-caption);font-weight:500;color:var(--mut);white-space:nowrap}
.facts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.f{display:grid;grid-template-columns:minmax(0,1fr);font-size:var(--fs-body);line-height:1.4}
.f.pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s2)}
/* значок 16 стоит под центром ведущего элемента; отступ значок → текст одинаковый везде (--s3) */
.fc{display:grid;grid-template-columns:var(--icon-sm) minmax(0,1fr);gap:var(--s3);align-items:start;min-width:0}
.f>.fc:first-child{padding-left:calc((var(--avatar) - var(--icon-sm)) / 2)}
.fi{color:var(--mut);padding-top:1px}
.ft3{max-height:calc(1.4em * 3);overflow:hidden;min-width:0}
.ft3.clip{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 1.4em),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 1.4em),transparent)}
.f .fl{color:var(--mut)}
.f.desc{font-size:var(--fs-caption);color:var(--mut)}
.fc .q{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;margin:0}
.kv div{display:flex;flex-direction:column;gap:1px;padding:6px var(--s2);border-radius:var(--rf);background:var(--in);border:1px solid var(--bd);min-width:0}
.kv dt{font-size:var(--fs-micro);color:var(--mut);font-weight:600;letter-spacing:.02em}
.kv dd{margin:0;font-size:var(--fs-body);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv dd.t-warn{color:var(--st-warn-t)}.kv dd.t-bad{color:var(--st-bad-t)}.kv dd.t-ok{color:var(--st-ok-t)}
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--st-ok);border-radius:999px}
.prog{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-caption);color:var(--mut)}
.abar{display:flex;align-items:center;gap:var(--s2);padding-top:var(--s2);border-top:1px solid var(--bd)}
.abar .grow{flex:1}
.abar .btn.ic{color:var(--ink)}
/* ведущий элемент */
.av{width:var(--avatar);height:var(--avatar);border-radius:50%;display:grid;place-items:center;background:var(--surf2);border:1px solid var(--bd);font-size:var(--fs-caption);font-weight:600;flex:none}
.av.dash{border-style:dashed}
.compact .av{width:var(--avatar-sm);height:var(--avatar-sm);font-size:var(--fs-micro)}
.ico{width:var(--avatar);height:var(--avatar);border-radius:50%;display:grid;place-items:center;background:var(--surf2);border:1px solid var(--bd);flex:none}
.compact .ico{width:var(--avatar-sm);height:var(--avatar-sm)}
.ico.t-bad{color:var(--st-bad-t)}.ico.t-warn{color:var(--st-warn-t)}.ico.t-ok{color:var(--st-ok-t)}.ico.t-info{color:var(--st-info-t)}
.tm{width:var(--avatar);display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:var(--s1) 0;border-radius:var(--rf);background:var(--in);border:1px solid var(--bd)}
.tm b{font-size:var(--fs-caption);font-variant-numeric:tabular-nums}
.tm span{font-size:var(--fs-micro);color:var(--mut);font-weight:600;letter-spacing:.04em}
.chk{width:22px;height:22px;margin:7px;border-radius:7px;border:1.5px solid var(--mut);display:grid;place-items:center;position:relative}
.chk::after{content:"";position:absolute;inset:-11px}
.chk.on{background:var(--st-ok);border-color:transparent;color:var(--st-on)}
.pick{width:22px;height:22px;margin:7px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;flex:none}
.pick.on{background:var(--acc);border-color:transparent;color:var(--on-acc)}
/* статус-чип: цвет только для статуса, всегда значок + слово */
.chip{display:inline-flex;align-items:center;gap:4px;height:var(--chip-h);padding:0 var(--chip-px);border-radius:999px;font-size:var(--fs-caption);font-weight:600;white-space:nowrap;border:1px solid transparent;color:var(--st-on)}
.chip.ok{background:var(--st-ok)}.chip.info{background:var(--st-info)}.chip.warn{background:var(--st-warn)}.chip.bad{background:var(--st-bad)}
.chip.neutral{background:var(--surf2);border-color:var(--bd);color:var(--ink)}
.chip.soft{background:transparent;border-color:var(--bd)}
.chip.soft.ok{color:var(--st-ok-t)}.chip.soft.info{color:var(--st-info-t)}.chip.soft.warn{color:var(--st-warn-t)}.chip.soft.bad{color:var(--st-bad-t)}
.reasons{display:flex;flex-direction:column;gap:var(--s2);padding-top:var(--s2);border-top:1px solid var(--bd)}

function totals(l,items){
  if(!l.money||noMoney(l)||l.arch!=="B")return "";
  const sum=items.reduce((s,i)=>s+signed(i),0);
  const bad=items.filter(i=>l.st[i.st]&&l.st[i.st][0]==="bad").reduce((s,i)=>s+(typeof i.v==="number"?i.v:0),0);
  return `<div class="totals"><span>Показано ${items.length} · <b class="num">${$(sum)}</b></span>${bad?`<span class="bad">${stIc("bad",13)}Проблемы <span class="num">${$(bad)}</span></span>`:""}</div>`;
}
function density(l){
  if(S.density!=="auto")return S.density;
  if(S.device==="desktop")return l.id==="attention"?"rich":"row";
  return l.density;
}

/* ================= СОДЕРЖИМОЕ СПИСКА ================= */
function listBody(l){
  if(S.role==="tech"&&l.techHidden)return emptyHTML("lock","Нет доступа","У роли «мастер» нет денег компании. Попросите директора, если нужно.","");
  if(S.mode==="loading")return `<div class="list">${Array.from({length:4},()=>`<div class="skel"><i class="c"></i><span style="display:flex;flex-direction:column;gap:8px"><i style="width:70%"></i><i style="width:45%"></i><i style="width:85%"></i><i style="width:60%"></i></span><i></i></div>`).join("")}</div>`;
  if(S.mode==="empty")return emptyHTML(l.icon,l.empty[0],l.empty[1],l.cta);
  const items=visible(l);
  if(!items.length)return emptyHTML("search","Ничего не найдено","По этому отбору нет записей.","",true);
  const d=density(l);
  const wrap=S.device==="tablet"?"grid2":"list";
  if(l.people&&S.peopleView&&d!=="row"){
    const by=new Map();items.forEach(i=>{const k=i.who||i.t;if(!by.has(k))by.set(k,[]);by.get(k).push(i)});
    const arr=[...by.entries()].sort((a,b)=>b[1].length-a[1].length);
    return `<div class="${wrap}">${arr.map(([w,its])=>personCard(w,its)).join("")}</div>`;
  }
  if(d==="row")return rowsHTML(l,items);
  let html="",idx=0;
  for(const [g,its] of groups(l,items)){html+=secHead(l,g,its)+its.map(i=>card(l,i,d,idx++)).join("")}
  return totals(l,items)+`<div class="${wrap}">${html}</div>`;
}
function emptyHTML(icon,title,hint,cta,reset){
  return `<div class="empty"><span class="big">${ic(icon,24)}</span><h4>${esc(title)}</h4><p>${esc(hint)}</p>${cta?`<button class="btn acc" data-new>${ic("plus",16)}${esc(cta)}</button>`:""}${reset?`<button class="btn" data-reset>Сбросить отбор</button>`:""}</div>`;
}
function rowsHTML(l,items){
  const keys=S.pane&&S.sel?l.cols.slice(0,1):l.cols;
  const showV=items.some(i=>i.v!=null&&i.v!=="")&&!noMoney(l);
  const cols=`22px 28px minmax(170px,1.2fr) ${keys.map(()=>"minmax(120px,1fr)").join(" ")} ${showV?"110px":""} 64px`;
  let arr=items.slice();

  const title=l.arch==="E"?"Что":l.id==="properties"?"Адрес":l.id==="catalog"?"Позиция":["suppliers","pos","subs"].includes(l.id)?"Компания":l.id==="expenses"?"Где":"Клиент";
  const h=`<div class="rowh" style="--cols:${cols}"><span></span><span></span><button data-sort="t">${title}${ic("sort",12)}</button>${keys.map(k=>`<span>${F[k][1]}</span>`).join("")}${showV?`<button class="r" data-sort="v">${l.val||"Сумма"}${ic("sort",12)}</button>`:""}<span></span></div>`;
  const rows=arr.map((it,idx)=>{
    const picked=S.picked.has(it.id);
    const quick=[it.f.phone?`<button class="btn ic" data-contact="Позвонить" data-val="${esc(it.f.phone)}" aria-label="Позвонить" title="Позвонить: ${esc(it.f.phone)}">${ic("phone",14)}</button>`:"",it.f.addr?`<button class="btn ic" data-contact="Карта и маршрут" data-val="${esc(it.f.addr)}" aria-label="Карта" title="Карта: ${esc(it.f.addr)}">${ic("map",14)}</button>`:""].join("");
    return `<div class="row" role="button" tabindex="0" style="--cols:${cols}" data-open="${it.id}" aria-selected="${S.sel===it.id}">${edgeHTML(l,it)}<span class="pick ${picked?"on":""}" data-pick="${it.id}" role="checkbox" aria-checked="${picked}" aria-label="Выбрать">${picked?ic("check",14):""}</span><span class="lead">${lead(l,it,"compact")}</span><span class="c tt"><b>${esc(it.t)}</b>${it.n?`<span class="n">${esc(it.n)}</span>`:""}${it.st?`<span class="tags" style="margin-top:4px">${chipHTML(l,it,true)}</span>`:""}</span>${keys.map((k,j)=>`<span class="c mm">${j===0&&S.mode==="offline"&&idx<2?`${ic("cloud",13)} `:""}${esc(it.f[k]||"—")}</span>`).join("")}${showV?`<span class="c r side">${valHTML(l,it)}</span>`:""}<span class="c ra">${quick}</span></div>`}).join("");
  return totals(l,arr)+`<div class="rows">${h}${rows}</div>`;
}

  const right=`<span style="display:flex;gap:8px;align-items:center">${S.selecting?`<button class="btn" data-selmode>Готово</button>`:`<button class="btn" data-selmode>Выбрать</button>`}${l.cta?`<button class="btn acc ${dev==="phone"?"ic":""}" data-new aria-label="${esc(l.cta)}">${ic("plus",18)}${dev==="phone"?"":esc(l.cta)}</button>`:""}</span>`;
  let h=`<div class="hdr"><span class="ver">OCTODEX v1.0.0 · 52 · Nov 5, 2026</span>`;
  if(isRoot)h+=`<div class="hrow"><span style="display:flex;gap:6px;align-items:center;min-width:0"><h2 class="disp">${esc(sub&&dev==="phone"?(sub[0]==="sales"?"Продажи":"Клиенты"):ttl)}</h2><span class="help" role="button" aria-label="Что это">?</span></span>${right}</div>`;
  else h+=`<div class="hrow"><button class="back">${ic("chevronLeft")}Ещё</button>${right}</div><span class="ver">ЕЩЁ · ${esc(SECTIONS.find(s=>s.lists.includes(l.id)).name.toUpperCase())}</span><span style="display:flex;gap:6px;align-items:center"><h2 class="ttl">${esc(ttl)}</h2><span class="help" role="button" aria-label="Что это">?</span></span>`;
  if(sub&&dev==="phone"){const arr=sub[1];const i=arr.indexOf(l.id);
    h+=`<div class="inseg" data-anim="sub" style="--n:${arr.length};--i:${S.prev.sub??i}" data-to="${i}">${arr.map(id=>`<button data-go="${id}" aria-pressed="${id===l.id}">${L[id].short||L[id].name}</button>`).join("")}</div>`;}
  if(S.mode==="offline")h+=`<span class="offline">${ic("wifiOff",14)}Без сети · 2 в очереди</span>`;
  if(l.people&&density(l)!=="row")h+=`<div class="inseg" data-anim="pv" style="--n:2;--i:${S.prev.pv??(S.peopleView?0:1)}" data-to="${S.peopleView?0:1}"><button data-pv="1" aria-pressed="${S.peopleView}">Люди</button><button data-pv="0" aria-pressed="${!S.peopleView}">Документы</button></div>`;
  h+=`<label class="field">${ic("search",18)}<input id="q-${dev}" type="search" placeholder="Имя, телефон, адрес, номер" value="${esc(S.q)}" aria-label="Поиск"></label>`;
  if(!(S.role==="tech"&&l.techHidden)&&(S.mode==="data"||S.mode==="offline"))h+=filterChips(l);
  return h+`</div>`;
}

   <li><b>Цифры</b> плитками, затем прогресс.</li>
   <li><b>Кнопки внизу всегда в одном порядке:</b> позвонить, SMS, карта, email — потом справа главное действие.</li></ol></section>

  </div>

  <div><h3>Планшет 820</h3><p>Две колонки тех же карточек.</p></div>
  <div><h3>Компьютер 1280</h3><p>Боковое меню · список строками · открытая карточка справа (та же подробная карточка). В строке колонки — те же факты, текст переносится, справа кнопки «позвонить» и «карта».</p></div>
  <div><h3>Роль «мастер»</h3><p>Сумм и плиток с деньгами нет; денежные списки закрыты «Нет доступа». Контакты и адреса видны.</p></div></div></section>
  <section><h2>Все списки: что на карточке</h2><div class="tblw"><table><thead><tr><th>Список</th><th>Рецепт</th><th>Шапка<br>(имя / номер)</th><th>Строки фактов</th><th>Цифры</th><th>Статусы</th><th>Кнопки</th><th>Размер</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
   <p class="mut">Таблица собрана из тех же данных, что и прототип. Статусы с «N дн» вычисляются из дат и не хранятся в базе; маржа каталога сравнивается с нормой компании (35%, настройка смет).</p></section>
  <section><h2>Решения на ваш выбор</h2><ol class="q-list">
   <li><span><b>Подробная карточка по умолчанию</b> почти во всех списках. Список длиннее, зато открывать карточку нужно реже. Уведомления — «обычная».</span></li>
   <li><span><b>Значки вместо подписей.</b> Новые значки (рупор, планшет запроса, ящик инструментов, человек с галочкой, ключ, щит, глаз, решётка номера, часы с историей) нужно добавить в дизайн-систему.</span></li>
   <li><span><b>Компьютер — строками с переносом текста</b> и открытой подробной карточкой справа.</span></li>
   <li><span><b>Каталог:</b> себестоимость включает налог при покупке; маржа ниже нормы компании — оранжевый статус.</span></li>
   <li><span><b>Мастер не видит денег</b>, но видит адреса, телефоны и кнопки связи.</span></li></ol></section>
  </div>`;
}

/* ================= ПАНЕЛЬ УПРАВЛЕНИЯ ================= */
const CTL=[
 ["view","Вид",[["proto","Прототип"],["spec","Спецификация"]]],
 ["device","Устройство",[["phone","Телефон"],["tablet","Планшет"],["desktop","Компьютер"]]],
 ["theme","Тема",[["dark","Тёмная"],["light","Светлая"]]],
 ["density","Размер карточки",[["auto","Авто"],["compact","Компакт"],["regular","Обычная"],["rich","Подробная"]]],
 ["edge","Кромка",[["alert","Только внимание"],["all","Все статусы"]]],
 ["mode","Состояние",[["data","Данные"],["loading","Загрузка"],["empty","Пусто"],["offline","Без сети"]]],
 ["role","Роль",[["owner","Директор"],["tech","Мастер"]]],
];
function controls(){
  document.getElementById("controls").innerHTML=CTL.filter(([k])=>S.view==="proto"||["view","theme","edge","role"].includes(k)).map(([k,label,opts])=>{
    const cur=k==="theme"?curTheme():S[k];const i=Math.max(0,opts.findIndex(o=>o[0]===cur));
    return `<div class="ctl"><span>${label}</span><div class="seg" data-anim="c-${k}" style="--n:${opts.length};--i:${S.prev["c-"+k]??i}" data-to="${i}" role="group" aria-label="${label}">${opts.map(([v,t])=>`<button data-ctl="${k}" data-v="${v}" aria-pressed="${cur===v}">${t}</button>`).join("")}</div></div>`}).join("");
}

/* ================= ОТРИСОВКА ================= */
function render(keepScroll){
  const sc=document.getElementById("scroller");const top=keepScroll&&sc?sc.scrollTop:0;
  controls();
  const root=document.getElementById("root");
  if(S.view==="spec"){root.innerHTML=spec();animSegs();clip();return}
  const l=L[S.list];
  if(S.device==="desktop"&&!S.sel&&S.pane)S.sel=visible(l)[0]?.id||null;
  const nav=SECTIONS.map(s=>`<div class="grp"><h3>${s.name}</h3>${s.lists.map(id=>`<button data-go="${id}" aria-current="${id===S.list}">${ic(L[id].icon,16)}${L[id].name}<span class="ar">${L[id].arch}</span></button>`).join("")}</div>`).join("");
  const opts=SECTIONS.map(s=>`<optgroup label="${s.name}">${s.lists.map(id=>`<option value="${id}" ${id===S.list?"selected":""}>${L[id].name}</option>`).join("")}</optgroup>`).join("");
  const devHTML=S.device==="phone"?phone(l):S.device==="tablet"?tablet(l):desktop(l);
  root.innerHTML=`<div class="layout"><nav class="nav" aria-label="Все списки">${nav}</nav><div class="stage">
   <div class="stagebar"><div class="what"><b>${l.name} · рецепт ${l.arch} «${ARCH[l.arch].name}»</b><small>Кнопки на карточке работают: позвонить, SMS, карта. Попробуйте размер карточки, отбор, поиск, «Выбрать».</small></div>
   <select class="navsel" id="navsel" aria-label="Список">${opts}</select></div>
   <div class="fit" id="fit"><div class="devwrap" id="devwrap">${devHTML}</div></div></div></div>`;
  fit();animSegs();
  const sc2=document.getElementById("scroller");if(sc2&&top)sc2.scrollTop=top;
  bindSwipe();save();clip();
}
function clip(){document.querySelectorAll('.ft3').forEach(e=>e.classList.toggle('clip',e.scrollHeight>e.clientHeight+1))}
function animSegs(){
  document.querySelectorAll("[data-anim]").forEach(el=>{const k=el.dataset.anim,to=el.dataset.to;S.prev[k]=+to;requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.setProperty("--i",to)))});
}
function fit(){
  const f=document.getElementById("fit"),w=document.getElementById("devwrap"),d=document.getElementById("dev");if(!f||!d)return;
  const s=Math.min(1,f.clientWidth/d.offsetWidth);w.style.transform=`scale(${s})`;f.style.height=(d.offsetHeight*s)+"px";
  w.style.left=s<1?"0":Math.max(0,(f.clientWidth-d.offsetWidth*s)/2)+"px";
}
addEventListener("resize",fit);

let toastT;
function toast(text,undo){
  const t=document.getElementById("toast");if(!t)return;clearTimeout(toastT);
  t.innerHTML=`<div class="toast" role="status"><span>${esc(text)}</span>${undo?`<button data-undo><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="2"/><circle class="ringc" cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-90 8 8)"/></svg>Отменить</button>`:""}</div>`;
  toastT=setTimeout(()=>{t.innerHTML=""},undo?5000:2400);
  if(undo)t.querySelector("[data-undo]").onclick=e=>{e.stopPropagation();undo();t.innerHTML="";};
}
function find(id){for(const l of Object.values(L)){const i=l.items.find(x=>x.id===id);if(i)return [l,i]}return []}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-closesheet],[data-opt],[data-stsel],[data-trsel],[data-ctl],[data-go],[data-filter],[data-contact],[data-act],[data-chk],[data-pick],[data-open],[data-selmode],[data-bulk],[data-new],[data-reset],[data-pv],[data-sort],[data-closepane]");
  if(!b)return;const D=b.dataset;
  if(D.closesheet!==undefined){if(e.target!==b&&!e.target.closest("button[data-closesheet]"))return;S.sheet=null;render(true);return}
  if(D.stsel||D.trsel){e.stopPropagation();S.sheet={kind:D.stsel?"st":"tr",id:D.stsel||D.trsel};render(true);return}
  if(D.opt!==undefined){e.stopPropagation();const [l,it]=find(S.sheet.id);const k=S.sheet.kind==="st"?"st":"trade";const old=it[k];
    it[k]=D.opt;S.sheet=null;render(true);
    const label=k==="st"?l.st[D.opt][1]:D.opt;toast(`${k==="st"?"Статус":"Направление"}: ${label}`,()=>{it[k]=old;render(true)});return}
  if(D.ctl){const k=D.ctl,v=D.v;
    if(k==="theme"){S.theme=v;document.documentElement.setAttribute("data-theme",v)}else S[k]=v;
    if(k==="device"){S.selecting=false;S.picked.clear()}
    render(k!=="device"&&k!=="view");return}
  if(D.go){S.sheet=null;S.list=D.go;S.filter="all";S.q="";S.sel=null;S.sort=null;S.selecting=false;S.picked.clear();render();return}
  if(D.filter){S.filter=D.filter;S.sel=null;render(true);return}
  if(D.contact){e.stopPropagation();toast(`${D.contact}: ${D.val}`);return}
  if(D.reset!==undefined){S.filter="all";S.q="";render();return}
  if(D.pv){S.peopleView=D.pv==="1";render(true);return}
  if(D.sort){S.sort=S.sort===D.sort?null:D.sort;render(true);return}
  if(D.closepane!==undefined){S.pane=false;S.sel=null;render(true);return}
  if(D.chk){e.stopPropagation();const had=S.checked.has(D.chk);had?S.checked.delete(D.chk):S.checked.add(D.chk);render(true);toast(had?"Задача снова открыта":"Задача выполнена",()=>{had?S.checked.add(D.chk):S.checked.delete(D.chk);render(true)});return}
  if(D.pick){e.stopPropagation();S.picked.has(D.pick)?S.picked.delete(D.pick):S.picked.add(D.pick);render(true);return}
  if(D.selmode!==undefined){S.selecting=!S.selecting;S.picked.clear();render(true);return}
  if(D.bulk!==undefined){const n=S.picked.size,l=L[S.list];S.selecting=false;S.picked.clear();render(true);toast(`${l.swR[1]}: ${n} — поставлено в очередь`,()=>toast("Отменено"));return}
  if(D.new!==undefined){toast(`Открылась бы форма «${L[S.list].cta||"Новый"}»`);return}
  if(D.act){e.stopPropagation();const [l,it]=find(D.act);if(!it)return;toast(`${it.act}: ${it.who||it.t}`,()=>toast("Отменено"));return}
  if(D.open){
    if(S.selecting||(S.device==="desktop"&&S.picked.size)){S.picked.has(D.open)?S.picked.delete(D.open):S.picked.add(D.open);render(true);return}
    if(S.device==="desktop"){if(e.target.closest(".dpane"))return;S.sel=D.open;S.pane=true;render(true);return}
    const [l,it]=find(D.open);toast(`Открылась бы карточка: ${it.t}`);return}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-open]")){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{if(e.target.matches("input[type=search]")){S.q=e.target.value;S.sel=null;const id=e.target.id,pos=e.target.selectionStart;render(true);const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener("change",e=>{if(e.target.id==="navsel"){S.list=e.target.value;S.filter="all";S.q="";S.sel=null;render()}});

/* свайп карточки на телефоне: вправо — прямое действие, влево — отложить */
function bindSwipe(){
  document.querySelectorAll("[data-sw]").forEach(w=>{
    const c=w.querySelector(".card");let x0=null,dx=0,moved=false;
    w.addEventListener("pointerdown",e=>{if(e.target.closest("button,[data-chk]"))return;x0=e.clientX;dx=0;moved=false});
    w.addEventListener("pointermove",e=>{if(x0===null)return;dx=Math.max(-96,Math.min(96,e.clientX-x0));if(Math.abs(dx)>8){moved=true;w.classList.add("dragging");c.style.transition="none";c.style.transform=`translateX(${dx}px)`}});
    const end=()=>{if(x0===null)return;x0=null;c.style.transition="";c.style.transform="";w.classList.remove("dragging");
      if(moved){const l=L[S.list];const it=l.items.find(i=>i.id===w.dataset.sw);const a=dx>60?l.swR[1]:dx<-60?l.swL[1]:null;
        if(a)toast(`${a}: ${it.who||it.t}`,()=>toast("Отменено"));
        w.addEventListener("click",ev=>{ev.stopPropagation()},{capture:true,once:true});}};
    w.addEventListener("pointerup",end);w.addEventListener("pointercancel",end);w.addEventListener("pointerleave",end);
  });
}
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(!S.theme)render(true)});
render();

</script>
