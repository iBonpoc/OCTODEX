<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gutters prices and settings</title>
<!-- Прототип спеки 57 (#1914 «Цены и прайс», #1919 настройки Gutters из вкладки). Этап 0, 390, светлая тема.
     Значения — токены «Наряда» (как docs/prototypes/gutters-windows): кнопки 36 / зона 44, строки 44, радиусы card 16 / field 12,
     шрифт 15/13/11.5, один акцент acc — главное действие. Цвет — только статус (значок + слово).
     ?f=tab|hub|prices|prices-menu|item|item-unit|offer|offer-sheet|rules — один экран (для снимков); без f — все «было → станет».
     Цены в прототипе — ТЕСТОВЫЕ (правило 9). -->
<style>
:root{--page:#DDD9D2;--bg:#EFEBE5;--ink:#15161A;--mut:#575C68;--surf:rgba(255,255,255,.62);--surf2:rgba(255,255,255,.85);--solid:#F9F7F5;--bd:rgba(20,22,30,.1);--bdField:rgba(20,22,30,.5);--track:rgba(20,22,30,.09);--acc:#FBFF00;--onacc:#0B0C0F;--scrim:rgba(20,22,30,.25);--warnT:#944600;--okT:#176428;--infoT:#3647C4;--badT:#B4232A;--sh:0 1px 3px rgba(60,50,40,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Onest,-apple-system,"SF Pro Text",system-ui,sans-serif;background:var(--page);color:var(--ink);font-size:15px;line-height:1.35}
.wall{display:flex;flex-direction:column;gap:40px;padding:24px}
.pair{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.pair h3{width:100%;font-size:17px}
.cap{font-size:13px;color:var(--mut);margin:6px 2px;max-width:390px}
.bef img{width:390px;border-radius:24px;display:block;box-shadow:var(--sh)}
.scr{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);border-radius:24px}
.single .scr{border-radius:0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{padding:14px 16px 0;font-size:13px;color:var(--mut)}
.hd{display:flex;align-items:center;gap:8px;padding:10px 16px 4px}
.hd h1{font-size:34px;font-weight:700;flex:1;letter-spacing:-.01em}
.hd h2{font-size:22px;font-weight:700;flex:1}
.back{display:flex;align-items:center;gap:4px;padding:8px 12px 0;font-size:17px}
.sub{padding:0 16px;color:var(--mut);font-size:15px}
.b36{height:36px;min-width:36px;border-radius:18px;background:var(--surf2);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:15px;font-weight:600;color:var(--ink)}
.b36.round{padding:0;width:36px}
.b36.acc{background:var(--acc);color:var(--onacc);border-color:transparent}
.stub{position:relative;outline:2px dashed var(--infoT);outline-offset:3px;border-radius:20px}
.stubnote{position:absolute;right:12px;top:112px;background:var(--solid);border:1px dashed var(--infoT);color:var(--infoT);font-size:11.5px;font-weight:600;border-radius:8px;padding:4px 8px;z-index:3}
.body{padding:12px 16px 120px;display:flex;flex-direction:column;gap:16px}
.grp{background:var(--surf2);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 14px;font-size:15px}
.row+.row{border-top:1px solid var(--bd)}
.row .k{flex:1}
.row .k small{display:block;font-size:13px;color:var(--mut)}
.row .v{color:var(--mut);display:flex;align-items:center;gap:4px;text-align:right}
.tile{width:30px;height:30px;border-radius:8px;background:var(--track);display:flex;align-items:center;justify-content:center;flex:none}
.lbl{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:0 4px -8px;display:flex;gap:6px;align-items:center}
.lbl .n{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.qm{width:18px;height:18px;border-radius:9px;border:1px solid var(--bd);background:var(--surf2);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--ink);font-weight:700}
.st{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.st.warn{color:var(--warnT)}.st.ok{color:var(--okT)}.st.info{color:var(--infoT)}
.st .ic{width:14px;height:14px}
.banner{border-radius:16px;border:1px solid var(--bd);background:var(--surf2);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.banner .t{font-weight:600}.banner .m{font-size:13px;color:var(--mut);margin-top:2px}
.banner .b36{margin-top:8px}
.fbar{display:flex;gap:8px;overflow:hidden;padding:2px 16px 4px;white-space:nowrap}
.fchip{height:36px;border-radius:18px;background:var(--surf2);border:1px solid var(--bd);display:inline-flex;align-items:center;gap:4px;padding:0 10px 0 12px;font-size:15px;font-weight:600;flex:none}
.fchip .ic{width:16px;height:16px}
.fchip.on{box-shadow:var(--sh)}
.lc{background:var(--surf2);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:56px}
.lc .k{flex:1;font-weight:600}
.lc .k small{display:block;font-weight:400;font-size:13px;color:var(--mut)}
.lc .v{font-weight:600;text-align:right;white-space:nowrap}
.lc .v small{display:block;font-weight:400}
.list{display:flex;flex-direction:column;gap:8px}
.tabs{position:absolute;left:16px;right:16px;bottom:16px;height:64px;border-radius:32px;background:var(--solid);border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-around;font-size:11.5px;color:var(--mut)}
.tabs span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:24px}
.tabs span.on{background:var(--surf2);box-shadow:var(--sh);color:var(--ink);font-weight:600}
.empty{margin:12px 16px;background:var(--surf2);border:1px solid var(--bd);border-radius:24px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.menu{position:absolute;background:var(--solid);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);border:1px solid var(--bd);min-width:220px;overflow:hidden;z-index:5}
.menu .mi{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;font-size:15px}
.menu .mi+.mi{border-top:1px solid var(--bd)}
.menu .mi .ck{width:16px}
.menu .hdm{font-size:13px;color:var(--mut);padding:8px 14px 4px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--solid);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.15);z-index:4}
.grab{width:36px;height:4px;border-radius:2px;background:var(--track);margin:8px auto 0}
.shd{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
.shd h2{font-size:20px;font-weight:700;flex:1}
.shd h2 small{display:block;font-size:13px;color:var(--mut);font-weight:500}
.sbody{padding:4px 16px 34px;display:flex;flex-direction:column;gap:14px}
.inp{height:44px;border-radius:12px;border:1px solid var(--bdField);background:var(--surf);display:flex;align-items:center;padding:0 12px;gap:8px;font-size:17px}
.inp .u{margin-left:auto;color:var(--mut);font-size:15px}
.sel{display:flex;align-items:center;gap:4px;color:var(--mut)}
.sel b{color:var(--ink);font-weight:500}
.tog{width:42px;height:24px;border-radius:12px;background:var(--track);position:relative;flex:none}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:10px;background:var(--solid);box-shadow:var(--sh)}
.tog.on{background:var(--acc)}.tog.on::after{left:20px;background:var(--onacc)}
.note{font-size:13px;color:var(--mut);margin:0 4px}
.foot{display:flex;gap:8px}
.btnw{flex:1;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;background:var(--surf2);border:1px solid var(--bd)}
.btnw.acc{background:var(--acc);color:var(--onacc);border:0}
.search{height:36px;border-radius:12px;background:var(--track);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--mut);font-size:15px;margin:0 16px}
</style></head>

<div id="root"></div>
<script>
const PAIRS = [
  { h: "1. Вкладка Gutters — вход в настройки", before: ["before-tab-1.png", "before-modules.png"], after: "tab",
    cap: "Было: настроек во вкладке нет, путь — «Ещё → Компания → Модули». Станет: один вход в шапке вкладки. Место и значок — по правилу #1920 (Экраны №9); здесь заглушка." },
  { h: "2. Настройки Gutters — оглавление", before: ["before-settings-1.png", "before-settings-2.png"], after: "hub",
    cap: "Было: одна длинная страница, 8 групп. Станет: оглавление как «Настройки» iPhone; первая строка — «Цены и прайс» с итогом." },
  { h: "3. Цены и прайс — выбор системы", before: ["before-prices-1.png", "before-prices-3.png"], after: "prices",
    cap: "Было: одна система (пробный замер), строка на цвет. Станет: система сверху (3 меню в одну строку), «Нет цены: N» у раздела, одна строка на деталь." },
  { h: "4. Меню системы", before: [], after: "prices-menu", cap: "Меню, не чипы (спека 56, стр. 4). Значения — только из «Что ставим»." },
  { h: "5. Позиция и единица", before: [], after: "item", cap: "Шторка цены: единица — меню, только у деталей, которые модуль умеет считать иначе." },
  { h: "6. Смена единицы extension → фут", before: [], after: "item-unit", cap: "Единица меняет расчёт: приложение спрашивает цену за фут, создаёт позицию «за фут», старую не трогает." },
  { h: "7. Что ставим", before: ["before-settings-3.png", "before-settings-4.png"], after: "offer", cap: "Было: 16 рядов чипов. Станет: строки-итоги, выбор — в шторке с галочками." },
  { h: "8. Выбор нескольких", before: [], after: "offer-sheet", cap: "Шторка с галочками справа (спека 56, стр. 7)." },
  { h: "9. Правила расчёта", before: ["before-settings-6.png", "before-settings-7.png"], after: "rules", cap: "Одно значение — меню у строки; да/нет — переключатель в строке." },
];
const f = new URLSearchParams(location.search).get("f");
const root = document.getElementById("root");
const frame = (id) => document.getElementById("t-" + id).content.cloneNode(true);
if (f) { document.body.classList.add("single"); document.body.style.background = "var(--bg)"; root.appendChild(frame(f)); }
else {
  const wall = document.createElement("div"); wall.className = "wall";
  for (const p of PAIRS) {
    const d = document.createElement("div"); d.className = "pair";
    d.innerHTML = `<h3>${p.h}</h3>` + p.before.map((b) => `<div class="bef"><div class="cap">Было</div><img src="before/${b}" alt="было"></div>`).join("");
    const a = document.createElement("div"); a.innerHTML = `<div class="cap">Станет</div>`; a.appendChild(frame(p.after));
    d.appendChild(a);
    const c = document.createElement("div"); c.className = "cap"; c.style.width = "100%"; c.textContent = p.cap; d.appendChild(c);
    wall.appendChild(d);
  }
  root.appendChild(wall);
}
</script>
