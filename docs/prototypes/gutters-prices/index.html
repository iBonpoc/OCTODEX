<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gutters prices and settings</title>
<!-- Прототип спеки 57 (#1914 «Цены и прайс», #1919 настройки Gutters из вкладки), ред. 2 — по ревью дизайна 16.11.
     Значения — токены «Наряда» (как docs/prototypes/gutters-windows): кнопки 36 / зона 44, строки и поля 44, радиусы card 16 /
     field 12, шрифт 15/13/11.5, один акцент acc — главное действие; цвет — только статус (значок + слово).
     ?f=<кадр>&t=light|dark — один кадр (для снимков); без f — все «было → станет». Кадры: tab hub prices system missing
     search transition item unit offer offer-sheet rules prices-1280. Цены — ТЕСТОВЫЕ (правило 9). -->
<style>
:root,[data-t=light]{--page:#DDD9D2;--bg:#EFEBE5;--ink:#15161A;--mut:#575C68;--surf:rgba(255,255,255,.62);--surf2:rgba(255,255,255,.85);--solid:#F9F7F5;--bd:rgba(20,22,30,.1);--bdField:rgba(20,22,30,.5);--track:rgba(20,22,30,.09);--acc:#FBFF00;--onacc:#0B0C0F;--scrim:rgba(20,22,30,.25);--warnT:#944600;--warnF:rgba(240,140,30,.55);--okT:#176428;--infoT:#3647C4;--badT:#B4232A;--sh:0 1px 3px rgba(60,50,40,.12)}
[data-t=dark]{--page:#111214;--bg:#24272D;--ink:#F2F3F5;--mut:#CDD1DA;--surf:rgba(255,255,255,.07);--surf2:rgba(255,255,255,.11);--solid:#33363C;--bd:rgba(255,255,255,.14);--bdField:rgba(255,255,255,.5);--track:rgba(255,255,255,.14);--acc:#FBFF00;--onacc:#0B0C0F;--scrim:rgba(0,0,0,.5);--warnT:#FFB86B;--warnF:rgba(255,170,80,.6);--okT:#7EE29A;--infoT:#AAB6FF;--badT:#FF8A8F;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Onest,-apple-system,"SF Pro Text",system-ui,sans-serif;background:var(--page);color:var(--ink);font-size:15px;line-height:1.35}
.wall{display:flex;flex-direction:column;gap:40px;padding:24px}
.pair{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.pair h3{width:100%;font-size:17px}
.cap{font-size:13px;color:var(--mut);margin:6px 2px;max-width:390px}
.bef img{width:390px;border-radius:24px;display:block;box-shadow:var(--sh)}
.scr{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);border-radius:24px}
.scr.w1280{width:1280px;height:800px}
.single .scr{border-radius:0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px}
.top{padding:14px 16px 0;font-size:13px;color:var(--mut)}
.hd{display:flex;align-items:center;gap:8px;padding:10px 16px 4px}
.hd h1{font-size:34px;font-weight:700;letter-spacing:-.01em}
.hd h2{font-size:22px;font-weight:700}
.hd .sp{flex:1}
.back{display:flex;align-items:center;gap:4px;padding:8px 12px 0;font-size:17px}
.sub{padding:0 16px;color:var(--mut);font-size:15px}
.b36{height:36px;min-width:36px;border-radius:18px;background:var(--surf2);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap}
.b36.round{padding:0;width:36px}
.b36.acc{background:var(--acc);color:var(--onacc);border-color:transparent}
.qm{width:22px;height:22px;border-radius:11px;border:1px solid var(--bd);background:var(--surf2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.stub{position:relative;outline:2px dashed var(--infoT);outline-offset:3px;border-radius:20px}
.stubnote{position:absolute;right:12px;top:112px;background:var(--solid);border:1px dashed var(--infoT);color:var(--infoT);font-size:11.5px;font-weight:600;border-radius:8px;padding:4px 8px;z-index:3}
.body{padding:12px 16px 120px;display:flex;flex-direction:column;gap:12px}
.grp{background:var(--surf2);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 14px;font-size:15px}
.row+.row{border-top:1px solid var(--bd)}
.row .k{flex:1;min-width:0}
.row .k small{display:block;font-size:13px;color:var(--mut)}
.row .v{color:var(--mut);display:flex;align-items:center;gap:4px;text-align:right;white-space:nowrap}
.tile{width:30px;height:30px;border-radius:8px;background:var(--track);display:flex;align-items:center;justify-content:center;flex:none}
.sect{font-size:17px;font-weight:600;margin:6px 2px -4px;display:flex;gap:8px;align-items:center}
.sect .n{margin-left:auto}
.st{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.st.warn{color:var(--warnT)}.st.ok{color:var(--okT)}.st.info{color:var(--infoT)}
.banner{border-radius:16px;border:1px solid var(--bd);background:var(--surf2);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{border-color:var(--warnF)}
.banner .t{font-weight:600}.banner .m{font-size:13px;color:var(--mut);margin-top:2px}
.banner .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sysrow{margin:4px 16px 0;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--surf2);display:flex;align-items:center;gap:8px;padding:0 12px}
.sysrow .k{color:var(--mut);font-size:13px}
.sysrow .v{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar{display:flex;gap:8px;padding:8px 16px 0;white-space:nowrap}
.fchip{white-space:nowrap;flex:none;height:32px;border-radius:16px;border:1px solid var(--bd);display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;font-weight:600;color:var(--mut)}
.fchip.on{background:var(--surf2);box-shadow:var(--sh);color:var(--ink)}
.lc{background:var(--surf2);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:56px}
.lc .k{flex:1;font-weight:600;min-width:0}
.lc .k small{display:block;font-weight:400;font-size:13px;color:var(--mut)}
.lc .v{font-weight:600;text-align:right;white-space:nowrap}
.lc .v .u{font-weight:400;color:var(--mut)}
.lc.sel{box-shadow:inset 3px 0 0 var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.tabs{position:absolute;left:16px;right:16px;bottom:16px;height:64px;border-radius:32px;background:var(--solid);border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-around;font-size:11.5px;color:var(--mut)}
.tabs span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:24px}
.tabs span.on{background:var(--surf2);box-shadow:var(--sh);color:var(--ink);font-weight:600}
.empty{margin:12px 16px;background:var(--surf2);border:1px solid var(--bd);border-radius:24px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:3}
.menu{position:absolute;background:var(--solid);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);border:1px solid var(--bd);min-width:220px;overflow:hidden;z-index:6}
.menu .mi{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;font-size:15px}
.menu .mi+.mi,.menu .hdm+.mi{border-top:1px solid var(--bd)}
.menu .mi .ck{width:16px}
.menu .mi .r{margin-left:auto}
.menu .hdm{font-size:13px;color:var(--mut);padding:8px 14px 6px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--solid);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);z-index:4}
.panel{position:absolute;right:0;top:0;bottom:0;width:444px;background:var(--solid);border-left:1px solid var(--bd);z-index:2}
.grab{width:36px;height:4px;border-radius:2px;background:var(--track);margin:8px auto 0}
.shd{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
.shd h2{font-size:20px;font-weight:700;flex:1}
.shd h2 small{display:block;font-size:13px;color:var(--mut);font-weight:500}
.sbody{padding:4px 16px 34px;display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label{font-size:13px;color:var(--mut);margin-left:2px}
.inp{height:44px;border-radius:12px;border:1px solid var(--bdField);display:flex;align-items:center;padding:0 12px;gap:8px;font-size:17px}
.inp .u{margin-left:auto;color:var(--mut);font-size:15px}
.inp.sel{justify-content:space-between}
.inp.sel span{color:var(--mut);display:flex;align-items:center;gap:4px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px;font-size:15px}
.total b{font-size:20px}
.stp{display:flex;align-items:center;gap:6px}
.stp b{width:36px;height:36px;border-radius:18px;border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;font-weight:500}
.stp span{min-width:56px;text-align:center;color:var(--mut)}
.tog{width:42px;height:24px;border-radius:12px;background:var(--track);position:relative;flex:none}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:9px;background:var(--solid);box-shadow:var(--sh)}
.tog.on{background:var(--acc)}.tog.on::after{left:21px;background:var(--onacc)}
.note{font-size:13px;color:var(--mut);margin:0 4px}
.btnw{height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;background:var(--surf2);border:1px solid var(--bd)}
.btnw.acc{background:var(--acc);color:var(--onacc);border:0}
.btnw.ghost{background:transparent;border:0}
.search{height:36px;border-radius:12px;background:var(--track);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:15px;margin:4px 16px 0}
.tr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.tr s{color:var(--mut)}
</style></head>

  { h: "13. Тёмная тема", before: [], after: "prices", t: "dark", cap: "Тот же экран в тёмной теме." },
  { h: "14. Цена позиции, тёмная", before: [], after: "item", t: "dark", cap: "" },
  { h: "15. 1280", before: [], after: "prices-1280", cap: "Широкий экран: система — три меню в ряд, позиция — панель справа 444 (DS Б1); открытая карточка — полоса у левого края." },
];
const q = new URLSearchParams(location.search);
const f = q.get("f"), theme = q.get("t") || "light";
const root = document.getElementById("root");
const fill = (node) => { node.querySelectorAll("slot[data-p]").forEach((s) => s.replaceWith(document.getElementById(s.dataset.p).content.cloneNode(true))); return node; };
const frame = (id, t) => { const n = fill(document.getElementById("t-" + id).content.cloneNode(true)); const w = document.createElement("div"); w.setAttribute("data-t", t); w.appendChild(n); return w; };
if (f) { document.body.classList.add("single"); root.appendChild(frame(f, theme)); }
else {
  const wall = document.createElement("div"); wall.className = "wall";
  for (const p of PAIRS) {
    const d = document.createElement("div"); d.className = "pair";
    d.innerHTML = `<h3>${p.h}</h3>` + p.before.map((b) => `<div class="bef"><div class="cap">Было</div><img src="before/${b}" alt="было"></div>`).join("");
    const a = document.createElement("div"); a.innerHTML = `<div class="cap">Станет</div>`; a.appendChild(frame(p.after, p.t || "light"));
    d.appendChild(a);
    if (p.cap) { const c = document.createElement("div"); c.className = "cap"; c.style.width = "100%"; c.textContent = p.cap; d.appendChild(c); }
    wall.appendChild(d);
  }
  root.appendChild(wall);
}
</script>
