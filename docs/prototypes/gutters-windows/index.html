<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gutters windows</title>
<!-- Прототип окон модуля Gutters (этап 0, задание руководителя №13, 16.11). Значения — токены «Наряда» (packages/design-tokens):
     светлая тема, кнопки 36 / зона 44, поля и строки 44, радиусы card 16 / field 12, шрифт 15/13/11.5. ?f=ds|run|corner|canvas|link|draft|tab &t=light|dark -->
<style>
[data-t=light]{--page:#DDD9D2;--bg:#EFEBE5;--ink:#15161A;--mut:#575C68;--surf:rgba(255,255,255,.62);--surf2:rgba(255,255,255,.85);--solid:#F9F7F5;--bd:rgba(20,22,30,.1);--track:rgba(20,22,30,.09);--acc:#FBFF00;--onacc:#0B0C0F;--s1:#0B6290;--s2:#8A4F00;--node:#15161A;--grid:rgba(20,22,30,.05);--grid2:rgba(20,22,30,.1);--scrim:rgba(20,22,30,.25);--warnT:#944600;--okT:#176428;--infoT:#3647C4;--sh:0 1px 3px rgba(60,50,40,.12);--badT:#B4232A}
[data-t=dark]{--page:#181A1E;--bg:#24272D;--ink:#F2F3F5;--mut:#CDD1DA;--surf:rgba(255,255,255,.07);--surf2:rgba(255,255,255,.11);--solid:#33363C;--bd:rgba(255,255,255,.14);--track:rgba(255,255,255,.12);--acc:#FBFF00;--onacc:#0B0C0F;--s1:#7FD4FF;--s2:#FFC46B;--node:#F2F3F5;--grid:rgba(255,255,255,.06);--grid2:rgba(255,255,255,.11);--scrim:rgba(0,0,0,.42);--warnT:#FFB47E;--okT:#9CF0A8;--infoT:#C2CCFF;--sh:0 1px 3px rgba(0,0,0,.4);--badT:#FFAAAA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Onest,-apple-system,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--ink);width:390px;font-size:15px;line-height:1.35}
.scr{position:relative;width:390px;min-height:844px;overflow:hidden}
svg.cv{position:absolute;left:0;top:0;width:390px;height:844px}
.ic{width:22px;height:22px;flex:none}
/* header of the canvas: every control 36 high, one shape (pill / circle), «Готово» the only accent */
.hdr{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center}
.b36{height:36px;min-width:36px;border-radius:18px;background:var(--surf2);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:15px;font-weight:600;white-space:nowrap;color:var(--ink)}
.b36.round{padding:0;width:36px}
.b36.acc{background:var(--acc);color:var(--onacc);border-color:transparent}
.b36.sec{background:var(--surf2)}
.sp{flex:1}
/* toolbar */
.tb{position:absolute;left:12px;right:12px;bottom:92px;height:60px;border-radius:20px;background:var(--solid);border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-around;font-size:11.5px;color:var(--mut)}
.tb .c{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;padding:4px 6px;border-radius:12px}
.tb .c.on{background:var(--surf2);box-shadow:var(--sh);color:var(--ink);font-weight:600}
.fld{position:absolute;left:12px;bottom:44px;height:36px;display:flex;align-items:center;gap:8px;font-size:13px;background:var(--surf2);border:1px solid var(--bd);border-radius:18px;padding:0 12px}
/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--solid);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheet.static{position:relative;margin-top:96px;margin-bottom:34px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--track);margin:8px auto 0}
.sh{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
.sh h2{font-size:20px;font-weight:700;flex:1}
.sh .sub{font-size:13px;color:var(--mut);font-weight:500}
.body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:16px}
.lbl{font-size:11.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:0 4px 6px}
/* icon tiles (shape / profile / corner kind): on view, one row */
.tiles{display:grid;gap:8px}
.tiles.c4{grid-template-columns:repeat(4,1fr)}.tiles.c5{grid-template-columns:repeat(5,1fr)}.tiles.c2{grid-template-columns:repeat(2,1fr)}
.tile{position:relative;min-height:64px;border-radius:12px;border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;color:var(--mut);text-align:center;padding:6px 2px;line-height:1.15}
.tile svg{width:26px;height:26px}
.tile.on{background:var(--surf2);box-shadow:var(--sh);color:var(--ink);font-weight:600;border-color:var(--bd)}
.tile .chk{position:absolute;right:4px;top:4px;width:14px;height:14px}
/* segmented */
.seg{display:flex;background:var(--track);border-radius:10px;padding:2px;height:36px}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut);border-radius:8px}
.seg span.on{background:var(--surf2);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
/* inset group of rows (iOS settings) */
.grp{background:var(--surf2);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;font-size:15px}
.row+.row{border-top:1px solid var(--bd)}
.row .k{flex:1}
.row .v{color:var(--mut);display:flex;align-items:center;gap:4px}
.row .v svg{width:16px;height:16px}
.row.sub{min-height:52px}
.row .stack{flex:1;display:flex;flex-direction:column}
.row .stack small{font-size:13px;color:var(--mut)}
.stp{display:flex;align-items:center;gap:0}
.stp b{width:36px;height:36px;border-radius:18px;border:1px solid var(--bd);background:var(--surf2);display:flex;align-items:center;justify-content:center;font-weight:500;color:var(--ink);font-size:18px}.stp b.off{color:var(--track);background:transparent}.stp i{font-style:normal;width:56px;text-align:center;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.row.del{color:var(--badT);font-weight:600}.row.del small{color:var(--mut);font-weight:400}
.tb2{position:absolute;left:12px;right:12px;bottom:92px;height:60px;border-radius:24px;background:var(--solid);border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-around}
.tb2 .c{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--ink)}.tb2 .c.on{background:var(--ink);color:var(--bg);box-shadow:var(--sh)}
.tile.h36{flex-direction:row;min-height:44px;gap:8px;font-size:15px}.tile.h36 svg{width:20px;height:20px}
.lc{display:flex;gap:12px;align-items:flex-start}.lc .av{width:40px;height:40px;border-radius:20px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex:none}
.tog{width:44px;height:26px;border-radius:13px;background:var(--track);position:relative}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:11px;background:var(--ink);box-shadow:var(--sh)}.tog.on::after{background:var(--onacc)}
.tog.on{background:var(--acc)}.tog.on::after{left:20px}
.note{font-size:13px;color:var(--mut);margin:6px 4px 0}
.ph{border:1.5px dashed var(--bd);border-radius:12px;padding:12px;font-size:13px;color:var(--mut)}
.foot{padding:8px 16px 28px;border-top:1px solid var(--bd);display:flex;gap:8px}
.btnw{flex:1;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;background:var(--surf2);border:1px solid var(--bd)}
.btnw.acc{background:var(--acc);color:var(--onacc);border:0}
.inp{height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--surf);display:flex;align-items:center;padding:0 12px;gap:8px;font-size:15px}
.inp.focus{border-color:var(--ink);border-width:2px}
.inp .ph2{color:var(--mut)}
table.cut{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.cut th{font-weight:500;color:var(--mut);text-align:right;padding:4px 0}table.cut th:first-child,table.cut td:first-child{text-align:left}
table.cut td{text-align:right;padding:6px 0;border-top:1px solid var(--bd)}
/* list screen */
.top{padding:12px 16px 0}
.crumb{font-size:13px;color:var(--mut);height:24px;display:flex;align-items:center}
.ttl{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.ttl h1{font-size:28px;font-weight:700}
.q{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--mut);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mut)}
.card{background:var(--surf2);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card .t{font-weight:600;display:flex;gap:8px;align-items:center}
.card .t > span:first-child{flex:1}
.card .m{font-size:13px;color:var(--mut)}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;display:inline-flex;gap:4px;align-items:center;border:1px solid var(--bd)}
.secH{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px}
.secH b{font-size:17px}.secH span{font-size:13px;color:var(--mut)}
.tabbar{position:absolute;left:0;right:0;bottom:34px;height:84px;background:var(--solid);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding-top:8px;font-size:10.5px;color:var(--mut)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar .on{color:var(--ink);font-weight:600}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:6px 12px;font-size:11px;color:var(--mut);background:var(--bg);border-top:1px dashed var(--bd)}
.qm{display:inline-flex;width:18px;height:18px;border-radius:9px;border:1.5px solid var(--mut);color:var(--mut);font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-left:6px;vertical-align:middle;flex:none}
.wait{display:inline-block;font-size:11px;font-weight:600;color:var(--infoT);border:1px solid var(--bd);border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:middle;text-transform:none;letter-spacing:0}
.sw{display:flex;gap:10px;overflow:hidden}.sw div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--mut);min-width:52px}
.sw i{width:36px;height:36px;border-radius:18px;border:1px solid var(--bd);display:block;position:relative}.sw .on i{}.sw .on{color:var(--ink);font-weight:600}
.dd{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--bd);background:var(--surf2);font-weight:600;font-size:15px}
.menu{position:absolute;background:var(--solid);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);width:240px;z-index:4;overflow:hidden}
.menu div{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;font-size:15px}.menu div+div{border-top:1px solid var(--bd)}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 14px}.opt+.opt{border-top:1px solid var(--bd)}.opt .stack{flex:1;display:flex;flex-direction:column}.opt small{font-size:13px;color:var(--mut)}
.disabled{opacity:.45}
</style></head>
<body><div class="scr" id="scr"></div>
<script>
const q=new URLSearchParams(location.search),F=q.get('f')||'ds';document.body.dataset.t=q.get('t')||'light';
const C=getComputedStyle(document.body),k=n=>C.getPropertyValue('--'+n).trim();
const P={camera:"M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7",plus:"M12 5v14M5 12h14",search:"M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4",cr:"M9 6l6 6-6 6",cl:"M15 6l-6 6 6 6",cd:"M6 9l6 6 6-6",check:"M5 12.5l4.5 4.5L19 7.5",more:"M6 12m-1.2 0a1.2 1.2 0 1 0 2.4 0a1.2 1.2 0 1 0-2.4 0M12 12m-1.2 0a1.2 1.2 0 1 0 2.4 0a1.2 1.2 0 1 0-2.4 0M18 12m-1.2 0a1.2 1.2 0 1 0 2.4 0a1.2 1.2 0 1 0-2.4 0",close:"M6 6l12 12M18 6L6 18",undo:"M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3",redo:"M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h3",trash:"M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13",link:"M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 10 18.7l1-1",user:"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0",users:"M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20M10 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.3M15.5 4.2a3.5 3.5 0 0 1 0 6.6",note:"M8 4h8v3H8zM6 5.5a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1M9 12h6M9 16h4",home:"M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10",pencil:"M4 20l1-4L16 5a2 2 0 0 1 3 3L8 19z",
dsRect:"M5 7h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z",dsRectRibbed:"M5 7h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zM8 7v2.5M12 7v2.5M16 7v2.5M8 17v-2.5M12 17v-2.5M16 17v-2.5",dsRound:"M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z",dsRoundRibbed:"M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 4v2.6M12 20v-2.6M4 12h2.6M20 12h-2.6M6.3 6.3l1.9 1.9M17.7 17.7l-1.9-1.9M17.7 6.3l-1.9 1.9M6.3 17.7l1.9-1.9",
xsK:"M6 4v13a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V9.5c0-1.4-1-2.2-2.4-2.2H13",xsHalf:"M4 8a8 8 0 0 0 16 0M3 8h3M18 8h3",xsFascia:"M6 4v13.5a2.5 2.5 0 0 0 2.5 2.5H18V8.5h-3",xsBox:"M5 5v13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5",xsEuro:"M4 8c0 6 3 10 8 10s8-4 8-10",
down:"M12 3v15M6 12l6 6 6-6",chain:"M9 3h6a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM12 10v4M9 14h6a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2z",toGut:"M4 5v7h12M12 8l4 4-4 4M17 18h4",cornerOut:"M12 3l9 9-9 9-9-9z",cornerIn:"M12 3l9 9-9 9-9-9zM12 11l1 1-1 1-1-1z"};
const ic=(n,s=22,col='currentColor',sw=1.75)=>`<svg class="ic" style="width:${s}px;height:${s}px" viewBox="0 0 24 24"><path d="${P[n]}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const chk=`<svg class="chk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="${k('ink')}"/><path d="${P.check}" fill="none" stroke="${k('bg')}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const tile=(icon,label,on,cls='')=>`<div class="tile ${cls} ${on?'on':''}">${ic(icon,26)}<span>${label}</span>${on?chk:''}</div>`;
const row=(key,val,opts={})=>`<div class="row ${opts.sub?'sub':''}">${opts.icon?ic(opts.icon,20,k('mut')):''}${opts.sub?`<div class="stack"><span>${key}</span><small>${opts.sub}</small></div>`:`<span class="k">${key}</span>`}${opts.ctrl??`<span class="v">${val}${ic('cr',16)}</span>`}</div>`;
const qm='<span class="qm">?</span>',wait='<span class="wait">ждёт ресёрча</span>';
const fin=(v,u,w=88)=>`<div class="inp" style="width:${w}px;justify-content:space-between"><span>${v}</span><span style="color:var(--mut)">${u}</span></div>`;
const frac=on=>`<div style="display:flex;gap:6px;margin-top:8px">${['0','⅛','¼','⅜','½','⅝','¾','⅞'].map(x=>`<span class="chip" style="height:32px;min-width:34px;justify-content:center;font-size:15px;${x===on?'background:var(--surf2);box-shadow:var(--sh);color:var(--ink)':'color:var(--mut)'}">${x}</span>`).join('')}</div>`;
const dd=v=>`<span class="dd">${v}${ic('cd',14)}</span>`;
const stp=n=>`<span class="stp"><b class="${n?'':'off'}">−</b><i>${n}</i><b>+</b></span>`;
const seg=(items,on)=>`<div class="seg">${items.map((x,i)=>`<span class="${i===on?'on':''}">${x}</span>`).join('')}</div>`;
let grid='';for(let x=0;x<390;x+=24)grid+=`<line x1="${x}" y1="0" x2="${x}" y2="844" stroke="${x%96?k('grid'):k('grid2')}"/>`;for(let y=0;y<844;y+=24)grid+=`<line x1="0" y1="${y}" x2="390" y2="${y}" stroke="${y%96?k('grid'):k('grid2')}"/>`;
const runL=(a,b,col=k('s1'),len,sel)=>{let s='';if(sel)s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${k('ink')}" stroke-width="12" stroke-linecap="round"/><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${k('bg')}" stroke-width="8" stroke-linecap="round"/>`;s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="${sel?6:4}" stroke-linecap="round"/>`;for(const p of [a,b])s+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${k('bg')}" stroke="${k('node')}" stroke-width="2"/>`;if(len){const v=Math.abs(b[0]-a[0])<2;s+=`<text x="${v?a[0]+12:(a[0]+b[0])/2}" y="${v?(a[1]+b[1])/2:a[1]-12}" font-size="12" font-weight="600" fill="${k('ink')}" text-anchor="${v?'start':'middle'}">${len}</text>`;}return s;};
const dsM=(p,n)=>`<rect x="${p[0]-15}" y="${p[1]-10}" width="30" height="20" rx="3" fill="${k('s1')}" stroke="${k('bg')}" stroke-width="2"/><text x="${p[0]}" y="${p[1]+4}" font-size="11" font-weight="700" fill="${k('bg')}" text-anchor="middle">D${n}</text>`;
const canvas=(extra='')=>`<svg class="cv" viewBox="0 0 390 844">${grid}${runL([40,300],[300,300],k('s1'),"21′ 8″",F==='run')}${runL([300,300],[300,470],k('s1'),"14′ 2″")}${dsM([300,430],1)}${extra}</svg>`;
const hdr=`<div class="hdr"><span class="b36 round">${ic('cl',20)}</span><span class="b36">${ic('link',18)}Привязать</span><span class="b36 round">${ic('camera',20)}</span><span class="b36 round">${ic('more',20)}</span><span class="sp"></span><span class="b36 acc">Готово</span></div>`;
const toolbar=(on)=>`<div class="tb"><div class="c ${on==='line'?'on':''}">${ic('xsK')}Желоб</div><div class="c ${on==='ds'?'on':''}">${ic('dsRect')}Водосток</div><div class="c"><span style="font-size:13px;font-weight:700;border:2px solid ${k('s1')};border-radius:10px;padding:0 6px">Эт 1</span>Этаж</div><div class="c">${ic('undo')}Назад</div><div class="c">${ic('redo')}Вперёд</div><div class="c">${ic('trash')}Удалить</div></div>`;
const field=`<div class="fld">${ic('dsRect',18)}<b>Водостоков 1</b><span style="color:var(--mut)">· 35′ 10″ желоба</span></div>`;
const cap=t=>`<div class="cap">${t}</div>`;
const sheet=(title,sub,body,foot='')=>`<div class="sheet static"><div class="grab"></div><div class="sh"><h2>${title}${sub?` <span class="sub">${sub}</span>`:''}</h2><span class="b36 round">${ic('close',18)}</span></div><div class="body">${body}</div>${foot}</div>`;
let H='';
