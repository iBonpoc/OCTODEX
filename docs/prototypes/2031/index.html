<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Волна Н1: главное действие</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Прототип этапа 0 волны Н1 (#2031). «Было» — снимки приложения (before/), «Стало» — макет на токенах «Наряда»
   (packages/design-tokens, DS §2.2: шрифт 28/22/17/15/15/13/11, отступы 4…32, радиусы 24/18/12, кнопки 28/32/36, зона 44).
   Правило — design/naryad-ds/DESIGN-SYSTEM.md §8.9а–§8.9в. Светлая тёплая — :root, тёмная графитовая — [data-theme=dark]. */
:root{
  --acc:#FBFF00;--on-acc:#0B0C0F;--font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:24px;--ri:18px;--rf:12px;
  --fs-display:28px;--fs-title:22px;--fs-heading:17px;--fs-body:15px;--fs-btn:15px;--fs-caption:13px;--fs-micro:11px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --c-sm:28px;--c-md:32px;--c-lg:36px;--hit:44px;--field-phone:44px;--field:34px;--chip-h:24px;
  --tabbar-h:56px;--rail:72px;--panel-w:360px;--form-max:560px;--content-max:1200px;--thumb:72px;--step-bar:4px;
  --st-ok:#7CE08A;--st-info:#8FA2FF;--st-warn:#FF8A3D;--st-bad:#FF6B6B;--st-on:#0B0C0F;
  --page:#DDD9D2;--bg:#EFEBE5;--ink:#15161A;--mut:#575C68;--surf:rgba(255,255,255,.62);--surf2:rgba(255,255,255,.85);--in:rgba(255,255,255,.55);
  --bd:rgba(20,22,30,.1);--track:rgba(20,22,30,.09);--sh:0 10px 28px rgba(60,50,40,.12);--ov:rgba(250,248,244,.78);--ring:#15161A;
  --st-ok-t:#176428;--st-info-t:#3647C4;--st-warn-t:#944600;--st-bad-t:#B4232A;
}
[data-theme="dark"]{
  --page:#181A1E;--bg:#24272D;--ink:#F2F3F5;--mut:#CDD1DA;--surf:rgba(255,255,255,.07);--surf2:rgba(255,255,255,.11);--in:rgba(255,255,255,.05);
  --bd:rgba(255,255,255,.14);--track:rgba(255,255,255,.12);--sh:0 10px 30px rgba(0,0,0,.3);--ov:rgba(38,41,48,.72);--ring:#FBFF00;
  --st-ok-t:#9CF0A8;--st-info-t:#C2CCFF;--st-warn-t:#FFB47E;--st-bad-t:#FFAAAA;color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#181A1E;--bg:#24272D;--ink:#F2F3F5;--mut:#CDD1DA;--surf:rgba(255,255,255,.07);--surf2:rgba(255,255,255,.11);--in:rgba(255,255,255,.05);
  --bd:rgba(255,255,255,.14);--track:rgba(255,255,255,.12);--sh:0 10px 30px rgba(0,0,0,.3);--ov:rgba(38,41,48,.72);--ring:#FBFF00;
  --st-ok-t:#9CF0A8;--st-info-t:#C2CCFF;--st-warn-t:#FFB47E;--st-bad-t:#FFAAAA;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:var(--fs-body);line-height:1.45}
body{padding:var(--s4) max(16px,env(safe-area-inset-right,0px)) var(--s8) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
h1{font-size:var(--fs-title);margin:0 0 var(--s1)}
.lead{color:var(--mut);margin:0 0 var(--s4);max-width:760px}
.bar{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;margin-bottom:var(--s4)}
.seg{display:inline-flex;background:var(--track);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{min-height:var(--c-md);padding:0 var(--s3);border-radius:999px;font-size:var(--fs-caption);font-weight:600;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--surf2);color:var(--ink);box-shadow:var(--sh)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.pane h2{font-size:var(--fs-heading);margin:0 0 var(--s2)}
.stage{background:var(--track);border-radius:var(--r);padding:var(--s3);overflow:hidden}
.scaler{transform-origin:0 0}
.before img{display:block;width:100%;height:auto;border-radius:var(--ri)}
.notes{margin-top:var(--s4);background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s4)}
.notes h3{font-size:var(--fs-heading);margin:0 0 var(--s2)}
.notes li{margin-bottom:var(--s1)}

/* ===== устройство ===== */
.dev{position:relative;background:var(--bg);color:var(--ink);overflow:hidden;border-radius:var(--ri);display:flex}
.dev[data-w="390"]{width:390px;height:844px}
.dev[data-w="820"]{width:820px;height:900px}
.dev[data-w="1280"]{width:1280px;height:900px}
.rail{width:var(--rail);flex:none;border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding-top:var(--s4)}
.rail .ri{width:56px;min-height:48px;border-radius:var(--rf);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs-micro);color:var(--mut);gap:2px}
.rail .ri.on{background:var(--surf2);color:var(--ink);font-weight:600}
.main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow:hidden;padding:var(--s4)}
.dev[data-w="820"] .scroll,.dev[data-w="1280"] .scroll{padding:var(--s4) var(--s6)}
.wrap{max-width:var(--content-max);margin:0 auto}
.ver{font-size:var(--fs-micro);color:var(--mut);margin-bottom:var(--s2)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:var(--hit);color:var(--mut);font-size:var(--fs-body);font-weight:500}
.hdr{display:flex;align-items:flex-start;gap:var(--s2)}
.hdr h2{font-size:var(--fs-display);line-height:1.15;margin:0;font-weight:700}
.q{width:18px;height:18px;border-radius:999px;border:1.5px solid var(--mut);color:var(--mut);font-size:11px;display:inline-flex;align-items:center;justify-content:center;margin-top:8px;flex:none}
.sp{flex:1}
.ib{width:var(--c-lg);height:var(--c-lg);border-radius:999px;background:var(--surf2);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;flex:none}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin:var(--s2) 0 var(--s6);color:var(--mut)}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:var(--chip-h);padding:0 10px;border-radius:999px;font-size:var(--fs-caption);font-weight:600;border:1px solid var(--bd);background:var(--surf2);color:var(--ink)}
.chip.warn{color:var(--st-warn-t);border-color:var(--st-warn)}
.chip.info{color:var(--st-info-t);border-color:var(--st-info)}
.chip.ok{color:var(--st-ok-t);border-color:var(--st-ok)}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);box-shadow:var(--sh)}
.now{font-size:var(--fs-body);margin:0 0 var(--s3)}
.stitle{font-size:var(--fs-heading);font-weight:600;margin:var(--s3) 0 var(--s2);display:flex;align-items:center;gap:var(--s2)}
.row{display:flex;align-items:center;gap:var(--s3);min-height:var(--hit);border-bottom:1px solid var(--bd);padding:var(--s1) 0}
.row:last-child{border-bottom:0}
.row .k{color:var(--mut);width:96px;flex:none;font-size:var(--fs-caption)}
.row .v{flex:1;min-width:0}
.row .chev{color:var(--mut)}
.money{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3)}
.money .lbl{color:var(--mut);font-size:var(--fs-caption)}
.money .sum{font-size:var(--fs-title);font-weight:600;font-variant-numeric:tabular-nums}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s1);margin:var(--s2) 0 var(--s3)}
.steps .st{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-caption);color:var(--mut)}
.steps .st i{display:block;height:var(--step-bar);border-radius:999px;background:var(--track)}
.steps .st.done{color:var(--ink)}
.steps .st.done i{background:var(--ink)}
.steps .st.cur{color:var(--ink);font-weight:600}
.steps .st.cur i{background:var(--acc);outline:1px solid var(--bd)}
.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.contact button{min-height:var(--hit);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-caption);font-weight:500;border-radius:var(--rf);background:var(--in);border:1px solid var(--bd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--hit);padding:0 var(--s4);border-radius:999px;font-weight:600;font-size:var(--fs-btn)}
.btn.pri{background:var(--acc);color:var(--on-acc)}
.btn.sec{background:var(--surf2);border:1px solid var(--bd)}
.btn.sm{min-height:var(--c-md);font-size:var(--fs-caption);padding:0 var(--s3)}
.tabs{display:flex;gap:var(--s1);overflow:hidden;margin:var(--s2) 0 var(--s3)}
.tabs span{min-height:30px;padding:0 var(--s3);display:inline-flex;align-items:center;border-radius:999px;font-size:var(--fs-caption);font-weight:600;color:var(--mut);white-space:nowrap}
.tabs span.on{background:var(--surf2);color:var(--ink);box-shadow:var(--sh)}
.thumbs{display:flex;gap:var(--s2);flex-wrap:wrap}
.thumbs b{width:var(--thumb);height:var(--thumb);border-radius:var(--rf);background:var(--track);border:1px solid var(--bd);display:flex;align-items:flex-end;padding:4px;font-size:var(--fs-micro);font-weight:500;color:var(--mut)}
ul.todo{margin:0;padding-left:var(--s5)}
ul.todo li{margin-bottom:var(--s1)}
.field{margin-bottom:var(--s3)}
.field label{display:block;font-size:var(--fs-caption);font-weight:500;color:var(--mut);margin-bottom:var(--s1)}
.field .inp{height:var(--field-phone);border-radius:var(--rf);background:var(--in);border:1px solid var(--bd);display:flex;align-items:center;padding:0 var(--s3);font-size:17px}
.dev:not([data-w="390"]) .field .inp{height:var(--field)}
.field .inp.ph{color:var(--mut)}
.form{max-width:var(--form-max)}

/* панели действия */
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 var(--s3) var(--s3);display:flex;flex-direction:column;gap:var(--s2);z-index:2}
.actionbar{background:var(--ov);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s2);box-shadow:var(--sh)}
.actionbar .r{display:flex;gap:var(--s2)}
.actionbar .r .btn{flex:1}
.actionbar .r .btn.g2{flex:2}.actionbar .r .btn.g3{flex:3}
.tabpill{height:var(--tabbar-h);background:var(--ov);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd);border-radius:999px;display:flex;align-items:center;justify-content:space-around;box-shadow:var(--sh)}
.tabpill span{display:flex;flex-direction:column;align-items:center;font-size:var(--fs-micro);color:var(--mut);gap:2px;min-width:60px}
.tabpill span.on{color:var(--ink);font-weight:600}
.dev[data-w="390"] .room{height:150px}
.dev[data-w="390"] .room.tall{height:200px}
/* полоса 820 — шириной колонки */
.strip{position:absolute;bottom:0;left:var(--s6);right:var(--s6);padding-bottom:var(--s3);z-index:2}
.strip .actionbar{flex-direction:row;justify-content:flex-end;align-items:center;max-width:var(--content-max);margin:0 auto}
.strip.formw{right:auto;width:var(--form-max)}
.strip .actionbar .btn{min-width:160px;max-width:280px}
.strip .info{margin-right:auto;font-size:var(--fs-caption);color:var(--mut)}
/* 1280 — две колонки */
.two{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);gap:var(--s6);align-items:start}
.side .btn{width:100%}
.side .card{margin-bottom:var(--s3)}
.menu{position:absolute;z-index:5;background:var(--ov);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd);border-radius:var(--rf);box-shadow:var(--sh);width:240px;padding:var(--s1) 0}
.menu div{min-height:var(--hit);display:flex;align-items:center;padding:0 var(--s4);gap:var(--s2)}
.menu .bad{color:var(--st-bad-t)}
.menu hr{border:0;border-top:1px solid var(--bd);margin:var(--s1) 0}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.m{width:20px;height:20px}

/* правки после ревью 18.11 */
.dev.full{height:auto!important}
.dev.full .scroll{overflow:visible}
.scroll{overflow:auto}
.rail{gap:2px;padding-top:var(--s3);overflow:hidden}
.rail .logo{font-weight:700;font-size:var(--fs-heading);margin-bottom:var(--s2)}
.rail .ri{min-height:44px}
.rail .av{width:var(--c-md);height:var(--c-md);border-radius:999px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:var(--fs-micro);margin-top:auto;margin-bottom:var(--s3)}
.field .inp{border-color:var(--bd-field)}
.field .inp.multi{height:88px;align-items:flex-start;padding-top:var(--s2)}
.field .inp .act{margin-left:auto;color:var(--mut);display:inline-flex}
.field2{display:grid;grid-template-columns:1fr 96px 120px;gap:var(--s2)}
.btn.sec{border-color:var(--bd-field)}
.contact{display:flex;gap:var(--s2);flex-wrap:wrap}
.contact button{flex:1;min-width:0;min-height:var(--c-lg);flex-direction:row;border-radius:999px;border:1px solid var(--bd-field);background:var(--surf2);font-size:var(--fs-caption);font-weight:600;gap:6px;position:relative}
.contact button::after{content:"";position:absolute;inset:-4px 0}
.steps .st.done{color:var(--ink)}
.steps .st.done i{background:var(--ink)}
.steps .st.next{color:var(--ink);font-weight:600}
.steps .st.next i{background:var(--track);outline:1px solid var(--bd-field)}
.steps .st span{display:inline-flex;align-items:center;gap:2px}
.lc{display:flex;align-items:center;gap:var(--s3);min-height:var(--hit);background:var(--surf);border:1px solid var(--bd);border-radius:var(--ri);padding:var(--s2) var(--s3);margin-bottom:var(--s2)}
.lc .t{flex:1;min-width:0}
.lc .t b{display:block;font-weight:600}
.lc .t small{color:var(--mut);font-size:var(--fs-caption)}
.detail{max-width:var(--form-max)}
.detail .row .k{width:72px}
.side .btn{min-height:var(--c-md);font-size:var(--fs-caption)}
.side .contact button{min-height:var(--c-md)}
.dock{padding-bottom:max(var(--s3),34px)}
.dock.acc .actionbar{background:none;border:0;box-shadow:none;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.dock.acc .btn{box-shadow:var(--sh)}
.strip.formw{position:sticky;left:auto;right:auto;margin-top:var(--s4);padding:0}
.chk{display:flex;align-items:center;gap:var(--s2);min-height:var(--hit);border-bottom:1px solid var(--bd)}
.chk:last-child{border-bottom:0}
.dc{width:22px;height:22px;border-radius:999px;border:1.5px solid var(--bd-field);display:inline-flex;align-items:center;justify-content:center;flex:none}
.dc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.addph{width:var(--thumb);height:var(--thumb);border-radius:var(--rf);border:1.5px dashed var(--bd-field);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs-micro);color:var(--mut);gap:2px}
.tabs{position:relative;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.stitle .add{margin-left:auto}
.st-n{color:var(--st-warn-t)}
.field .inp.multi{height:88px!important}
.strip.formw .actionbar{background:none;border:0;box-shadow:none;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
</style>
</head>
<body>
<h1>Волна Н1 — главное действие и выезд</h1>
<p class="lead">Этап 0 задачи #2031. Слева — как сейчас (снимки приложения), справа — как станет по правилу DS §8.9а–§8.9в. Демо-данные; роль переключается в экране «Выезд».</p>

<div class="bar" role="group" aria-label="Настройки показа">
  <div class="seg" id="scr" aria-label="Экран">
    <button data-v="visitM" aria-pressed="true">Выезд — назначенный</button>
    <button data-v="visitO" aria-pressed="false">Выезд — офис</button>
    <button data-v="visitD" aria-pressed="false">Выезд закрыт — итог</button>
    <button data-v="job" aria-pressed="false">Работа</button>
    <button data-v="lead" aria-pressed="false">Новый лид (форма)</button>
  </div>
  <div class="seg" id="wid" aria-label="Ширина">
    <button data-v="390" aria-pressed="true">390</button>
    <button data-v="820" aria-pressed="false">820</button>
    <button data-v="1280" aria-pressed="false">1280</button>
  </div>
  <div class="seg" id="thm" aria-label="Тема">
    <button data-v="dark" aria-pressed="true">Тёмная</button>
    <button data-v="light" aria-pressed="false">Светлая</button>
  </div>
  <div class="seg" id="mnu" aria-label="Меню ⋯">
    <button data-v="0" aria-pressed="true">⋯ закрыто</button>
    <button data-v="1" aria-pressed="false">⋯ открыто</button>
  </div>
  <div class="seg" id="full" aria-label="Высота">
    <button data-v="0" aria-pressed="true">Окно</button>
    <button data-v="1" aria-pressed="false">Вся страница</button>
  </div>
</div>

<div class="cols">
  <section class="pane"><h2>Было</h2><div class="stage before"><img id="beforeImg" alt="Снимок экрана сейчас"></div></section>
  <section class="pane"><h2>Стало</h2><div class="stage" id="afterStage"><div class="scaler" id="scaler"></div></div></section>
</div>

<div class="notes" id="notes"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-nav" viewBox="0 0 24 24"><path d="M3 11l19-9-9 19-2-8-8-2z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-rcpt" viewBox="0 0 24 24"><path d="M4 2v20l3-2 3 2 2-2 2 2 3-2 3 2V2l-3 2-3-2-2 2-2-2-3 2z"/><path d="M8 9h8M8 13h6"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></symbol>

<script>
const BEFORE = { visitM: "visit_v1", visitO: "visit_v1", visitD: "visit_v1", job: "job_j1", lead: "lead_new" };
const S = { scr: "visitM", wid: "390", thm: "dark", mnu: "0", full: "0" };
const ic = (n, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const STEPS = ["В пути", "На месте", "Работа", "Подпись", "Оплата"];

function rail(on) {
  const items = [["plus", "Создать"], ["home", "Главная"], ["msg", "Сообщения"], ["cal", "План"], ["note", "Лиды"], ["rcpt", "Работы"], ["users", "Клиенты"], ["phone", "Звонки"], ["check", "Задачи"], ["note", "Сметы"], ["rcpt", "Счета"]];
  return `<nav class="rail" aria-label="Разделы"><div class="logo">GR</div>${items.map(([i, t]) => `<div class="ri ${t === on ? "on" : ""}">${ic(i, "m")}${t}</div>`).join("")}<div class="av">AP</div></nav>`;
}
function tabpill(on) {
  const items = [["home", "Главная"], ["cal", "План"], ["msg", "Сообщения"], ["users", "Клиенты"], ["more", "Ещё"]];
  return `<div class="tabpill" aria-label="Вкладки">${items.map(([i, t]) => `<span class="${t === on ? "on" : ""}">${ic(i, "m")}${t}</span>`).join("")}</div>`;
}
const head = (back, title) => `
  <div class="ver">GoRix v1.0.0 · 18</div>
  <button class="back">${ic("back")}${back}</button>
  <div class="hdr"><h2>${title}</h2><span class="q" aria-label="Подсказка">?</span><span class="sp"></span><button class="ib" aria-label="Ещё действия">${ic("more")}</button></div>`;
const contact = `<div class="contact"><button>${ic("phone")}Позвонить</button><button>${ic("msg")}Написать</button><button>${ic("nav")}Маршрут</button></div>`;
const lc = (icon, title, sub, chip = "") => `<div class="lc">${ic(icon, "m")}<div class="t"><b>${title}</b>${sub ? `<small>${sub}</small>` : ""}</div>${chip}${ic("chev")}</div>`;
const chipWarn = (t) => `<span class="chip warn">${ic("alert")}${t}</span>`;
const chipInfo = (t) => `<span class="chip info">${ic("clock")}${t}</span>`;
const chipOk = (t) => `<span class="chip ok">${ic("check")}${t}</span>`;
const chipNeu = (t) => `<span class="chip">${ic("note")}${t}</span>`;

function steps(done) { // done = number of passed steps
  return `<div class="steps" aria-label="Шаги выезда">${STEPS.map((t, i) => `<div class="st ${i < done ? "done" : i === done ? "next" : ""}"><i></i><span>${i < done ? ic("check") : ""}${t}</span></div>`).join("")}</div>`;
}
function visitParts(kind) {
  const master = kind === "visitM", done = kind === "visitD";
  const now = done ? "Выезд закрыт 17 нояб., 12:41 PM — всё оплачено."
    : master ? "Опаздываете на 12 мин — выезжайте." : "Alex Petrov ещё не выехал · опаздывает на 12 мин.";
  const statusChip = done ? chipOk("Закрыт") : chipWarn("Опаздывает");
  const sub = `<div class="sub">${statusChip}Выезд · вт, 17 нояб. · 8:30 AM</div>`;
  const money = done ? `<div class="money"><span class="lbl">Оплачено</span><span class="sum">$3,078</span></div>` : `<div class="money"><span class="lbl">К оплате</span><span class="sum">$3,078</span></div>`;
  const status = `<div class="card" aria-label="Что сейчас"><p class="now">${now}</p>${money}${steps(done ? 5 : 0)}${contact}</div>`;
  const office = kind === "visitO";
  const arrow = office ? `<span class="chev">${ic("chev")}</span>` : "";
  const who = `<div class="card detail" aria-label="Когда и кто"><div class="stitle" style="margin-top:0">Когда и кто</div>
      <div class="row"><span class="k">Когда</span><span class="v">вт, 17 нояб.<br>8:30 AM – 12:30 PM</span>${arrow}</div>
      <div class="row"><span class="k">Мастер</span><span class="v">Alex Petrov</span>${office ? `<button class="ib" aria-label="Позвонить мастеру">${ic("phone")}</button>` : ""}${arrow}</div>
      <div class="row"><span class="k">Адрес</span><span class="v">1420 Oak Grove Ave, Pasadena, CA 91103</span></div></div>`;
  const todo = `<div class="card"><div class="stitle" style="margin-top:0">Что сделать</div><ul class="todo"><li>Remove old vanity and toilet</li><li>Tile backsplash, 24 sq ft</li><li>Install new vanity, faucet</li></ul></div>`;
  const chk = (on, t) => `<div class="chk"><span class="dc ${on ? "on" : ""}">${on ? ic("check") : ""}</span>${t}</div>`;
  const checklist = `<div class="stitle">Чек-лист</div><div class="card">${chk(done, "Фото «до» сделаны")}${chk(done, "Вода перекрыта")}${chk(false, "Клиент показал место работ")}</div>`;
  const photos = `<div class="stitle">Фото · до 0 · после 0</div><div class="thumbs"><div class="addph">${ic("cam", "m")}Добавить</div></div>`;
  const summary = `<div class="card" aria-label="Итог"><div class="stitle" style="margin-top:0">Итог</div><div class="detail">
      <div class="row"><span class="k">Чек-лист</span><span class="v">2 из 3 · не сделано: «Клиент показал место работ»</span><span class="chev">${ic("chev")}</span></div>
      <div class="row"><span class="k">Фото</span><span class="v">до 3 · после 4</span><span class="chev">${ic("chev")}</span></div>
      <div class="row"><span class="k">Подпись</span><span class="v">Sarah Mitchell, 12:20 PM</span><span class="chev">${ic("chev")}</span></div>
      <div class="row"><span class="k">Оплата</span><span class="v">$3,078 · карта</span><span class="chev">${ic("chev")}</span></div></div></div>`;
  const related = `<div class="stitle">Связано</div>${lc("rcpt", "Работа JOB-0001", "Bathroom remodel")}${lc("users", "Sarah Mitchell", "")}${lc("home", "1420 Oak Grove Ave", "")}`;
  return { sub, status, who, todo, checklist, photos, summary, related, master, done, office, statusChip, money, now };
}
function visitMenu(kind, x, y) {
  const master = kind === "visitM";
  const items = master ? `<div>${ic("undo")}Вернуть шаг «На месте»</div><p style="margin:0 16px 4px;color:var(--mut);font-size:13px">(показан после второго шага; на «В пути» пункта нет)</p>`
    : `<div>${ic("users")}Лид</div><hr><div class="bad">${ic("x")}Отменить выезд…</div>`;
  return `<div class="menu" style="left:${x}px;top:${y}px" role="menu">${items}</div>`;
}
function render() {
  const w = +S.wid, menuOpen = S.mnu === "1", full = S.full === "1";
  let content = "", dock = "", side = "";
  if (S.scr.startsWith("visit")) {
    const v = visitParts(S.scr);
    const h = head("Работа JOB-0001", "Sarah Mitchell");
    const pri = `<button class="btn pri">${ic("nav")}В пути</button>`;
    const sec = `<button class="btn sec">${ic("cam")}Фото</button><button class="btn sec">${ic("rcpt")}Расход</button>`;
    const body = (v.done ? v.summary : "") + v.who + v.todo + v.checklist + (v.done ? "" : v.photos);
    if (w === 1280) {
      const sideCard = `<div class="card">${v.statusChip}<p class="now" style="margin-top:12px">${v.now}</p>${v.money}
        ${v.master || v.done ? `${v.done ? "" : pri}<div style="display:flex;gap:8px;margin-top:8px">${sec.replace(/class="btn sec"/g, 'class="btn sec" style="flex:1"')}</div>` : ""}
        <div style="margin-top:12px">${contact}</div></div>${v.related}`;
      content = h + v.sub + `<div class="two"><div><div class="card">${steps(v.done ? 5 : 0)}</div>${body}</div><aside class="side" aria-label="Сводка">${sideCard}</aside></div>`;
    } else {
      content = h + v.sub + v.status + body + v.related + `<div style="height:${w === 390 ? (v.master ? 170 : 40) : (v.master ? 96 : 24)}px"></div>`;
      const p1 = v.done ? "" : pri;
      if (v.master || v.done) dock = w === 390
        ? `<div class="dock"><div class="actionbar">${p1 ? `<div class="r">${p1}</div>` : ""}<div class="r">${sec}</div></div></div>`
        : `<div class="strip"><div class="actionbar"><span class="info">${v.done ? "Выезд закрыт" : "Дальше: В пути"}</span>${sec}${p1}</div></div>`;
    }
    if (menuOpen) side = visitMenu(S.scr, w - (w === 390 ? 260 : 300), 150);
  } else if (S.scr === "job") {
    const h = head("Sarah Mitchell", "Работа JOB-0001");
    const sub = `<div class="sub">${chipInfo("Запланирована")}вт, 17 нояб. · $3,078</div>`;
    const now = `<p class="now">Сегодня выезд в 8:30 AM — Alex Petrov опаздывает на 12 мин.</p>`;
    const addr = `<div class="card detail"><div class="row"><span class="k">Адрес</span><span class="v">1420 Oak Grove Ave, Pasadena, CA 91103</span><span class="chev">${ic("chev")}</span></div></div>`;
    const tabs = `<div class="tabs" role="tablist"><span class="on">Обзор</span><span>Выезды · 1</span><span>Деньги</span><span>Фото</span><span>Задачи</span><span>История</span></div>`;
    const visits = `<div class="stitle">Выезды<button class="btn sec sm add">${ic("plus")}Выезд</button></div>${lc("cal", "вт, 17 нояб. · 8:30 AM", "Alex Petrov · 4 ч", chipWarn("Опаздывает"))}${lc("cal", "чт, 19 нояб. · 9:00 AM", "Alex Petrov · 1 ч 30 мин", chipNeu("Назначен"))}`;
    const photos = `<div class="stitle">Фото выездов</div><div class="card"><div style="color:var(--mut);font-size:13px;margin-bottom:8px">пн, 9 нояб. · осмотр · до 3 · после 4</div><div class="thumbs"><b>до</b><b>до</b><b>до</b><b>после</b><b>после</b><b>после</b><b>после</b></div></div>`;
    const related = `<div class="stitle">Связано</div>${lc("users", "Sarah Mitchell", "")}${lc("home", "1420 Oak Grove Ave", "")}${lc("note", "EST-0012", "Подписана · $3,078.00")}`;
    const pri = `<button class="btn pri">${ic("nav")}Открыть выезд</button>`;
    if (w === 1280) {
      content = h + `<div class="sub">вт, 17 нояб. · Bathroom remodel: vanity, toilet, tile</div><div class="two"><div>${tabs}${visits}${photos}</div><aside class="side" aria-label="Сводка"><div class="card">
        ${chipInfo("Запланирована")}<p class="now" style="margin-top:12px">Сегодня выезд в 8:30 AM — Alex Petrov опаздывает на 12 мин.</p>${pri}
        <div class="money" style="margin-top:12px"><span class="lbl">Сумма</span><span class="sum">$3,078</span></div>
        <div class="money"><span class="lbl">Оплачено</span><span style="font-variant-numeric:tabular-nums">$0</span></div>
        <div class="detail"><div class="row"><span class="k">Адрес</span><span class="v">1420 Oak Grove Ave, Pasadena</span><span class="chev">${ic("chev")}</span></div></div>${contact}</div>${related}</aside></div>`;
    } else {
      content = h + sub + now + contact + tabs + addr + visits + photos + related + `<div style="height:${w === 390 ? 150 : 96}px"></div>`;
      dock = w === 390 ? `<div class="dock acc"><div class="actionbar"><div class="r">${pri}</div></div>${tabpill("Клиенты")}</div>`
        : `<div class="strip"><div class="actionbar">${pri}</div></div>`;
    }
  } else {
    const h = `<div class="ver">GoRix v1.0.0 · 18</div><button class="back">${ic("back")}Отмена</button><div class="hdr"><h2>Новый лид</h2><span class="q">?</span></div><div style="height:24px"></div>`;
    const f = (l, v, o = {}) => `<div class="field"><label>${l}</label><div class="inp ${o.ph ? "ph" : ""} ${o.multi ? "multi" : ""}">${v}${o.act ? `<span class="act">${ic(o.act)}</span>` : ""}</div></div>`;
    const form = `<div class="form">${f("Телефон", "(626) 555-0148", { act: "paste" })}${f("Имя", "Kevin Brooks")}${f("Улица и дом", "1520 Elm St")}
      <div class="field2">${f("Город", "Pasadena")}${f("Штат", "CA")}${f("ZIP", "91104")}</div>
      ${f("Что нужно", "Fix a leaking kitchen faucet and replace two outlets", { multi: true })}${f("Источник", "Google", { act: "chevd" })}
      ${w > 390 ? `<div class="strip formw"><div class="actionbar"><button class="btn pri">Сохранить лид</button></div></div>` : ""}</div>`;
    content = h + form + `<div style="height:${w === 390 ? 120 : 24}px"></div>`;
    if (w === 390) dock = `<div class="dock"><div class="actionbar"><div class="r"><button class="btn pri">Сохранить лид</button></div></div></div>`;
  }
  const hasRail = w > 390;
  const railOn = S.scr === "lead" ? "Лиды" : S.scr === "job" ? "Работы" : "Работы";
  const dev = `<div class="dev ${full ? "full" : ""}" data-w="${w}" data-theme="${S.thm}">${hasRail ? rail(railOn) : ""}
    <div class="main"><div class="scroll"><div class="wrap">${content}</div></div>${dock}${side}</div></div>`;
  const sc = document.getElementById("scaler");
  sc.innerHTML = dev;
  const stage = document.getElementById("afterStage");
  const devEl = sc.firstElementChild, hgt = devEl.offsetHeight;
  const avail = stage.clientWidth - 24, k = Math.min(1, avail / w);
  sc.style.transform = `scale(${k})`;
  sc.style.width = w + "px";
  sc.style.height = hgt * k + "px";
  stage.style.height = hgt * k + 24 + "px";
  const img = document.getElementById("beforeImg");
  img.src = `before/${BEFORE[S.scr]}-${w}-${S.thm}.jpg`;
  img.alt = `Сейчас: ${BEFORE[S.scr]}, ${w}, ${S.thm === "dark" ? "тёмная" : "светлая"}`;
  document.getElementById("notes").innerHTML = NOTES[S.scr];
}
const NOTES = {
  visitM: `<h3>Выезд — тот, на кого он назначен (мастер или владелец-одиночка)</h3><ul>
    <li><b>390:</b> шаг «В пути» — жёлтая кнопка в закреплённой панели, под ней «Фото · Расход» (§8.9). Было: кнопки шага нет, четыре кнопки в три ряда (РБ-13, РБ-14).</li>
    <li><b>Шапка:</b> статус «⚠ Опаздывает» под заголовком; блок «Что сейчас» — «Опаздываете на 12 мин — выезжайте».</li>
    <li><b>Шкала:</b> до первого шага ни один сегмент не залит; следующий шаг — жирной подписью; пройденный — полосой и «✓». Жёлтого на шкале нет — жёлтая только кнопка (§8.9б). Подписи 13, «К оплате».</li>
    <li><b>«Когда и кто»</b> у назначенного — без «›»: переносит и назначает офис. Ниже — чек-лист, фото с «Добавить», «Связано» (работа, клиент, адрес).</li>
    <li><b>«⋯»:</b> «Вернуть шаг „<прошлый>“» — только после шага; «Отменить выезд» у мастера нет.</li>
    <li><b>820:</b> полоса внизу шириной колонки, «Дальше: В пути», кнопки справа. <b>1280:</b> справа колонка 360 — статус, «Что сейчас», «К оплате», кнопки 32, связь, «Связано».</li>
    <li>«Вся страница» — увидеть низ: последняя строка не закрыта панелью.</li></ul>`,
  visitO: `<h3>Выезд — офис (или владелец, когда выезд не на нём)</h3><ul>
    <li>Шага нет — <b>панели нет</b> (§8.9а). «Когда ›» — перенести, «Мастер ›» — назначить, значок телефона — позвонить мастеру (опоздание).</li>
    <li>«⋯»: «Лид» (у осмотра), «Отменить выезд…» последним, красным, с подтверждением и причиной.</li></ul>`,
  visitD: `<h3>Выезд закрыт — итог (РБ-29)</h3><ul>
    <li>Вверху «Итог»: чек-лист 2 из 3 и невыполненный пункт словом, фото до/после, подпись, оплата — каждая строка открывает своё.</li>
    <li>Шкала пройдена целиком (полосы и «✓»). Шага больше нет — жёлтой кнопки нет; у назначенного в панели остаётся строка «Фото · Расход» (§8.9: дослать снимки и чек). У офиса панели нет.</li></ul>`,
  job: `<h3>Работа</h3><ul>
    <li>«Начать выезд» со «✓» посреди карточки → «Открыть выезд» над пилюлей вкладок («аксессуар» iOS 26, капсула 44 без подложки; при прокрутке вниз вкладки сжимаются, кнопка остаётся). Вкладки на месте (спека 28). РБ-03, О-06.</li>
    <li>Статус «Запланирована» — значок часов (info); выезды — отдельные компактные карточки, «＋ Выезд» в разделе; «Выезды · 1» — один ждёт действия (опаздывает), у «Фото» числа нет; ряд вкладок с затуханием у края.</li>
    <li>Адрес строкой, «Связано» — клиент, адрес, смета; «Фото выездов» по выездам (РБ-06).</li>
    <li><b>820:</b> полоса внизу; <b>1280:</b> справа сводка 360 — статус, «Что сейчас», кнопка 32, деньги, адрес, связь, «Связано» (Ш-15).</li></ul>`,
  lead: `<h3>Форма «Новый лид» (и все формы: клиент, позиция каталога, удаление аккаунта)</h3><ul>
    <li>Поля как сейчас: телефон первым со значком «вставить», адрес — улица, город, штат, ZIP; «Что нужно» в несколько строк; «Источник ⌄» — поле-меню (А2).</li>
    <li><b>390:</b> «Сохранить лид» — в закреплённой панели; при открытой клавиатуре панель <b>поднимается над ней</b> (§8.9а). «Отмена» — только в шапке.</li>
    <li><b>820 и 1280:</b> полоса под колонкой 560, прилипает к низу окна, но не ниже конца формы — у короткой формы кнопка сразу под последним полем.</li></ul>`,
};
for (const id of ["scr", "wid", "thm", "mnu", "full"]) {
  document.getElementById(id).addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    S[id] = b.dataset.v;
    for (const x of e.currentTarget.querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b));
    render();
  });
}
addEventListener("resize", render);
render();
</script>
