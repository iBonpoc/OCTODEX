<title>Смета GoRix · прототип</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Прототип экрана сметы в дизайн-системе «Наряд».
   Все значения — токены из design/naryad-ds/tokens/*.css и packages/design-tokens (зеркало).
   Новые значения помечены «новый токен» со ссылкой на раздел DS. Раскладка: телефон — одна колонка и закреплённая панель;
   планшет — колонка formMax; компьютер — колонка позиций + правая колонка panelW с кнопками и итогами. */
:root{
 /* foundation.css */
 --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --fs-display:28px;--fs-title:20px;--fs-heading:15px;--fs-body:13px;--fs-btn:12.5px;--fs-caption:11.5px;--fs-micro:10.5px;
 --lh-tight:1.15;--lh-body:1.45;--lh-snug:1.35;
 --fw-regular:400;--fw-medium:500;--fw-semibold:600;--fw-bold:700;
 --space-hair:2px;--space-tight:6px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
 --radius-pill:999px;--radius-field:12px;--radius-chip:999px;--r:24px;--ri:18px;--radius-tip:8px;--sheet-radius:24px;
 --control-sm:28px;--control-md:32px;--control-lg:36px;--field:34px;--hit-min:44px;--field-phone:44px;
 --icon-xs:12px;--icon-sm:16px;--icon-md:20px;--icon-lg:24px;
 --statusbar-h:44px;
 --dur-press:80ms;--dur-fast:160ms;--dur-base:220ms;--dur-slow:350ms;
 --ease-out:cubic-bezier(.2,.8,.2,1);--ease-spring:cubic-bezier(.3,1.25,.5,1);--ease-liquid:cubic-bezier(.3,1.35,.5,1);
 --press-scale:.95;--menu-scale:.96;--alert-scale:1.06;--lift-scale:1.05;--lift-tilt:-2deg;--dim:.45;
 --blur:20px;--blurov:24px;
 --z-nav:2;--z-lift:3;--z-fab:4;--z-scrim:5;--z-sheet:6;--z-modal:7;--z-toast:8;
 --shadow-pop:0 20px 60px rgba(0,0,0,.45);--shadow-sheet:0 -10px 40px rgba(0,0,0,.4);--shadow-lift:0 20px 60px rgba(0,0,0,.35);
 /* components.css + component.* из index.ts */
 --chip-h:24px;--chip-px:10px;--seg-h:32px;--seg-pad:4px;--switch-w:42px;--switch-h:24px;--switch-knob:16px;
 --help-visible:18px;--row-min:44px;--row-max:52px;--row-option:48px;
 --selected-border:2px;--hairline:1px;--grabber-w:36px;--grabber-h:4px;
 --menu-w:240px;--dialog-w:444px;--alert-max-w:340px;--panel-w:360px;--content-max:1200px;
 --form-max:560px;      /* layout.formMax — Н-15 */
 --checkbox:22px;--checkbox-r:7px;--checkbox-bd:1.5px; /* component.checkbox */
 --swipe-w:80px;        /* новый токен component.swipeAction.w — DS Б13 */
 --kb-bar-h:44px;       /* панель «‹ › Готово» над цифровой клавиатурой — DS А6.2 (в приложении это InputAccessoryView iOS) */
 /* цвета: theme.css + status.css; светлая тема по умолчанию */
 --acc:#FBFF00;--on-acc:#0B0C0F;
 --st-ok:#7CE08A;--st-info:#8FA2FF;--st-warn:#FF8A3D;--st-bad:#FF6B6B;--st-on:#0B0C0F;
 --page:#DDD9D2;--bg:#EFEBE5;--ink:#15161A;--mut:#575C68;
 --surf:rgba(255,255,255,.62);--surf2:rgba(255,255,255,.85);--in:rgba(255,255,255,.55);--bd:rgba(20,22,30,.1);--track:rgba(20,22,30,.09);
 --st-neu-fill:rgba(20,22,30,.09);
 --sh:0 10px 28px rgba(60,50,40,.12);--ov:rgba(250,248,244,.78);--ov-solid:#FAF8F4;--scrim:rgba(20,22,30,.25);
 --st-ok-text:#176428;--st-info-text:#3647C4;--st-warn-text:#944600;--st-bad-text:#B4232A;
 --glow:radial-gradient(600px 420px at 6% 0%,rgba(124,224,138,.3),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,160,60,.24),transparent 60%),radial-gradient(520px 420px at 60% 35%,rgba(143,162,255,.2),transparent 60%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --page:#181A1E;--bg:#24272D;--ink:#F2F3F5;--mut:#CDD1DA;
 --surf:rgba(255,255,255,.07);--surf2:rgba(255,255,255,.11);--in:rgba(255,255,255,.05);--bd:rgba(255,255,255,.14);--track:rgba(255,255,255,.12);
 --st-neu-fill:rgba(255,255,255,.11);
 --sh:0 10px 30px rgba(0,0,0,.3);--ov:rgba(38,41,48,.72);--ov-solid:#262930;--scrim:rgba(0,0,0,.42);
 --st-ok-text:#9CF0A8;--st-info-text:#C2CCFF;--st-warn-text:#FFB47E;--st-bad-text:#FFAAAA;
 --glow:radial-gradient(600px 420px at 6% 0%,rgba(124,224,138,.08),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,160,60,.07),transparent 60%),radial-gradient(520px 420px at 60% 35%,rgba(143,162,255,.06),transparent 60%);
 color-scheme:dark}}
:root[data-theme="dark"]{
 --page:#181A1E;--bg:#24272D;--ink:#F2F3F5;--mut:#CDD1DA;
 --surf:rgba(255,255,255,.07);--surf2:rgba(255,255,255,.11);--in:rgba(255,255,255,.05);--bd:rgba(255,255,255,.14);--track:rgba(255,255,255,.12);
 --st-neu-fill:rgba(255,255,255,.11);
 --sh:0 10px 30px rgba(0,0,0,.3);--ov:rgba(38,41,48,.72);--ov-solid:#262930;--scrim:rgba(0,0,0,.42);
 --st-ok-text:#9CF0A8;--st-info-text:#C2CCFF;--st-warn-text:#FFB47E;--st-bad-text:#FFAAAA;
 --glow:radial-gradient(600px 420px at 6% 0%,rgba(124,224,138,.08),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,160,60,.07),transparent 60%),radial-gradient(520px 420px at 60% 35%,rgba(143,162,255,.06),transparent 60%);
 color-scheme:dark}
@media (prefers-reduced-motion: reduce){:root{--dur-press:0ms;--dur-base:0ms;--dur-slow:0ms}}
:root{--fs-input:var(--fs-body);--qty-w:72px;--unit-w:84px;--bar-btn:var(--control-lg)}
/* «Крупнее» — шкала аудита DS #1303 (просьба основателя 13.11: в приложении мелко). Ориентир — iOS HIG, не Estixa.
   Новые значения шкалы — кандидаты в токены font.* и component.*; решение по всему приложению — отдельной задачей */
:root[data-size="large"]{--fs-display:28px;--fs-title:22px;--fs-heading:17px;--fs-body:15px;--fs-btn:15px;--fs-caption:13px;--fs-micro:11px;--fs-input:17px;
 --bar-btn:44px;--qty-w:80px;--unit-w:88px}
/* шкала аудита #1303 (13.11): кнопки по-прежнему 36, главная 44, зона 44; подписи полей — caption */
:root[data-size="large"] .btn.primary,:root[data-size="large"] .sidecard .btn{height:var(--bar-btn)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:var(--fs-body);line-height:var(--lh-snug);color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,textarea{font:inherit;color:inherit;margin:0}
:focus-visible{outline:var(--selected-border) solid var(--acc);outline-offset:var(--selected-border)}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.mut{color:var(--mut)}
.tab{font-variant-numeric:tabular-nums}
.cap{font-size:var(--fs-caption);font-weight:var(--fw-medium);line-height:var(--lh-snug)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- полоса прототипа (не часть приложения) ---------- */
#pbar{position:relative;z-index:var(--z-nav);display:flex;align-items:center;gap:var(--space-2);min-height:var(--hit-min);
 padding-block:var(--space-1);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 background:var(--page);border-bottom:var(--hairline) solid var(--bd)}
#pbar .tag{font-size:var(--fs-caption);font-weight:var(--fw-semibold);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar .tag b{color:var(--ink)}

/* ---------- рамка приложения ---------- */
#stage{display:flex;justify-content:center}
#frame{position:relative;width:100%;max-width:var(--fw,100%);min-height:100vh;background:var(--glow),var(--bg);display:flex;flex-direction:column}
.wide-host #frame{border-left:var(--hairline) solid var(--bd);border-right:var(--hairline) solid var(--bd)}
.in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* шапка */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-nav);transition:background var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out)}
#hdr.scrolled{background:var(--ov);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:inset 0 calc(-1 * var(--hairline)) 0 var(--bd)}
.hdr-in{display:flex;align-items:center;gap:var(--space-2);min-height:var(--statusbar-h);padding-block:var(--space-1)}
.hdr-back{display:inline-flex;align-items:center;gap:var(--space-1);font-weight:var(--fw-semibold);min-height:var(--hit-min);max-width:220px}
.hdr-title{flex:1;min-width:0;text-align:center;font-size:var(--fs-heading);font-weight:var(--fw-semibold);opacity:0;transition:opacity var(--dur-fast) var(--ease-out);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr.scrolled .hdr-title{opacity:1}
.hdr-r{display:flex;gap:var(--space-2)}

main{flex:1;display:flex;flex-direction:column;gap:var(--space-4);padding-block:var(--space-2) var(--space-6)}
.cols{display:flex;flex-direction:column;gap:var(--space-4)}
.colL,.colR{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
[data-w="tablet"] .colL,[data-w="tablet"] .colR{max-width:var(--form-max)}
[data-w="desktop"] main{max-width:calc(var(--form-max) + var(--panel-w) + var(--space-6));width:100%;margin:0 auto}
[data-w="desktop"] .cols{display:grid;grid-template-columns:minmax(0,var(--form-max)) var(--panel-w);gap:var(--space-6);align-items:start}
[data-w="desktop"] .colR{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--statusbar-h) + var(--space-3))}

h1{margin:0;font-size:var(--fs-display);font-weight:var(--fw-bold);line-height:var(--lh-tight);letter-spacing:-.01em}
.titleb{display:flex;flex-direction:column;gap:var(--space-2)}
.titleb .meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2)}
.h2{font-size:var(--fs-heading);font-weight:var(--fw-semibold)}
.sect-t{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);min-height:var(--hit-min)}

/* карточка */
.card{background:var(--surf);border:var(--hairline) solid var(--bd);border-radius:var(--r);overflow:hidden}
.rowlink{display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:var(--row-max);padding:var(--space-2) var(--space-4);text-align:left}
.rowlink+.rowlink,.rowlink+.adj-warn+.rowlink{border-top:var(--hairline) solid var(--bd)}
.rowlink .lab{flex:none;color:var(--mut);min-width:84px}
.rowlink .val{flex:1;min-width:0;text-align:right;font-weight:var(--fw-medium)}
.rowlink .val.ph{color:var(--mut);font-weight:var(--fw-regular)}
.rowlink:active{background:var(--surf2)}
.rowlink .chev{color:var(--mut)}
.rowlink.bad{box-shadow:inset 0 0 0 var(--selected-border) var(--st-bad)}
.adj-warn{display:flex;gap:var(--space-2);align-items:flex-start;padding:0 var(--space-4) var(--space-3);color:var(--st-warn-text)}

/* кнопки */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:var(--control-lg);padding:0 var(--space-4);
 border-radius:var(--radius-pill);font-size:var(--fs-btn);font-weight:var(--fw-semibold);white-space:nowrap;transition:transform var(--dur-press) var(--ease-out);user-select:none;-webkit-user-select:none}
.btn::after{content:"";position:absolute;left:0;right:0;top:50%;height:var(--hit-min);transform:translateY(-50%)}
.btn:active{transform:scale(var(--press-scale))}
.btn.primary{background:var(--acc);color:var(--on-acc)}
.btn.secondary{background:var(--surf2);border:var(--hairline) solid var(--bd)}
.btn.ghost{background:transparent}
.btn.sm{height:var(--control-sm);padding:0 var(--space-3)}
.btn.full{width:100%}
.btn[aria-disabled="true"]{opacity:var(--dim)}
[data-w="tablet"] .btn,[data-w="desktop"] .btn{height:var(--control-md)}
.ibtn{position:relative;width:var(--control-lg);height:var(--control-lg);border-radius:var(--radius-pill);background:var(--surf2);border:var(--hairline) solid var(--bd);display:inline-flex;align-items:center;justify-content:center;flex:none;transition:transform var(--dur-press) var(--ease-out)}
.ibtn::after{content:"";position:absolute;left:50%;top:50%;width:var(--hit-min);height:var(--hit-min);transform:translate(-50%,-50%)}
.ibtn:active{transform:scale(var(--press-scale))}
.ibtn.plain{background:transparent;border-color:transparent}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.brow .btn{min-width:0;padding:0 var(--space-2)}
.bar-in .brow{grid-template-columns:2fr 3fr}
.bcol{display:flex;flex-direction:column;gap:var(--space-2)}

/* чип статуса и метки */
.chip{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--chip-h);padding:0 var(--chip-px);border-radius:var(--radius-chip);font-size:var(--fs-caption);font-weight:var(--fw-semibold);white-space:nowrap;flex:none}
.chip.neutral{background:var(--st-neu-fill);color:var(--mut);box-shadow:inset 0 0 0 var(--hairline) var(--bd)}
.chip.ok{background:var(--st-ok);color:var(--st-on)}.chip.info{background:var(--st-info);color:var(--st-on)}
.chip.warn{background:var(--st-warn);color:var(--st-on)}.chip.bad{background:var(--st-bad);color:var(--st-on)}
.chip.soft{background:transparent;box-shadow:inset 0 0 0 var(--hairline) var(--bd)}
.chip.soft.warn{color:var(--st-warn-text)}.chip.soft.bad{color:var(--st-bad-text)}.chip.soft.info{color:var(--st-info-text)}
.marks{display:flex;flex-wrap:wrap;gap:var(--space-1)}

/* сегменты */
.seg{display:flex;background:var(--track);border-radius:var(--radius-pill);padding:var(--seg-pad);height:var(--seg-h);gap:var(--space-hair)}
.seg button{flex:1;min-width:0;text-align:center;border-radius:var(--radius-pill);font-size:var(--fs-btn);font-weight:var(--fw-medium);color:var(--mut);padding:0 var(--space-3);position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.seg button::after{content:"";position:absolute;left:0;right:0;top:50%;height:var(--hit-min);transform:translateY(-50%)}
.seg button[aria-checked="true"]{background:var(--surf2);color:var(--ink);font-weight:var(--fw-semibold);box-shadow:inset 0 0 0 var(--selected-border) var(--ink)}
.seg.auto button{flex:none}

/* переключатель */
.trow{display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:var(--row-min);text-align:left}
.trow .tl{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-hair)}
.trow[aria-disabled="true"] .tl,.trow[aria-disabled="true"] .sw-t{opacity:var(--dim)}
.sw-t{width:var(--switch-w);height:var(--switch-h);border-radius:var(--radius-pill);background:var(--track);position:relative;flex:none;transition:background var(--dur-fast) var(--ease-out)}
.sw-t::after{content:"";position:absolute;top:calc((var(--switch-h) - var(--switch-knob)) / 2);left:calc((var(--switch-h) - var(--switch-knob)) / 2);width:var(--switch-knob);height:var(--switch-knob);border-radius:var(--radius-pill);background:var(--ink);transition:transform var(--dur-base) var(--ease-spring),background var(--dur-fast) var(--ease-out)}
[aria-checked="true"] .sw-t{background:var(--acc)}
[aria-checked="true"] .sw-t::after{background:var(--on-acc);transform:translateX(calc(var(--switch-w) - var(--switch-h)))}

/* поля */
.fld{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.fld .lab{font-size:var(--fs-caption);font-weight:var(--fw-medium);color:var(--mut)}
.fld .box{display:flex;align-items:center;gap:var(--space-1);min-height:var(--field-phone);padding:0 var(--space-3);border-radius:var(--radius-field);background:var(--in);border:var(--hairline) solid var(--bd);transition:border-color var(--dur-fast) var(--ease-out)}
[data-w="desktop"] .fld .box{min-height:var(--field)}
.fld .box:focus-within{border-color:var(--ink)}
.fld input,.fld textarea{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:0;font-size:var(--fs-input);line-height:var(--lh-snug);height:calc(var(--field-phone) - var(--hairline) * 2)}
[data-w="desktop"] .fld input{height:calc(var(--field) - var(--hairline) * 2)}
.fld textarea{resize:none;height:auto;min-height:calc(var(--field-phone) - var(--hairline) * 2);padding-block:var(--space-3);overflow:hidden;display:block}
.fld input.big{font-size:var(--fs-heading);font-weight:var(--fw-semibold)}
.fld .pre,.fld .suf{color:var(--mut)}
.fld .num{text-align:right;font-variant-numeric:tabular-nums}
.fld .err{display:none;align-items:flex-start;gap:var(--space-1);font-size:var(--fs-caption);font-weight:var(--fw-medium);color:var(--st-bad-text)}
.fld.bad .box{border-color:var(--st-bad)}
.fld.bad .err{display:flex}
.fld .hint{font-size:var(--fs-caption);color:var(--mut)}
.selbox{justify-content:space-between;text-align:left;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);align-items:start}
.grid3{display:grid;grid-template-columns:var(--qty-w) var(--unit-w) minmax(0,1fr);gap:var(--space-2);align-items:start}
.grid3 .fld .box{padding:0 var(--space-2)}
.ed-top .sp{flex:1}
.vars{padding:var(--space-3) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.vars .vh{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.tplrow{display:flex;gap:var(--space-2);flex-wrap:wrap}

/* ---------- список позиций ---------- */
.listhead{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);min-height:var(--hit-min);flex-wrap:wrap}
.listhead .seg{width:auto}
#list{position:relative;padding:0}
#list:empty{display:none}
.empty{padding:var(--space-6) var(--space-4);text-align:center;color:var(--mut)}
.li,.sec{position:relative}
.li+.li,.sec+.li,.li+.sec,.sec+.sec{border-top:var(--hairline) solid var(--bd)}
.sw{position:absolute;top:0;bottom:0;overflow:hidden;display:flex;z-index:1}
.sw-l{left:0;width:max(0px,var(--sx,0px))}
.sw-r{right:0;width:max(0px,calc(-1 * var(--sx,0px)));justify-content:flex-start}
.swb{flex:none;width:var(--swipe-w);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-1);font-size:var(--fs-caption);font-weight:var(--fw-semibold);background:var(--surf2);color:var(--ink);text-align:center}
.sw-l .swb{margin-left:auto}
.sw-r .swb+.swb{flex:1}
.swb-del{background:var(--st-bad);color:var(--st-on)}
.swb.dim>*{opacity:var(--dim)}
.li.anim .sw,.li.anim .face{transition:width var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out)}

/* разбор числа: DS А6.2 — «-100», «abc», «1e5» — ошибка; запятая — тысячи, кроме одной запятой с 1–2 цифрами (регионы без точки) */
function parseNum(raw,dec,max){
 let s=String(raw).trim().replace(/\s+/g,'').replace(/^\$/,'').replace(/%$/,'');
 if(s==='')return{empty:true};
 const bad={err:dec===2?'Впишите сумму, например 12.50':'Впишите число, например 12.5'};
 if(/[^0-9.,]/.test(s))return bad;
 let i='',f='';
 if(s.includes('.')){ if(s.split('.').length>2)return bad; [i,f]=s.split('.'); if(i.includes(',')){ if(!/^\d{1,3}(,\d{3})+$/.test(i))return bad; i=i.replace(/,/g,''); } if(f.includes(','))return bad; }
 else if(s.includes(',')){ const p=s.split(','); if(p.length===2&&/^\d{1,2}$/.test(p[1])){i=p[0];f=p[1]} else if(p.length===2&&p[1]===''){i=p[0]} else if(/^\d{1,3}(,\d{3})+$/.test(s)){i=s.replace(/,/g,'')} else return bad; }
 else i=s;
 if(i==='')i='0';
 if(f.length>dec)return{err:dec===0?'Впишите целое число':`Не больше ${dec===2?'двух':'четырёх'} знаков после точки`};
 const v=Number(i)*10**dec+Number((f||'').padEnd(dec,'0')||0);
 if(!Number.isFinite(v)||v>max)return{err:'Слишком большое число'};
 return{ok:true,v};
}

function seqOf(o,dragging){
 const out=[]; const tops=o.sections.filter(s=>!s.parentId);
 const direct=sid=>o.lines.filter(l=>secOf(o,l)===sid);
 for(const s of tops){
  out.push({t:'sec',s,depth:0});
  if(o.collapsed[s.id])continue;
  direct(s.id).forEach(l=>out.push({t:'line',l,depth:0,sec:s.id}));
  for(const sub of o.sections.filter(x=>x.parentId===s.id)){
   out.push({t:'sec',s:sub,depth:1});
   if(!o.collapsed[sub.id])direct(sub.id).forEach(l=>out.push({t:'line',l,depth:2,sec:sub.id}));
  }
 }
 const loose=direct(null);
 if(tops.length&&(loose.length||dragging))out.push({t:'loose'});
 loose.forEach(l=>out.push({t:'line',l,depth:tops.length?0:0,sec:null}));
 return out;
}

function updateCalc(){
 const o=opt();
 $$('[data-calc]').forEach(el=>{
  const k=el.dataset.calc;
  if(k==='totals')el.outerHTML=totalsHTML();
  else if(k==='adj'){const a=document.activeElement&&document.activeElement.id;el.outerHTML=adjHTML()}
  else if(k==='optsum')el.innerHTML=optSumHTML();
  else if(k==='bartotal')el.textContent=money(compute(o).total);
  else if(k==='count')el.textContent=o.lines.length;
  else if(k==='secloose'){let t=0;o.lines.forEach(l=>{if(secOf(o,l)===null&&!l.optional)t+=lineTotal(l)});el.textContent=money(t)}
  else if(k.startsWith('sec:'))el.textContent=money(secTotal(o,k.slice(4)));
  else if(k.startsWith('figs:')){const l=line(k.slice(5));if(l)el.innerHTML=figsHTML(l)}
  else if(k.startsWith('catwhy:')){const l=line(k.slice(7));if(l)el.innerHTML=catWhy(l,catOffer(l))}
  else if(k.startsWith('hidewhy:')){const l=line(k.slice(8));if(l)el.textContent=l.priceCents===0?'Клиент не увидит позицию. Себестоимость останется в ваших расходах':'Скрыть можно позицию с ценой $0'}
 });
}

/* ================= отрисовка, анимации ================= */
function topOf(key){const el=document.querySelector(`[data-key="${CSS.escape(key)}"]`);return el?el.getBoundingClientRect().top:null}
function heightOf(key){const el=document.querySelector(`[data-key="${CSS.escape(key)}"]`);return el?el.getBoundingClientRect().height:null}
function capture(root){const m=new Map();$$('[data-key]',root).forEach(el=>m.set(el.dataset.key,el.getBoundingClientRect().top));return m}
function flip(root,before,o={}){
 if(reduced())return;
 $$('[data-key]',root).forEach(el=>{const k=el.dataset.key,t=el.getBoundingClientRect().top;
  if(before.has(k)){const dy=before.get(k)-t;if(Math.abs(dy)>.5)el.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:T.durBase,easing:EASE})}
  else if(o.fadeNew!==false)el.animate([{opacity:0},{opacity:1}],{duration:T.durFast,easing:EASE});
 });
}
function renderList(o={}){
 const list=$('#list'); if(!list)return renderAll();
 const before=o.flip?capture(list):null;
 const aTop=o.anchor?topOf(o.anchor):null;
 const ae=document.activeElement, aid=ae&&ae.id&&list.contains(ae)?ae.id:null;
 list.innerHTML=listHTML(o.dragging);
 list.classList.toggle('compact',P.view==='compact');
 if(aTop!=null){const n=topOf(o.anchor);if(n!=null)window.scrollBy(0,n-aTop)}
 if(before)flip(list,before,o);
 if(aid){const el=document.getElementById(aid);el&&el.focus({preventScroll:true})}
 autoGrowAll(); updateCalc(); if(!D)armPeek();
}
function renderAll(){
 const ae=document.activeElement,aid=ae&&ae.id;
 $('#hdr').innerHTML=hdrHTML(); $('#main').innerHTML=mainHTML(); $('#bar').innerHTML=barHTML();
 if(aid){const el=document.getElementById(aid);el&&el!==document.body&&el.focus({preventScroll:true})}
 autoGrowAll(); syncFrame(); armPeek();
}
function pulse(key){if(reduced())return;const el=document.querySelector(`[data-key="${CSS.escape(key)}"]`);if(!el)return;
 el.animate([{backgroundColor:'var(--surf2)',boxShadow:'inset 0 0 0 2px var(--ink)'},{backgroundColor:'transparent',boxShadow:'inset 0 0 0 2px transparent'}],{duration:T.durSlow,easing:EASE})}
function animateHeight(key,from){
 if(reduced()||from==null)return; const el=document.querySelector(`[data-key="${CSS.escape(key)}"]`); if(!el)return;
 const to=el.getBoundingClientRect().height; if(Math.abs(to-from)<1)return;
 el.style.overflow='hidden';
 const a=el.animate([{height:from+'px'},{height:to+'px'}],{duration:T.durBase,easing:EASE}); a.onfinish=a.oncancel=()=>{el.style.overflow=''};
 const inner=el.firstElementChild; if(inner&&to>from)inner.animate([{opacity:0},{opacity:1}],{duration:T.durBase,easing:EASE});
}
function autoGrow(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
function autoGrowAll(){$$('.fld textarea').forEach(autoGrow)}
function visTop(){const h=$('#hdr').getBoundingClientRect();return h.bottom}
function visBottom(){const vv=window.visualViewport;let b=vv?vv.height+vv.offsetTop:innerHeight;const bar=$('#bar');if(isPhone()&&bar&&!UI.typing){const r=bar.getBoundingClientRect();if(r.height)b=Math.min(b,r.top)}if($('#kb').classList.contains('on'))b-=44;return b}
function scrollIntoComfort(el,o={}){ // плавно, с отступом space[6] сверху (DS §11 п.3)
 if(!el)return; const r=el.getBoundingClientRect(), top=visTop()+24, bot=visBottom()-16; let dy=0;
 if(o.top||r.top<top)dy=r.top-top; else if(r.bottom>bot)dy=Math.min(r.bottom-bot,r.top-top);
 if(Math.abs(dy)>1)window.scrollBy({top:dy,behavior:reduced()?'auto':'smooth'});

/* ================= каталог (DS А3 PickerSheet) ================= */
function catalogSheet({mode,lineId,sectionId}){
 // mode: 'multi' — добавить несколько; 'replace' — одна позиция заменяет строку
 const sel=new Set(); let q='', kind='all';
 const multi=mode==='multi';
 const foot=multi?`<button class="btn primary full" data-add>Добавить</button>`:'';
 const sh=openSheet({title:multi?(sectionId?'Из каталога в раздел':'Из каталога'):'Заменить позицию',large:true,foot,
  body:`<div class="sh-sticky"><label class="search">${ic('search',16)}<input id="cat-q" type="search" enterkeyhint="search" placeholder="Название позиции" autocomplete="off" aria-label="Поиск по каталогу"></label>
  <div class="seg" role="radiogroup" aria-label="Вид">${[['all','Все'],...KINDS.map(k=>[k,KIND_SEC[k]])].map(([k,w])=>`<button role="radio" aria-checked="${k==='all'}" data-kf="${k}">${w}</button>`).join('')}</div></div>
  <div id="cat-list" role="listbox" aria-multiselectable="${multi}"></div>`,
  mount(el,close){
   const listEl=el.querySelector('#cat-list'), addB=el.querySelector('[data-add]');
   const rowH=c=>`<button class="opt" role="option" data-c="${c.id}" aria-selected="${sel.has(c.id)}"><span class="kind mut">${ic(KIND_ICON[c.kind],16)}</span><span class="tl"><span>${esc(c.name)}</span><span class="s tab">${KIND_WORD[c.kind]} · ${money(c.price)} / ${esc(c.unit)}${costsVisible()?` · себест. ${money(c.cost)}`:''}</span></span>${multi?`<span class="box2">${sel.has(c.id)?ic('check',16):''}</span>`:''}</button>`;
   const draw=()=>{
    const qq=q.trim().toLowerCase(); const hit=CAT.filter(c=>(kind==='all'||c.kind===kind)&&(!qq||c.name.toLowerCase().includes(qq)));
    let h='';
    if(!multi)h+=`<button class="opt" data-clear><span class="kind mut">${ic('pencil',16)}</span><span class="tl"><span>Очистить позицию</span><span class="s">Строка останется на месте, впишете своё</span></span></button>`;
    if(qq)h+=`<button class="opt" data-own><span class="kind mut">${ic('plus',16)}</span><span class="tl"><span>Своя позиция «${esc(q.trim())}»</span><span class="s">Нет в каталоге — впишете цену сами</span></span></button>`;
    const rec=!qq&&kind==='all'?UI.recent.map(catById).filter(Boolean):[];
    if(rec.length)h+=`<div class="grp">Недавние</div>`+rec.map(rowH).join('')+`<div class="grp">Все</div>`;
    h+=hit.length?hit.map(rowH).join(''):`<div class="empty">Ничего не нашлось. Проверьте название или добавьте свою позицию.</div>`;
    listEl.innerHTML=h;
    if(addB)addB.textContent=sel.size?`Добавить · ${sel.size}`:'Добавить';
   };
   draw();
   el.querySelector('#cat-q').addEventListener('input',e=>{q=e.target.value;draw()});
   el.querySelectorAll('[data-kf]').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kf;el.querySelectorAll('[data-kf]').forEach(x=>x.setAttribute('aria-checked',x===b));draw()}));
   listEl.addEventListener('click',e=>{
    const b=e.target.closest('.opt'); if(!b)return;
    if(b.hasAttribute('data-own')){close();if(multi)addLine({name:q.trim(),sectionId});else{const l=line(lineId);l.name=q.trim();l.catalogId=null;openRow(lineId,{focus:'price',select:true})}return}
    if(b.hasAttribute('data-clear')){close();replaceLine(lineId,'clear');return}
    const c=catById(b.dataset.c);
    if(!multi){close();replaceLine(lineId,c);return}
    sel.has(c.id)?sel.delete(c.id):sel.add(c.id); draw();
   });
   addB&&addB.addEventListener('click',()=>{if(!sel.size){haptic('warning');toast('Отметьте позиции, которые добавить');return}const items=[...sel].map(catById);close();fromCatalog(items,sectionId)});
  }});
}

const NUM={qty:[4,LIM.qty],price:[2,LIM.money],cost:[2,LIM.money]};
function setBad(id,f,msg){const k=fk(id,f);if(msg)UI.bad[k]=msg;else delete UI.bad[k];const w=document.querySelector(`[data-fk="${CSS.escape(k)}"]`);if(w){w.classList.toggle('bad',!!msg);const s=w.querySelector('.err span');if(s)s.textContent=msg||''}}

 const t=e.target; const id=t.dataset&&t.dataset.lid; if(!id)return; const l=line(id),f=t.dataset.f;
 if(f==='name'){l.name=t.value;if(t.value.trim())setBad(id,'name',null);updateCalc();return}
 if(f==='desc'){l.desc=t.value;autoGrow(t);return}
 if(f==='ownUnit'){l.unit=t.value.trim();UI.raw[fk(id,'ownUnit')]=t.value;return}
 const [dec,max]=NUM[f]; UI.raw[fk(id,f)]=t.value; const r=parseNum(t.value,dec,max);
 if(r.ok||r.empty){
  if(f==='qty'&&r.ok)l.qtyE4=r.v; if(f==='price')l.priceCents=r.ok?r.v:0; if(f==='cost')l.costCents=r.ok?r.v:null;
  if(UI.bad[fk(id,f)]&&r.ok)setBad(id,f,null);
  if(f==='price'&&l.hidden&&l.priceCents!==0){l.hidden=false;toast('Позиция снова видна клиенту: у неё есть цена')}
  if(f==='price'||f==='cost'){const w=document.querySelector(`[data-act="want-cat"][data-id="${id}"]`);if(w){const off=catOffer(l);w.setAttribute('aria-disabled',String(!off.ok));w.setAttribute('aria-checked',String(!!l.wantCat&&off.ok))}}
  if(f==='price'){const h=document.querySelector(`[data-act="hide"][data-id="${id}"]`);if(h){h.setAttribute('aria-disabled',String(l.priceCents!==0&&!l.hidden));h.setAttribute('aria-checked',String(l.hidden))}}
 }
 updateCalc();
});
document.addEventListener('focusout',e=>{
 const t=e.target; const id=t.dataset&&t.dataset.lid; if(!id)return; const f=t.dataset.f; if(!NUM[f])return; const l=line(id); if(!l)return;
 const [dec,max]=NUM[f]; const r=parseNum(t.value,dec,max);
 if(r.err){setBad(id,f,r.err);return}
 if(r.empty&&f==='qty'){setBad(id,f,'Впишите число, например 12.5');return}
 setBad(id,f,null); delete UI.raw[fk(id,f)];

/* ================= жесты: смахивание и перетаскивание ================= */
let G=null, D=null;
function rowEl(id){return document.querySelector(`[data-key="l:${id}"]`)}
function setSx(el,x){el.style.setProperty('--sx',x+'px')}
function closeSwipe(instant){if(!UI.swiped)return;const el=rowEl(UI.swiped.id);UI.swiped=null;if(!el)return;if(instant||reduced()){el.classList.remove('anim');setSx(el,0);return}el.classList.add('anim');setSx(el,0);setTimeout(()=>el.classList.remove('anim'),T.durBase)}
function frameX(x){return x-FR.getBoundingClientRect().left}
function gStart(x,y,target,touch){
 if(sheetCur||menuEl||D)return;
 if(!target.closest||!target.closest('#list'))return startScrollWatch(x,y,target,touch);
 const grip=target.closest('[data-grip]'); const face=target.closest('.li:not(.open) .face'); const field=target.closest('input,textarea,.ed button,.hmore,[data-act="row-del"]');
 G={x0:x,y0:y,x,y,t:performance.now(),touch,mode:'pending',grip:grip?{type:grip.dataset.grip,id:grip.dataset.id}:null,lineId:face?face.closest('.li').dataset.line:null,inOpen:!!target.closest('.li.open'),field:!!field,vx:0,lx:x,lt:performance.now()};
 if(locked()){G.grip=null;G.lineId=null}
 if(touch&&G.lineId&&!G.grip)G.hold=setTimeout(()=>{if(G&&G.mode==='pending')startDrag('line',G.lineId)},T.hold);
}
function startScrollWatch(x,y,target,touch){G={x0:x,y0:y,x,y,touch,mode:'pending',outside:true,inOpen:!!(target.closest&&target.closest('.li.open'))}}
function gMove(x,y,e){
 if(!G)return; const dx=x-G.x0, dy=y-G.y0; const now=performance.now(); G.vx=(x-G.lx)/Math.max(1,now-G.lt); G.lx=x; G.lt=now; G.x=x; G.y=y;
 if(G.mode==='pending'){
  if(G.grip){if(Math.hypot(dx,dy)>=T.dragStart)startDrag(G.grip.type,G.grip.id);else if(e&&e.cancelable)e.preventDefault();if(G&&G.mode!=='drag')return}
  else if(!G.touch){if(G.lineId&&!G.field&&Math.hypot(dx,dy)>=T.dragStart)startDrag('line',G.lineId);else return}
  else if(G.lineId&&Math.abs(dx)>T.slop&&Math.abs(dx)>Math.abs(dy)*1.2&&frameX(G.x0)>=T.leftEdge){clearTimeout(G.hold);beginSwipe()}
  else if(Math.abs(dy)>T.slop){clearTimeout(G.hold);G.mode='scroll';onScrollBegin()}
  else if(Math.abs(dx)>T.slop){clearTimeout(G.hold);G.mode='scroll'}
 }
 if(G.mode==='swipe'){if(e&&e.cancelable)e.preventDefault();swipeMove(dx)}
 else if(G.mode==='drag'){if(e&&e.cancelable)e.preventDefault();dragMove(x,y)}
}
function gEnd(){if(!G)return;clearTimeout(G.hold);const m=G.mode;if(m==='swipe')swipeEnd();else if(m==='drag')dragEnd();G=null}
// начало прокрутки пальцем закрывает открытую строку (DS §8.3) — если палец начал не на ней самой
function onScrollBegin(){
 closeSwipe();
 if(!UI.openId||G.inOpen)return;
 if(rowHasError(UI.openId))return;
 const under=document.elementFromPoint(G.x0,G.y0); const ak=under&&under.closest&&under.closest('[data-key]');
 const anchor=ak&&ak.dataset.key!=='l:'+UI.openId?ak.dataset.key:null;

}
// смахивание строки (DS Б13, строки сметы): влево — «Заменить» и «Удалить», вправо — «Скрыть»; полного смахивания нет
function beginSwipe(){
 if(P.peeks<PEEK_MAX){P.peeks=PEEK_MAX;store.set('peeks',PEEK_MAX)}
 const id=G.lineId;
 if(UI.openId){const ok=closeRow({anchor:'l:'+id});if(!ok){G.mode='scroll';return}}
 if(UI.swiped&&UI.swiped.id!==id)closeSwipe();
 G.mode='swipe'; G.el=rowEl(id); G.el.classList.remove('anim');
 G.base=UI.swiped&&UI.swiped.id===id?UI.swiped.x:0; G.x0=G.x; G.cur=G.base;
}
function swipeMove(dx){const W=T.swipeW;let x=G.base+dx;const maxR=W,maxL=-2*W;if(x>maxR)x=maxR+(x-maxR)*.2;if(x<maxL)x=maxL+(x-maxL)*.2;G.cur=x;setSx(G.el,x)}
function swipeEnd(){
 const W=T.swipeW,x=G.cur,v=G.vx; let to=0;
 if(x<0&&(x<-W*.5||v<-.5))to=-2*W; else if(x>0&&(x>W*.5||v>.5))to=W;
 if(v>.5&&x<0&&G.base<0)to=0; if(v<-.5&&x>0&&G.base>0)to=0;
 const el=G.el; el.classList.add('anim'); setSx(el,to); setTimeout(()=>el.classList.remove('anim'),T.durBase);
 UI.swiped=to?{id:el.dataset.line,x:to}:null; suppressUntil=performance.now()+T.durSlow;
}

/* перетаскивание (DS §14.6, §15.6): ручка — сразу после сдвига 5; строка — удержание 230; мышь — сдвиг 5 */
function startDrag(type,id){
 clearTimeout(G&&G.hold); if(!G)return;
 const o=opt();
 if(type==='line'&&UI.openId&&UI.openId!==id){if(!closeRow({anchor:'l:'+id})){G.mode='scroll';return}}
 if(type==='line'&&UI.openId===id){if(!closeRow({render:true,anchor:'l:'+id})){G.mode='scroll';return}}
 if(type==='sec'&&UI.openId&&!closeRow({anchor:'s:'+id})){G.mode='scroll';return}
 closeSwipe(true);
 G.mode='drag';
 const key=(type==='line'?'l:':'s:')+id;
 let el=document.querySelector(`[data-key="${key}"]`); if(!el){G.mode='scroll';return}
 const r0=el.getBoundingClientRect(); const grabDy=G.y-r0.top;
 const list=$('#list'); const fingerY=G.y;
 // показать «Без раздела» как цель и сложить список (вопрос 4)
 renderList({dragging:true});
 if(type==='line'&&P.fold)list.classList.add('fold');
 if(type==='sec'){list.classList.add('secdrag');const s=o.sections.find(x=>x.id===id);if(!s.parentId)$$('.sec.d1',list).forEach(h=>h.classList.add('hidesub'))}
 list.classList.add('dragging');
 el=document.querySelector(`[data-key="${key}"]`);
 // копия над страницей — в сложенном виде
 const lr=list.getBoundingClientRect(), fr=FR.getBoundingClientRect();
 const fl=document.createElement('div'); fl.className='float'+(list.classList.contains('fold')?' fold':'')+(list.classList.contains('compact')?' compact':'');
 fl.appendChild(el.cloneNode(true)); fl.firstChild.style.setProperty('--sx','0px');
 if(type==='sec'){const n=secCount(o,id);const c=fl.querySelector('.scnt');if(c)c.textContent=posWord(n)}
 fl.style.width=lr.width+'px'; fl.style.left=(lr.left-fr.left)+'px';
 $('#ovl').appendChild(fl);
 const h=fl.getBoundingClientRect().height; const gd=Math.max(8,Math.min(grabDy,h-8));
 // спрятать саму строку (раздел — со всем, что в нём)
 const hide=[el]; if(type==='sec'){const s=o.sections.find(x=>x.id===id);const ids=new Set([id,...o.sections.filter(x=>x.parentId===id).map(x=>x.id)]);
  $$('[data-key]',list).forEach(x=>{const k=x.dataset.key;if(k.startsWith('s:')&&ids.has(k.slice(2))&&x!==el)hide.push(x);if(k.startsWith('l:')){const l=line(k.slice(2));if(l&&ids.has(secOf(o,l)))hide.push(x)}})}
 // место откуда взяли: индекс следующего видимого элемента
 const all=$$('[data-key]',list).filter(x=>x.offsetParent!==null);
 const after=all.slice(all.indexOf(el)+1).find(x=>!hide.includes(x));
 hide.forEach(x=>x.classList.add('dg-hide'));
 const els=$$('[data-key]',list).filter(x=>x.offsetParent!==null);
 const originIdx=after?els.indexOf(after):els.length;
 const snapRects=els.map(x=>{const r=x.getBoundingClientRect();return{el:x,key:x.dataset.key,top:r.top+scrollY,bottom:r.bottom+scrollY}});
 const gaps=type==='line'?lineGaps(o,snapRects):secGaps(o,snapRects,id);
 let gi=gaps.findIndex(g=>g.idx===originIdx); if(gi<0)gi=gaps.reduce((b,g,i)=>Math.abs(g.idx-originIdx)<Math.abs(gaps[b].idx-originIdx)?i:b,0);
 // докрутить страницу, чтобы место строки оказалось под пальцем
 const slotY=gaps[gi].y-scrollY; window.scrollBy(0,slotY-(fingerY-gd));
 const ins=document.createElement('div'); ins.className='ins'; list.appendChild(ins);
 D={type,id,grabDy:gd,h,fl,els:snapRects,gaps,gi,originGi:gi,ins,y:G.y,x:G.x,hide,listTop:lr.top+scrollY,raf:0,lastV:0};
 placeFloat(); applyGap(gi,true);
 if(!reduced()){fl.style.transition='none';fl.style.transform=`translateY(${D.y-gd}px)`;fl.getBoundingClientRect();fl.style.transition='';fl.style.transform=`translateY(${D.y-gd}px) scale(var(--lift-scale)) rotate(var(--lift-tilt))`;setTimeout(()=>{if(D&&D.fl===fl)fl.style.transition='none'},T.durSlow)}
 else fl.style.transform=`translateY(${D.y-gd}px)`;
 haptic('light');
 D.raf=requestAnimationFrame(autoScroll);
}
function lineGaps(o,els){
 const gaps=[]; const kindOf=e=>e.key.startsWith('l:')?'line':'sec';
 for(let i=0;i<=els.length;i++){
  const prev=els[i-1], next=els[i]; let tgt=null;
  if(next&&kindOf(next)==='line'){const l=line(next.key.slice(2));tgt={sec:secOf(o,l),before:l.id}}
  else if(prev){if(kindOf(prev)==='line'){const l=line(prev.key.slice(2));tgt={sec:secOf(o,l),before:null}}else{const sid=prev.key.slice(2);tgt={sec:sid==='loose'?null:sid,before:null}}}
  if(!tgt)continue;
  const y=next?next.top:prev.bottom; gaps.push({idx:i,y,tgt});
 }
 return gaps;
}
function secGaps(o,els,id){
 const s=o.sections.find(x=>x.id===id); const sub=!!s.parentId; const gaps=[];
 const headers=els.map((e,i)=>({e,i})).filter(x=>x.e.key.startsWith('s:')&&x.e.key!=='s:loose');
 const secById=k=>o.sections.find(x=>x.id===k.slice(2));
 if(!sub){
  headers.forEach(({e,i})=>{const t=secById(e.key);if(t&&!t.parentId)gaps.push({idx:i,y:e.top,tgt:{parent:null,before:t.id}})});
  const loose=els.findIndex(e=>e.key==='s:loose'); const endIdx=loose>=0?loose:els.length; const last=els[endIdx-1];
  gaps.push({idx:endIdx,y:loose>=0?els[loose].top:(last?last.bottom:0),tgt:{parent:null,before:null}});
 }else{
  // подраздел: перед любым подразделом или в конец любого раздела
  const tops=headers.filter(x=>{const t=secById(x.e.key);return t&&!t.parentId});
  tops.forEach((tp,ti)=>{
   const nextTop=tops[ti+1]; const endI=nextTop?nextTop.i:(els.findIndex(e=>e.key==='s:loose')>=0?els.findIndex(e=>e.key==='s:loose'):els.length);
   for(let i=tp.i+1;i<endI;i++){const t=secById(els[i].key);if(els[i].key.startsWith('s:')&&t&&t.parentId)gaps.push({idx:i,y:els[i].top,tgt:{parent:tp.e.key.slice(2),before:t.id}})}
   const last=els[endI-1]; gaps.push({idx:endI,y:last.bottom,tgt:{parent:tp.e.key.slice(2),before:null}});
  });
 }
 return gaps;
}
function placeFloat(){const sc=reduced()?'':' scale(var(--lift-scale)) rotate(var(--lift-tilt))';D.fl.style.transition='none';D.fl.style.transform=`translateY(${D.y-D.grabDy}px)${sc}`}
function applyGap(gi,first){
 const g=D.gaps[gi]; D.gi=gi;
 D.els.forEach((e,i)=>{e.el.style.transform=i>=g.idx?`translateY(${D.h}px)`:''});
 D.ins.style.top=(g.y-D.listTop+D.h/2-1)+'px';
 $$('.sec.drop').forEach(x=>x.classList.remove('drop'));
 const sid=D.type==='line'?g.tgt.sec:g.tgt.parent; const crossed=!first&&sid!==D.sec; D.sec=sid; const hdr=sid?document.querySelector(`[data-key="s:${sid}"]`):(D.type==='line'?document.querySelector('[data-key="s:loose"]'):null);
 hdr&&hdr.classList.add('drop');
 if(crossed)haptic('selection');
}
function visualY(g){const cur=D.gaps[D.gi];return g.idx<cur.idx?g.y:g.idx===cur.idx?g.y+D.h/2:g.y+D.h}
function dragMove(x,y){
 D.x=x;D.y=y; placeFloat();
 const c=y-D.grabDy+D.h/2+scrollY;
 let best=D.gi,bd=Math.abs(visualY(D.gaps[D.gi])-c);
 D.gaps.forEach((g,i)=>{const d=Math.abs(visualY(g)-c);if(d<bd-6){bd=d;best=i}});
 if(best!==D.gi)applyGap(best);
}
function autoScroll(){
 if(!D)return; const top=visTop(), bot=visBottom(); let v=0;
 if(D.y<top+T.edge)v=-Math.pow(Math.min(1,(top+T.edge-D.y)/T.edge),2)*18;
 else if(D.y>bot-T.edge)v=Math.pow(Math.min(1,(D.y-(bot-T.edge))/T.edge),2)*18;
 if(v){const b=scrollY;window.scrollBy(0,v);if(scrollY!==b)dragMove(D.x,D.y)}
 D.raf=requestAnimationFrame(autoScroll);
}
function dragEnd(){
 const d=D; D=null; cancelAnimationFrame(d.raf); suppressUntil=performance.now()+T.durSlow;
 const g=d.gaps[d.gi]; const changed=d.gi!==d.originGi&&!sameSpot(d,g);
 const o=opt(); const snap=snapOpt();
 // копия «приземляется» на место
 const land=g.y-scrollY+(d.gaps[d.gi].idx>=0?0:0);
 const finish=()=>{
  const list=$('#list'); const flTop=d.fl.getBoundingClientRect().top; d.fl.remove(); d.ins.remove();
  if(changed){if(d.type==='line')moveLine(d.id,g.tgt);else moveSection(d.id,g.tgt)}
  const before=capture(list); const key=(d.type==='line'?'l:':'s:')+d.id; before.set(key,flTop);
  list.classList.remove('fold','secdrag','dragging'); d.els.forEach(e=>e.el.style.transform='');
  list.innerHTML=listHTML(false); list.classList.toggle('compact',P.view==='compact');
  const now=topOf(key); if(now!=null)window.scrollBy(0,now-flTop);
  flip(list,before,{fadeNew:false}); updateCalc();
  if(changed){pulse(key);haptic('medium');toast(d.type==='line'?'Позиция перенесена':'Раздел перенесён',{undo:()=>{restoreOpt(snap);renderList({flip:true})}})}
 };
 if(reduced())return finish();
 d.fl.style.transition=`transform ${T.durSlow}ms ${SPRING}, box-shadow ${T.durSlow}ms ${EASE}`; d.fl.style.transform=`translateY(${land}px) scale(1) rotate(0deg)`; d.fl.style.boxShadow='none';
 setTimeout(finish,T.durSlow);
}
function sameSpot(d,g){ // бросок туда же, где взяли — не перенос
 if(d.type==='line'){const o=opt();const l=line(d.id);const sec=secOf(o,l);const same=o.lines.filter(x=>secOf(o,x)===sec);const k=same.indexOf(l);const nxt=same[k+1];return g.tgt.sec===sec&&(g.tgt.before===(nxt?nxt.id:null))}
 const o=opt();const s=o.sections.find(x=>x.id===d.id);const sib=o.sections.filter(x=>(x.parentId||null)===(s.parentId||null));const k=sib.indexOf(s);const nxt=sib[k+1];return (g.tgt.parent||null)===(s.parentId||null)&&g.tgt.before===(nxt?nxt.id:null);
}
// касания (палец) и мышь
// касание слушаем на самом элементе, которого коснулся палец: при перерисовке списка он уходит со страницы,
// и браузер шлёт движения пальца только ему (в приложении этим занимается Gesture Handler)
let touchTgt=null;
const tMove=e=>{if(!G)return;const t=e.touches[0];gMove(t.clientX,t.clientY,e)};
const tEnd=()=>{if(touchTgt){touchTgt.removeEventListener('touchmove',tMove);touchTgt.removeEventListener('touchend',tEnd);touchTgt.removeEventListener('touchcancel',tEnd);touchTgt=null}gEnd()};
document.addEventListener('touchstart',e=>{if(e.touches.length>1){G&&clearTimeout(G.hold);if(!D)G=null;return}
 if(touchTgt)tEnd(); touchTgt=e.target; touchTgt.addEventListener('touchmove',tMove,{passive:false}); touchTgt.addEventListener('touchend',tEnd); touchTgt.addEventListener('touchcancel',tEnd);
 const t=e.touches[0];gStart(t.clientX,t.clientY,e.target,true)},{passive:true});
document.addEventListener('mousedown',e=>{if(e.button!==0)return;if(performance.now()-lastTouch<800)return;gStart(e.clientX,e.clientY,e.target,false)});
document.addEventListener('mousemove',e=>{if(G&&!G.touch)gMove(e.clientX,e.clientY,e)});
document.addEventListener('mouseup',()=>{if(G&&!G.touch)gEnd()});
let lastTouch=0;document.addEventListener('touchstart',()=>{lastTouch=performance.now()},{passive:true,capture:true});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.face'))e.preventDefault()});
// без жеста касания (колесо мыши, прокрутка трекпадом) строка не закрывается: DS §8.3 говорит о «прокрутке пальцем»
addEventListener('scroll',()=>{$('#hdr').classList.toggle('scrolled',scrollY>8)},{passive:true});

/* ================= рамка, тема, ширина ================= */
function applyTheme(){const r=document.documentElement;r.setAttribute('data-size',P.size);if(P.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',P.theme)}
function layoutFor(w){return w<820?'phone':w<1100?'tablet':'desktop'}
function applyWidth(){
 const wide=innerWidth>=900; document.body.classList.toggle('wide-host',wide&&(P.width||390)<innerWidth);
 FR.style.setProperty('--fw',wide?(P.width||390)+'px':'100%');
 const w=layoutFor(Math.min(FR.getBoundingClientRect().width||innerWidth,innerWidth));
 if(FR.dataset.w!==w){FR.dataset.w=w;UI.swiped=null;renderAll()} else syncFrame();
}
function syncFrame(){const r=FR.getBoundingClientRect();document.documentElement.style.setProperty('--fx',r.left+'px');document.documentElement.style.setProperty('--fwpx',r.width+'px')}
addEventListener('resize',()=>applyWidth());

/* ================= сдвиг-подсказка первой позиции ================= */
const PEEK_MAX=3; let peekObs=null, peekDone=false;
function armPeek(force){
 if(peekObs){peekObs.disconnect();peekObs=null}
 if(reduced()||locked()||(!force&&(peekDone||P.peeks>=PEEK_MAX)))return;
 const first=document.querySelector('#list .li:not(.open)'); if(!first||!('IntersectionObserver' in window))return;
 peekObs=new IntersectionObserver(es=>{for(const e of es){if(e.isIntersecting&&e.intersectionRatio>=.9){peekObs.disconnect();peekObs=null;setTimeout(()=>runPeek(e.target.dataset.line),T.durSlow)}}},{threshold:[.9]});
 peekObs.observe(first);
}
function runPeek(id){
 const el=rowEl(id); if(!el||UI.swiped||UI.openId===id||G||D)return;
 peekDone=true; P.peeks=(P.peeks||0)+1; store.set('peeks',P.peeks);
 const W=T.swipeW, steps=[[-W*1.4,T.durSlow+T.durBase],[0,T.durSlow],[W*.8,T.durSlow+T.durBase],[0,T.durSlow]];
 el.classList.add('anim','peek'); let t=0;
 steps.forEach(([x,hold])=>{setTimeout(()=>{if(G||UI.swiped||!el.isConnected)return;setSx(el,x)},t);t+=hold});
 setTimeout(()=>el.classList.remove('anim','peek'),t);
}
/* ================= запуск ================= */
applyTheme();
FR.dataset.w=layoutFor(innerWidth>=900?(P.width||390):innerWidth);
renderAll(); applyWidth(); armPeek();
</script>
