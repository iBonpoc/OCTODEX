<!doctype html>
<!-- Спека 67, макеты «как предлагаю» (#2511). Только токены дизайн-системы: design/naryad-ds/tokens/*.css.
     Открыть: mockups.html#screen=v1-list&theme=light  (screen: v1-list, v1-card, v2-list, v2-card, compare-list, compare-card). -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gutters — макеты</title>
<link rel="stylesheet" href="../../../../design/naryad-ds/tokens/foundation.css">
<link rel="stylesheet" href="../../../../design/naryad-ds/tokens/theme.css">
<link rel="stylesheet" href="../../../../design/naryad-ds/tokens/status.css">
<link rel="stylesheet" href="../../../../design/naryad-ds/tokens/components.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font); color: var(--ink); background: var(--ground); -webkit-font-smoothing: antialiased; }
  .phone { width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--ground); }
  .scroll { position: absolute; inset: 0 0 0 0; padding: 0 16px 200px; overflow: hidden; }
  /* шапка v2 (DS §12.13): круги 40 сверху, заголовок 30/600 */
  .top { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; height: 52px; }
  .round { width: 40px; height: 40px; border-radius: 20px; background: var(--surf2); display: grid; place-items: center; }
  .round.sm { width: 32px; height: 32px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .back { display: flex; align-items: center; gap: 4px; color: var(--mut); font-size: 15px; font-weight: 600; }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .help { width: 18px; height: 18px; border-radius: 9px; font-size: 11px !important; background: var(--surf2); font-size: 13px; font-weight: 700; display: grid; place-items: center; color: var(--mut); }
  .sub { font-size: 13px; color: var(--mut); font-weight: 500; margin-top: 4px; }
  .search { margin-top: 16px; height: 44px; border-radius: 22px; background: var(--surf); display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--mut); font-size: 15px; }
  /* ListGroup / GroupRow (src/ui/groupedList.tsx): заголовок 17/700, справа «Все ›» 13/600 */
  .gh { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 4px 10px; }
  .gh b { font-size: 17px; font-weight: 700; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
  .cnt { height: 24px; min-width: 28px; padding: 0 8px; border-radius: 12px; background: var(--surf); box-shadow: inset 0 1px 0 var(--hl); font-size: 13px; font-weight: 700; color: var(--mut); display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
  .gh span { font-size: 13px; font-weight: 600; color: var(--mut); }
  .card { background: var(--surf); border-radius: 22px; box-shadow: inset 0 1px 0 var(--hl); overflow: hidden; }
  .gr { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 64px; position: relative; }
  .gr + .gr::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--off); }
  .gr .t { flex: 1; min-width: 0; }
  .gr .n { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gr .m { font-size: 13px; color: var(--mut); font-weight: 500; margin-top: 2px; }
  .gr .r { text-align: right; font-size: 12px; color: var(--mut); font-weight: 600; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .thumb { width: 40px; height: 40px; border-radius: 13px; background: var(--surf2); display: grid; place-items: center; flex: none; }
  .ico { width: 40px; height: 40px; border-radius: 13px; background: var(--surf2); display: grid; place-items: center; flex: none; color: var(--ink); }
  .chev { color: var(--mut); flex: none; }
  /* плашка статуса: 24, радиус 12, значок 13 + слово 12/600 */
  .pill { height: 24px; border-radius: 12px; padding: 0 9px 0 7px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.ok { background: var(--st-ok); color: var(--st-ok-text); } .pill.info { background: var(--st-info); color: var(--st-info-text); }
  .pill.warn { background: var(--st-warn); color: var(--st-warn-text); } .pill.neutral { background: var(--st-neutral); color: var(--st-neutral-text); }
  .act { height: 40px; border-radius: 20px; padding: 0 14px; display: inline-flex; align-items: center; background: var(--surf2); font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  /* кнопки: капсула 40, 15/700; залитая acc — одна на экран */
  .btn { height: 40px; border-radius: 20px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .btn.pri { background: var(--acc); color: var(--on-acc); box-shadow: inset 0 0 0 1px var(--acc-edge); }
  .btn.sec { background: var(--surf2); color: var(--acc-text); box-shadow: inset 0 0 0 1px var(--bd-field); }
  .btn.wide { width: 100%; }
  .btn svg, .round svg { flex: none; }
  .btn.sm { height: 40px; padding: 0 12px; font-size: 15px; gap: 4px; }
  .pair.col { flex-direction: column; } .pair.col .btn { flex: none; width: 100%; }
  .nw { white-space: nowrap; }
  .kc .help { background: var(--surf3); }
  .later { font-size: 13px; font-weight: 500; color: var(--mut); margin-top: 8px; }
  /* панель вкладок: 56 + нижняя зона, значок 22 + слово 12, активная accText без заливки */
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: var(--tab); display: flex; padding: 8px 6px 0; }
  .tabbar div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--mut); position: relative; }
  .tabbar div.on { color: var(--acc-text); }
  .badge { position: absolute; top: -4px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--st-bad-text); color: var(--surf-solid); font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
  .meta { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; font-size: 13px; color: var(--mut); font-weight: 500; }
  .sheet { margin-top: 16px; background: var(--surf); border-radius: 22px; padding: 12px; box-shadow: inset 0 1px 0 var(--hl); position: relative; }
  .paper { background: var(--bg); color: var(--ink); border-radius: 14px; height: 176px; display: grid; place-items: center; }
  .sheet .edit { position: absolute; right: 20px; top: 20px; }
  .trio { display: flex; gap: 8px; margin-top: 8px; }
  .trio div { flex: 1; background: var(--surf2); border-radius: 14px; padding: 10px 12px; }
  .trio b { display: block; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .trio span { font-size: 12px; font-weight: 600; color: var(--mut); }
  .seg { margin-top: 16px; height: 36px; border-radius: 18px; background: var(--surf); padding: 3px; display: flex; box-shadow: inset 0 1px 0 var(--hl); }
  .seg div { flex: 1; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--mut); border-radius: 15px; }
  .seg div.on { background: var(--surf3); color: var(--ink); }
  /* ViewTabs (DS §9 А1п): без дорожки, невыбранная без подложки mut, выбранная — заливка, ink 600; пилюля 30 */
  .vt { margin: 16px -16px 0; padding: 0 16px; display: flex; gap: 8px; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - var(--tab-fade-w)), transparent); }
  .vt div { height: var(--tab-h); padding: 0 12px; border-radius: 15px; display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 500; color: var(--mut); white-space: nowrap; flex: none; font-weight: 400; }
  .vt div.on { background: var(--surf3); color: var(--ink); font-weight: 600; }
  .vt small { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--mut); }
  /* NowCard «Сейчас» (DS §12.12): surf, радиус карточки, рамка acc (светлая — accEdge), кикер 12 прописными, имя 17, строка 13, кнопка 40 во всю ширину */
  [data-theme="dark"] { --now-edge: var(--acc); } [data-theme="light"] { --now-edge: var(--acc-edge); }
  .now { margin-top: 16px; background: var(--surf); border-radius: 22px; padding: 14px 16px 16px; box-shadow: inset 0 0 0 1px var(--now-edge); }
  .now .k { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--mut); }
  .now .k > span:first-child { letter-spacing: .04em; text-transform: uppercase; }
  .now .tt { font-size: 17px; font-weight: 700; margin-top: 8px; }
  .now .ln { font-size: 13px; font-weight: 500; color: var(--mut); margin-top: 2px; }
  .now .btn { margin-top: 12px; }
  /* «● Демо» (DS §12.13 «Где версия и „Демо“»): плашка 20, warn — точка + слово */
  .demo { height: 20px; border-radius: 10px; padding: 0 8px 0 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; background: var(--st-warn); color: var(--st-warn-text); }
  .demo i { width: 6px; height: 6px; border-radius: 3px; background: currentColor; }
  .rootline { margin-top: 6px; font-size: 13px; }
  .parent { font-size: 15px; font-weight: 600; color: var(--ink); }
  .rule { height: 1px; width: 40px; background: var(--off); margin-top: 12px; }
  .kind { font-size: 15px; font-weight: 600; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
  .hst { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--mut); margin-top: 2px; }
  .go { font-size: 13px; font-weight: 600; color: var(--mut); }
  .cap { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--mut); margin: 20px 4px 0; }
  .pair { display: flex; gap: 12px; margin-top: 12px; } .pair .btn { flex: 1 1 0; min-width: 0; padding: 0 10px; gap: 6px; }
  .next { margin-top: 16px; font-size: 15px; font-weight: 500; color: var(--ink); }
  .sheet .edit.btn { position: absolute; right: 20px; top: 20px; }
  .gnote { font-size: 13px; font-weight: 500; color: var(--mut); margin: 8px 4px 0; }
  /* три карточки под чертежом: gutter · переходники (делится на части) · downspout */
  /* тройка: одна карточка surf (NumberTrio), ячейки surf2 одной высоты */
  .kpi { display: grid; grid-template-columns: 84px 1fr 96px; gap: 8px; margin-top: 8px; padding: 8px; background: var(--surf); border-radius: 22px; box-shadow: inset 0 1px 0 var(--hl); align-items: stretch; }
  .kc { background: var(--surf2); border-radius: 14px; padding: 10px 10px; min-width: 0; }
  .kc b { display: block; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kc > span { font-size: 12px; font-weight: 600; color: var(--mut); display: block; }
  .kc em { display: block; font-style: normal; font-size: 12px; font-weight: 500; color: var(--mut); margin-top: 4px; }
  .kc small { font-size: 12px; font-weight: 600; color: var(--mut); }
  .kc.fit { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .kc.fit > span { padding: 8px 10px; display: flex; align-items: center; gap: 4px; box-shadow: inset 0 -1px 0 var(--bd); }
  .kc.fit i.help { font-style: normal; }
  .kc.fit .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--bd); flex: 1; }
  .kc.fit .parts div { padding: 8px 8px; background: var(--surf2); min-width: 0; }
  .kc.fit.odd .parts div:last-child { grid-column: 1 / -1; }
  .kc.fit .parts span { font-size: 12px; font-weight: 600; color: var(--mut); white-space: nowrap; }
  .kc.fit .more b { font-size: 15px; }
  .sost { display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 4px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .sost svg { color: var(--mut); }
  .saved { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--mut); margin-top: 8px; }
  .saved.warnline { color: var(--st-warn-text); }
  .gnote { border: 1px dashed var(--dash); border-radius: 10px; padding: 6px 10px; }
  .sheet { padding: 0 !important; background: none !important; box-shadow: none !important; }
  .sheet .paper { border-radius: 22px; }
  .sheet .exp { position: absolute; right: 12px; bottom: 12px; width: 32px; height: 32px; border-radius: 16px; background: var(--surf); display: grid; place-items: center; color: var(--mut); }
  .phone.se { width: 375px; height: 667px; }
  .vt small { font-size: 13px; color: var(--mut); }
  .next svg { vertical-align: -2px; color: var(--st-warn-text); }
  .money { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
  /* сравнение */
  .cmp { display: flex; gap: 28px; padding: 24px; background: var(--page); width: max-content; }
  .cmp figure { display: flex; flex-direction: column; gap: 10px; }
  .cmp figcaption { max-width: 390px; font-size: 17px; font-weight: 700; color: var(--ink); }
  .cmp figcaption small { display: block; font-size: 13px; font-weight: 500; color: var(--mut); margin-top: 2px; max-width: 390px; }
  .cmp img, .cmp .phone { width: 390px; height: 844px; border-radius: 28px; box-shadow: 0 0 0 1px var(--off); }
  .cmp iframe { width: 390px; height: 844px; border: 0; border-radius: 28px; box-shadow: 0 0 0 1px var(--off); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const theme = P.get("theme") || "light", screen = P.get("screen") || "v1-list";
document.documentElement.dataset.theme = theme;
const svg = (d, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  plus: '<path d="M12 5v14M5 12h14"/>', more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/>', chev: '<path d="m9 6 6 6-6 6"/>', back: '<path d="m15 6-6 6 6 6"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', pin: '<path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  home: '<path d="M4 11 12 4l8 7v9H4z"/>', users: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 0 1 0 6M21 20c0-2-1-4-3-5"/>',
  money: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M12 9v6M10 10.5h3a1.5 1.5 0 0 1 0 3h-2"/>', leads: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>',
  gut: '<path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h5"/>', clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>', crew: '<path d="M4 18c0-3 3-5 8-5s8 2 8 5"/><path d="M7 11a5 5 0 0 1 10 0z"/>',
  ruler: '<path d="M3 15 15 3l6 6L9 21z"/><path d="m7 11 2 2M10 8l2 2M13 5l2 2"/>', box: '<path d="M4 7 12 3l8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>',
  cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>', expand: '<path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/>', wifiOff: '<path d="M2 8.5a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/><path d="M3 3l18 18"/>', bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>', alert: '<path d="M12 4 2 20h20z"/><path d="M12 10v4M12 17v.5"/>', arrowLeft: '<path d="M19 12H5M11 6l-6 6 6 6"/>', camera: '<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M9 7l1.5-3h3L15 7"/>', list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/>',
  userPlus: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M19 8v6M16 11h6"/>',
  dot: '<circle cx="12" cy="12" r="7" stroke-dasharray="2.5 2.5"/>', check: '<path d="m5 12 5 5 9-10"/>', send: '<path d="M4 12 20 4l-6 16-3-7z"/>',
};
const ic = (n, s) => svg(I[n], s);
// миниатюра чертежа — тот же контур, что на холсте
const mini = (w = 28) => `<svg width="${w}" height="${w}" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9h26v22H6"/><circle cx="6" cy="9" r="2.5" fill="currentColor"/><circle cx="6" cy="31" r="2.5" fill="currentColor"/></svg>`;
const big = `<svg width="270" height="171" viewBox="0 0 300 190" fill="none" stroke="currentColor"><path d="M40 40h190v110H40" stroke-width="3.5"/><circle cx="40" cy="40" r="6" fill="var(--bg)" stroke-width="2.5"/><circle cx="40" cy="150" r="6" fill="var(--bg)" stroke-width="2.5"/><circle cx="230" cy="95" r="6" fill="var(--bg)" stroke-width="2.5"/><g font-family="system-ui" font-size="13" fill="currentColor" stroke="none"><text x="112" y="28">28′ 9″</text><text x="240" y="99">33′ 2″</text><text x="112" y="172">28′ 9″</text><text x="30" y="62">D1</text><text x="30" y="140">D2</text><text x="206" y="118">D3</text></g></svg>`;

// мастер (§8.3 п.3, nav/sections.ts: у мастера «Денег» нет): Главная · План · Gutters · Клиенты · Лиды — макет по совету §8.3, ждёт ответа
const TABS = [["home", "Главная"], ["gut", "Gutters"], ["users", "Клиенты"], ["money", "Деньги"], ["leads", "Лиды"]];
const TABS_MASTER = [["home", "Главная"], ["cal", "План"], ["gut", "Gutters"], ["users", "Клиенты"], ["leads", "Лиды"]];
const tabbar = (on, set = TABS) => `<div class="tabbar">${set
  .map(([i, l]) => `<div class="${l === on ? "on" : ""}">${ic(i, 22)}${l}${l === "Лиды" ? '<span class="badge">2</span>' : ""}</div>`).join("")}</div>`;
const demo = `<span class="demo"><i></i>Демо</span>`;
// шапка корня (DS §12.13 root, «Обвязка списка»): аватар; справа поиск значком · «＋» · «⋯»; строка 13 с «● Демо»; заголовок 30/600 и «?»
const headRoot = (title) => `<div class="top"><div class="round" style="background:var(--tint)"><b style="font-size:15px">AP</b></div>
  <div class="row"><div class="round">${ic("search")}</div><span class="btn sec sm">${ic("plus", 16)}Замер</span><div class="round">${ic("more")}</div></div></div>
  <div class="rootline">${demo}</div><h1 style="margin-top:4px">${title}<span class="help">?</span></h1>`;
// шапка объекта (DS §12.13 object): «←» 40 (arrowLeft) · слово родителя · «● Демо»; справа «?» · «⋯»; имя 30/600 · черта 1×40 ·
// две строки: «что это · метка» 15/600 и статус значком и словом 13/500 mut без плашки (HeadStatus). Адрес — строкой на «Обзоре»
// шапка объекта (DS §12.13 object): «←» 40 · слово родителя · «● Демо»; справа только «⋯»; имя 30/600 · черта 1×40 ·
// «что это · метка» 15/600 и «?» 18 вплотную справа от надписи (DS «?»: не в углу) · статус значком и словом без плашки (HeadStatus)
const headObj = (name, status, kind = "Замер · 24 нояб.") => `<div class="top"><div class="row"><div class="round">${ic("arrowLeft", 22)}</div><span class="parent">Gutters</span>${demo}</div>
  <div class="row"><div class="round">${ic("more")}</div></div></div>
  <h1>${name}</h1><div class="rule"></div>
  <div class="kind">${kind}<span class="help">?</span></div><div class="hst">${status}</div>`;
const hst = (icon, word) => `${ic(icon, 14)}<span>${word}</span>`;
const row = (lead, n, m, right, chev = true) => `<div class="gr">${lead}<div class="t"><div class="n">${n}</div>${m ? `<div class="m">${m}</div>` : ""}</div>${right ? `<div class="r">${right}</div>` : ""}${chev ? `<span class="chev">${ic("chev", 18)}</span>` : ""}</div>`;
const group = (title, rows, link, n) => `<div class="gh"><b>${title}${n != null ? `<span class="cnt">${n}</span>` : ""}</b>${link ? `<span>${link}</span>` : ""}</div><div class="card">${rows.join("")}</div>`;
const pill = (tone, icon, word) => `<span class="pill ${tone}">${ic(icon, 13)}${word}</span>`;
const th = `<div class="thumb">${mini()}</div>`;
// «сегодня» — 25 нояб.; замер Linda — 24 нояб. (одна дата на карточке и в списке)
// дата — справа под состоянием, адрес — одной строкой (не рвать число и слово)
const when = (a) => a;
const rt = (x, d) => `${x}<span class="nw">${d}</span>`;
const rLinda = row(th, "Linda Alvarez", when("2207 Ocean Park Blvd"), rt(pill("neutral", "doc", "Не отправлена"), "24&nbsp;нояб."));
// у мастера то же состояние тем же словом, что в карточке
const rLindaMaster = row(th, "Linda Alvarez", when("2207 Ocean Park Blvd"), rt(pill("neutral", "doc", "Смета у офиса"), "24&nbsp;нояб."));
const rLindaSum = row(th, "Linda Alvarez", when("2207 Ocean Park Blvd"), rt(`<span class="money">$2,113.67</span>`, "24&nbsp;нояб."));
const rMark = row(th, "Mark Chen", when("1520 Elm St"), rt(pill("info", "doc", "Отправлена"), "23&nbsp;нояб."));
const rRosa = row(th, "Rosa Diaz", when("88 Pine Ave"), rt(pill("ok", "check", "Подписана"), "21&nbsp;нояб."));
const rDraft = row(th, "Без клиента · 9:15", "Gutter 46 ft · Downspout 1", "");
// выезд-осмотр — значок календаря (не «часы» тона info)
const visit = (n, when, a) => row(`<div class="ico">${ic("cal")}</div>`, n, `${when} · ${a}`, "");
const waitRows = [visit("Tom Reyes", "сегодня 10:00", "73 Birch Ln"), visit("Kevin Wu", "завтра 9:00", "41 Oak Rd")];

const S = {};
S["v1-list"] = () => `<div class="phone"><div class="scroll">${headRoot("Gutters")}
  ${group("Черновики", [rDraft], "", 1)}
  ${group("Замеры", [rLinda, rMark, rRosa], "", 3)}
  </div>${tabbar("Gutters")}</div>`;
// В2 (выбор #2517). «Ждут замера» — по умолчанию #2678: только записанные осмотры без замера (сегодня и ближайшие дни); нажатие строки — замер.
// Смета собирается сама (#2676): «Ждут отправки» — у офиса и директора; у мастера группы нет (экран v2-list-master)
S["v2-list"] = () => `<div class="phone"><div class="scroll">${headRoot("Gutters")}
  ${group("Ждут замера", waitRows, "", 2)}<div class="gnote">Макет: в группе — записанные осмотры без замера (по умолчанию, ждёт ответа #2678). Нажатие строки начинает замер</div>
  ${group("Ждут отправки", [rLindaSum], "", 1)}
  ${group("Черновики", [rDraft], "", 1)}
  ${group("Последние", [rMark, rRosa], "Все замеры ›")}
  </div>${tabbar("Gutters")}</div>`;
// мастер: денег нет — нет «Ждут отправки», в строках без сумм
S["v2-list-master"] = () => `<div class="phone"><div class="scroll">${headRoot("Gutters")}
  <div class="gnote" style="margin-top:12px">Макет: у мастера «План» остаётся, «Денег» нет, Gutters — на свободное место (совет §8.3, ждёт ответа)</div>
  ${group("Ждут замера", waitRows, "", 2)}
  ${group("Черновики", [rDraft], "", 1)}
  ${group("Последние", [rLindaMaster, rMark, rRosa], "Все замеры ›")}
  </div>${tabbar("Gutters", TABS_MASTER)}</div>`;
S["v2-list-empty"] = () => `<div class="phone"><div class="scroll">${headRoot("Gutters")}
  <div class="card" style="margin-top:20px;padding:24px 20px;text-align:center"><div class="ico" style="margin:0 auto">${mini()}</div>
  <div class="tt" style="font-size:17px;font-weight:700;margin-top:12px">Замеров пока нет</div>
  <div class="m" style="font-size:13px;color:var(--mut);margin-top:4px">Записанные осмотры попадут в «Ждут замера»</div><div class="gnote" style="text-align:left;margin-top:12px">Макет: кто в «Ждут замера» — по умолчанию, ждёт ответа #2678</div>
  <span class="btn sec" style="margin-top:16px">${ic("plus", 18)}Замер</span></div>
  </div>${tabbar("Gutters")}</div>`;
// превью чертежа — одна поверхность (без рамки в рамке), значок «развернуть»
const sheet = `<div class="sheet"><div class="paper">${big}</div><span class="exp">${ic("expand", 16)}</span></div>`;
const act = (pri, priIcon, sec = "Править чертёж") => `<div class="pair">${pri ? `<span class="btn pri">${ic(priIcon, 18)}${pri}</span>` : ""}${sec ? `<span class="btn sec">${ic("pencil", 18)}${sec}</span>` : ""}</div>`;
const next = (t) => `<div class="next">${t}</div>`;
// тройка (#2677) — одна карточка surf с ячейками surf2, как NumberTrio (§12.12): слева ft gutter (по профилям второй строкой),
// в центре «Переходники» (2 — в ряд, 3 — 2 + 1 во всю ширину, 4 — 2×2, 5 — 2+2+1, 6 — 2×3, 7+ — 5 и «ещё N ›»), справа downspout и его футы
const kpi = (fits, more = 0) => {
  const cells = fits.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join("") + (more ? `<div class="more"><b>ещё ${more}</b><span>Состав ›</span></div>` : "");
  const odd = (fits.length + (more ? 1 : 0)) % 2 === 1;
  return `<div class="kpi"><div class="kc"><b>91 <small>ft</small></b><span>Gutter</span><em>5″&nbsp;K&nbsp;64<br>6″&nbsp;K&nbsp;27</em></div>
  <div class="kc fit${odd ? " odd" : ""}"><span>Переходники <i class="help">?</i></span><div class="parts">${cells}</div></div>
  <div class="kc"><b>3</b><span>Downspout</span><em>52 ft</em></div></div>`;
};
// числа фитингов — макет (3 downspout по одному каждого); в коде — из движка для этого чертежа
const FITS = [["3", "A Elbow"], ["3", "B Elbow"], ["2", "A Offset"]];
const fitNote = `<div class="gnote">Макет: состав «Переходников» — умолчание, ждёт ответа #2679</div>`;
const trio = kpi(FITS) + fitNote + `<div class="sost"><span>Состав · 14</span>${ic("chev", 16)}</div>`;
const addr = group("", [row(`<div class="ico">${ic("pin")}</div>`, "2207 Ocean Park Blvd", "Santa Monica, CA", `<span class="go">Маршрут</span>`)]);
const docs = group("Файлы", [
  row(`<div class="ico">${ic("doc")}</div>`, "Клиенту", "Чертёж без цен · EN", ""),
  row(`<div class="ico">${ic("crew")}</div>`, "Бригаде", "Раскрой и детали · RU", ""),
  row(`<div class="ico">${ic("ruler")}</div>`, "Рабочие чертежи", "План, ведомости · 11×17", ""),
  row(`<div class="ico">${ic("box")}</div>`, "Заказ материалов", "Поставщику · EN", ""),
], "", 4);
const noEst = hst("doc", "Смета готова · не отправлена");
// статус уже в шапке — здесь только сумма и шаг
const officeNext = `<div class="next"><span class="money">$2,113.67</span> · проверьте и отправьте</div>`;
const saved = (t) => `<div class="saved">${ic("check", 14)}${t}</div>`;
// очередь без сети — DS §15.3б: значок wifiOff, тон warn
const offline = (t) => `<div class="saved warnline">${ic("wifiOff", 14)}${t}</div>`;
const tabs = (est = true) => `<div class="vt"><div class="on">Обзор</div><div>Фото</div><div>Файлы</div>${est ? `<div>Сметы <small>1</small></div>` : ""}<div>История</div></div>`;
S["v1-card"] = () => `<div class="phone"><div class="scroll">${headObj("Linda Alvarez", noEst)}${officeNext}${sheet}${saved("Сохранено в облаке · 10:42")}${act("Отправить смету", "send")}${trio}${addr}${docs}
  </div>${tabbar("Gutters")}</div>`;
// В2 «Вкладки» (#2518): у вкладки «Сметы» число — неотправленная смета ждёт действия (А1п)
S["v2-card"] = () => `<div class="phone"><div class="scroll">${headObj("Linda Alvarez", noEst)}${tabs()}
  ${officeNext}${sheet}${saved("Сохранено в облаке · 10:42")}${act("Отправить смету", "send")}${trio}${addr}
  </div>${tabbar("Gutters")}</div>`;
// мастер: без денег, без вкладки «Сметы», без жёлтой
S["v2-card-master"] = () => `<div class="phone"><div class="scroll">${headObj("Linda Alvarez", hst("wifiOff", "На телефоне · уйдёт в офис"))}${tabs(false)}
  ${next("Смета собрана — офис проверит и отправит")}${sheet}${offline("Нет сети · уйдёт в офис, когда появится сеть")}${act("", "", "Править чертёж")}${trio}${addr}
  </div>${tabbar("Gutters", TABS_MASTER)}</div>`;
// iPhone SE (667): кнопка и тройка — над вкладками?
S["v2-card-se"] = () => `<div class="phone se"><div class="scroll">${headObj("Linda Alvarez", noEst)}${tabs()}
  ${officeNext}${sheet}${saved("Сохранено в облаке · 10:42")}${act("Отправить смету", "send").replace('class="pair"', 'class="pair col"')}${trio}
  </div>${tabbar("Gutters")}</div>`;
const mini2 = `<div class="sheet" style="margin-top:8px"><div class="paper" style="height:64px">${mini(56)}</div></div>`;
S["fit-split"] = () => `<div class="phone" style="height:1150px"><div class="scroll" style="padding-top:4px">
  <div class="cap">2 вида</div>${kpi([["3", "A Elbow"], ["3", "B Elbow"]])}
  <div class="cap">3 вида</div>${kpi(FITS)}
  <div class="cap">4 вида</div>${kpi([["3", "A Elbow"], ["3", "B Elbow"], ["2", "A Offset"], ["1", "B Offset"]])}
  <div class="cap">6 видов</div>${kpi([["3", "A Elbow"], ["3", "B Elbow"], ["2", "A Offset"], ["1", "B Offset"], ["2", "Elbow 45°"], ["1", "Elbow 90°"]])}
  <div class="cap">7 и больше — 5 видов и «ещё N»</div>${kpi([["3", "A Elbow"], ["3", "B Elbow"], ["2", "A Offset"], ["1", "B Offset"], ["2", "Elbow 45°"]], 2)}
  ${fitNote}
  </div></div>`;
// состояния: сумма видна офису везде; «не собралась» — с причиной и путём
S["now-states"] = () => `<div class="phone" style="height:1010px"><div class="scroll" style="padding-top:4px">
  <div class="cap">Смета не собралась · офис</div>${next(`${ic("alert", 15)} Нет цены у 2 деталей — смета не полная`)}${act("Указать цены", "list").replace('class="pair"', 'class="pair col"')}
  <div class="cap">Черновик без клиента · офис</div>${next("Смета собрана, но отправить некому")}${act("Привязать клиента", "userPlus").replace('class="pair"', 'class="pair col"')}
  <div class="cap">Отправлена · офис</div>${next("<span class=\"money\">$2,113.67</span> · отправлена вчера, клиент открыл 2&nbsp;раза")}${act("Напомнить клиенту", "bell").replace('class="pair"', 'class="pair col"')}
  <div class="cap">Изменена после отправки · офис</div>${next("Было <span class=\"money\">$2,113.67</span> → стало <span class=\"money\">$2,348.20</span>. Клиент видит версию от 24&nbsp;нояб.")}${act("Отправить изменения", "send", "")}<div class="later">В «⋯» — «Восстановить версию клиента» (с подтверждением)</div>
  <div class="cap">Подписана, депозит не оплачен · офис</div>${next("<span class=\"money\">$2,113.67</span> · подписана сегодня")}${act("Получить депозит", "money", "")}
  <div class="gnote">Макет: правка чертежа после подписи — решение до кода, #2676 (этап 0)</div>
  </div></div>`;
// мастер в тех же состояниях: денег нет, жёлтой нет, следующий шаг — свой
S["now-states-master"] = () => `<div class="phone"><div class="scroll" style="padding-top:4px">
  <div class="cap">Отправлена · мастер</div><div class="hst">${hst("doc", "Отправлена")}</div>${next("Офис ждёт ответа клиента. Чертёж можно поправить — офис увидит изменения")}${act("", "", "Править чертёж")}
  <div class="cap">Подписана · мастер</div><div class="hst">${hst("check", "Подписана")}</div>${next("Дальше — работа: дату ставит офис, она появится в «Плане»")}${act("", "", "Открыть план").replace(ic("pencil", 18), ic("cal", 18))}
  <div class="cap">Смета не собралась · мастер</div><div class="hst">${hst("alert", "Нет цены у 2 деталей")}</div>${next("Офис укажет цены — делать ничего не нужно")}${act("", "", "Править чертёж")}
  </div></div>`;
const frame = (s) => `<iframe src="mockups.html#screen=${s}&theme=${theme}"></iframe>`;
const fig = (cap, sub, body) => `<figure><figcaption>${cap}<small>${sub}</small></figcaption>${body}</figure>`;
S["compare-list"] = () => `<div class="cmp">
  ${fig("Как сейчас", "Заголовок «Замеры», фильтры-кнопки, каждая запись — большая карточка", `<img src="asis-05-list-${theme}.png">`)}
  ${fig("Как будет · вариант 1 «Два списка»", "Поиск значком, «＋ Замер» словом вверху. Черновики и замеры — строками: картинка чертежа, имя, адрес, состояние", frame("v1-list"))}
  ${fig("Как будет · вариант 2 «Сначала — что замерить» (выбран)", "Сверху — к кому сегодня ехать мерить (нажали строку — начался замер), потом готовые сметы, которые не отправлены, черновики, последние", frame("v2-list"))}</div>`;
S["compare-card"] = () => `<div class="cmp">
  ${fig("Как сейчас", "«Просмотр замера»: имя два раза, кнопку «Сделать смету» не видно без прокрутки", `<img src="asis-06-card-top-${theme}.png">`)}
  ${fig("Как будет · вариант 1 «Одна лента»", "Смета уже собрана из чертежа. Под чертежом «Отправить» и «Править чертёж», ниже три карточки: gutter · переходники · downspout", frame("v1-card"))}
  ${fig("Как будет · вариант 2 «Вкладки» (выбран)", "Вкладки под именем. Смета уже собрана из чертежа: под чертежом «Отправить» и «Править чертёж», ниже три карточки: gutter · переходники · downspout", frame("v2-card"))}</div>`;
// пары «было (84a8435) | предлагаем» для ревью
const pair = (s, what) => `<div class="cmp">${fig("Было (5d05a55)", what, `<img src="r4-${s}-${theme}.png">`)}${fig("Предлагаем", "После проверки №4 (7173319468)", frame(s))}</div>`;
S["pair-v2-card"] = () => pair("v2-card", "Карточка, вариант 2 «Вкладки»");
S["pair-v1-card"] = () => pair("v1-card", "Карточка, вариант 1 «Одна лента»");
S["pair-v2-list"] = () => pair("v2-list", "Первый экран, вариант 2");
S["pair-states"] = () => pair("now-states", "Другие состояния");
S["pair-master"] = () => `<div class="cmp">${fig("Мастер · первый экран", "Без «Ждут отправки» и сумм", frame("v2-list-master"))}${fig("Мастер · карточка", "Без денег и «Смет», без жёлтой; нет сети — warn", frame("v2-card-master"))}${fig("Мастер · отправлена и подписана", "Следующий шаг мастера", frame("now-states-master"))}${fig("iPhone SE (667)", "Что видно без прокрутки", frame("v2-card-se").replace("<iframe", '<iframe style="height:667px;width:375px"'))}</div>`;
S["pair-v1-list"] = () => pair("v1-list", "Первый экран, вариант 1");
S["compare-tab"] = () => `<div class="cmp">
  ${fig("Модуль выключен (как есть)", "Вторая вкладка — «План»", `<img src="asis-01-tabs-off-${theme}.png">`)}
  ${fig("Модуль включён (как есть)", "«Gutters» встаёт на место «План», «План» уходит в «Ещё»", `<img src="asis-05-list-${theme}.png">`)}
  ${fig("Где включают (как есть)", "Ещё → Компания → Модули, только директор", `<img src="asis-03-modules-on-${theme}.png">`)}</div>`;
document.getElementById("app").innerHTML = (S[screen] || S["v1-list"])();
</script>
</body>
