<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Работа — одна папка</title>
<!-- Прототип спеки 71 (#3124). Только для показа основателю: в приложение не входит.
     Вид — токены «Наряда»: значения скопированы из design/naryad-ds/tokens/theme.css и status.css (26.11.2026).
     Открыть кадр: index.html?s=hub&t=dark  (s = hub | estimate | invoice | s1 | s2 | s3; t = dark | light). Без ?s — все кадры столбиком. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--acc:#E2C15E;--on-acc:#1C1A12;--font:'Manrope',system-ui,sans-serif;--r:22px;--ri:14px}
[data-theme="dark"]{--acc-text:#E2C15E;--tint:rgba(226,193,94,.16);--surf3:#44464D;--tab:#1F2024;--page:#1F2024;--bg:#26282C;--ink:#EEEFF1;--mut:#B3B6BE;--surf:#303237;--surf2:#3A3C42;--bd:rgba(255,255,255,.07);--bd-field:#80838C;--sh:0 10px 30px rgba(0,0,0,.3);--ov-solid:#2C2E33;
  --ground:linear-gradient(170deg,#43392F 0%,#26282C 55%,#191A1D 100%);
  --st-ok:#1C2E23;--st-ok-text:#86D3A0;--st-info:#182A2E;--st-info-text:#86C9D4;--st-warn:#33281C;--st-warn-text:#E8B67F;--st-bad:#3A2122;--st-bad-text:#F09A90;--st-neutral:#3A3C42;--st-neutral-text:#C9CCD2;--scrim:rgba(0,0,0,.45)}
[data-theme="light"]{--acc-text:#5E4C0C;--tint:rgba(226,193,94,.30);--surf3:#C4C5BF;--tab:#E3E4DE;--page:#CBCCC6;--bg:#D6D7D1;--ink:#17181B;--mut:#42454B;--surf:#E3E4DE;--surf2:#CDCEC8;--bd:rgba(20,21,24,.08);--bd-field:#6F7279;--sh:0 10px 28px rgba(60,50,40,.12);--ov-solid:#DEDFD9;
  --ground:linear-gradient(170deg,#E1D9CA 0%,#D6D7D1 55%,#BBBCB6 100%);
  --st-ok:#DCEBDF;--st-ok-text:#1B6034;--st-info:#D8EAED;--st-info-text:#0E5866;--st-warn:#F2E2CC;--st-warn-text:#824306;--st-bad:#F4DAD6;--st-bad-text:#9A2C22;--st-neutral:#CDCEC8;--st-neutral-text:#3E4147;--scrim:rgba(20,21,24,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font)}
body.all{display:flex;flex-wrap:wrap;gap:24px;padding:24px}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:var(--ground);font-size:15px;line-height:1.35;flex:none}
.scroll{position:absolute;inset:0 0 72px 0;overflow:hidden;padding:6px 16px 24px}
.hdr{display:flex;align-items:center;gap:10px;height:52px}
.circ{width:40px;height:40px;border-radius:50%;background:var(--surf);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.circ svg{width:20px;height:20px}
.hdr .who{font-size:15px;color:var(--mut);font-weight:500}
.demo{font-size:12px;color:var(--st-warn-text);background:var(--st-warn);border-radius:999px;padding:3px 9px;font-weight:600}
.sp{flex:1}
.title{display:flex;align-items:center;gap:12px;margin:14px 0 18px}
.title h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.title .rule{width:1px;align-self:stretch;background:var(--bd-field);opacity:.5}
.title .rest{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .side{display:flex;flex-direction:column;gap:2px;font-size:15px}
.link{color:var(--acc-text);font-size:14px;font-weight:600;margin:0 0 22px;display:flex;gap:6px;align-items:center}
.link.mark{background:var(--tint);border-radius:12px;padding:10px 12px;margin:-4px -4px 18px}
.qa{display:flex;justify-content:space-around;margin:4px 0 18px}
.qa div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.qa .circ{width:44px;height:44px}
.card{background:var(--surf);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.kick{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600;display:flex;justify-content:space-between}
.kick span:last-child{text-transform:none;letter-spacing:0;font-size:13px;display:inline-flex;gap:5px;align-items:center;color:var(--ink)}
.when{font-size:15px;font-weight:700;margin-top:8px}
.addr{font-size:13px;color:var(--mut);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{background:var(--surf2);border-radius:var(--ri);padding:10px 6px;text-align:center}
.tile b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mut)}
.btns{display:flex;gap:8px}
.b{height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;flex:1;padding:0 14px;white-space:nowrap}
.b.acc{background:var(--acc);color:var(--on-acc)}
.b.sec{background:var(--surf2);color:var(--acc-text)}
.b svg{width:18px;height:18px}
.tabs{display:flex;gap:6px;margin:20px -16px 14px;padding:0 16px;white-space:nowrap;overflow:hidden}
.tabs span{font-size:15px;font-weight:600;color:var(--mut);padding:7px 12px;border-radius:999px}
.tabs span.on{background:var(--surf);color:var(--ink);box-shadow:var(--sh)}
.tabs span i{font-style:normal;font-weight:500;opacity:.8;margin-left:4px}
.tabs span.new{outline:2px dashed var(--acc);outline-offset:-2px}
.gt{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 8px}
.gt h3{font-size:17px;margin:0;font-weight:700;display:flex;gap:8px;align-items:center}
.cnt{font-size:12px;font-weight:600;background:var(--surf2);color:var(--mut);border-radius:999px;padding:1px 8px}
.grp{display:flex;flex-direction:column;gap:6px}
.row{background:var(--surf);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-height:52px}
.row.sub{margin-left:26px;background:var(--surf2);min-height:44px;padding:8px 12px;border-radius:14px}
.row .ic{width:30px;height:30px;border-radius:50%;background:var(--surf2);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--mut)}
.row.sub .ic{background:var(--surf);width:26px;height:26px}
.row .ic svg{width:16px;height:16px}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ds{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}
.row .val small{display:block;font-weight:600;font-size:12px}
.row .chev{color:var(--mut);width:14px;flex:none}
.row.act{background:transparent;border:1px dashed var(--bd-field);color:var(--acc-text);font-weight:700;min-height:44px;justify-content:flex-start}
.row.act .ic{background:var(--tint);color:var(--acc-text)}
.row.sum{background:transparent;padding:4px 12px;min-height:auto;color:var(--mut);font-size:13px}
.ok{color:var(--st-ok-text)} .warn{color:var(--st-warn-text)} .info{color:var(--st-info-text)} .bad{color:var(--st-bad-text)}
.st{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600}
.st svg{width:12px;height:12px}
.pill{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.pill.ok{background:var(--st-ok)} .pill svg{width:14px;height:14px}
.stmt{display:flex;flex-direction:column;gap:10px}
.stmt .l{display:flex;justify-content:space-between;font-size:15px}
.stmt .l span:first-child{color:var(--mut)}
.stmt .big{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--bd);padding-top:12px;font-weight:700;font-size:17px}
.stmt .big b{font-size:24px}
.h2{font-size:17px;font-weight:700;margin:20px 2px 10px}
.money{display:flex;align-items:center;gap:8px;background:var(--surf);border-radius:16px;padding:10px 12px;margin-bottom:8px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.money b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--surf2);overflow:hidden;display:flex;width:100%}
.bar i{display:block;background:var(--st-ok-text)} .bar u{display:block;background:var(--mut);opacity:.5}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--tab);display:flex;justify-content:space-around;padding-top:8px;font-size:11px;color:var(--mut)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar svg{width:22px;height:22px}
.tabbar .on{color:var(--acc-text)}
.sheet{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:6}
.sheet .in{background:var(--ov-solid);width:100%;border-radius:28px 28px 0 0;padding:10px 16px 28px;display:flex;flex-direction:column;gap:10px}
.grab{width:36px;height:5px;border-radius:999px;background:var(--bd-field);opacity:.6;align-self:center}
.sheet h2{font-size:19px;margin:6px 0 0}
.sheet p{margin:0;color:var(--mut);font-size:13px}
.opt{background:var(--surf);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;min-height:56px}
.opt .rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd-field);flex:none}
.opt.sel{box-shadow:inset 0 0 0 2px var(--acc)} .opt.sel .rad{border:7px solid var(--acc)}
.opt .mid{flex:1} .opt .nm{font-weight:700} .opt .ds{font-size:12.5px;color:var(--mut)}
.seg{display:flex;background:var(--surf);border-radius:999px;padding:3px}
.seg span{flex:1;text-align:center;padding:8px 0;border-radius:999px;font-weight:600;color:var(--mut);font-size:14px}
.seg span.on{background:var(--surf3);color:var(--ink)}
.note{position:absolute;left:12px;right:12px;bottom:84px;z-index:9;background:var(--acc);color:var(--on-acc);border-radius:14px;padding:8px 12px;font-size:12.5px;font-weight:600;display:none}
body.all .note{display:block}

/* одна группа строк (ListGroup + GroupRow, DS §5.5): строки внутри одной карточки, разделитель — волосок */
.lg{background:var(--surf);border-radius:var(--r);overflow:hidden}
.lg .row{background:transparent;border-radius:0;border-top:1px solid var(--bd)}
.lg .row:first-child{border-top:0}
.lg .row.sub{margin-left:0;padding-left:52px;background:transparent;border-radius:0}
.lg .row.sub .ic{background:transparent;width:22px;height:22px}
.lg .row.add{color:var(--ink);font-weight:600;min-height:48px}
.lg .row.add .ic{background:transparent;color:var(--ink)}
.badge{position:absolute;top:-6px;right:-10px;background:#E5484D;color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center}
.tabbar div{position:relative}
.fld{background:var(--surf);border-radius:12px;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:16px;font-weight:700}
.fld span{font-size:12.5px;font-weight:500;color:var(--mut)}
</style>
</head>
<body>
<script>
const I = {
  back:'<path d="M15 5l-7 7 7 7"/>', plus:'<path d="M12 5v14M5 12h14"/>', more:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/>', sms:'<path d="M5 18l-1 3 4-2a9 8 0 10-3-1z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01" stroke-width="2.4"/>',
  route:'<path d="M3 11l18-8-8 18-2-8z"/>', camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>', inv:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M12 7v8M10 9.5c0-1 1-1.5 2-1.5s2 .5 2 1.5-1 1.3-2 1.5-2 .6-2 1.6.9 1.4 2 1.4 2-.4 2-1.4"/>',
  usd:'<path d="M12 3v18M16 7c0-1.7-1.8-3-4-3s-4 1.3-4 3 1.8 2.6 4 3 4 1.4 4 3.2-1.8 3-4 3-4-1.3-4-3"/>', co:'<path d="M12 8v8M8 12h8"/><rect x="3" y="3" width="18" height="18" rx="5"/>',
  chev:'<path d="M9 5l7 7-7 7"/>', ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>', half:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/>',
  minus:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>', send:'<path d="M4 12l16-8-6 16-2-6z"/>',
  home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>', cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>', people:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 4.5a3.5 3.5 0 010 7M18 14c2 .8 3 3 3 6"/>',
  cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M12 9v6M10.5 10.5h2.2a1 1 0 010 2h-1.4a1 1 0 000 2h2.2"/><path d="M6 12h.01M18 12h.01" stroke-width="2.4"/>', target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
};
const svg = (k, sw = 1.75) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const circ = (k) => `<span class="circ">${svg(k)}</span>`;
/* нижняя панель — как в приложении: красный кружок «2» на «Лидах» (исключение 4 правила 2) */
const tabbar = `<div class="tabbar">${[["home","Главная"],["cal","План"],["people","Клиенты",1],["cash","Деньги"],["target","Лиды",0,2]].map(([k,l,on,n])=>`<div class="${on?"on":""}">${svg(k)}${n?`<span class="badge">${n}</span>`:""}<span>${l}</span></div>`).join("")}</div>`;
const st = (cls, ic, word) => `<span class="st ${cls}">${svg(ic,2)}${word}</span>`;
const row = (ic, nm, ds, val, sub) => `<div class="row"><span class="ic">${svg(ic)}</span><div class="mid"><div class="nm">${nm}</div>${ds?`<div class="ds">${ds}</div>`:""}</div><div class="val">${val}${sub?`<small>${sub}</small>`:""}</div><span class="chev">${svg("chev")}</span></div>`;
const subrow = (ic, nm, ds, val) => `<div class="row sub"><span class="ic">${svg(ic)}</span><div class="mid"><div class="nm" style="font-size:14px;font-weight:500">${nm}</div><div class="ds">${ds}</div></div><div class="val" style="font-size:14px;font-weight:600">${val}</div><span class="chev">${svg("chev")}</span></div>`;
const add = (nm) => `<div class="row add"><span class="ic">${svg("plus")}</span><span>${nm}</span></div>`;
const docsHead = (n) => `<div class="gt"><h3>Документы <span class="cnt">${n}</span></h3></div>`;

/* Шапка и «Сейчас» работы JOB-0001 — как в приложении (снимок /job/j1); суммы на обзоре — целыми долларами (#3029) */
const jobTop = (fig = ["$3,420","Смета","$342","Оплачено","$3,078","Остаток"], main = ["Начать выезд","В пути"]) => `
  <div class="hdr">${circ("back")}<span class="who">Sarah Mitchell</span><span class="demo">• Демо</span><span class="sp"></span>${circ("plus")}${circ("more")}</div>
  <div class="title"><h1>Bathroom remodel</h1><span class="rule"></span><span class="rest">vanity, toile…</span></div>
  <div class="qa">${[["phone","Позвонить"],["sms","SMS"],["route","Маршрут"],["camera","Фото"]].map(([k,l])=>`<div>${circ(k)}${l}</div>`).join("")}</div>
  <div class="card"><div class="kick"><span>Ближайший выезд</span><span>${svg("minus",2).replace("<svg","<svg width=14 height=14")} Запланирована</span></div>
    <div class="when">пт, 20 нояб. 8:30 AM · Alex Petrov</div><div class="addr">1420 Oak Grove Ave, Pasadena, CA 91103</div>
    <div class="tiles"><div class="tile"><b>${fig[0]}</b><span>${fig[1]}</span></div><div class="tile"><b>${fig[2]}</b><span>${fig[3]}</span></div><div class="tile"><b>${fig[4]}</b><span>${fig[5]}</span></div></div>
    <div class="btns"><span class="b acc">${main[0]}</span>${main[1]?`<span class="b sec">${main[1]}</span>`:""}</div></div>`;
const tabsRow = (docs, extra = "") => `<div class="tabs" ${extra}><span class="on">Обзор</span><span>Выезды<i>2</i></span><span>Документы<i>${docs}</i></span><span>Расходы<i>1</i></span><span>Заказы</span></div>`;
const collapsed = (docs) => `<div class="hdr" style="margin:0 -16px;padding:6px 16px;background:var(--bg);border-bottom:1px solid var(--bd);height:56px">${circ("back")}<b style="font-size:17px">Bathroom remodel</b><span class="sp"></span>${circ("plus")}${circ("more")}</div>${tabsRow(docs,'style="margin-top:0;padding-top:10px;padding-bottom:10px;background:var(--bg)"')}`;

/* демо-данные как есть: смета подписана, депозит INV-0105 оплачен картой */
const demoDocs = `<div class="lg">
      ${row("doc","Смета","12 нояб.","$3,420", st("ok","ok","Подписана"))}
      ${row("inv","Депозит INV-0105","срок 12 нояб.","$342", st("ok","ok","Оплачен"))}
      ${subrow("usd","Оплата · Карта","RCT-0102 · 12 нояб.","$342")}
      ${add("Взять оплату")}
    </div>`;

const S = {
  hub: { cap: "Работа — Обзор", html: `<div class="scroll">${jobTop()}${tabsRow(3)}${docsHead(3)}${demoDocs}</div>${tabbar}` },
  hub2: { cap: "Работа — Обзор ниже", html: `<div class="scroll" style="padding-top:0">${collapsed(3)}${docsHead(3)}${demoDocs}
    <div class="h2">Команда</div>
    <div class="card" style="padding:12px 16px"><div style="font-weight:600">Alex Petrov</div><div style="display:flex;justify-content:space-between;margin-top:10px;border-top:1px solid var(--bd);padding-top:10px"><span>Прибыль сейчас</span><b>$2,536 · 74.2%</b></div></div>
    </div>${tabbar}` },

  /* смета и счёт — меняется только строка-путь под названием */
  estimate: { cap: "Смета", html: `<div class="scroll">
    <div class="hdr">${circ("back")}<span class="who">Sarah Mitchell</span><span class="demo">• Демо</span></div>
    <div class="title"><h1 style="font-size:24px">Bathroom remodel</h1><span class="circ" style="width:30px;height:30px">${svg("chev").replace('d="M9 5l7 7-7 7"','d="M6 9l6 6 6-6"')}</span><span class="rule"></span><span class="side" style="font-size:14px"><b style="font-weight:600">$3,420.00</b><span style="color:var(--mut);display:inline-flex;gap:5px;align-items:center">${svg("ok",2).replace("<svg","<svg width=15 height=15")} Одобрена</span></span></div>
    <div class="link">Работа JOB-0001 <span style="width:14px;display:inline-flex">${svg("chev",2.2)}</span></div>
    <div class="h2" style="margin-top:6px">Позиции</div>
    <div class="card" style="color:var(--mut)">Позиции не сохранены в этой смете</div>
    <div class="h2">Выписка по договору</div>
    <div class="card stmt"><div class="l"><span>Договор</span><span>$3,420.00</span></div><div class="l"><span>Выставлено</span><span>$342.00</span></div><div class="l"><span>Оплачено</span><span>$342.00</span></div>
