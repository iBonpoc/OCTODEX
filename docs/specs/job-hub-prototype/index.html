<style>

[data-theme="dark"]{--acc-text:#E2C15E;--tint:rgba(226,193,94,.16);--surf3:#44464D;--tab:#1F2024;--page:#1F2024;--bg:#26282C;--ink:#EEEFF1;--mut:#B3B6BE;--surf:#303237;--surf2:#3A3C42;--bd:rgba(255,255,255,.07);--bd-field:#80838C;--sh:0 10px 30px rgba(0,0,0,.3);--ov-solid:#2C2E33;

/* варианты раскладки (28.11) и страница клиента (#3129) */

.jh{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 8px}

.prog{font-size:12.5px;color:var(--mut)}
.doc{position:absolute;inset:0;background:#F6F5F1;color:#17181B;padding:22px 20px;font-family:var(--font);font-size:14px}

.dim{position:absolute;inset:0;background:var(--scrim);z-index:5}
.pdf{background:#F6F5F1;color:#17181B;border-radius:12px;padding:14px;font-size:12.5px;margin-top:10px}
.pdf h4{margin:0 0 6px;font-size:15px}
.pdf .l{display:flex;justify-content:space-between;padding:3px 0}

.la{background:rgba(30,32,38,.92);border-radius:22px;padding:12px 14px;margin-top:60px}
.la .btn3{display:flex;gap:8px;margin-top:10px}.la .btn3 span{flex:1;background:rgba(255,255,255,.12);border-radius:999px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}

.mini{display:flex;gap:2px;margin-top:5px;width:120px}.mini i{flex:1;height:5px;border-radius:3px;background:var(--surf2);display:block}.mini i.p{background:var(--ink);opacity:.75}.mini i.c{background:var(--ink)}
.jr{display:flex;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--bd)}.jr:first-child{border-top:0}
.jr .mid{flex:1;min-width:0}.jr .nm{font-weight:600;font-size:15px}.jr .ds{font-size:12.5px;color:var(--mut)}
