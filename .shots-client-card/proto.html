<style>
/* Только токены «Наряда»: ни одного своего цвета, размера, радиуса */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);font-family:var(--font);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body)}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);background-image:var(--glow)}
.status{height:var(--statusbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-6);font-weight:var(--fw-semibold);font-size:var(--fs-heading)}
.scroll{position:absolute;top:var(--statusbar-h);left:0;right:0;bottom:calc(var(--tabbar-h) + var(--safe-bottom));overflow:hidden;padding:0 var(--space-4)}
.top{display:flex;align-items:center;justify-content:space-between;height:var(--hit-min)}
.back{color:var(--mut);display:flex;align-items:center;gap:var(--space-1)}
.ghost{height:var(--control-md);padding:0 var(--space-3);border-radius:var(--radius-pill);display:inline-flex;align-items:center;gap:var(--space-tight);font-size:var(--fs-btn);font-weight:var(--fw-semibold);color:var(--ink)}
h1{font-size:var(--fs-display);line-height:var(--lh-tight);font-weight:var(--fw-bold);margin-top:var(--space-1)}
.meta{display:flex;gap:var(--space-2);align-items:center;margin-top:var(--space-2);flex-wrap:nowrap}
.cap{font-size:var(--fs-caption);color:var(--mut)}
.micro{font-size:var(--fs-micro);color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.chip{height:var(--chip-h);padding:0 var(--chip-px);border-radius:var(--radius-chip);display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--fs-caption);font-weight:var(--fw-semibold);background:var(--surf2);border:1px solid var(--bd)}
.chip.ok{color:var(--st-ok-text)} .chip.warn{color:var(--st-warn-text)} .chip.info{color:var(--st-info-text)}
.chip.tag{font-weight:var(--fw-medium);color:var(--mut)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2);margin-top:var(--space-4)}
.act{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);font-size:var(--fs-micro);color:var(--mut)}
.act i{width:var(--control-lg);height:var(--control-lg);border-radius:var(--radius-pill);background:var(--surf2);border:1px solid var(--bd);display:grid;place-items:center;color:var(--ink)}
.acts.row{display:flex;gap:var(--space-2);margin-top:var(--space-3)}
.acts.row .act i{width:var(--control-lg)}
.primary{margin-top:var(--space-4);height:var(--control-lg);border-radius:var(--radius-pill);background:var(--acc);color:var(--on-acc);display:flex;align-items:center;justify-content:center;gap:var(--space-2);font-weight:var(--fw-semibold);font-size:var(--fs-btn)}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.money{margin-top:var(--space-3);display:grid;grid-template-columns:repeat(3,1fr);padding:var(--space-3) var(--space-4)}
.money b{display:block;font-size:var(--fs-heading);font-weight:var(--fw-semibold)}
.money .w b{color:var(--st-warn-text)}
.seg{margin:var(--space-4) calc(-1 * var(--space-4)) 0;padding:var(--space-2) var(--space-4);position:relative;background:var(--bg)}
.seg .track{height:var(--seg-h);padding:var(--seg-pad);border-radius:var(--radius-pill);background:var(--track);display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.seg span{border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;gap:var(--space-1);font-size:var(--fs-btn);color:var(--mut);font-weight:var(--fw-medium)}
.seg span.on{background:var(--surf2);color:var(--ink);font-weight:var(--fw-semibold);box-shadow:var(--shadow-sm)}
.seg em{font-style:normal;font-size:var(--fs-micro);color:var(--mut)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:var(--space-4) var(--space-1) var(--space-2)}
.sec h3{font-size:var(--fs-caption);font-weight:var(--fw-semibold);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.sec a{font-size:var(--fs-caption);color:var(--ink);font-weight:var(--fw-semibold)}
.lc{display:flex;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-4);min-height:var(--hit-min)}
.lc + .lc{border-top:1px solid var(--bd)}
.stack{display:flex;flex-direction:column;gap:var(--space-2)}
.ic{color:var(--mut);flex:none;display:grid;place-items:center}
.grow{flex:1;min-width:0}
.t{font-weight:var(--fw-semibold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{text-align:right;flex:none}
.empty{padding:var(--space-3) var(--space-4);display:flex;align-items:center;gap:var(--space-3)}
.add{height:var(--control-sm);padding:0 var(--space-3);border-radius:var(--radius-pill);background:var(--surf2);border:1px solid var(--bd);display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--fs-btn);font-weight:var(--fw-semibold);flex:none}
.grp{display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-4);min-height:var(--hit-min)}
.grp .l{display:flex;align-items:center;gap:var(--space-2);font-weight:var(--fw-semibold)}
.cnt{font-size:var(--fs-caption);color:var(--mut);font-weight:var(--fw-medium)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabbar-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--ov);backdrop-filter:blur(var(--blurov));-webkit-backdrop-filter:blur(var(--blurov));border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);z-index:var(--z-nav)}
.tabbar div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-hair);font-size:var(--fs-micro);color:var(--mut)}
.tabbar .on{color:var(--ink);font-weight:var(--fw-semibold)}
.fab{position:absolute;right:var(--space-4);bottom:calc(var(--tabbar-h) + var(--safe-bottom) + var(--space-4));width:var(--fab);height:var(--fab);border-radius:var(--radius-pill);background:var(--acc);color:var(--on-acc);display:grid;place-items:center;box-shadow:var(--shadow-fab);z-index:var(--z-fab)}
.label{position:absolute;top:calc(var(--statusbar-h) + var(--space-1));right:var(--space-4);font-size:var(--fs-micro);color:var(--mut)}
svg{width:var(--icon-sm);height:var(--icon-sm);stroke:currentColor;fill:none;stroke-width:var(--icon-stroke);stroke-linecap:round;stroke-linejoin:round}
.act svg{width:var(--icon-md);height:var(--icon-md)}
.chev{color:var(--mut)}
.sticky-mini{position:absolute;top:var(--statusbar-h);left:0;right:0;z-index:var(--z-nav);background:var(--ov);backdrop-filter:blur(var(--blurov));-webkit-backdrop-filter:blur(var(--blurov));border-bottom:1px solid var(--bd);padding:0 var(--space-4)}
.sticky-mini .row1{display:flex;align-items:center;justify-content:space-between;height:var(--hit-min)}
.sticky-mini .mini{display:flex;gap:var(--space-2)}
.sticky-mini .mini i{width:var(--control-md);height:var(--control-md);border-radius:var(--radius-pill);background:var(--surf2);border:1px solid var(--bd);display:grid;place-items:center}
.sticky-mini .seg{margin:0 calc(-1 * var(--space-4));background:transparent;padding-top:0}
</style>
</head>
<body>

<script>
const I={
 back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',

 down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
 phone:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
 sms:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',

 users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0M16 4a3.5 3.5 0 0 1 0 7M22 21a7 7 0 0 0-4-6.3"/></svg>',

 route:'<svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>',
 home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v10H3z"/></svg>',
 cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
 dot:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>',
 warn:'<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17v.5"/></svg>',
 okc:'<svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>',
};
const q=new URLSearchParams(location.search);
const v=q.get('v')||'a', tab=q.get('tab')||'overview', scrolled=q.get('scrolled')==='1';
document.documentElement.dataset.theme=q.get('theme')||'dark';

const status=`<div class="status"><span class="num">9:41</span><span class="micro">●●●● 5G ▮</span></div>`;
const tabbar=`<div class="tabbar">
 <div>${I.home}Главная</div><div>${I.cal}План</div><div>${I.sms}Сообщ.</div><div class="on">${I.users}Клиенты</div><div>${I.more}Ещё</div></div>`;
const head=`<div class="top"><span class="back">${I.back}Клиенты</span><span class="ghost">${I.pencil}Изменить</span></div>
 <h1>Maria Lopez</h1>
 <div class="meta"><span class="cap num">CLT-0042</span><span class="chip ok">${I.dot}Активный</span><span class="chip tag">Повторный</span><span class="chip tag">+</span></div>`;
const acts=`<div class="acts">
 <div class="act"><i>${I.phone}</i>Позвонить</div><div class="act"><i>${I.sms}</i>SMS</div>
 <div class="act"><i>${I.mail}</i>Почта</div><div class="act"><i>${I.nav}</i>Маршрут</div></div>`;
const primary=`<div class="primary">${I.invoice}Создать смету</div>`;
const money=`<div class="card money"><div class="w"><span class="cap">Должен</span><b class="num">$1,250</b></div><div><span class="cap">Оплачено</span><b class="num">$4,800</b></div><div><span class="cap">Выставлено</span><b class="num">$6,050</b></div></div>`;
const seg=(on)=>`<div class="seg"><div class="track">
 <span class="${on==='overview'?'on':''}">Обзор</span>
 <span class="${on==='work'?'on':''}">Работа <em>6</em></span>
 <span class="${on==='history'?'on':''}">История</span></div></div>`;
const sec=(t,all)=>`<div class="sec"><h3>${t}</h3>${all?`<a>${all} ›</a>`:''}</div>`;
const row=(ic,t,s,r,rs)=>`<div class="lc"><span class="ic">${I[ic]}</span><div class="grow"><div class="t">${t}</div><div class="cap">${s}</div></div>${r?`<div class="r">${r}${rs?`<div class="cap num">${rs}</div>`:''}</div>`:''}<span class="chev">${I.chev}</span></div>`;
const st=(k,ic,w)=>`<span class="chip ${k}">${I[ic]}${w}</span>`;
const emptyLine=(txt)=>`<div class="card empty"><div class="grow cap">${txt}</div><span class="add">${I.plus}Добавить</span></div>`;

function overview(){return `
 ${sec('Дальше')}
 <div class="card">
  ${row('route','Выезд · пт 14 нояб., 9:00','Замена водостоков · Alex K.','')}
  ${row('wallet','Счёт INV-0107','$1,250 · срок 2 нояб.',st('warn','warn','Просрочен'))}
 </div>
 ${sec('Объект')}
 <div class="card">${row('pin','1420 Oak Ave, Pasadena, CA','Дом · счета на этот же адрес','')}</div>
 ${sec('Контакт')}
 <div class="card">${row('phone','(626) 555-0142','Мобильный · Maria Lopez','')}${row('mail','maria.lopez@example.com','Почта','')}</div>
 ${sec('Заметка')}
 <div class="card">${row('note','Ворота открыты с 8:00, собака во дворе','Alex K. · 3 нояб.','')}</div>`;}
function work(){return `
 ${sec('Работы · 2')}
 <div class="card">
  ${row('wrench','JOB-0311 · Замена водостоков','1420 Oak Ave · выезд пт 14 нояб.',st('info','dot','В работе'))}
  ${row('wrench','JOB-0288 · Чистка водостоков','1420 Oak Ave · 12 окт.',st('ok','okc','Готово'))}
 </div>
 ${sec('Сметы · 1')}
 <div class="card">${row('invoice','EST-0219 · Водостоки 160 LF','Подписана 28 окт.',st('ok','okc','Подписана'),'$6,050')}</div>
 ${sec('Счета и квитанции · 2','Все 3')}
 <div class="card">${row('wallet','INV-0107 · Водостоки','срок 2 нояб.',st('warn','warn','Просрочен'),'$1,250')}${row('wallet','RCT-0091 · Квитанция','28 окт. · Zelle',st('ok','okc','Оплачено'),'$4,800')}</div>
 ${sec('Задачи · 1')}
 <div class="card">${row('check','Перезвонить про сетки','до сб 15 нояб.','')}</div>
 ${sec('Нет пока')}
 <div class="card empty"><div class="grow cap">Лидов нет</div><span class="add">${I.plus}Лид</span></div>`;}

function variantA(){
 const body = tab==='overview'?overview():work();
 return `${status}<div class="scroll">${head}${acts}${primary}${money}${seg(tab)}${body}</div>${tabbar}<div class="fab">${I.plus}</div>`;
}

function grp(ic,t,c,open,inner){return `<div class="card">
 <div class="grp"><span class="l"><span class="ic">${I[ic]}</span>${t}<span class="cnt">${c}</span></span><span class="chev">${open?I.down:I.chev}</span></div>
 ${open?`<div style="border-top:1px solid var(--bd)">${inner}</div>`:''}</div>`;}
function variantB(){
 return `${status}<div class="scroll">${head}${acts}${primary}${money}
 ${sec('Дальше')}
 <div class="card">${row('route','Выезд · пт 14 нояб., 9:00','Замена водостоков · Alex K.','')}</div>
 <div class="stack" style="margin-top:var(--space-4)">
 ${grp('wrench','Работы','2',true,row('wrench','JOB-0311 · Замена водостоков','выезд пт 14 нояб.',st('info','dot','В работе'))+row('wrench','JOB-0288 · Чистка','12 окт.',st('ok','okc','Готово')))}
 ${grp('wallet','Счета и квитанции','3',false)}
 ${grp('invoice','Сметы','1',false)}
 ${grp('pin','Объекты','1',false)}
 ${grp('users','Люди','1',false)}
 ${grp('clock','История','',false)}
 </div>
 <div class="card empty" style="margin-top:var(--space-2)"><div class="grow cap">Пусто: лиды, задачи, файлы</div><span class="add">${I.plus}Добавить</span></div>
 </div>${tabbar}<div class="fab">${I.plus}</div>`;
}

function variantOld(){
 const r=(ic,t,c,s)=>`<div class="lc"><span class="ic">${I[ic]}</span><div class="grow"><div class="t">${t}</div>${s?`<div class="cap">${s}</div>`:''}</div><span class="cnt">${c}</span><span class="chev">${I.chev}</span></div>`;
 return `${status}<div class="scroll">${head}
 <div class="acts row"><div class="act"><i>${I.phone}</i></div><div class="act"><i>${I.sms}</i></div><div class="act"><i>${I.mail}</i></div><div class="act"><i>${I.nav}</i></div></div>
 ${primary}${money}
 ${sec('Контакты')}<div class="card">${row('mail','maria.lopez@example.com','Почта','')}</div>
 <div class="card" style="margin-top:var(--space-4)">
 ${r('pin','Объекты','1','1420 Oak Ave')}${r('invoice','Адрес для счетов','','Как у объекта')}${r('users','Люди','1','Maria Lopez')}
 ${r('wrench','Работы','0')}${r('inbox','Лиды','0')}${r('invoice','Сметы','0')}${r('wallet','Счета и квитанции','0')}
 ${r('check','Задачи','0')}${r('note','Заметки','0')}${r('camera','Файлы','0')}${r('clock','История','')}
 </div></div>${tabbar}<div class="fab">${I.plus}</div>`;
}

/* A, прокручено: шапка сжалась — имя, звонок/SMS и вкладки закреплены */
function variantAScrolled(){
 return `${status}<div class="sticky-mini"><div class="row1"><span class="back">${I.back}<b style="color:var(--ink)">Maria Lopez</b></span><span class="mini"><i>${I.phone}</i><i>${I.sms}</i></span></div>${seg('work')}</div>
 <div class="scroll" style="padding-top:calc(var(--hit-min) + var(--seg-h) + var(--space-4))">${work()}</div>${tabbar}<div class="fab">${I.plus}</div>`;
}


/* ---- Другие «простыни»: объект и лид ---- */
const hdr=(back,title,meta)=>`<div class="top"><span class="back">${I.back}${back}</span><span class="ghost">${I.pencil}Изменить</span></div><h1>${title}</h1><div class="meta">${meta}</div>`;
const rowc=(ic,t,c,s)=>`<div class="lc"><span class="ic">${I[ic]}</span><div class="grow"><div class="t">${t}</div>${s?`<div class="cap">${s}</div>`:''}</div><span class="cnt">${c}</span><span class="chev">${I.chev}</span></div>`;
const seg3=(items,on)=>`<div class="seg"><div class="track">${items.map(([k,l,n])=>`<span class="${k===on?'on':''}">${l}${n?` <em>${n}</em>`:''}</span>`).join('')}</div></div>`;
function propOld(){return `${status}<div class="scroll">${hdr('Maria Lopez','1420 Oak Ave','<span class="cap">Pasadena, CA 91104</span>')}
 <div class="acts row"><div class="act"><i>${I.nav}</i></div></div>
 ${sec('Сейчас')}<div class="card">${row('route','Выезд · пт 14 нояб., 9:00','Замена водостоков','')}</div>
 ${sec('Доступ')}<div class="card">${row('note','Ворота открыты с 8:00','Собака во дворе','')}</div>
 <div class="card" style="margin-top:var(--space-4)">
 ${rowc('users','Люди','1')}${rowc('inbox','Лиды','0')}${rowc('wrench','Работы','2')}${rowc('invoice','Сметы','1')}${rowc('wallet','Счета','2')}
 ${rowc('route','Выезды','3')}${rowc('check','Задачи','0')}${rowc('note','Заметки','0')}${rowc('camera','Файлы','0')}${rowc('clock','История','')}
 </div></div>${tabbar}<div class="fab">${I.plus}</div>`;}
function propA(){return `${status}<div class="scroll">${hdr('Maria Lopez','1420 Oak Ave','<span class="cap">Pasadena, CA 91104</span>')}
