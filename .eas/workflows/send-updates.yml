# Publishes the app for Expo Go (EAS Update, channel "preview") on every push to main.
# Monorepo: dependencies install at the repo root (npm workspaces), the app lives in apps/mobile.
# Runs on Expo servers through the linked GitHub repo — no tokens in the repo or the chat.
name: Publish to Expo Go

on:
  push:
    branches: ['main']

jobs:
  publish_preview:
    name: Publish update (preview)
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Publish EAS Update
        working_directory: ./apps/mobile
        run: npx eas-cli@latest update --channel preview --platform all --non-interactive --message "main @ $(git rev-parse --short HEAD)"
