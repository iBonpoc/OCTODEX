# Same workflow as /.eas/workflows/send-updates.yml, for when the Expo project's base directory is apps/mobile.
name: Publish to Expo Go (app dir)

on:
  push:
    branches: ['main']

jobs:
  send_updates:
    name: Publish update (preview)
    type: update
    params:
      channel: preview

  deploy_web:
    name: Deploy web app (Expo Hosting, production)
    type: deploy
    params:
      prod: true
