<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No framing (clickjacking): the site is one page (web.output single), so it cannot send per-page frame headers
         (spec 34 §3в). The page hides itself unless it is the top window; a site that frames it shows nothing. -->
    <style id="anti-frame">html { display: none !important; }</style>
    <script>
      try { if (window.self === window.top) document.getElementById("anti-frame").remove(); } catch (e) { /* a cross-origin top: stay hidden */ }
    </script>
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the app draws under the home indicator (and the notch in landscape); safe-area insets keep content clear. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GoRix</title>
    <!-- Home Screen icon opens as an app: no Safari address bar or toolbar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GoRix" />
    <!-- "default": iOS draws the status bar itself, so the clock stays readable in the light theme too
         ("black-translucent" = white clock over our light bg). Read once when the icon is added. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Colors = theme bg tokens (packages/design-tokens: dark.bg / light.bg), checked by test/pwa.test.ts. -->
    <meta name="theme-color" content="#24272D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#EFEBE5" media="(prefers-color-scheme: light)" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #24272D;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: #EFEBE5;
        }
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root">
      <!-- GoRix before the JS (DS §18.2, #1046): the GR mark as in the app's boot layer (ui/brandRules.ts, 56 high).
           React's first render replaces it. Colours = tokens: ink and acc of the theme, the ring = light ink. -->
      <div id="gx-boot" style="display:flex;flex:1;align-items:center;justify-content:center">
        <svg viewBox="16 -736 1403 764" height="56" width="103" role="img" aria-label="GoRix">
          <style>#gx-boot .i{fill:#F2F3F5}#gx-boot .ring{fill:none}#gx-boot .dot{fill:#FBFF00}@media (prefers-color-scheme:light){#gx-boot .i{fill:#15161A}#gx-boot .ring{fill:#15161A}}</style>
          <g transform="translate(-143.9 -895.9) scale(1.05848)"><path class="i" d="M660 170 H442 A272 272 0 0 0 170 442 V582 A272 272 0 0 0 442 854 H582 A272 272 0 0 0 854 582 V450 H640 V574 H730 V582 A148 148 0 0 1 582 730 H442 A148 148 0 0 1 294 582 V442 A148 148 0 0 1 442 294 H660 Z"/><circle class="ring" cx="515" cy="512" r="106"/><circle class="dot" cx="515" cy="512" r="85"/></g>
          <path class="i" transform="translate(-564 0)" d="M1394 0V-708H1679Q1732 -708 1780.5 -697.5Q1829 -687 1868.0 -662.0Q1907 -637 1929.5 -592.5Q1952 -548 1952 -479Q1952 -428 1935.0 -387.0Q1918 -346 1885.0 -317.0Q1852 -288 1806 -272L1963 0H1802L1664 -249H1537V0ZM1537 -376H1669Q1700 -376 1725.5 -381.5Q1751 -387 1769.5 -399.0Q1788 -411 1798.5 -431.0Q1809 -451 1809 -480Q1810 -517 1793.5 -537.5Q1777 -558 1747.5 -566.5Q1718 -575 1678 -575H1537Z"/>
        </svg>
      </div>
    </div>
  </body>
</html>
