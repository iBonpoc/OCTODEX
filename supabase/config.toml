project_id = "octodex"

# 7-2 (S21): accepting a team invitation trusts a CONFIRMED sign-in email (auth.users.email_confirmed_at).
# Keep «Confirm email» on in the hosted project too (Authentication → Providers → Email).
[auth.email]
enable_confirmations = true
# the sign-in code (docs/specs/52 §4 Р3): 6 digits, 10 minutes — the same in the hosted project (Authentication → Providers → Email)
otp_length = 6
otp_expiry = 600

# 7а-2a (S22): «Удалить аккаунт» — only with a valid user JWT (the person deletes themselves; the uid is never in the body).
[functions.delete-account]
verify_jwt = true

# Пуши П3 (docs/specs/27 §4.5): send-push is woken by pg_cron (app.push_kick), not by a person — no JWT; the only key is
# the header x-push-key equal to the function's secret PUSH_FN_KEY (compared in constant time in handler.ts).
[functions.send-push]
verify_jwt = false

# Приём заявок (docs/specs/34 §3): a homeowner's browser (the page /f/<token>) and Zapier have no JWT. The form is found
# by its token's hash, a webhook by its key (Authorization: Bearer gxk_…) — both in the database, never by the body.
[functions.lead-intake]
verify_jwt = false

# Онлайн-оплата (docs/specs/35, 20b): the owner connects Stripe from the app — with their JWT.
[functions.stripe-connect]
verify_jwt = true

# Оплата с /p/ (docs/specs/35, 20в): the client's browser has no JWT — the /p/ token is checked in public.stripe_pay_open.
[functions.stripe-pay]
verify_jwt = false

# Вебхук Stripe (docs/specs/35, 20г): Stripe has no JWT — its signature over the raw body is checked first.
[functions.stripe-webhook]
verify_jwt = false

# Возврат картой/ACH (docs/specs/35, 20д): only a signed-in person; owner/admin is checked in public.stripe_refund_open.
[functions.stripe-refund]
verify_jwt = true

# LOCAL stack only (supabase start — the nightly cloud scenarios, docs/specs/21 §7). release.yml runs `db push`,
# never `config push`, so nothing below reaches the hosted project.
[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:*/**"]

# the app signs in by the 6-digit code from the email (auth/sign-in.tsx → verifyOtp, #1756): BOTH emails carry the code
# and no link — a new address gets «confirmation», a known one «magic_link». The code in the subject lets iOS offer it
# over the keyboard. The hosted project gets the same subjects and texts by hand (guard: test/authEmails.test.ts).
[auth.email.template.magic_link]
subject = "{{ .Token }} — your GoRix sign-in code"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "{{ .Token }} — your GoRix sign-in code"
content_path = "./supabase/templates/confirmation.html"

# the local stack's built-in limit is 2 emails an hour: the nightly cloud specs (102, 442, delete-account) send more
[auth.rate_limit]
email_sent = 100

[edge_runtime]
enabled = true
