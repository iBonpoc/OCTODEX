project_id = "octodex"

# 7-2 (S21): accepting a team invitation trusts a CONFIRMED sign-in email (auth.users.email_confirmed_at).
# Keep «Confirm email» on in the hosted project too (Authentication → Providers → Email).
[auth.email]
enable_confirmations = true

# 7а-2a (S22): «Удалить аккаунт» — only with a valid user JWT (the person deletes themselves; the uid is never in the body).
[functions.delete-account]
verify_jwt = true

# Пуши П3 (docs/specs/27 §4.5): send-push is woken by pg_cron (app.push_kick), not by a person — no JWT; the only key is
# the header x-push-key equal to the function's secret PUSH_FN_KEY (compared in constant time in handler.ts).
[functions.send-push]
verify_jwt = false

# LOCAL stack only (supabase start — the nightly cloud scenarios, docs/specs/21 §7). release.yml runs `db push`,
# never `config push`, so nothing below reaches the hosted project.
[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:*/**"]

# the app signs in by the 6-digit code from the email (auth/sign-in.tsx → verifyOtp): the local email must carry it
[auth.email.template.magic_link]
subject = "Your OCTODEX sign-in code"
content_path = "./supabase/templates/magic-link.html"

[edge_runtime]
enabled = true
